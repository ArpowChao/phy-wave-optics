                ctx.strokeStyle = 'rgba(18,49,58,0.14)'; ctx.lineWidth = 1;
                ctx.strokeRect(x0, y0, TW, TH);
                const clipTank = () => { ctx.beginPath(); ctx.rect(x0, y0, TW, TH); ctx.clip(); };

                /* ============ 反射 ============ */
                if (p.mode === 'reflect') {
                    const lam = Math.max(p.lam2, 10);
                    const th = rad(p.ang);
                    const by = y1;                                   // 障礙物＝水槽底線
                    const ox = x0 + TW * 0.52;                       // 入射點
                    const ph = ((t * 26) % lam);
                    const drawTrain = (dirx, diry, color, lw) => {
                        // 波前垂直於射線；第 n 條波前通過 O 沿射線後退 n·λ 的位置
                        const ex = -diry, ey = dirx;
                        ctx.save(); clipTank();
                        ctx.strokeStyle = color; ctx.lineWidth = lw;
                        for (let n = -10; n <= 10; n++) {
                            const s = n * lam + ph;          // +ph：波前沿射線方向前進
                            const px = ox + dirx * s, py = by + diry * s;
                            const L = TW + TH;
                            ctx.beginPath();
                            ctx.moveTo(px - ex * L, py - ey * L);
                            ctx.lineTo(px + ex * L, py + ey * L);
                            ctx.stroke();
                        }
                        ctx.restore();
                    };
                    // 入射：往右下（dir = (sinθ, cosθ)）；反射：往右上（dir = (sinθ, −cosθ)）
                    drawTrain(Math.sin(th), Math.cos(th), 'rgba(11,111,146,0.55)', 2);
                    drawTrain(Math.sin(th), -Math.cos(th), 'rgba(107,70,193,0.5)', 1.8);

                    // 障礙物
                    ctx.strokeStyle = '#41606b'; ctx.lineWidth = 5;
                    ctx.beginPath(); ctx.moveTo(x0, by); ctx.lineTo(x1, by); ctx.stroke();
                    for (let X = x0; X < x1; X += 10) {
                        ctx.strokeStyle = 'rgba(65,96,107,0.5)'; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(X, by + 3); ctx.lineTo(X + 7, by + 11); ctx.stroke();
                    }
                    label(ctx, '直線形障礙物（反射面）', x0 + 6, by + 24, C.muted, 11);

                    dashed(ctx, ox, by, ox, y0 + 6, 'rgba(18,49,58,0.45)');
                    label(ctx, '法線', ox + 6, labelY, C.muted, 10);
                    const R = Math.min(TH * 0.82, TW * 0.42);
                    arrow(ctx, ox - Math.sin(th) * R, by - Math.cos(th) * R, ox, by, C.blue, 2.4);
                    arrow(ctx, ox, by, ox + Math.sin(th) * R, by - Math.cos(th) * R, C.violet, 2.4);
                    /* 標籤放在箭頭端點「正上方」，不要沿射線方向偏移，否則文字會壓在線上 */
                    const rayLabelY = Math.max(labelY + lineH, by - Math.cos(th) * R - 8);
                    label(ctx, '入射線', ox - Math.sin(th) * R, rayLabelY, C.blue, 11, 'center');
                    label(ctx, '反射線', ox + Math.sin(th) * R, rayLabelY, C.violet, 11, 'center');
                    ctx.strokeStyle = 'rgba(18,49,58,0.5)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(ox, by, 40, -Math.PI / 2 - th, -Math.PI / 2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(ox, by, 52, -Math.PI / 2, -Math.PI / 2 + th); ctx.stroke();
                    label(ctx, `θᵢ = ${p.ang}°`, ox - 46 - Math.sin(th) * 16, by - 48, C.blue, 11, 'right');
                    label(ctx, `θᵣ = ${p.ang}°`, ox + 58 + Math.sin(th) * 16, by - 60, C.violet, 11);
                    label(ctx, '入射角＝反射角；波長、波速、頻率都不變', x0 + 6, capY, C.ink, 12);
                    return;
                }

                /* ============ 折射 ============ */
                if (p.mode === 'refract') {
                    const lam1 = Math.max(p.lam2, 10), lam2 = lam1 * p.vr;
                    const th1 = rad(p.ang);
                    const s2 = Math.sin(th1) * p.vr;
                    const total = Math.abs(s2) > 1;
                    const th2 = total ? null : Math.asin(s2);
                    const iy = y0 + TH * 0.46;
                    const ox = x0 + TW * 0.5;
                    ctx.fillStyle = 'rgba(11,111,146,0.06)'; ctx.fillRect(x0, y0, TW, iy - y0);
                    ctx.fillStyle = 'rgba(201,117,15,0.09)'; ctx.fillRect(x0, iy, TW, y1 - iy);
                    ctx.strokeStyle = C.rose; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(x0, iy); ctx.lineTo(x1, iy); ctx.stroke();
                    label(ctx, '深水區：波速快、波長長', x0 + 6, capY, C.blue, 12);
                    label(ctx, '淺水區（下方放厚玻璃片）：波速慢、波長短', x0 + 6, y1 - 8, C.orange, 12);

                    const ph = ((t * 26) % lam1);
                    const train = (dirx, diry, lam, phase, top, color) => {
                        const ex = -diry, ey = dirx;
                        ctx.save();
                        ctx.beginPath();
                        top ? ctx.rect(x0, y0, TW, iy - y0) : ctx.rect(x0, iy, TW, y1 - iy);
                        ctx.clip();
                        ctx.strokeStyle = color; ctx.lineWidth = 2;
                        for (let n = -12; n <= 12; n++) {
                            const s = n * lam + phase;       // +phase：入射波往界面、折射波往外
                            const px = ox + dirx * s, py = iy + diry * s;
                            const L = TW + TH;
                            ctx.beginPath();
                            ctx.moveTo(px - ex * L, py - ey * L);
                            ctx.lineTo(px + ex * L, py + ey * L);
                            ctx.stroke();
                        }
                        ctx.restore();
                    };
                    train(Math.sin(th1), Math.cos(th1), lam1, ph, true, 'rgba(11,111,146,0.6)');
                    if (!total) train(Math.sin(th2), Math.cos(th2), lam2, ph * p.vr, false, 'rgba(201,117,15,0.7)');

                    dashed(ctx, ox, y0 + 4, ox, y1 - 4, 'rgba(18,49,58,0.4)');
                    label(ctx, '法線', ox + 6, labelY, C.muted, 10);
                    const R1 = Math.min((iy - y0) * 0.85, TW * 0.34);
                    arrow(ctx, ox - Math.sin(th1) * R1, iy - Math.cos(th1) * R1, ox, iy, C.blue, 2.4);
                    ctx.strokeStyle = 'rgba(18,49,58,0.5)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(ox, iy, 38, -Math.PI / 2 - th1, -Math.PI / 2); ctx.stroke();
                    label(ctx, `θ₁ = ${p.ang}°`, ox - 44, iy - 42, C.blue, 11, 'right');
                    if (total) {
                        label(ctx, '波速比太小 ⇒ 此角度已無折射波', ox + 10, iy + 30, C.rose, 12);
                    } else {
                        const R2 = Math.min((y1 - iy) * 0.85, TW * 0.34);
                        arrow(ctx, ox, iy, ox + Math.sin(th2) * R2, iy + Math.cos(th2) * R2, C.orange, 2.4);
                        ctx.beginPath(); ctx.arc(ox, iy, 38, Math.PI / 2 - th2, Math.PI / 2); ctx.stroke();
                        label(ctx, `θ₂ = ${deg(th2).toFixed(0)}°`, ox + 44, iy + 50, C.orange, 11);
                        label(ctx, '深水 → 淺水：波速變慢 ⇒ 折射線偏向法線', x0 + 6, iy - 10, C.ink, 12);
                    }
                    return;
                }

                /* ============ 干涉 ============ */
                if (p.mode === 'interfere') {
                    const scale = TW / 24;                            // 畫面寬代表 24 cm
                    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
                    const s1 = { x: cx - p.d * scale / 2, y: cy };
                    const s2 = { x: cx + p.d * scale / 2, y: cy };
                    const lamPx = Math.max(p.lam * scale, 6);
                    const k = 2 * Math.PI / lamPx;
                    const om = 3.2;
                    const step = 4;
                    const iw = Math.ceil(TW / step) * step, ih = Math.ceil(TH / step) * step;
                    const img = ctx.createImageData(iw, ih);
                    for (let yy = 0; yy < ih; yy += step) {
                        for (let xx = 0; xx < iw; xx += step) {
                            const gx = x0 + xx, gy = y0 + yy;
                            const r1 = Math.hypot(gx - s1.x, gy - s1.y);
                            const r2 = Math.hypot(gx - s2.x, gy - s2.y);
                            const a1 = Math.cos(k * r1 - om * t) / Math.sqrt(Math.max(r1, 16));
                            const a2 = Math.cos(k * r2 - om * t) / Math.sqrt(Math.max(r2, 16));
                            const v = (a1 + a2) * 9;
                            const g = Math.max(0, Math.min(255, Math.round(150 + v * 118)));
                            for (let dy = 0; dy < step; dy++) {
                                const row = (yy + dy) * iw;
                                for (let dx = 0; dx < step; dx++) {
                                    const idx = (row + xx + dx) * 4;
                                    img.data[idx] = g * 0.86; img.data[idx + 1] = g * 0.95; img.data[idx + 2] = g;
                                    img.data[idx + 3] = 255;
                                }
                            }
                        }
                    }
                    const off = getOffscreen(iw, ih);
                    off.ctx.putImageData(img, 0, 0);
                    ctx.drawImage(off.canvas, 0, 0, iw, ih, x0, y0, TW, TH);

                    ctx.save(); clipTank();
                    // 節線（紅）與腹線（綠）：以 S1、S2 為焦點的雙曲線
                    const hyper = (aHalf, color, dash) => {
                        const c = p.d * scale / 2;
                        if (Math.abs(aHalf) >= c) return;
                        const b2 = c * c - aHalf * aHalf;
                        ctx.save();
                        if (dash) ctx.setLineDash([5, 4]);
                        ctx.strokeStyle = color; ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        let started = false;
                        for (let yy = -TH; yy <= TH; yy += 3) {
                            const xx = aHalf * Math.sqrt(1 + (yy * yy) / b2);
                            const PX = cx + xx, PY = cy + yy;
                            if (PX < x0 - 40 || PX > x1 + 40) { started = false; continue; }
                            started ? ctx.lineTo(PX, PY) : (ctx.moveTo(PX, PY), started = true);
                        }
                        ctx.stroke(); ctx.restore();
                    };
                    const nMax = Math.floor(p.d / p.lam);
                    for (let n = 1; n <= nMax; n++) {
                        [-1, 1].forEach((sg) => hyper(sg * n * lamPx / 2, 'rgba(18,128,92,0.8)', true));
                    }
                    const mMax = Math.floor(p.d / p.lam + 0.5);
                    for (let m = 1; m <= mMax; m++) {
                        [-1, 1].forEach((sg) => hyper(sg * (m - 0.5) * lamPx / 2, 'rgba(194,38,74,0.85)', false));
                    }
                    dashed(ctx, cx, y0, cx, y1, 'rgba(18,128,92,0.9)');

                    // P 點與波程差作圖
                    const PY = cy - (p.py / 100) * (TH * 0.42);
                    const PX = cx + TW * 0.34;
                    const r1 = Math.hypot(PX - s1.x, PY - s1.y);
                    const r2 = Math.hypot(PX - s2.x, PY - s2.y);
                    const dl = Math.abs(r1 - r2) / lamPx;             // 波程差（單位：λ）
                    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(PX, PY);
                    ctx.moveTo(s2.x, s2.y); ctx.lineTo(PX, PY); ctx.stroke();
                    ctx.restore();

                    [s1, s2].forEach((s, i) => {
                        ctx.fillStyle = C.rose;
                        ctx.beginPath(); ctx.arc(s.x, s.y, 5.5, 0, Math.PI * 2); ctx.fill();
                        label(ctx, `S${i + 1}`, s.x, s.y - 11, '#ffffff', 12, 'center');
                    });
                    ctx.fillStyle = '#ffb347';
                    ctx.beginPath(); ctx.arc(PX, PY, 6, 0, Math.PI * 2); ctx.fill();
                    label(ctx, 'P', PX + 9, PY - 6, '#ffb347', 13);

                    const frac = dl - Math.floor(dl);
                    const nearInt = Math.min(frac, 1 - frac) < 0.06;
                    const nearHalf = Math.abs(frac - 0.5) < 0.06;
                    const verdict = nearInt ? `腹點（第 ${Math.round(dl)} 腹線）` : (nearHalf ? `節點（第 ${Math.round(dl + 0.5)} 節線）` : '介於腹線與節線之間');
                    const vcol = nearInt ? '#7bf0c2' : (nearHalf ? '#ffb3c6' : '#ffffff');
                    /* 左上的讀數面板與右上的圖例面板：寬度依畫布分配，
                     * 三行讀數用同一個行高堆疊，不再各自寫死 y（守則 §3）。 */
                    const legendW = Math.min(186, TW * 0.44);
                    const wide = TW >= 520;                    // 夠寬才並排，否則圖例讓到下一段
                    const readW = Math.min(300, wide ? TW - legendW - 22 : TW - 12);
                    const lineH = 18;
                    ctx.fillStyle = 'rgba(8,30,38,0.82)';
                    ctx.fillRect(x0 + 6, y0 + 6, readW, 3 * lineH + 12);
                    [[`波程差 Δℓ = |PS₁ − PS₂| = ${(Math.abs(r1 - r2) / scale).toFixed(2)} cm`, '#e6f4f7'],
                     [`Δℓ / λ = ${dl.toFixed(2)}`, '#e6f4f7'],
                     [`⇒ P 為 ${verdict}`, vcol]
                    ].forEach(([txt, col], i) => {
                        labelFit(ctx, txt, x0 + 14, y0 + 24 + i * lineH, col, 12, 'left',
                                 { maxW: readW - 18 });
                    });
                    /* 圖例：寬畫布放右上角，窄畫布移到讀數面板下方，避免兩塊互相壓 */
                    const legX = wide ? x1 - 6 : x0 + 6 + legendW;
                    const legY = wide ? y0 + 6 : y0 + 6 + 3 * lineH + 16;
                    ctx.fillStyle = 'rgba(8,30,38,0.78)';
                    ctx.fillRect(legX - legendW, legY, legendW, 2 * lineH + 6);
                    labelFit(ctx, '- - - 腹線（Δℓ = nλ）', legX - 8, legY + 16, '#7bf0c2', 11, 'right',
                             { clampW: w, maxW: legendW - 16 });
                    labelFit(ctx, '—— 節線（Δℓ = (m−½)λ）', legX - 8, legY + 16 + lineH, '#ffb3c6', 11, 'right',
                             { clampW: w, maxW: legendW - 16 });
                    labelFit(ctx, '明暗＝瞬間高低；灰色不一定是節線', x0 + 6, y1 + 18, C.muted, 11, 'left', { maxW: TW - 12, min: 10, clampW: w });
                    return;
                }

                /* ============ 繞射 ============ */
                const lam = Math.max(p.lam2, 10);
                const by = y0 + TH * 0.42;                            // 障礙物所在的水平線
                const slit = Math.max(p.slit, 6);
                const cx = (x0 + x1) / 2;
                const k = 2 * Math.PI / lam;
                const om = 3.0;

                // 縫前：直線波前
                const ph = ((t * 26) % lam);
                ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, TW, by - y0); ctx.clip();
                ctx.strokeStyle = 'rgba(11,111,146,0.6)'; ctx.lineWidth = 2;
                for (let n = 0; n < 14; n++) {
                    const Y = by - lam + ph - n * lam;   // 波前往下走向狹縫
                    if (Y < y0 - 2) break;
                    ctx.beginPath(); ctx.moveTo(x0, Y); ctx.lineTo(x1, Y); ctx.stroke();
                }
                ctx.restore();

                // 縫後：把縫上的點視為同相子波源，逐塊疊加
                const NS = 13;
                const srcs = [];
                for (let i = 0; i < NS; i++) srcs.push(cx - slit / 2 + slit * i / (NS - 1));
                const step = 5;
                const bh = y1 - by;
                const iw = Math.ceil(TW / step) * step, ih = Math.ceil(bh / step) * step;
                const img = ctx.createImageData(iw, ih);
                for (let yy = 0; yy < ih; yy += step) {
                    for (let xx = 0; xx < iw; xx += step) {
                        const gx = x0 + xx, gy = by + yy;
                        let sum = 0;
                        for (let i = 0; i < NS; i++) {
                            const r = Math.hypot(gx - srcs[i], gy - by);
                            sum += Math.cos(k * r - om * t) / Math.sqrt(Math.max(r, 10));
                        }
                        const v = sum * (7 / Math.sqrt(NS));
                        const g = Math.max(0, Math.min(255, Math.round(150 + v * 110)));
                        for (let dy = 0; dy < step; dy++) {
                            const row = (yy + dy) * iw;
                            for (let dx = 0; dx < step; dx++) {
                                const idx = (row + xx + dx) * 4;
                                img.data[idx] = g * 0.86; img.data[idx + 1] = g * 0.95; img.data[idx + 2] = g;
                                img.data[idx + 3] = 255;
                            }
                        }
                    }
                }
                const off = getOffscreen(iw, ih);
                off.ctx.putImageData(img, 0, 0);
                ctx.drawImage(off.canvas, 0, 0, iw, ih, x0, by, TW, bh);

                // 障礙物與狹縫
                ctx.fillStyle = '#41606b';
                ctx.fillRect(x0, by - 5, cx - slit / 2 - x0, 10);
                ctx.fillRect(cx + slit / 2, by - 5, x1 - (cx + slit / 2), 10);
                ctx.fillStyle = C.orange;
                for (let i = 0; i < NS; i++) {
                    ctx.beginPath(); ctx.arc(srcs[i], by, 2.2, 0, Math.PI * 2); ctx.fill();
                }
                ctx.strokeStyle = C.orange; ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(cx - slit / 2, by - 16); ctx.lineTo(cx + slit / 2, by - 16);
                ctx.moveTo(cx - slit / 2, by - 21); ctx.lineTo(cx - slit / 2, by - 11);
                ctx.moveTo(cx + slit / 2, by - 21); ctx.lineTo(cx + slit / 2, by - 11);
                ctx.stroke();
                label(ctx, `d = ${slit} px`, cx, by - 25, C.orange, 11, 'center');
                ctx.fillStyle = 'rgba(255,255,255,0.86)';
                ctx.fillRect(x0 + 4, by + 6, 246, 18);
                label(ctx, '縫上每一點都是新的點波源（惠更斯原理）', x0 + 8, by + 19, '#0a2f3a', 11);
                const ratio = slit / lam;
                labelFit(ctx, `d/λ = ${ratio.toFixed(2)}：${ratio < 1.6 ? '擴散很明顯' : (ratio < 4 ? '繞射明顯' : '近直線傳播')}`,
                    x0 + 6, y0 + 18, C.ink, 12, 'left', { maxW: TW - 12, min: 10, clampW: w });
                labelFit(ctx, '繞射前後 v、f、λ 不變；波向兩側展開', x0 + 6, y1 + 18, C.muted, 11, 'left', { maxW: TW - 12, min: 10, clampW: w });
            }
        };
        /* 5b. 水波干涉探究模擬器 ------------------------------------------- */
        const wiShowRatio = (p) => Number(p.dlabel) === 1 || Number(p.dlabel) === 3;
        const wiShowCm = (p) => Number(p.dlabel) === 2 || Number(p.dlabel) === 3;
        const wiLamCm = (p) => (2 / (Number(p.freq) || 0.08)) * 0.088;
        const wiLocusName = (p,kind) => kind === '節' && Number(p.decay) === 1 ? '反相線' : `${kind}線`;
        function wiGeometry(w,h) {
            const x0=12,x1=Math.max(x0+120,w-12),y0=10,y1=h-48;
            return {x0,x1,y0,y1,cx:(x0+x1)/2,cy:(y0+y1)/2,scale:(x1-x0)/24};
        }
        // Store P in model cm, not display pixels, so resizing keeps its physical location.
        function wiPoint(p,w,h) {
            if (!p.clickP) return null;
            if (!p._pointCm) {
                const prior = wiGeometry(p._geomW || w,p._geomH || h);
                p._pointCm = {x:(p.clickP.x-prior.cx)/prior.scale,y:(p.clickP.y-prior.cy)/prior.scale};
            }
            const g = wiGeometry(w,h);
            return {x:Math.max(g.x0,Math.min(g.x1,g.cx+p._pointCm.x*g.scale)),
                y:p.mode === '1D' ? g.cy : Math.max(g.y0,Math.min(g.y1,g.cy+p._pointCm.y*g.scale))};
        }
        // Use physical model lengths so changing the view or canvas width cannot change attenuation.
        const wiAmplitude = (p,rCm) => Number(p.decay) === 1 ? 1/(1+Math.max(0,rCm)*0.1) : 1;
        const wiFmtLen = (p, cm) => {
            const ratio = cm / wiLamCm(p);
            if (wiShowRatio(p) && wiShowCm(p)) return `${cm.toFixed(2)} cm = ${ratio.toFixed(2)} λ`;
            if (wiShowRatio(p)) return `${ratio.toFixed(2)} λ`;
            return `${cm.toFixed(2)} cm`;
        };
        // Treat only an exact ratio as a degenerate hyperbola; nearby ratios remain curves.
        function wiDegeneracy(p) {
            const ratio = Number(p.d) / wiLamCm(p), outPhase = Number(p.phase) === 1;
            if (Math.abs(ratio - Math.round(ratio)) < 1e-6) return { ratio, kind: outPhase ? '節' : '腹' };
            if (Math.abs(ratio - (Math.round(ratio - 0.5) + 0.5)) < 1e-6) return { ratio, kind: outPhase ? '腹' : '節' };
            return null;
        }
        function wiSpacingMarks(ctx, p, o) {
            if (!wiShowRatio(p) && !wiShowCm(p)) return null;
            const plotW = o.x1 - o.x0, fs = plotW >= 600 ? 20 : 15;
            const tick = fs * 0.45, pad = 10, gap = 6;
            const strokeBoth = (path) => {
                ctx.strokeStyle = o.halo; ctx.lineWidth = 6; path(); ctx.stroke();
                ctx.strokeStyle = o.hi; ctx.lineWidth = 2.6; path(); ctx.stroke();
            };
            const bar = (xa, xb, y) => strokeBoth(() => {
                ctx.beginPath(); ctx.moveTo(xa,y); ctx.lineTo(xb,y);
                for (const x of [xa,xb]) {ctx.moveTo(x,y-tick); ctx.lineTo(x,y+tick);}
            });
            const tag = (text, center, top, size, maxW) => {
                ctx.font = `${size}px Outfit, "Noto Sans TC", sans-serif`;
                const bw = Math.min(ctx.measureText(text).width + 2*pad, maxW), bh = size + 2*gap;
                const left = Math.max(o.x0 + 4, Math.min(center - bw/2, o.x1 - bw - 4));
                ctx.fillStyle = o.plate; ctx.fillRect(left,top,bw,bh);
                ctx.strokeStyle = o.hi; ctx.lineWidth = 1.5; ctx.strokeRect(left,top,bw,bh);
                labelFit(ctx,text,left+bw/2,top+size+gap/2,o.ink,size,'center', {maxW:bw-2*pad,min:12,clampW:o.x1+12});
                return {left,top,width:bw,height:bh};
            };
            ctx.save(); ctx.setLineDash([4,4]);
            strokeBoth(() => {
                ctx.beginPath();
                for (const x of [o.s1x,o.s2x]) {ctx.moveTo(x,o.srcY+8); ctx.lineTo(x,o.lineY);}
            });
            ctx.setLineDash([]); bar(o.s1x,o.s2x,o.lineY);
            tag(`d = ${wiFmtLen(p,o.dCm)}`, (o.s1x+o.s2x)/2, o.lineY+tick+gap, fs, plotW-8);
            const rulerText = wiShowCm(p) ? `λ = ${o.lamCm.toFixed(2)} cm` : 'λ';
            const rulerFs = fs-2;
            ctx.font = `${rulerFs}px Outfit, "Noto Sans TC", sans-serif`;
            const boxW = Math.max(o.lamPx,ctx.measureText(rulerText).width)+2*pad;
            const boxH = rulerFs+2*tick+3*gap, left = o.x1-4-boxW, top = o.barY+tick+gap-boxH;
            ctx.fillStyle = o.plate; ctx.fillRect(left,top,boxW,boxH);
            ctx.strokeStyle = o.hi; ctx.lineWidth = 1.5; ctx.strokeRect(left,top,boxW,boxH);
            const mid = left+boxW/2;
            bar(mid-o.lamPx/2,mid+o.lamPx/2,o.barY);
            labelFit(ctx,rulerText,mid,o.barY-tick-gap,o.ink,rulerFs,'center',{maxW:boxW-2*pad,min:11,clampW:o.x1+12});
            ctx.restore();
            return {left,top,width:boxW,height:boxH};
        }

            draw: (ctx, w, h, p, t) => {

                const x0 = 12, x1 = Math.max(x0+120,w-12), y0 = 10, y1 = h-48;
                const TW = x1 - x0, TH = y1 - y0;
                const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
                const scale = TW / 24;
                const dCm = Math.max(Number(p.d) || 8.8, 1.0);
                const dPx = dCm * scale;
                const s1 = { x: cx - dPx / 2, y: cy };
                const s2 = { x: cx + dPx / 2, y: cy };
                const f = Number(p.freq) || 0.08;
                const lamCm = (2.0 / f) * 0.088;
                const lamPx = Math.max(lamCm * scale, 6);
                const k = (2 * Math.PI) / lamPx;
                const om = 3.2;
                const isOutPhase = Number(p.phase) === 1;
                const phase1 = 0;
                const phase2 = isOutPhase ? Math.PI : 0;
                const phaseDiff_L = (phase2 - phase1) / k;
                const waveAt = (r1,r2) => wiAmplitude(p,r1/scale)*Math.cos(k*r1-om*t+phase1) + wiAmplitude(p,r2/scale)*Math.cos(k*r2-om*t+phase2);
                const envelopeAt = (r1,r2) => {
                    const a1 = wiAmplitude(p,r1/scale), a2 = wiAmplitude(p,r2/scale);
                    return Math.sqrt(Math.max(0,a1*a1+a2*a2+2*a1*a2*Math.cos(k*(r1-r2)+phase1-phase2)));

                if (p.mode === '2D' || !p.mode) {
                    /* 逐像素算干涉場的成本與畫布面積成正比。畫布加大之後固定 step = 4
                     * 會讓每幀掉到 20 ms（超過 60fps 的 16.7 ms 預算），
                     * 所以改成依面積調整區塊大小，讓運算量維持在固定水準。
                     * 這是連續變化的場，step 5~6 在視覺上看不出差別。 */
                    const step = Math.max(4, Math.min(8, Math.round(Math.sqrt(TW * TH / 16000))));
                    const iw = Math.ceil(TW / step) * step, ih = Math.ceil(TH / step) * step;
                    const shadeOn = Number(p.shade) !== 0;
                    if (!shadeOn) {ctx.fillStyle = 'rgb(73,156,163)'; ctx.fillRect(x0,y0,TW,TH);}
                    const img = shadeOn ? ctx.createImageData(iw,ih) : null;
                    if (shadeOn) for (let yy = 0; yy < ih; yy += step) {
                        for (let xx = 0; xx < iw; xx += step) {
                            const gx = x0 + xx, gy = y0 + yy;
                            const r1 = Math.hypot(gx - s1.x, gy - s1.y);
                            const r2 = Math.hypot(gx - s2.x, gy - s2.y);
                            const a1 = wiAmplitude(p,r1/scale), a2 = wiAmplitude(p,r2/scale);
                            const z = a1 * Math.cos(k * r1 - om * t + phase1) + a2 * Math.cos(k * r2 - om * t + phase2);
                            const base = 118;
                            const intensity = z * 58;
                            const r = Math.max(0, Math.min(255, Math.round(base - 45 + intensity * 0.45)));
                            const g = Math.max(0, Math.min(255, Math.round(base + 38 + intensity * 0.95)));
                            const b = Math.max(0, Math.min(255, Math.round(base + 75 + intensity * 1.05)));
                            for (let dy = 0; dy < step; dy++) {
                                const row = (yy + dy) * iw;
                                for (let dx = 0; dx < step; dx++) {
                                    const idx = (row + xx + dx) * 4;
                                    img.data[idx] = r;
                                    img.data[idx + 1] = g;
                                    img.data[idx + 2] = b;
                                    img.data[idx + 3] = 255;
                                }
                            }
                        }
                    }
                    if (shadeOn) {
                        const off = getOffscreen(iw,ih);
                        off.ctx.putImageData(img,0,0);
                        ctx.drawImage(off.canvas,0,0,iw,ih,x0,y0,TW,TH);
                    }

                    ctx.strokeStyle = 'rgba(18,49,58,0.22)'; ctx.lineWidth = 1.2;
                    ctx.strokeRect(x0, y0, TW, TH);

                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x0, y0, TW, TH);
                    ctx.clip();

                    // 繪製雙曲線（含中垂線與外側射線退化判定）
                    if (Number(p.lines) === 1) {
                        const drawSingleHyperbola = (deltaL, color, dash) => {
                            const a = Math.abs(deltaL) / 2;
                            const c = dPx / 2;
                            const sign = deltaL >= 0 ? 1 : -1;

                            // 1. 中垂線退化
                            if (a < 1e-6) {
                                ctx.save();
                                ctx.strokeStyle = color;
                                ctx.lineWidth = 2.0;
                                if (dash) ctx.setLineDash(dash);
                                ctx.beginPath();
                                ctx.moveTo(cx, y0);
                                ctx.lineTo(cx, y1);
                                ctx.stroke();
                                ctx.restore();
                                return;
                            }

                            // 2. Only |Δℓ| = d produces an outer ray; larger differences have no locus.
                            if (a >= c - 1e-6) {
                                if (Math.abs(a-c) < 1e-6) {
                                    ctx.save();
                                    ctx.strokeStyle = color;
                                    ctx.lineWidth = 2.8;
                                    if (dash) ctx.setLineDash(dash);
                                    ctx.beginPath();
                                    if (sign > 0) {
                                        ctx.moveTo(s2.x, cy);
                                        ctx.lineTo(x1, cy);
                                    } else {
                                        ctx.moveTo(s1.x, cy);
                                        ctx.lineTo(x0, cy);
                                    }
                                    ctx.stroke();
                                    ctx.restore();
                                }
                                return;
                            }

                            // 3. 一般雙曲線
                            const b2 = c * c - a * a;
                            if (b2 <= 0) return;
                            const b = Math.sqrt(b2);
                            ctx.save();
                            ctx.strokeStyle = color;
                            ctx.lineWidth = 1.5;
                            if (dash) ctx.setLineDash(dash);
                            ctx.beginPath();
                            let started = false;
                            for (let yy = -TH; yy <= TH; yy += 3) {
                                const xOff = sign * a * Math.sqrt(1 + (yy * yy) / b2);
                                const plotX = cx + xOff;
                                const plotY = cy + yy;
                                if (plotX < x0 - 30 || plotX > x1 + 30) {
                                    started = false;
                                    continue;
                                }
                                if (!started) {
                                    ctx.moveTo(plotX, plotY);
                                    started = true;
                                } else {
                                    ctx.lineTo(plotX, plotY);
                                }
                            }
                            ctx.stroke();
                            ctx.restore();
                        };

                        const maxN = Math.floor((dPx + Math.abs(phaseDiff_L)) / lamPx) + 1;
                        // 腹線（亮紋雙曲線）
                        for (let n = -maxN; n <= maxN; n++) {
                            const dl = n * lamPx - phaseDiff_L;
                            if (Math.abs(dl) <= dPx + 1e-6) {
                                drawSingleHyperbola(dl, '#7bf0c2', [6, 4]);
                            }
                        }
                        // 節線（暗紋雙曲線）
                        for (let m = -maxN; m <= maxN; m++) {
                            const dl = (m + 0.5) * lamPx - phaseDiff_L;
                            if (Math.abs(dl) <= dPx + 1e-6) {
                                drawSingleHyperbola(dl, '#ffb3c6', [3, 4]);
                            }
                        }
                    }

                        ctx.fillStyle = '#f1c40f';
                        ctx.beginPath(); ctx.arc(s.x, s.y, 5.5, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = '#081e26'; ctx.lineWidth = 1.5; ctx.stroke();
                        labelFit(ctx, `S${idx+1}`, s.x + (idx ? 8 : -8), s.y-13, '#ffffff', TW>=600 ? 16 : 13, idx ? 'left' : 'right', {plate:'rgba(6,26,34,.8)',clampW:w});
                    });
                    const rulerBox = wiSpacingMarks(ctx,p,{s1x:s1.x,s2x:s2.x,srcY:cy,lineY:cy+34,
                        lamPx,dCm,lamCm,x0,x1,barY:y1-16,ink:'#fff3c4',hi:'#ffd166',halo:'rgba(6,26,34,.85)',plate:'rgba(6,26,34,.9)'});

                    // 測量點 P 標註與即時連線
                    let topPanelBottom = y0+32;
                    if (point) {
                        const px = point.x, py = point.y;
                        const r1 = Math.hypot(px - s1.x, py - s1.y);
                        const r2 = Math.hypot(px - s2.x, py - s2.y);
                        const r1Cm = r1 / scale;
                        const r2Cm = r2 / scale;
                        const dlCm = Math.abs(r1Cm - r2Cm);
                        const dlLam = dlCm / lamCm;

                        ctx.strokeStyle = '#f59e0b';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(s1.x, s1.y); ctx.lineTo(px, py);
                        ctx.moveTo(s2.x, s2.y); ctx.lineTo(px, py);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        ctx.fillStyle = '#ef4444';
                        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
                        labelFit(ctx,'P',px+9,Math.max(y0+18,py-10),'#ffffff',12,'left',{clampW:w,plate:'rgba(6,26,34,.8)'});

                        let phaseDiffTotal = Math.abs((k * r1 + phase1) - (k * r2 + phase2)) % (2 * Math.PI);
                        if (phaseDiffTotal > Math.PI) phaseDiffTotal = 2 * Math.PI - phaseDiffTotal;
                        let verdict = '介於腹線與節線之間';
                        let verdictCol = '#ffffff';
                        if (phaseDiffTotal < 1e-6) {
                            verdict = '腹線：兩波同相到達';
                            verdictCol = '#7bf0c2';
                        } else if (Math.PI-phaseDiffTotal < 1e-6) {
                            const isRealDecay = Number(p.decay) === 1;
                            verdict = isRealDecay ? '反相位置：振幅不等時有殘留' : '節線：反相且等振幅，始終靜止';
                            verdictCol = '#ffb3c6';
                        } else if (phaseDiffTotal < 0.35) verdict = '接近腹線：尚未精確同相';
                        else if (Math.PI-phaseDiffTotal < 0.35) verdict = '接近節線：仍可能振動';
                        if (Number(p.dlabel) === 0) {verdict='判定已隱藏：先自行推理'; verdictCol='#e6f4f7';}

                        const hudReserve = Number(p.lines) === 1 && TW >= 470 ? Math.min(200,TW*.45)+14 : 0;
                        const hudW = Math.min(430,TW-16-hudReserve), hfs = TW>=600 ? 14 : 11, lineH = hfs+7;
                        const pathRows = TW<600 ? [[`PS₁ = ${wiFmtLen(p,r1Cm)}`,'#e6f4f7'],[`PS₂ = ${wiFmtLen(p,r2Cm)}`,'#e6f4f7']]
                            : [[`PS₁ = ${wiFmtLen(p,r1Cm)}，PS₂ = ${wiFmtLen(p,r2Cm)}`,'#e6f4f7']];
                        const rows = [...pathRows,[`波程差 Δℓ = ${wiFmtLen(p,dlCm)}`,'#f59e0b'],[`⇒ ${verdict}`,verdictCol]];
                        const measureCtx = getOffscreen(Math.ceil(hudW),1).ctx;
                        const rowCounts = rows.map(([text,color]) => labelWrap(measureCtx,text,0,hfs,color,hfs,lineH,hudW-16));
                        const hudH = rowCounts.reduce((sum,count)=>sum+count,0)*lineH+8;
                        let rowY = y0+6+lineH;
                        topPanelBottom = y0+6+hudH;
                        ctx.fillStyle = 'rgba(8, 30, 38, 0.88)';
                        ctx.fillRect(x0 + 6, y0 + 6, hudW, hudH);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 1;
                        ctx.strokeRect(x0 + 6, y0 + 6, hudW, hudH);
                        rows.forEach(([text,color],i) => {
                            if (TW<600) labelWrap(ctx,text,x0+12,rowY,color,hfs,lineH,hudW-16);
                            else labelFit(ctx,text,x0+12,rowY,color,hfs,'left',{maxW:hudW-16,min:10});
                            rowY += rowCounts[i]*lineH;
                        });
                    } else {
                        /* 右上角有腹線／節線圖例時，提示框只能用剩下的寬度，
                         * 否則兩塊會疊在一起（窄畫布尤其明顯）。 */
                        const legReserve = (Number(p.lines) === 1 && TW >= 470)
                            ? Math.min(200, TW * 0.45) + 14 : 0;
                        const hintW = Math.min(340, TW - 16 - legReserve);
                        ctx.fillStyle = 'rgba(8, 30, 38, 0.76)';
                        ctx.fillRect(x0 + 6, y0 + 6, hintW, 26);
                        labelFit(ctx, '💡 提示：點水面任一處放置測量點 P', x0 + 12, y0 + 23, '#e6f4f7', 11, 'left', { maxW: hintW - 16 });
                    }
                    ctx.restore();

                    if (Number(p.lines) === 1) {
                        /* 畫布夠寬才並排在右上角；太窄就整塊移到提示框下方 */
                        const legW = Math.min(200, TW * 0.45);
                        const wide = TW >= 470;
                        const lx = wide ? x1 - 6 : x0 + 6 + legW;
                        const ly = wide ? y0+6 : topPanelBottom+8;
                        ctx.fillStyle = 'rgba(8, 30, 38, 0.78)';
                        ctx.fillRect(lx - legW, ly, legW, 40);
                        labelFit(ctx, '- - - 腹線 (建設性/雙曲線)', lx - 6, ly + 16, '#7bf0c2', 10, 'right', { maxW: legW - 12 });
                        labelFit(ctx,`······ ${wiLocusName(p,'節')}（雙曲線）`,lx-6,ly+32,'#ffb3c6',10,'right',{maxW:legW-12});
                    }

                    const degen = wiDegeneracy(p);
                    if (wiShowRatio(p) && degen) {
                        const degenW = rulerBox ? rulerBox.left-x0-20 : TW-12;
                        const text = TW >= 600 ? `d = ${degen.ratio.toFixed(2)}λ：最外側${wiLocusName(p,degen.kind)}退化為波源外側射線` : `最外側${wiLocusName(p,degen.kind)}退化為射線`;
                        labelFit(ctx,text,x0+6,y1-8,degen.kind === '腹' ? '#7bf0c2' : '#ffb3c6',11,'left',{plate:'rgba(8,30,38,.85)',maxW:degenW,min:10});
                    }
                    labelFit(ctx,shadeOn ? '亮暗表示瞬間水面高低；單張亮暗圖不能判定腹節線。' : '亮暗紋已隱藏：先推理，再打開亮暗紋或輔助線核對。',x0+6,y1+30,C.muted,11,'left',{maxW:TW,min:10});
                    return;
                }


                /* ============ 三維水面起伏 ============ */
                if (p.mode === '3D') {
                    /* 近景：只涵蓋俯視的一半範圍，山脊寬一倍才看得出形狀 */
                    const sc3 = TW / 12;
                    const d3 = dCm * sc3;
                    const lam3 = Math.max(lamCm * sc3, 8);
                    const k3 = (2 * Math.PI) / lam3;
                    const isRealDecay = Number(p.decay) === 1;
                    const showGuides = Number(p.lines) === 1;

                    /* 世界座標以水槽中心為原點；波源在 (±d3/2, 0) */
                    const HU = TW / 2, HV = TH / 2;
                    const zAt = (a, b) => {
                        const r1 = Math.hypot(a + d3 / 2, b);
                        const r2 = Math.hypot(a - d3 / 2, b);
                        const A1 = wiAmplitude(p,r1/sc3), A2 = wiAmplitude(p,r2/sc3);
                        return A1 * Math.cos(k3 * r1 - om * t + phase1)
                             + A2 * Math.cos(k3 * r2 - om * t + phase2);
                    };
                    /* 波程差（單位：波長）；用來把節線「染」進水面 */
                    const qAt = (a, b) => (Math.hypot(a + d3 / 2, b)
                                         - Math.hypot(a - d3 / 2, b)) / lam3;

                    /* 方位角：繞鉛直軸旋轉。限制在 ±50°，
                     * 超出這個範圍逐列由遠而近的畫法會出現遮擋錯誤。 */
                    const yaw = Math.max(-50, Math.min(50, Number(p.yaw) || 0)) * Math.PI / 180;
                    const CY = Math.cos(yaw), SY = Math.sin(yaw);
                    const TILT = 0.46;                       // 俯角造成的深度壓縮
                    const halfW = Math.abs(HU * CY) + Math.abs(HV * SY);
                    const halfD = Math.abs(HU * SY) + Math.abs(HV * CY);
                    const SX = (TW * 0.5 - 6) / halfW;
                    const SD = SX * TILT;
                    const ZA = Math.max(14, Math.min(44, (TH - 2 * halfD * SD - 24) / 4.4));
                    const midY = y0 + (TH - 8) / 2 + 6;
                    const projX = (a, b) => cx + (a * CY - b * SY) * SX;
                    const projY = (a, b, z) => midY + (a * SY + b * CY) * SD - z * ZA;

                    /* 先把高度算成陣列，法線才有辦法用鄰點算，也省下重複計算 */
                    const NU = 84, NV = 52;
                    const Z = new Float64Array((NU + 1) * (NV + 1));
                    const Q = new Float64Array((NU + 1) * (NV + 1));
                    const aOf = (i) => -HU + (2 * HU) * i / NU;
                    const bOf = (j) => -HV + (2 * HV) * j / NV;
                    for (let j = 0; j <= NV; j++) {
                        const b = bOf(j);
                        for (let i = 0; i <= NU; i++) {
                            const idx = j * (NU + 1) + i;
                            Z[idx] = zAt(aOf(i), b);
                            Q[idx] = qAt(aOf(i), b);
                        }
                    }

                    /* 逐格上色。由遠而近（b 由小到大）畫，近的自然蓋住遠的。 */
                    const nodeHit = (q) => {
                        const shifted = q-(phase2-phase1)/(2*Math.PI);
                        const r = Math.abs(shifted-Math.round(shifted-0.5)-0.5);
                        return r < 0.085 ? (1 - r / 0.085) : 0;
                    };
                    for (let j = 0; j < NV; j++) {
                        for (let i = 0; i < NU; i++) {
                            const i0 = j * (NU + 1) + i, i1 = i0 + 1;
                            const i2 = i0 + (NU + 1), i3 = i2 + 1;
                            const z0 = Z[i0], z1 = Z[i1], z2 = Z[i2], z3 = Z[i3];
                            const a0 = aOf(i), a1 = aOf(i + 1);
                            const b0 = bOf(j), b1 = bOf(j + 1);

                            /* 斜率決定明暗：面向光源的斜面亮、背光的暗 */
                            const du = (2 * HU) / NU, dv = (2 * HV) / NV;
                            const gx = ((z1 + z3) - (z0 + z2)) / (2 * du) * ZA;
                            const gy = ((z2 + z3) - (z0 + z1)) / (2 * dv) * ZA;
                            const nl = 1 / Math.sqrt(gx * gx + gy * gy + 1);
                            /* 光從左上前方來 */
                            const lum = Math.max(0, Math.min(1,
                                0.30 + 0.86 * nl * (0.55 - gx * 0.42 - gy * 0.30) + 0.30 * nl));

                            const zm = (z0 + z1 + z2 + z3) / 4;
                            const hi = Math.max(0, Math.min(1, (zm + 1.8) / 3.6));   // 0 谷 → 1 峰
                            let R = 18 + 150 * hi, G = 78 + 150 * hi, B = 108 + 138 * hi;
                            R *= lum; G *= lum; B *= lum;

                            /* 節線染色：畫在曲面裡，遮擋關係自動正確 */
                            const nh = showGuides ? nodeHit((Q[i0]+Q[i1]+Q[i2]+Q[i3])/4) : 0;
                            if (nh > 0) {
                                R = R * (1 - nh) + 236 * nh * lum;
                                G = G * (1 - nh) + 132 * nh * lum;
                                B = B * (1 - nh) + 168 * nh * lum;
                            }

                            ctx.fillStyle = `rgb(${R | 0},${G | 0},${B | 0})`;
                            ctx.beginPath();
                            ctx.moveTo(projX(a0, b0), projY(a0, b0, z0));
                            ctx.lineTo(projX(a1, b0), projY(a1, b0, z1));
                            ctx.lineTo(projX(a1, b1), projY(a1, b1, z3));
                            ctx.lineTo(projX(a0, b1), projY(a0, b1, z2));
                            ctx.closePath();
                            ctx.fill();
                        }
                    }

                    /* 波源與浮標：節線上那個永遠不動，是這個模式的重點 */
                    const bF = HV * 0.42;
                    const locusA = (q) => {                    // 雙曲線解析式
                        const aa = Math.abs(q) * lam3 / 2, cF = d3 / 2;
                        if (aa > cF - 1e-6) return null;
                        if (Math.abs(q) < 1e-9) return 0;
                        return Math.sign(q) * aa * Math.sqrt(1 + (bF * bF) / (cF * cF - aa * aa));
                    };
                    const floats = (showGuides ? [0,0.5,1] : []).map(q => {
                        const shifted = q-(phase2-phase1)/(2*Math.PI);
                        const isNode = Math.abs(shifted-Math.round(shifted-0.5)-0.5)<1e-6;
                        return {q,isNode,col:isNode ? '#ff9ec2' : '#8ef5c8',a:locusA(q)};
                    })
                     .filter((o) => o.a !== null && Math.abs(o.a) < HU - 8);

                    floats.forEach((o) => {
                        const z = zAt(o.a, bF);
                        const X = projX(o.a, bF);
                        const Y0 = projY(o.a, bF, 0), Y = projY(o.a, bF, z);
                        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.6;
                        ctx.beginPath(); ctx.moveTo(X, Y0); ctx.lineTo(X, Y); ctx.stroke();
                        ctx.fillStyle = o.col;
                        ctx.beginPath(); ctx.arc(X, Y, 6, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = 'rgba(6,26,34,0.95)'; ctx.lineWidth = 1.8; ctx.stroke();
                    });

                    [[-d3 / 2, 'S₁'], [d3 / 2, 'S₂']].forEach(([a, nm]) => {
                        const z = zAt(a, 0);
                        const X = projX(a, 0), Y = projY(a, 0, z);
                        ctx.fillStyle = '#ffd166';
                        ctx.beginPath(); ctx.arc(X, Y, 6, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = 'rgba(6,26,34,0.95)'; ctx.lineWidth = 1.8; ctx.stroke();
                        labelFit(ctx, nm, X + 9, Y - 9, '#ffe8a3', 12, 'left',
                                 { clampW: w, plate: 'rgba(6,26,34,0.72)' });
                    });

                    /* 說明面板 */
                    const nodeF = floats.find((o) => o.isNode);
                    const zNode = nodeF ? zAt(nodeF.a, bF) : 0;
                    const panelW = Math.min(380, TW - 20);
                    const lineH = 19, panelTop = y0+6, firstY = panelTop+lineH;
                    ctx.fillStyle = 'rgba(6, 26, 34, 0.82)';
                    ctx.fillRect(x0+6,panelTop,panelW,3*lineH+10);
                    [[showGuides ? isRealDecay ? '粉紅水道：兩波反相到達的位置' : '粉紅水道：反相且等振幅的節線' : '輔助線已隱藏，可先自行觀察水面','#ff9ec2'],
                     [nodeF ? `粉紅浮標高度 = ${Math.abs(zNode)<0.005 ? '0.00' : zNode.toFixed(2)} A${isRealDecay ? '（可能有殘留）' : '（始終靜止）'}` : '目前沒有可見的粉紅浮標','#ff9ec2'],
                     [`拖曳畫面可旋轉　方位角 ${(yaw * 180 / Math.PI).toFixed(0)}°`, '#cfe9f2']
                    ].forEach(([txt, col], i) => {
                        labelFit(ctx,txt,x0+14,firstY+i*lineH,col,12,'left',{maxW:panelW-20,min:10});
                    });
                    labelFit(ctx,isRealDecay ? '振幅隨距離衰減；兩波振幅不同，反相處仍可能振動。' : '同相波源中央為腹線；反相波源中央為節線。拖曳可旋轉。',
                             x0+6,y1+30,C.muted,11,'left',{maxW:TW-12});
                    return;
                }

                /* ============ 一維連線波形 ============ */
                ctx.fillStyle = 'rgba(11, 111, 146, 0.04)';
                ctx.fillRect(x0, y0, TW, TH);
                ctx.strokeStyle = 'rgba(18, 49, 58, 0.16)'; ctx.lineWidth = 1;
                ctx.strokeRect(x0, y0, TW, TH);

                // 平衡位置基準線
                ctx.strokeStyle = 'rgba(18, 49, 58, 0.28)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
                labelFit(ctx, '兩波源連線上的平衡位置 (y = 0)', x0 + 8, cy - 8, C.muted, 10, 'left', { maxW: TW * 0.4 });
                label(ctx, 'x →', x1-6, cy-8, C.muted,10,'right');

                // 駐波包絡線 (兩波源之間)
                ctx.save();
                ctx.strokeStyle = 'rgba(107, 70, 193, 0.35)'; ctx.lineWidth = 1.4; ctx.setLineDash([4, 4]);
                ctx.beginPath();
                for (let x = s1.x; x <= s2.x; x += 2) {
                    const env = envelopeAt(Math.abs(x-s1.x),Math.abs(x-s2.x))*36;
                    if (x === s1.x) ctx.moveTo(x, cy - env); else ctx.lineTo(x, cy - env);
                }
                for (let x = s2.x; x >= s1.x; x -= 2) {
                    const env = envelopeAt(Math.abs(x-s1.x),Math.abs(x-s2.x))*36;
                    ctx.lineTo(x, cy + env);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();

                // 合成波曲線
                ctx.strokeStyle = '#0b6f92'; ctx.lineWidth = 2.4;
                ctx.beginPath();
                for (let x = x0; x <= x1; x += 2) {
                    const r1 = Math.abs(x - s1.x);
                    const r2 = Math.abs(x - s2.x);
                    const z = waveAt(r1,r2);
                    const py = cy - z * 36;
                    if (x === x0) ctx.moveTo(x, py); else ctx.lineTo(x, py);
                }
                ctx.stroke();

                // 波源位置
                [s1, s2].forEach((s, idx) => {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath(); ctx.arc(s.x, cy, 6, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#081e26'; ctx.lineWidth = 1.5; ctx.stroke();
                    labelFit(ctx,`S${idx+1}`,s.x+(idx ? 10 : -10),cy+22,C.ink,11,idx ? 'left' : 'right',{clampW:w});
                });

                // 若有測量點 P，標示其連線上的 x 位置與瞬時振盪
                if (point) {
                    const px = point.x;
                    const r1 = Math.abs(px - s1.x);
                    const r2 = Math.abs(px - s2.x);
                    const z = waveAt(r1,r2);
                    const py = cy - z * 36;

                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
                    ctx.beginPath(); ctx.moveTo(px, y0); ctx.lineTo(px, y1); ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
                    labelFit(ctx, `P (z = ${(z).toFixed(2)} A)`, px + 8, py - 8, '#ef4444', 11, 'left', { clampW: w, maxW: 140 });
                }

                wiSpacingMarks(ctx,p,{s1x:s1.x,s2x:s2.x,srcY:cy+30,lineY:y1-100,
                    lamPx,dCm,lamCm,x0,x1,barY:y1-16,ink:'#8c5600',hi:'#d99a19',halo:'rgba(255,255,255,.95)',plate:'rgba(255,255,255,.95)'});
                labelFit(ctx,'一維連線剖面：實線是瞬間位移，虛線是振幅包絡。',x0+6,y1+30,C.muted,11,'left',{maxW:TW,min:10});
            }
        };
        /* 6. 聲波的傳播 ---------------------------------------------------- */
        LABS.sound = {
            name: '聲波的傳播',
            cycle: 2.4,
            tag: 'N08',
            hint: '深色環代表密部、淺色環代表疏部；相鄰兩個密部相距一個波長。選一個模式，觀察溫度、介質或回聲時間與聲波的關係。',
            note: '本模擬給定空氣、水與鋼的聲速；聲波由空氣進入水或鋼時，波速與波長增加，頻率不變。聲速取決於介質的彈性與密度，不能只用「密度較大」判定聲速較快。',
            height: 400,
            modes: [
                { key: 'medium', label: '介質與溫度' },
                { key: 'refract', label: '折射：空氣 → 水' },
                { key: 'echo', label: '回聲與聲納' }
            ],
            controls: [
                { key: 'temp', label: '氣溫 T (°C)', min: -20, max: 40, step: 1, value: 15, fmt: (v) => `${v} °C`, only: ['medium', 'echo'] },
                { key: 'f', label: '波源頻率 f (Hz)', min: 200, max: 2000, step: 20, value: 500, fmt: (v) => `${v} Hz`, only: ['medium', 'refract'] },
                { key: 'dist', label: '到牆（或海底）的距離 (m)', min: 20, max: 400, step: 5, value: 170, fmt: (v) => `${v} m`, only: ['echo'] }
            ],
            readouts: (p) => {
                const v = 331 + 0.6 * p.temp;
                if (p.mode === 'medium') return [
                    { label: '空氣中聲速 v = 331 + 0.6T', value: `${v.toFixed(1)} m/s` },
                    { label: '波長 λ = v / f', value: `${(v / Math.max(p.f, 1)).toFixed(3)} m` },
                    { label: '本例聲速：鋼 > 水 > 空氣', value: '鋼 5950｜水 1493｜20°C 空氣 343 m/s' },
                    { label: '聲波是', value: '縱波・力學波（真空不能傳聲）' }];
                if (p.mode === 'refract') {
                    const vAir = 343, vWater = 1493;
                    return [
                        { label: '空氣中', value: `v = ${vAir} m/s，λ = ${(vAir / Math.max(p.f, 1)).toFixed(3)} m` },
                        { label: '水中', value: `v = ${vWater} m/s，λ = ${(vWater / Math.max(p.f, 1)).toFixed(3)} m` },
                        { label: '波長變化', value: `變長 ${(vWater / vAir).toFixed(2)} 倍` },
                        { label: '頻率', value: '完全不變（由波源決定）' }];
                }
                const tt = 2 * p.dist / v;
                return [
                    { label: '聲速', value: `${v.toFixed(1)} m/s` },
                    { label: '來回時間 t = 2d / v', value: `${tt.toFixed(3)} s` },
                    { label: '由 t 反推距離', value: 'd = v · t / 2（務必除以 2）' },
                    { label: '人耳能分辨回聲', value: tt >= 0.1 ? `可以（t = ${tt.toFixed(2)} s ≥ 0.1 s）` : `不行（t = ${tt.toFixed(2)} s < 0.1 s）` }];
            },
            draw: (ctx, w, h, p, t) => {
                const x0 = 12, x1 = Math.max(x0 + 120, w - 12), y0 = 8, y1 = h - 34;
                const TW = x1 - x0, TH = y1 - y0;

                /* ---- 共用：畫一組疏密相間的球面波環 ---- */
                const rings = (sx, sy, lamPx, phase, rMax, a0, a1, tint) => {
                    ctx.save();
                    ctx.beginPath(); ctx.rect(x0, y0, TW, TH); ctx.clip();
                    for (let n = 0; n < 40; n++) {
                        const R = phase + n * lamPx / 2;
                        if (R > rMax) break;
                        if (R < 4) continue;
                        const dense = (n % 2 === 0);
                        const fade = Math.max(0.08, 1 - R / rMax);
                        ctx.strokeStyle = dense
                            ? `rgba(${tint[0]},${tint[1]},${tint[2]},${0.72 * fade})`
                            : `rgba(${tint[0]},${tint[1]},${tint[2]},${0.16 * fade})`;
                        ctx.lineWidth = dense ? Math.max(2, lamPx * 0.16) : Math.max(1.5, lamPx * 0.14);
                        ctx.beginPath(); ctx.arc(sx, sy, R, a0, a1); ctx.stroke();
                    }
                    ctx.restore();
                };
                /* ---- 共用：畫一支音叉 ---- */
                const fork = (fx, fy, wob) => {
                    ctx.strokeStyle = '#41606b'; ctx.lineWidth = 3.4;
                    ctx.beginPath();
                    ctx.moveTo(fx - 7 - wob, fy - 26); ctx.lineTo(fx - 7 - wob, fy - 4);
                    ctx.moveTo(fx + 7 + wob, fy - 26); ctx.lineTo(fx + 7 + wob, fy - 4);
                    ctx.moveTo(fx, fy - 4); ctx.lineTo(fx, fy + 16);
                    ctx.stroke();
                };

                /* ============ 介質與溫度 ============ */
                if (p.mode === 'medium') {
                    const v = 331 + 0.6 * p.temp;
                    const lamM = v / Math.max(p.f, 1);                  // 公尺
                    const lamPx = Math.max(10, Math.min(70, lamM * 90));
                    const sx = x0 + TW * 0.20, sy = y0 + TH * 0.48;
                    const phase = ((t * 34) % lamPx);
                    rings(sx, sy, lamPx, phase, TW * 1.05, -Math.PI, Math.PI, [11, 111, 146]);
                    fork(sx, sy, Math.sin(t * 9) * 1.6);
                    labelFit(ctx, '音叉（波源）', sx, sy + 34, C.ink, 11, 'center', { clampW: w, plate: 1 });
                    /* 右上角聲速表的寬度隨畫布縮放，左側說明文字則以「表格左緣」為可用寬度上限 */
                    /* 畫布太窄時，說明文字與聲速表無法並存（兩邊都會被切成碎片）。
                     * 此時不畫表——畫布下方的即時讀數已經列出同一組數字。 */
                    const showPanel = TW >= 430;
                    const panelW = showPanel ? Math.min(200, TW * 0.42) : 0;
                    const panelX = x1 - panelW;
                    const capMax = (showPanel ? panelX - 14 : x1) - (x0 + 8);
                    const capLineH = 18;
                    let capY = y0 + 18;
                    [['深色環＝密部（壓力大）　淺色環＝疏部（壓力小）', C.ink],
                     [`v = 331 + 0.6 × ${p.temp} = ${v.toFixed(1)} m/s`, C.blue],
                     [`λ = v / f = ${lamM.toFixed(3)} m`, C.cyan]
                    ].forEach(([txt, col]) => {
                        capY += labelWrap(ctx, txt, x0 + 8, capY, col, 12, capLineH, capMax) * capLineH;
                    });
                    // 波長尺寸線
                    const ra = phase + 2 * lamPx, rb = ra + lamPx;
                    if (sx + rb < x1 - 10) {
                        const yy = sy + TH * 0.34;
                        ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(sx + ra, yy); ctx.lineTo(sx + rb, yy);
                        ctx.moveTo(sx + ra, yy - 5); ctx.lineTo(sx + ra, yy + 5);
                        ctx.moveTo(sx + rb, yy - 5); ctx.lineTo(sx + rb, yy + 5);
                        ctx.stroke();
                        labelFit(ctx, 'λ（相鄰兩密部）', (sx + ra + sx + rb) / 2, yy - 8, C.cyan, 11, 'center', { clampW: w, plate: 1 });
                    }
                    // 不同介質的聲速比較表
                    if (!showPanel) {
                        labelFit(ctx, '本例：鋼 > 水 > 空氣；介質條件決定聲速',
                                 x0 + 8, y1 + 18, C.muted, 11, 'left', { maxW: TW - 16 });
                        return;
                    }
                    const tx = panelX, ty = y0 + 14;
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.strokeStyle = 'rgba(18,49,58,0.14)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.rect(tx, ty, panelW - 8, 92); ctx.fill(); ctx.stroke();
                    labelFit(ctx, '各介質中的聲速 (m/s)', tx + 10, ty + 18, C.ink, 11, 'left', { maxW: panelW - 28 });
                    [['鋼　固體', '5950'], ['水　液體', '1493'], ['空氣 20°C', '343'], ['空氣 0°C', '331']]
                        .forEach((r, i) => {
                            labelFit(ctx, r[0], tx + 10, ty + 36 + i * 15, C.muted, 10, 'left', { maxW: panelW - 70 });
                            label(ctx, r[1], tx + panelW - 18, ty + 36 + i * 15, C.blue, 10, 'right');
                        });
                    labelFit(ctx, '本例：鋼 > 水 > 空氣；介質條件決定聲速',
                             x0 + 8, y1 + 18, C.muted, 11, 'left', { maxW: TW - 16 });
                    return;
                }

                /* ============ 折射：空氣 → 水 ============ */
                if (p.mode === 'refract') {
                    const vAir = 343, vWater = 1493;
                    const iy = y0 + TH * 0.44;
                    ctx.fillStyle = 'rgba(11,111,146,0.05)'; ctx.fillRect(x0, y0, TW, iy - y0);
                    ctx.fillStyle = 'rgba(6,148,162,0.13)'; ctx.fillRect(x0, iy, TW, y1 - iy);
                    ctx.strokeStyle = C.cyan; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(x0, iy); ctx.lineTo(x1, iy); ctx.stroke();

                    const lamAirPx = Math.max(12, Math.min(56, (vAir / Math.max(p.f, 1)) * 80));
                    const lamWaterPx = lamAirPx * (vWater / vAir);
                    const ph = ((t * 40) % lamAirPx);
                    // 空氣中的平面波前（由上往下）
                    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, TW, iy - y0); ctx.clip();
                    ctx.strokeStyle = 'rgba(11,111,146,0.7)'; ctx.lineWidth = 2.4;
                    for (let n = 0; n < 30; n++) {
                        const Y = iy - lamAirPx + ph - n * lamAirPx;   // 往下走向界面
                        if (Y < y0 - 2) break;
                        ctx.beginPath(); ctx.moveTo(x0 + 6, Y); ctx.lineTo(x1 - 6, Y); ctx.stroke();
                    }
                    ctx.restore();
                    // 水中的平面波前（間距變大）
                    ctx.save(); ctx.beginPath(); ctx.rect(x0, iy, TW, y1 - iy); ctx.clip();
                    ctx.strokeStyle = 'rgba(6,148,162,0.85)'; ctx.lineWidth = 2.4;
                    for (let n = 0; n < 30; n++) {
                        const Y = iy + ph * (vWater / vAir) + n * lamWaterPx;   // 往下離開界面
                        if (Y > y1 + 2) break;
                        if (Y < iy - 1) continue;
                        ctx.beginPath(); ctx.moveTo(x0 + 6, Y); ctx.lineTo(x1 - 6, Y); ctx.stroke();
                    }
                    ctx.restore();

                    const cxm = (x0 + x1) / 2;
                    arrow(ctx, cxm, y0 + 16, cxm, iy - 8, C.blue, 2.2);
                    arrow(ctx, cxm, iy + 8, cxm, y1 - 16, C.cyan, 2.2);
                    label(ctx, `空氣：v = ${vAir} m/s，λ = ${(vAir / Math.max(p.f, 1)).toFixed(3)} m`, x0 + 10, y0 + 20, C.blue, 12);
                    label(ctx, `水：v = ${vWater} m/s，λ = ${(vWater / Math.max(p.f, 1)).toFixed(3)} m（波長變長）`, x0 + 10, iy + 22, C.cyan, 12);
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.strokeStyle = 'rgba(194,38,74,0.3)'; ctx.lineWidth = 1;
                    const bx = x1 - 268, byy = iy - 46;
                    ctx.beginPath(); ctx.rect(bx, byy, 258, 40); ctx.fill(); ctx.stroke();
                    labelFit(ctx, '聲波由空氣進入水或鋼：變快、變長', bx + 10, byy + 17, C.rose, 12,
                             'left', { clampW: w, maxW: w - 20 });
                    labelFit(ctx, '光由空氣進入玻璃：變慢、變短', bx + 10, byy + 33,
                             C.rose, 11, 'left', { clampW: w, maxW: w - 20 });
                    label(ctx, '頻率由波源決定，穿越界面時完全不變', x0 + 8, y1 + 18, C.muted, 11);
                    return;
                }

                /* ============ 回聲與聲納 ============ */
                const v = 331 + 0.6 * p.temp;
                const D = p.dist;
                const sx = x0 + 54, sy = y0 + TH * 0.42;
                const wallX = x1 - 40;
                const travelPx = wallX - sx;
                const period = Math.max(1.2, (2 * D / v) * 1.6 + 0.9);   // 動畫一輪的秒數
                const u = (t % period) / period;                          // 0→1
                const goPhase = Math.min(1, u * 2);                       // 前半段去程
                const backPhase = Math.max(0, u * 2 - 1);                 // 後半段回程

                ctx.fillStyle = 'rgba(11,111,146,0.05)'; ctx.fillRect(x0, y0, TW, TH);
                ctx.fillStyle = '#41606b'; ctx.fillRect(wallX, y0 + 10, 14, TH - 20);
                label(ctx, '牆 / 海底', wallX + 7, y0 + TH - 2, C.muted, 10, 'center');

                ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, TW, TH); ctx.clip();
                if (backPhase <= 0) {
                    for (let n = 0; n < 4; n++) {
                        const R = goPhase * travelPx - n * 16;
                        if (R < 2) continue;
                        ctx.strokeStyle = `rgba(11,111,146,${0.7 - n * 0.15})`; ctx.lineWidth = 2.4;
                        ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.2, Math.PI / 2.2); ctx.stroke();
                    }
                } else {
                    for (let n = 0; n < 4; n++) {
                        const R = backPhase * travelPx - n * 16;
                        if (R < 2) continue;
                        ctx.strokeStyle = `rgba(107,70,193,${0.7 - n * 0.15})`; ctx.lineWidth = 2.4;
                        ctx.beginPath(); ctx.arc(wallX, sy, R, Math.PI - Math.PI / 2.2, Math.PI + Math.PI / 2.2); ctx.stroke();
                    }
                }
                ctx.restore();
                fork(sx, sy, Math.sin(t * 9) * 1.6);
                label(ctx, '波源／偵測器', sx, sy + 34, C.ink, 11, 'center');
                label(ctx, backPhase <= 0 ? '① 去程：聲波往牆前進' : '② 回程：反射波回到偵測器', x0 + 10, y0 + 20,
                    backPhase <= 0 ? C.blue : C.violet, 12);

                // 距離標示與公式
                const yy = y1 - 26;
                ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(sx, yy); ctx.lineTo(wallX, yy);
                ctx.moveTo(sx, yy - 5); ctx.lineTo(sx, yy + 5);
                ctx.moveTo(wallX, yy - 5); ctx.lineTo(wallX, yy + 5);
                ctx.stroke();
                label(ctx, `d = ${D} m`, (sx + wallX) / 2, yy - 8, C.muted, 11, 'center');
                const tt = 2 * D / v;
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.strokeStyle = 'rgba(18,49,58,0.14)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(x0 + 8, y1 - 96, 250, 62); ctx.fill(); ctx.stroke();
                label(ctx, `聲波走的總路程 = 2d = ${2 * D} m`, x0 + 16, y1 - 78, C.ink, 11);
                label(ctx, `來回時間 t = 2d / v = ${tt.toFixed(3)} s`, x0 + 16, y1 - 62, C.blue, 11);
                label(ctx, `⇒ 由 t 求距離時 d = v·t / 2`, x0 + 16, y1 - 46, C.rose, 11);
                label(ctx, tt >= 0.1 ? '來回超過 0.1 s，人耳可分辨出回聲' : '來回不到 0.1 s，人耳分不出回聲（與原聲混在一起）',
                    x0 + 8, y1 + 18, tt >= 0.1 ? C.green : C.rose, 11);
            }
        };
        /* 12. 光的干涉實驗（楊氏雙狹縫） ------------------------------------ */
        LABS.young = {
            name: '光的干涉實驗（楊氏雙狹縫）',
            cycle: 1.85,
            tag: 'N19',
            hint: '「實驗裝置」模式＝楊氏 1801 年的原始裝置：平行光先過單狹縫 S₀ 成為新線光源，使 S₁、S₂ 落在同一波前上而成為同相同調光。「幾何與公式」模式則把課本圖 (a) 畫出來——拖動 P 點，看波程差 Δℓ = d sinθ 在整數倍與半整數倍波長之間變化，即時判定亮紋或暗紋。',
            note: '圖中尺寸未按實際比例。遠屏條件 L ≫ d，加上中央附近 |y| ≪ L，才可用 sinθ ≈ tanθ ≈ y/L。兩同相點光源模型下，亮紋波程差為整數倍 λ，暗紋為半整數倍 λ；忽略單縫包絡時亮紋近似等亮。',
            height: 470,
            modes: [
                { key: 'setup', label: '實驗裝置與干涉場' },
                { key: 'geometry', label: '幾何關係與公式' }
            ],
            controls: [
                { key: 'lam', label: '波長 λ (nm)', min: 400, max: 700, step: 5, value: 550, fmt: (v) => `${v} nm` },
                { key: 'd', label: '狹縫間距 d (μm)', min: 20, max: 400, step: 5, value: 120, fmt: (v) => `${v} μm` },
                { key: 'L', label: '屏幕距離 L (m)', min: 0.3, max: 2.5, step: 0.1, value: 1.2, fmt: (v) => `${v.toFixed(1)} m` },
                { key: 'yn', label: 'P 點高度（以 Δy 為單位）', min: -300, max: 300, step: 5, value: 100, fmt: (v) => `${(v / 100).toFixed(2)} Δy`, only: ['geometry'] }
            ],
            readouts: (p) => {
                const lam = p.lam * 1e-9, d = p.d * 1e-6;
                const dy = p.L * lam / d;
                if (p.mode === 'geometry') {
                    const q = p.yn / 100;                                   // Δℓ / λ
                    const y = q * dy;
                    const near = (x) => Math.abs(x - Math.round(x));
                    const bright = near(q) < 0.03, dark = Math.abs(Math.abs(q % 1) - 0.5) < 0.03;
                    return [
                        { label: 'Δℓ / λ', value: q.toFixed(2) },
                        { label: 'P 點高度 y', value: `${(y * 100).toFixed(2)} cm` },
                        { label: '判定', value: bright ? `亮紋（n = ${Math.abs(Math.round(q))}）` : (dark ? `暗紋（m = ${Math.round(Math.abs(q) + 0.5)}）` : '介於亮紋與暗紋之間') },
                        { label: '條紋間距 Δy = Lλ/d', value: `${(dy * 1000).toFixed(2)} mm` }
                    ];
                }
                return [
                    { label: '條紋間距 Δy = Lλ/d', value: `${(dy * 1000).toFixed(2)} mm` },
                    { label: '理想點光源亮紋', value: '中央附近等距・忽略包絡時等亮' },
                    { label: '中央亮紋', value: '只有 1 條（n = 0）' },
                    { label: '浸入水中 n = 1.33', value: `Δy → ${(dy * 1000 / 1.33).toFixed(2)} mm（變 1/n 倍）` }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const lam = p.lam * 1e-9, dd = p.d * 1e-6;
                const dy = p.L * lam / dd;                                  // 條紋間距（公尺）
                // 依波長取近似色
                const wl = p.lam;
                let rgb;
                if (wl < 440) rgb = [130, 0, 200];
                else if (wl < 490) rgb = [0, 90, 235];
                else if (wl < 510) rgb = [0, 180, 190];
                else if (wl < 580) rgb = [70, 200, 60];
                else if (wl < 645) rgb = [235, 160, 0];
                else rgb = [225, 40, 40];
                const col = (a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

                /* ================= 模式一：實驗裝置與干涉場 ================= */
                if (p.mode === 'setup') {
                    const y0 = 8, y1 = h - 74, cy = (y0 + y1) / 2, TH = y1 - y0;
                    const xSrc = 16, xA = Math.max(66, w * 0.10), xB = Math.max(xA + 60, w * 0.26);
                    const xS = Math.max(xB + 120, w - 132);               // 屏幕位置
                    const dPix = Math.max(16, Math.min(TH * 0.30, 26 + p.d * 0.10));
                    const s1 = { x: xB, y: cy + dPix / 2 };
                    const s2 = { x: xB, y: cy - dPix / 2 };
                    const lamPix = Math.max(9, Math.min(30, 3200 * lam / dd * 0.5 + 8));
                    const k = 2 * Math.PI / lamPix;
                    const om = 3.4;

                    // 干涉場（S1、S2 之後）
                    const step = 4;
                    const fw = xS - xB, fh = TH;
                    if (fw > 20) {
                        const iw = Math.ceil(fw / step) * step, ih = Math.ceil(fh / step) * step;
                        const img = ctx.createImageData(iw, ih);
                        for (let yy = 0; yy < ih; yy += step) {
                            for (let xx = 0; xx < iw; xx += step) {
                                const gx = xB + xx, gy = y0 + yy;
                                const r1 = Math.hypot(gx - s1.x, gy - s1.y);
                                const r2 = Math.hypot(gx - s2.x, gy - s2.y);
                                const a1 = Math.cos(k * r1 - om * t) / Math.sqrt(Math.max(r1, 12));
                                const a2 = Math.cos(k * r2 - om * t) / Math.sqrt(Math.max(r2, 12));
                                const v = Math.max(0, Math.min(1, Math.abs((a1 + a2) * 5.2)));
                                for (let ddy = 0; ddy < step; ddy++) {
                                    const row = (yy + ddy) * iw;
                                    for (let ddx = 0; ddx < step; ddx++) {
                                        const idx = (row + xx + ddx) * 4;
                                        img.data[idx] = rgb[0] * v + 10 * (1 - v);
                                        img.data[idx + 1] = rgb[1] * v + 16 * (1 - v);
                                        img.data[idx + 2] = rgb[2] * v + 22 * (1 - v);
                                        img.data[idx + 3] = 255;
                                    }
                                }
                            }
                        }
                        const off = getOffscreen(iw, ih);
                        off.ctx.putImageData(img, 0, 0);
                        ctx.drawImage(off.canvas, 0, 0, iw, ih, xB, y0, fw, fh);
                    }

                    // 光源與 S0 之前的區域
                    ctx.fillStyle = 'rgba(11,111,146,0.05)';
                    ctx.fillRect(0, y0, xB, TH);
                    for (let i = 0; i < 7; i++) {
                        const yy = y0 + TH * (i + 0.5) / 7;
                        arrow(ctx, xSrc, yy, xA - 12, yy, col(0.8), 1.6);
                    }
                    label(ctx, '平行光', xSrc, y0 + 14, C.ink, 11);

                    // 屏 A（單狹縫 S0）
                    ctx.fillStyle = '#3b5a66';
                    ctx.fillRect(xA - 4, y0, 8, TH / 2 - 5);
                    ctx.fillRect(xA - 4, cy + 5, 8, y1 - cy - 5);
                    label(ctx, '屏 A', xA, y1 + 14, C.muted, 10, 'center');
                    label(ctx, 'S₀', xA + 8, cy + 4, C.ink, 12);

                    // S0 → S1、S2 的圓形波前
                    ctx.save(); ctx.beginPath(); ctx.rect(xA, y0, xB - xA, TH); ctx.clip();
                    ctx.strokeStyle = col(0.55); ctx.lineWidth = 1.6;
                    for (let n = 0; n < 26; n++) {
                        const R = ((t * 26) % lamPix) + n * lamPix;
                        if (R > (xB - xA) * 1.6) break;
                        ctx.beginPath(); ctx.arc(xA, cy, R, -Math.PI / 2.4, Math.PI / 2.4); ctx.stroke();
                    }
                    ctx.restore();

                    // 屏 B（雙狹縫）
                    ctx.fillStyle = '#3b5a66';
                    ctx.fillRect(xB - 4, y0, 8, s2.y - y0 - 4);
                    ctx.fillRect(xB - 4, s2.y + 4, 8, dPix - 8);
                    ctx.fillRect(xB - 4, s1.y + 4, 8, y1 - s1.y - 4);
                    [[s2, 'S₂'], [s1, 'S₁']].forEach(([s, nm]) => {
                        ctx.fillStyle = C.orange;
                        ctx.beginPath(); ctx.arc(s.x, s.y, 3.4, 0, Math.PI * 2); ctx.fill();
                        label(ctx, nm, s.x - 8, s.y + 4, '#ffffff', 11, 'right');
                    });
                    label(ctx, '屏 B', xB, y1 + 14, C.muted, 10, 'center');
                    ctx.strokeStyle = C.orange; ctx.lineWidth = 1.2;
                    dashed(ctx, xA, cy, s1.x, s1.y, 'rgba(201,117,15,0.8)');
                    dashed(ctx, xA, cy, s2.x, s2.y, 'rgba(201,117,15,0.8)');
                    label(ctx, 'S₀S₁ = S₀S₂ ⇒ S₁、S₂ 落在同一波前上 ⇒ 同相同調光', 6, y1 + 34, C.orange, 11);

                    // 屏幕上的條紋：直接由畫面上的 S₁、S₂ 幾何算出，才會與左邊的干涉場完全吻合
                    const IatY = (py) => {
                        const r1 = Math.hypot(xS - s1.x, py - s1.y);
                        const r2 = Math.hypot(xS - s2.x, py - s2.y);
                        return Math.pow(Math.cos(k * (r1 - r2) / 2), 2);
                    };
                    for (let py = y0; py <= y1; py++) {
                        const I = IatY(py);
                        ctx.fillStyle = `rgb(${Math.round(rgb[0] * I + 12 * (1 - I))},${Math.round(rgb[1] * I + 18 * (1 - I))},${Math.round(rgb[2] * I + 24 * (1 - I))})`;
                        ctx.fillRect(xS, py, 24, 1);
                    }
                    ctx.strokeStyle = 'rgba(18,49,58,0.3)'; ctx.lineWidth = 1;
                    ctx.strokeRect(xS, y0, 24, TH);
                    label(ctx, '屏幕', xS + 12, y1 + 14, C.muted, 10, 'center');
                    // 強度曲線
                    if (w - (xS + 30) > 40) {
                        const cw = w - (xS + 30) - 6;
                        ctx.strokeStyle = col(0.95); ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let py = y0; py <= y1; py++) {
                            const X = xS + 30 + IatY(py) * cw;
                            py === y0 ? ctx.moveTo(X, py) : ctx.lineTo(X, py);
                        }
                        ctx.stroke();
                        label(ctx, '強度', xS + 30, y0 + 12, C.muted, 10);
                    }
                    labelFit(ctx, `條紋間距 Δy = Lλ/d = ${(dy * 1000).toFixed(2)} mm`, 6, h - 22, C.ink, 12, 'left', { maxW: w - 12, min: 10, clampW: w });
                    labelFit(ctx, '尺寸未按比例；實驗中 L ≫ d', 6, h - 7, C.muted, 11, 'left', { maxW: w - 12, min: 10, clampW: w });
                    return;
                }

                /* ================= 模式二：幾何關係與公式 ================= */
                const y0 = 8, y1 = h - 74, cy = (y0 + y1) / 2, TH = y1 - y0;
                const xSl = Math.max(70, w * 0.13);                        // 雙狹縫位置
                const xS = Math.max(xSl + 160, w - 150);                   // 屏幕位置
                const dPix = Math.min(TH * 0.34, 96);
                const s1 = { x: xSl, y: cy + dPix / 2 };                   // 下方縫
                const s2 = { x: xSl, y: cy - dPix / 2 };                   // 上方縫
                const O = { x: xSl, y: cy };
                const q = p.yn / 100;                                      // Δℓ / λ
                const halfSpan = 3.4;                                      // 螢幕上半高＝3.4 個 Δy
                const Py = cy - (q / halfSpan) * (TH * 0.46);
                const P = { x: xS, y: Math.max(y0 + 6, Math.min(y1 - 6, Py)) };

                // 入射平行光
                for (let i = 0; i < 5; i++) {
                    const yy = y0 + TH * (i + 0.5) / 5;
                    arrow(ctx, 8, yy, xSl - 14, yy, col(0.7), 1.4);
                }
                // 屏與縫
                ctx.fillStyle = '#3b5a66';
                ctx.fillRect(xSl - 4, y0, 8, s2.y - y0 - 3);
                ctx.fillRect(xSl - 4, s2.y + 3, 8, dPix - 6);
                ctx.fillRect(xSl - 4, s1.y + 3, 8, y1 - s1.y - 3);
                // 屏幕
                ctx.fillStyle = '#c9b79a';
                ctx.fillRect(xS, y0, 7, TH);
                label(ctx, '屏幕', xS + 4, y1 + 16, C.muted, 10, 'center');

                // 中央線 OO'
                dashed(ctx, O.x, O.y, xS, O.y, 'rgba(18,49,58,0.45)');
                label(ctx, "O'", xS - 12, O.y + 15, C.muted, 11, 'right');
                /* 中央線標籤：θ 角標在起點附近、「往 P 點」標在射線中段，
                 * 水平方向怎麼挪都會撞到其中一個。改成標在中央線的「另一側」——
                 * P 在線上方就標下方，反之亦然，射線永遠不會經過那裡。 */
                const midSide = (P.y < O.y) ? 16 : -8;
                label(ctx, '中央線', O.x + (xS - O.x) * 0.5, O.y + midSide, C.muted, 10, 'center');

                // PS1、PS2
                ctx.strokeStyle = col(0.9); ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(P.x, P.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(s2.x, s2.y); ctx.lineTo(P.x, P.y); ctx.stroke();

                /* 離 P 較遠的那個縫，其光程多出 Δℓ。P 在中央線上方時 S₂ 較近 ⇒ 多出來的是 S₁ 這一段。
                   作法：由較近的縫對「較遠的縫到 P」那條線作垂足 A，則 (較遠縫)A = Δℓ = d sinθ。 */
                const far = (P.y <= O.y) ? s1 : s2;                        // 離 P 較遠的縫
                const near2 = (P.y <= O.y) ? s2 : s1;                      // 離 P 較近的縫
                const ux = P.x - far.x, uy = P.y - far.y;
                const uLen = Math.max(Math.hypot(ux, uy), 1e-6);
                const ex = ux / uLen, ey = uy / uLen;
                const proj = (near2.x - far.x) * ex + (near2.y - far.y) * ey;
                const A = { x: far.x + ex * proj, y: far.y + ey * proj };
                ctx.fillStyle = 'rgba(107,70,193,0.20)';
                ctx.beginPath();
                ctx.moveTo(far.x, far.y); ctx.lineTo(near2.x, near2.y); ctx.lineTo(A.x, A.y); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = C.violet; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(far.x, far.y); ctx.lineTo(A.x, A.y); ctx.stroke();
                dashed(ctx, near2.x, near2.y, A.x, A.y, 'rgba(107,70,193,0.85)');
                ctx.fillStyle = C.violet;
                ctx.beginPath(); ctx.arc(A.x, A.y, 3, 0, Math.PI * 2); ctx.fill();
                label(ctx, 'A', A.x + 7, A.y + 14, C.violet, 11);

                // 角度 θ（在 O 處，中央線與 OP 的夾角）
                const thDraw = Math.atan2(O.y - P.y, P.x - O.x);
                ctx.strokeStyle = 'rgba(18,49,58,0.5)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(O.x, O.y, 46, -thDraw, 0, thDraw < 0); ctx.stroke();
                label(ctx, 'θ', O.x + 54, O.y - Math.sign(thDraw) * 10, C.ink, 12);

                // 縫、d、O
                [[s2, 'S₂'], [s1, 'S₁']].forEach(([s, nm]) => {
                    ctx.fillStyle = C.orange;
                    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
                    label(ctx, nm, s.x - 9, s.y + 4, C.orange, 12, 'right');
                });
                ctx.fillStyle = C.muted;
                ctx.beginPath(); ctx.arc(O.x, O.y, 2.6, 0, Math.PI * 2); ctx.fill();
                label(ctx, 'O', O.x - 9, O.y + 16, C.muted, 11, 'right');
                ctx.strokeStyle = C.orange; ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(xSl - 26, s2.y); ctx.lineTo(xSl - 26, s1.y);
                ctx.moveTo(xSl - 31, s2.y); ctx.lineTo(xSl - 21, s2.y);
                ctx.moveTo(xSl - 31, s1.y); ctx.lineTo(xSl - 21, s1.y);
                ctx.stroke();
                label(ctx, 'd', xSl - 34, cy + 4, C.orange, 12, 'right');

                // L 的標示
                ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
                const yy = y1 + 6;
                ctx.beginPath();
                ctx.moveTo(xSl, yy); ctx.lineTo(xS, yy);
                ctx.moveTo(xSl, yy - 5); ctx.lineTo(xSl, yy + 5);
