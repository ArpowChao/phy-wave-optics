            tag: 'N19',
            hint: '「實驗裝置」模式重現楊氏 1801 年的裝置：平行光先過單狹縫 S₀ 成為新線光源，使 S₁、S₂ 落在同一波前上而成為同相同調光。「幾何與公式」模式則把課本圖 (a) 畫出來——拖動 P 點，看波程差 Δℓ = d sinθ 在整數倍與半整數倍波長之間變化，即時判定亮紋或暗紋。',
            note: '圖中尺寸未按實際比例作圖：實際上 d < 1 mm、L ≈ 1 m，故 L ≫ d、θ → 0，才能用 sinθ ≈ tanθ = y/L 的小角近似。亮紋 Δℓ = nλ（n = 0,1,2…），暗紋 Δℓ = (m−½)λ（m = 1,2,3…）。',
            height: 470,
            modes: [
                { key: 'setup', label: '實驗裝置與干涉場' },
                { key: 'geometry', label: '幾何關係與公式' }
            ],
            controls: [
                { key: 'lam', label: '波長 λ (nm)', min: 400, max: 700, step: 5, value: 550, fmt: (v) => `${v} nm` },
                { key: 'd', label: '狹縫間距 d (μm)', min: 20, max: 400, step: 5, value: 120, fmt: (v) => `${v} μm` },
                { key: 'L', label: '屏幕距離 L (m)', min: 0.3, max: 2.5, step: 0.1, value: 1.2, fmt: (v) => `${v.toFixed(1)} m` },
                { key: 'yn', label: 'P 點高度（以 Δy 為單位）', min: -300, max: 300, step: 5, value: 100, fmt: (v) => `${(v / 100).toFixed(2)} Δy`, only: ['geometry'] }
            ],
            readouts: (p) => {
                const lam = p.lam * 1e-9, d = p.d * 1e-6;
                const dy = p.L * lam / d;
                if (p.mode === 'geometry') {
                    const q = p.yn / 100;                                   // Δℓ / λ
                    const y = q * dy;
                    const near = (x) => Math.abs(x - Math.round(x));
                    const bright = near(q) < 0.03, dark = Math.abs(Math.abs(q % 1) - 0.5) < 0.03;
                    return [
                        { label: 'Δℓ / λ', value: q.toFixed(2) },
                        { label: 'P 點高度 y', value: `${(y * 100).toFixed(2)} cm` },
                        { label: '判定', value: bright ? `亮紋（n = ${Math.abs(Math.round(q))}）` : (dark ? `暗紋（m = ${Math.round(Math.abs(q) + 0.5)}）` : '介於亮紋與暗紋之間') },
                        { label: '條紋間距 Δy = Lλ/d', value: `${(dy * 1000).toFixed(2)} mm` }
                    ];
                }
                return [
                    { label: '條紋間距 Δy = Lλ/d', value: `${(dy * 1000).toFixed(2)} mm` },
                    { label: '各亮紋', value: '等寬、等亮' },
                    { label: '中央亮紋', value: '只有 1 條（n = 0）' },
                    { label: '浸入水中 n = 1.33', value: `Δy → ${(dy * 1000 / 1.33).toFixed(2)} mm（變 1/n 倍）` }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const lam = p.lam * 1e-9, dd = p.d * 1e-6;
                const dy = p.L * lam / dd;                                  // 條紋間距（公尺）
                // 依波長取近似色
                const wl = p.lam;
                let rgb;
                if (wl < 440) rgb = [130, 0, 200];
                else if (wl < 490) rgb = [0, 90, 235];
                else if (wl < 510) rgb = [0, 180, 190];
                else if (wl < 580) rgb = [70, 200, 60];
                else if (wl < 645) rgb = [235, 160, 0];
                else rgb = [225, 40, 40];
                const col = (a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

                /* ================= 模式一：實驗裝置與干涉場 ================= */
                if (p.mode === 'setup') {
                    const y0 = 8, y1 = h - 60, cy = (y0 + y1) / 2, TH = y1 - y0;
                    const xSrc = 16, xA = Math.max(66, w * 0.10), xB = Math.max(xA + 60, w * 0.26);
                    const xS = Math.max(xB + 120, w - 132);               // 屏幕位置
                    const dPix = Math.max(16, Math.min(TH * 0.30, 26 + p.d * 0.10));
                    const s1 = { x: xB, y: cy + dPix / 2 };
                    const s2 = { x: xB, y: cy - dPix / 2 };
                    const lamPix = Math.max(9, Math.min(30, 3200 * lam / dd * 0.5 + 8));
                    const k = 2 * Math.PI / lamPix;
                    const om = 3.4;

                    // 干涉場（S1、S2 之後）
                    const step = 4;
                    const fw = xS - xB, fh = TH;
                    if (fw > 20) {
                        const iw = Math.ceil(fw / step) * step, ih = Math.ceil(fh / step) * step;
                        const img = ctx.createImageData(iw, ih);
                        for (let yy = 0; yy < ih; yy += step) {
                            for (let xx = 0; xx < iw; xx += step) {
                                const gx = xB + xx, gy = y0 + yy;
                                const r1 = Math.hypot(gx - s1.x, gy - s1.y);
                                const r2 = Math.hypot(gx - s2.x, gy - s2.y);
                                const a1 = Math.cos(k * r1 - om * t) / Math.sqrt(Math.max(r1, 12));
                                const a2 = Math.cos(k * r2 - om * t) / Math.sqrt(Math.max(r2, 12));
                                const v = Math.max(0, Math.min(1, Math.abs((a1 + a2) * 5.2)));
                                for (let ddy = 0; ddy < step; ddy++) {
                                    const row = (yy + ddy) * iw;
                                    for (let ddx = 0; ddx < step; ddx++) {
                                        const idx = (row + xx + ddx) * 4;
                                        img.data[idx] = rgb[0] * v + 10 * (1 - v);
                                        img.data[idx + 1] = rgb[1] * v + 16 * (1 - v);
                                        img.data[idx + 2] = rgb[2] * v + 22 * (1 - v);
                                        img.data[idx + 3] = 255;
                                    }
                                }
                            }
                        }
                        ctx.putImageData(img, xB, y0);
                    }

                    // 光源與 S0 之前的區域
                    ctx.fillStyle = 'rgba(11,111,146,0.05)';
                    ctx.fillRect(0, y0, xB, TH);
                    for (let i = 0; i < 7; i++) {
                        const yy = y0 + TH * (i + 0.5) / 7;
                        arrow(ctx, xSrc, yy, xA - 12, yy, col(0.8), 1.6);
                    }
                    label(ctx, '平行光', xSrc, y0 + 14, C.ink, 11);

                    // 屏 A（單狹縫 S0）
                    ctx.fillStyle = '#3b5a66';
                    ctx.fillRect(xA - 4, y0, 8, TH / 2 - 5);
                    ctx.fillRect(xA - 4, cy + 5, 8, y1 - cy - 5);
                    label(ctx, '屏 A', xA, y1 + 14, C.muted, 10, 'center');
                    label(ctx, 'S₀', xA + 8, cy + 4, C.ink, 12);

                    // S0 → S1、S2 的圓形波前
                    ctx.save(); ctx.beginPath(); ctx.rect(xA, y0, xB - xA, TH); ctx.clip();
                    ctx.strokeStyle = col(0.55); ctx.lineWidth = 1.6;
                    for (let n = 0; n < 26; n++) {
                        const R = ((t * 26) % lamPix) + n * lamPix;
                        if (R > (xB - xA) * 1.6) break;
                        ctx.beginPath(); ctx.arc(xA, cy, R, -Math.PI / 2.4, Math.PI / 2.4); ctx.stroke();
                    }
                    ctx.restore();

                    // 屏 B（雙狹縫）
                    ctx.fillStyle = '#3b5a66';
                    ctx.fillRect(xB - 4, y0, 8, s2.y - y0 - 4);
                    ctx.fillRect(xB - 4, s2.y + 4, 8, dPix - 8);
                    ctx.fillRect(xB - 4, s1.y + 4, 8, y1 - s1.y - 4);
                    [[s2, 'S₂'], [s1, 'S₁']].forEach(([s, nm]) => {
                        ctx.fillStyle = C.orange;
                        ctx.beginPath(); ctx.arc(s.x, s.y, 3.4, 0, Math.PI * 2); ctx.fill();
                        label(ctx, nm, s.x - 8, s.y + 4, '#ffffff', 11, 'right');
                    });
                    label(ctx, '屏 B', xB, y1 + 14, C.muted, 10, 'center');
                    ctx.strokeStyle = C.orange; ctx.lineWidth = 1.2;
                    dashed(ctx, xA, cy, s1.x, s1.y, 'rgba(201,117,15,0.8)');
                    dashed(ctx, xA, cy, s2.x, s2.y, 'rgba(201,117,15,0.8)');
                    label(ctx, 'S₀S₁ = S₀S₂ ⇒ S₁、S₂ 落在同一波前上 ⇒ 同相同調光', 6, y1 + 32, C.orange, 11);

                    // 屏幕上的條紋：直接由畫面上的 S₁、S₂ 幾何算出，才會與左邊的干涉場完全吻合
                    const IatY = (py) => {
                        const r1 = Math.hypot(xS - s1.x, py - s1.y);
                        const r2 = Math.hypot(xS - s2.x, py - s2.y);
                        return Math.pow(Math.cos(k * (r1 - r2) / 2), 2);
                    };
                    for (let py = y0; py <= y1; py++) {
                        const I = IatY(py);
                        ctx.fillStyle = `rgb(${Math.round(rgb[0] * I + 12 * (1 - I))},${Math.round(rgb[1] * I + 18 * (1 - I))},${Math.round(rgb[2] * I + 24 * (1 - I))})`;
                        ctx.fillRect(xS, py, 24, 1);
                    }
                    ctx.strokeStyle = 'rgba(18,49,58,0.3)'; ctx.lineWidth = 1;
                    ctx.strokeRect(xS, y0, 24, TH);
                    label(ctx, '屏幕', xS + 12, y1 + 14, C.muted, 10, 'center');
                    // 強度曲線
                    if (w - (xS + 30) > 40) {
                        const cw = w - (xS + 30) - 6;
                        ctx.strokeStyle = col(0.95); ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let py = y0; py <= y1; py++) {
                            const X = xS + 30 + IatY(py) * cw;
                            py === y0 ? ctx.moveTo(X, py) : ctx.lineTo(X, py);
                        }
                        ctx.stroke();
                        label(ctx, '強度', xS + 30, y0 + 12, C.muted, 10);
                    }
                    label(ctx, `實際的條紋間距 Δy = Lλ/d = ${(dy * 1000).toFixed(2)} mm，各亮紋等寬等亮`, 6, h - 26, C.ink, 12);
                    label(ctx, '圖中尺寸未按實際比例（實際 L ≫ d，條紋數遠多於圖示）', 6, h - 8, C.muted, 11);
                    return;
                }

                /* ================= 模式二：幾何關係與公式 ================= */
                const y0 = 8, y1 = h - 74, cy = (y0 + y1) / 2, TH = y1 - y0;
                const xSl = Math.max(70, w * 0.13);                        // 雙狹縫位置
                const xS = Math.max(xSl + 160, w - 150);                   // 屏幕位置
                const dPix = Math.min(TH * 0.34, 96);
                const s1 = { x: xSl, y: cy + dPix / 2 };                   // 下方縫
                const s2 = { x: xSl, y: cy - dPix / 2 };                   // 上方縫
                const O = { x: xSl, y: cy };
                const q = p.yn / 100;                                      // Δℓ / λ
                const halfSpan = 3.4;                                      // 螢幕上半高＝3.4 個 Δy
                const Py = cy - (q / halfSpan) * (TH * 0.46);
                const P = { x: xS, y: Math.max(y0 + 6, Math.min(y1 - 6, Py)) };

                // 入射平行光
                for (let i = 0; i < 5; i++) {
                    const yy = y0 + TH * (i + 0.5) / 5;
                    arrow(ctx, 8, yy, xSl - 14, yy, col(0.7), 1.4);
                }
                // 屏與縫
                ctx.fillStyle = '#3b5a66';
                ctx.fillRect(xSl - 4, y0, 8, s2.y - y0 - 3);
                ctx.fillRect(xSl - 4, s2.y + 3, 8, dPix - 6);
                ctx.fillRect(xSl - 4, s1.y + 3, 8, y1 - s1.y - 3);
                // 屏幕
                ctx.fillStyle = '#c9b79a';
                ctx.fillRect(xS, y0, 7, TH);
                label(ctx, '屏幕', xS + 4, y1 + 16, C.muted, 10, 'center');

                // 中央線 OO'
                dashed(ctx, O.x, O.y, xS, O.y, 'rgba(18,49,58,0.45)');
                label(ctx, "O'", xS - 12, O.y + 15, C.muted, 11, 'right');
                label(ctx, '中央線', (O.x + xS) / 2, O.y - 6, C.muted, 10, 'center');

                // PS1、PS2
                ctx.strokeStyle = col(0.9); ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(P.x, P.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(s2.x, s2.y); ctx.lineTo(P.x, P.y); ctx.stroke();

                /* 離 P 較遠的那個縫，其光程多出 Δℓ。P 在中央線上方時 S₂ 較近 ⇒ 多出來的是 S₁ 這一段。
                   作法：由較近的縫對「較遠的縫到 P」那條線作垂足 A，則 (較遠縫)A = Δℓ = d sinθ。 */
                const far = (P.y <= O.y) ? s1 : s2;                        // 離 P 較遠的縫
                const near2 = (P.y <= O.y) ? s2 : s1;                      // 離 P 較近的縫
                const ux = P.x - far.x, uy = P.y - far.y;
                const uLen = Math.max(Math.hypot(ux, uy), 1e-6);
                const ex = ux / uLen, ey = uy / uLen;
                const proj = (near2.x - far.x) * ex + (near2.y - far.y) * ey;
                const A = { x: far.x + ex * proj, y: far.y + ey * proj };
                ctx.fillStyle = 'rgba(107,70,193,0.20)';
                ctx.beginPath();
                ctx.moveTo(far.x, far.y); ctx.lineTo(near2.x, near2.y); ctx.lineTo(A.x, A.y); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = C.violet; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(far.x, far.y); ctx.lineTo(A.x, A.y); ctx.stroke();
                dashed(ctx, near2.x, near2.y, A.x, A.y, 'rgba(107,70,193,0.85)');
                ctx.fillStyle = C.violet;
                ctx.beginPath(); ctx.arc(A.x, A.y, 3, 0, Math.PI * 2); ctx.fill();
                label(ctx, 'A', A.x + 7, A.y + 14, C.violet, 11);

                // 角度 θ（在 O 處，中央線與 OP 的夾角）
                const thDraw = Math.atan2(O.y - P.y, P.x - O.x);
                ctx.strokeStyle = 'rgba(18,49,58,0.5)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(O.x, O.y, 46, -thDraw, 0, thDraw < 0); ctx.stroke();
                label(ctx, 'θ', O.x + 54, O.y - Math.sign(thDraw) * 10, C.ink, 12);

                // 縫、d、O
                [[s2, 'S₂'], [s1, 'S₁']].forEach(([s, nm]) => {
                    ctx.fillStyle = C.orange;
                    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
                    label(ctx, nm, s.x - 9, s.y + 4, C.orange, 12, 'right');
                });
                ctx.fillStyle = C.muted;
                ctx.beginPath(); ctx.arc(O.x, O.y, 2.6, 0, Math.PI * 2); ctx.fill();
                label(ctx, 'O', O.x - 9, O.y + 16, C.muted, 11, 'right');
                ctx.strokeStyle = C.orange; ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(xSl - 26, s2.y); ctx.lineTo(xSl - 26, s1.y);
                ctx.moveTo(xSl - 31, s2.y); ctx.lineTo(xSl - 21, s2.y);
                ctx.moveTo(xSl - 31, s1.y); ctx.lineTo(xSl - 21, s1.y);
                ctx.stroke();
                label(ctx, 'd', xSl - 34, cy + 4, C.orange, 12, 'right');

                // L 的標示
                ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
                const yy = y1 + 6;
                ctx.beginPath();
                ctx.moveTo(xSl, yy); ctx.lineTo(xS, yy);
                ctx.moveTo(xSl, yy - 5); ctx.lineTo(xSl, yy + 5);
                ctx.moveTo(xS, yy - 5); ctx.lineTo(xS, yy + 5);
                ctx.stroke();
                label(ctx, `L = ${p.L.toFixed(1)} m`, (xSl + xS) / 2, yy - 7, C.muted, 11, 'center');

                // P 點與 y
                ctx.fillStyle = '#ffb347';
                ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, Math.PI * 2); ctx.fill();
                label(ctx, 'P', P.x + 10, P.y + 4, '#b06a00', 13);
                ctx.strokeStyle = 'rgba(176,106,0,0.8)'; ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(xS + 16, O.y); ctx.lineTo(xS + 16, P.y);
                ctx.moveTo(xS + 11, O.y); ctx.lineTo(xS + 21, O.y);
                ctx.moveTo(xS + 11, P.y); ctx.lineTo(xS + 21, P.y);
                ctx.stroke();
                label(ctx, 'y', xS + 24, (O.y + P.y) / 2 + 4, '#b06a00', 12);

                /* 放大插圖：把 S₁S₂A 這個極小的三角形放大（比照課本圖 b 的作法） */
                const iw2 = Math.min(232, Math.max(150, w * 0.28)), ih2 = 132;
                const ix = Math.min(w - iw2 - 10, xSl + 46);          // 放在左下的空白區，避免蓋住 P 點
                const iy = y1 - ih2 - 6;
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.strokeStyle = 'rgba(107,70,193,0.35)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(ix, iy, iw2, ih2); ctx.fill(); ctx.stroke();
                label(ctx, '🔍 放大：Δℓ = d sinθ', ix + 8, iy + 16, C.violet, 11);
                const thD = rad(30);                                        // 插圖用的誇大角度
                const dI = 62;
                const b1 = { x: ix + 40, y: iy + 40 + dI / 2 };              // 較遠的縫
                const b2 = { x: ix + 40, y: iy + 40 - dI / 2 };              // 較近的縫
                const uu = { x: Math.cos(thD), y: -Math.sin(thD) };
                const pj = (b2.x - b1.x) * uu.x + (b2.y - b1.y) * uu.y;
                const bA = { x: b1.x + uu.x * pj, y: b1.y + uu.y * pj };
                ctx.strokeStyle = C.orange; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
                ctx.strokeStyle = col(0.85); ctx.lineWidth = 1.8;
                ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b1.x + uu.x * 150, b1.y + uu.y * 150); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(b2.x, b2.y); ctx.lineTo(b2.x + uu.x * 150, b2.y + uu.y * 150); ctx.stroke();
                ctx.fillStyle = 'rgba(107,70,193,0.22)';
                ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(bA.x, bA.y); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = C.violet; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(bA.x, bA.y); ctx.stroke();
                dashed(ctx, b2.x, b2.y, bA.x, bA.y, 'rgba(107,70,193,0.85)');
                label(ctx, 'd', b1.x - 8, (b1.y + b2.y) / 2 + 4, C.orange, 11, 'right');
                label(ctx, 'Δℓ', (b1.x + bA.x) / 2 - 4, (b1.y + bA.y) / 2 + 16, C.violet, 12);
                label(ctx, '往 P 點', b2.x + uu.x * 150 + 4, b2.y + uu.y * 150 + 4, C.muted, 10);
                ctx.strokeStyle = 'rgba(18,49,58,0.5)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(b1.x, b1.y, 26, -thD, 0); ctx.stroke();
                label(ctx, 'θ', b1.x + 31, b1.y - 6, C.ink, 11);
                dashed(ctx, b1.x, b1.y, b1.x + 60, b1.y, 'rgba(18,49,58,0.3)');

                // 判定面板
                const near = Math.abs(q - Math.round(q));
                const bright = near < 0.03;
                const dark = Math.abs(Math.abs(q % 1) - 0.5) < 0.03;
                const verdict = bright ? `亮紋（完全建設性干涉，n = ${Math.abs(Math.round(q))}）`
                    : (dark ? `暗紋（完全破壞性干涉，m = ${Math.round(Math.abs(q) + 0.5)}）`
                        : '介於亮紋與暗紋之間');
                const vcol = bright ? C.green : (dark ? C.rose : C.muted);
                const bw = Math.min(330, w - 16);
                ctx.fillStyle = 'rgba(255,255,255,0.93)';
                ctx.strokeStyle = 'rgba(18,49,58,0.16)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(8, h - 66, bw, 60); ctx.fill(); ctx.stroke();
                label(ctx, `Δℓ = d sinθ ≈ d·y/L = ${q.toFixed(2)} λ`, 18, h - 48, C.ink, 12);
                label(ctx, `y = ${(q * dy * 100).toFixed(2)} cm　　Δy = Lλ/d = ${(dy * 1000).toFixed(2)} mm`, 18, h - 31, C.muted, 11);
                label(ctx, `⇒ P 點為 ${verdict}`, 18, h - 13, vcol, 12);
                label(ctx, '圖中尺寸未按實際比例：實際上 L ≫ d，θ → 0', w - 8, h - 13, C.muted, 10, 'right');
            }
        };
        /* 13. 光的繞射實驗（單狹縫） --------------------------------------- */
        LABS.diffraction = {
            name: '光的繞射實驗（單狹縫）',
            cycle: 1.96,
            tag: 'N20',
            hint: '三個模式對應課本的三段推理：① 縫上排滿點光源，子波互相干涉而擴散（惠更斯原理）；② 最大光程差 Δℓ_AB = a sinθ ≈ a·y/L；③ 把縫等分成偶數區，區與區成對抵消 ⇒ 暗紋。第三個模式就是「為什麼 a sinθ = mλ 是暗紋而不是亮紋」的完整論證。',
            note: '外型相似、意義相反：雙狹縫 yₙ = n·Lλ/d 是「亮紋」公式；單狹縫 yₘ = m·Lλ/a 是「暗紋」公式。單狹縫的中央亮紋寬度 2Lλ/a 是其他亮紋（Lλ/a）的兩倍，且亮度向兩側迅速遞減。',
            height: 470,
            modes: [
                { key: 'huygens', label: '惠更斯子波' },
                { key: 'pathdiff', label: '最大光程差' },
                { key: 'cancel', label: '暗紋：成對抵消' }
            ],
            controls: [
                { key: 'lam', label: '波長 λ (nm)', min: 400, max: 700, step: 5, value: 550, fmt: (v) => `${v} nm` },
                { key: 'a', label: '狹縫寬度 a (μm)', min: 10, max: 200, step: 2, value: 60, fmt: (v) => `${v} μm` },
                { key: 'L', label: '屏幕距離 L (m)', min: 0.3, max: 2.5, step: 0.1, value: 1.2, fmt: (v) => `${v.toFixed(1)} m` },
                { key: 'yn', label: 'P 點高度（以 Lλ/a 為單位）', min: 0, max: 320, step: 5, value: 100, fmt: (v) => `${(v / 100).toFixed(2)} Lλ/a`, only: ['pathdiff'] },
                { key: 'zones', label: '把狹縫等分成幾區', min: 2, max: 6, step: 2, value: 2, fmt: (v) => `${v} 區（第 ${v / 2} 暗紋）`, only: ['cancel'] },
                { key: 'aw', label: '縫寬 a（畫面上的 a/λ）', min: 1, max: 8, step: 0.25, value: 2.5, fmt: (v) => `a / λ = ${v.toFixed(2)}`, only: ['huygens'] }
            ],
            readouts: (p) => {
                const lam = p.lam * 1e-9, a = p.a * 1e-6;
                const dy = p.L * lam / a;
                if (p.mode === 'cancel') {
                    const m = Math.round(p.zones / 2);
                    return [
                        { label: '等分區數', value: `${Math.round(p.zones)} 區 ⇒ 兩兩成對抵消` },
                        { label: '最大光程差', value: `Δℓ_AB = ${m}λ` },
                        { label: '結果', value: `第 ${m} 暗紋（y = ${m}·Lλ/a）` },
                        { label: '暗紋位置', value: `y_${m} = ${(m * dy * 1000).toFixed(2)} mm` }];
                }
                if (p.mode === 'pathdiff') {
                    const q = p.yn / 100;
                    const near = Math.abs(q - Math.round(q));
                    const isDark = q >= 0.5 && near < 0.04;
                    return [
                        { label: 'Δℓ_AB / λ', value: q.toFixed(2) },
                        { label: 'P 點高度 y', value: `${(q * dy * 1000).toFixed(2)} mm` },
                        { label: '判定', value: q < 0.5 ? '中央亮紋範圍內' : (isDark ? `第 ${Math.round(q)} 暗紋` : '亮暗之間（亮度已大幅衰減）') },
                        { label: '暗紋間距 Lλ/a', value: `${(dy * 1000).toFixed(2)} mm` }];
                }
                return [
                    { label: '暗紋間距 Lλ/a', value: `${(dy * 1000).toFixed(2)} mm` },
                    { label: '中央亮紋寬度 2Lλ/a', value: `${(2 * dy * 1000).toFixed(2)} mm（其他亮紋的兩倍）` },
                    { label: '縫愈窄', value: '繞射愈明顯、中央亮紋愈寬' },
                    { label: '亮度分布', value: '由中央向兩側迅速遞減' }];
            },
            draw: (ctx, w, h, p, t) => {
                const lam = p.lam * 1e-9, aa = p.a * 1e-6;
                const dyR = p.L * lam / aa;
                const wl = p.lam;
                let rgb;
                if (wl < 440) rgb = [130, 0, 200];
                else if (wl < 490) rgb = [0, 90, 235];
                else if (wl < 510) rgb = [0, 180, 190];
                else if (wl < 580) rgb = [70, 200, 60];
                else if (wl < 645) rgb = [235, 160, 0];
                else rgb = [225, 40, 40];
                const col = (al) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${al})`;
                const y0 = 8, y1 = h - 74, cy = (y0 + y1) / 2, TH = y1 - y0;
                const xSl = Math.max(60, w * 0.14);
                const xS = Math.max(xSl + 150, w - 148);
                const QMAX = 3.4;                                   // 螢幕上半高＝3.4 個 Lλ/a
                const sinc2 = (q) => {
                    const b = Math.PI * q;
                    if (Math.abs(b) < 1e-7) return 1;
                    const s = Math.sin(b) / b;
                    return s * s;
                };
                const yToQDefault = (py) => (cy - py) / (TH * 0.5) * QMAX;

                /* 螢幕上的條紋帶與強度曲線（三個模式共用；由真實的 sinc² 分布繪製）
                   mapQ 可覆寫「螢幕高度 → Δℓ_AB/λ」的對應，讓條紋與畫面上的繞射場一致。 */
                const drawScreen = (mapQ) => {
                    const yToQ = mapQ || yToQDefault;
                    for (let py = y0; py <= y1; py++) {
                        const I = sinc2(yToQ(py));
                        ctx.fillStyle = `rgb(${Math.round(rgb[0] * I + 12 * (1 - I))},${Math.round(rgb[1] * I + 18 * (1 - I))},${Math.round(rgb[2] * I + 24 * (1 - I))})`;
                        ctx.fillRect(xS, py, 22, 1);
                    }
                    ctx.strokeStyle = 'rgba(18,49,58,0.3)'; ctx.lineWidth = 1;
                    ctx.strokeRect(xS, y0, 22, TH);
                    label(ctx, '屏幕', xS + 11, y1 + 15, C.muted, 10, 'center');
                    const cw = w - (xS + 30) - 6;
                    if (cw > 30) {
                        ctx.strokeStyle = col(0.95); ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let py = y0; py <= y1; py++) {
                            const X = xS + 30 + sinc2(yToQ(py)) * cw;
                            py === y0 ? ctx.moveTo(X, py) : ctx.lineTo(X, py);
                        }
                        ctx.stroke();
                        // 暗紋位置標記：沿螢幕掃描，找 |q| 通過整數的位置
                        for (let m = 1; m <= 3; m++) {
                            [-1, 1].forEach((sg) => {
                                let py = null;
                                for (let yy = y0 + 1; yy <= y1; yy++) {
                                    const qa = yToQ(yy), qb = yToQ(yy - 1);
                                    if ((qa - sg * m) * (qb - sg * m) <= 0) { py = yy; break; }
                                }
                                if (py === null || py < y0 + 2 || py > y1 - 2) return;
                                dashed(ctx, xS + 24, py, w - 6, py, 'rgba(18,49,58,0.22)');
                                label(ctx, `暗${m}`, w - 8, py - 3, C.muted, 9, 'right');
                            });
                        }
                        label(ctx, '強度', xS + 30, y0 + 12, C.muted, 10);
                    }
                    // 中央亮紋寬度（兩倍）：由 yToQ 找出 q = ±1 的位置
                    let pA = cy - (1 / QMAX) * (TH * 0.5), pB = cy + (1 / QMAX) * (TH * 0.5);
                    for (let yy = y0 + 1; yy <= y1; yy++) {
                        if ((yToQ(yy) - 1) * (yToQ(yy - 1) - 1) <= 0) pA = yy;
                        if ((yToQ(yy) + 1) * (yToQ(yy - 1) + 1) <= 0) pB = yy;
                    }
                    ctx.strokeStyle = C.rose; ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(xS - 10, pA); ctx.lineTo(xS - 10, pB);
                    ctx.moveTo(xS - 15, pA); ctx.lineTo(xS - 5, pA);
                    ctx.moveTo(xS - 15, pB); ctx.lineTo(xS - 5, pB);
                    ctx.stroke();
                    label(ctx, '2Lλ/a', xS - 18, cy + 4, C.rose, 10, 'right');
                };

                /* ================= 模式一：惠更斯子波 ================= */
                if (p.mode === 'huygens') {
                    const lamPix = 22;
                    const slitPix = Math.max(8, p.aw * lamPix);
                    const k = 2 * Math.PI / lamPix;
                    const om = 3.2;
                    const NS = Math.max(6, Math.min(22, Math.round(slitPix / 6) + 5));
                    const srcs = [];
                    for (let i = 0; i < NS; i++) srcs.push(cy - slitPix / 2 + slitPix * i / (NS - 1));

                    // 縫前的平面波
                    ctx.save(); ctx.beginPath(); ctx.rect(0, y0, xSl, TH); ctx.clip();
                    ctx.strokeStyle = col(0.55); ctx.lineWidth = 2;
                    for (let n = 0; n < 20; n++) {
                        const X = xSl - lamPix + ((t * 30) % lamPix) - n * lamPix;   // 往右走向狹縫
                        if (X < 0) break;
                        ctx.beginPath(); ctx.moveTo(X, y0); ctx.lineTo(X, y1); ctx.stroke();
                    }
                    ctx.restore();

                    // 縫後：子波疊加
                    const step = 5;
                    const fw = xS - xSl;
                    const iw = Math.ceil(fw / step) * step, ih = Math.ceil(TH / step) * step;
                    const img = ctx.createImageData(iw, ih);
                    for (let yy = 0; yy < ih; yy += step) {
                        for (let xx = 0; xx < iw; xx += step) {
                            const gx = xSl + xx, gy = y0 + yy;
                            let sr = 0, si = 0;
                            for (let i = 0; i < NS; i++) {
                                const r = Math.hypot(gx - xSl, gy - srcs[i]);
                                const ph = k * r - om * t;
                                const amp = 1 / Math.sqrt(Math.max(r, 10));
                                sr += Math.cos(ph) * amp; si += Math.sin(ph) * amp;
                            }
                            const v = Math.max(0, Math.min(1, Math.abs(sr) * (6.4 / Math.sqrt(NS))));
                            for (let ddy = 0; ddy < step; ddy++) {
                                const row = (yy + ddy) * iw;
                                for (let ddx = 0; ddx < step; ddx++) {
                                    const idx = (row + xx + ddx) * 4;
                                    img.data[idx] = rgb[0] * v + 10 * (1 - v);
                                    img.data[idx + 1] = rgb[1] * v + 16 * (1 - v);
                                    img.data[idx + 2] = rgb[2] * v + 22 * (1 - v);
                                    img.data[idx + 3] = 255;
                                }
                            }
                        }
                    }
                    ctx.putImageData(img, xSl, y0);

                    // 遮板與縫上的點光源
                    ctx.fillStyle = '#3b5a66';
                    ctx.fillRect(xSl - 5, y0, 10, cy - slitPix / 2 - y0);
                    ctx.fillRect(xSl - 5, cy + slitPix / 2, 10, y1 - (cy + slitPix / 2));
                    ctx.fillStyle = C.orange;
                    for (let i = 0; i < NS; i++) {
                        ctx.beginPath(); ctx.arc(xSl, srcs[i], 2.6, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.strokeStyle = C.orange; ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(xSl - 24, cy - slitPix / 2); ctx.lineTo(xSl - 24, cy + slitPix / 2);
                    ctx.moveTo(xSl - 29, cy - slitPix / 2); ctx.lineTo(xSl - 19, cy - slitPix / 2);
                    ctx.moveTo(xSl - 29, cy + slitPix / 2); ctx.lineTo(xSl - 19, cy + slitPix / 2);
                    ctx.stroke();
                    label(ctx, 'a', xSl - 32, cy + 4, C.orange, 12, 'right');
                    // 螢幕條紋改用畫面上的幾何 ⇒ 與左邊的繞射場完全一致
                    const fwPix = xS - xSl;
                    drawScreen((py) => p.aw * Math.sin(Math.atan2(cy - py, Math.max(fwPix, 1))));
                    ctx.fillStyle = 'rgba(255,255,255,0.88)';
                    ctx.fillRect(xSl + 8, y0 + 6, 260, 36);
                    label(ctx, `縫上排滿「眾多的點光源」，各自發出同相子波`, xSl + 14, y0 + 21, '#0a2f3a', 11);
                    label(ctx, `a / λ = ${p.aw.toFixed(2)}　${p.aw < 2 ? '⇒ 擴散非常明顯' : (p.aw < 4 ? '⇒ 擴散明顯' : '⇒ 近乎直線穿越')}`, xSl + 14, y0 + 36, '#0a2f3a', 11);
                    label(ctx, `中央亮紋寬度 2Lλ/a = ${(2 * dyR * 1000).toFixed(2)} mm，是其他亮紋的兩倍；亮度向兩側迅速遞減`, 8, h - 12, C.ink, 12);
                    return;
                }

                /* ================= 模式二：最大光程差 ================= */
                if (p.mode === 'pathdiff') {
                    const q = p.yn / 100;
                    const aPix = Math.min(TH * 0.42, 120);
                    const A = { x: xSl, y: cy - aPix / 2 };
                    const B = { x: xSl, y: cy + aPix / 2 };
                    const P = { x: xS, y: Math.max(y0 + 6, Math.min(y1 - 6, cy - (q / QMAX) * (TH * 0.46))) };

                    for (let i = 0; i < 6; i++) {
                        const yy = y0 + TH * (i + 0.5) / 6;
                        arrow(ctx, 8, yy, xSl - 14, yy, col(0.7), 1.4);
                    }
                    ctx.fillStyle = '#3b5a66';
                    ctx.fillRect(xSl - 5, y0, 10, A.y - y0);
                    ctx.fillRect(xSl - 5, B.y, 10, y1 - B.y);
                    dashed(ctx, xSl, cy, xS, cy, 'rgba(18,49,58,0.45)');
                    label(ctx, "O'", xS - 10, cy + 15, C.muted, 11, 'right');
                    label(ctx, '中央線', (xSl + xS) / 2, cy - 6, C.muted, 10, 'center');

                    // 縫上多點到 P 的光線
                    for (let i = 0; i <= 6; i++) {
                        const yy = A.y + (B.y - A.y) * i / 6;
                        ctx.strokeStyle = col(i === 0 || i === 6 ? 0.95 : 0.4);
                        ctx.lineWidth = (i === 0 || i === 6) ? 2 : 1.1;
                        ctx.beginPath(); ctx.moveTo(xSl, yy); ctx.lineTo(P.x, P.y); ctx.stroke();
                    }
                    // 由 A 對 BP 作垂足 C ⇒ BC = Δℓ_AB
                    const ux = P.x - B.x, uy = P.y - B.y;
                    const uLen = Math.max(Math.hypot(ux, uy), 1e-6);
                    const ex = ux / uLen, ey = uy / uLen;
                    const pj = (A.x - B.x) * ex + (A.y - B.y) * ey;
                    const Cc = { x: B.x + ex * pj, y: B.y + ey * pj };
                    ctx.fillStyle = 'rgba(107,70,193,0.22)';
                    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(Cc.x, Cc.y); ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = C.violet; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.lineTo(Cc.x, Cc.y); ctx.stroke();
                    dashed(ctx, A.x, A.y, Cc.x, Cc.y, 'rgba(107,70,193,0.85)');
                    ctx.fillStyle = C.violet;
                    ctx.beginPath(); ctx.arc(Cc.x, Cc.y, 3, 0, Math.PI * 2); ctx.fill();
                    label(ctx, 'C', Cc.x + 7, Cc.y + 14, C.violet, 11);

                    [[A, 'A'], [B, 'B']].forEach(([s, nm]) => {
                        ctx.fillStyle = C.orange;
                        ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
                        label(ctx, nm, s.x - 9, s.y + 4, C.orange, 12, 'right');
                    });
                    ctx.fillStyle = C.muted;
                    ctx.beginPath(); ctx.arc(xSl, cy, 2.6, 0, Math.PI * 2); ctx.fill();
                    label(ctx, 'O', xSl - 9, cy + 16, C.muted, 11, 'right');
                    ctx.strokeStyle = C.orange; ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(xSl - 26, A.y); ctx.lineTo(xSl - 26, B.y);
                    ctx.moveTo(xSl - 31, A.y); ctx.lineTo(xSl - 21, A.y);
                    ctx.moveTo(xSl - 31, B.y); ctx.lineTo(xSl - 21, B.y);
                    ctx.stroke();
                    label(ctx, 'a', xSl - 34, cy + 4, C.orange, 12, 'right');

                    ctx.fillStyle = '#c9b79a'; ctx.fillRect(xS, y0, 7, TH);
                    drawScreen();
                    ctx.fillStyle = '#ffb347';
                    ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, Math.PI * 2); ctx.fill();
                    label(ctx, 'P', P.x + 10, P.y - 6, '#b06a00', 13);

                    ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
                    const yy2 = y1 + 4;
                    ctx.beginPath();
                    ctx.moveTo(xSl, yy2); ctx.lineTo(xS, yy2);
                    ctx.moveTo(xSl, yy2 - 5); ctx.lineTo(xSl, yy2 + 5);
                    ctx.moveTo(xS, yy2 - 5); ctx.lineTo(xS, yy2 + 5);
                    ctx.stroke();
                    label(ctx, `L = ${p.L.toFixed(1)} m`, (xSl + xS) / 2, yy2 - 7, C.muted, 11, 'center');

                    const near = Math.abs(q - Math.round(q));
                    const isDark = q >= 0.5 && near < 0.04;
                    const verdict = q < 0.5 ? '仍在中央亮紋範圍內' : (isDark ? `第 ${Math.round(q)} 暗紋` : '亮暗之間');
                    const bw = Math.min(340, w - 16);
                    ctx.fillStyle = 'rgba(255,255,255,0.93)';
                    ctx.strokeStyle = 'rgba(18,49,58,0.16)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.rect(8, h - 66, bw, 60); ctx.fill(); ctx.stroke();
                    label(ctx, `最大光程差 Δℓ_AB = BC = a sinθ ≈ a·y/L = ${q.toFixed(2)} λ`, 18, h - 48, C.ink, 12);
                    label(ctx, `y = ${(q * dyR * 1000).toFixed(2)} mm　　暗紋間距 Lλ/a = ${(dyR * 1000).toFixed(2)} mm`, 18, h - 31, C.muted, 11);
                    label(ctx, `⇒ P 點：${verdict}`, 18, h - 13, isDark ? C.rose : C.muted, 12);
                    return;
                }

                /* ================= 模式三：暗紋的成對抵消 ================= */
                const Z = Math.max(2, Math.round(p.zones / 2) * 2);        // 偶數區
                const m = Z / 2;                                            // 第 m 暗紋
                const aPix = Math.min(TH * 0.58, 190);
                const A = { x: xSl, y: cy - aPix / 2 };
                const B = { x: xSl, y: cy + aPix / 2 };
                const P = { x: xS, y: Math.max(y0 + 8, cy - (m / QMAX) * (TH * 0.46)) };
                const zoneCols = ['rgba(11,111,146,0.20)', 'rgba(194,38,74,0.20)', 'rgba(18,128,92,0.20)'];

                for (let i = 0; i < 6; i++) {
                    const yy = y0 + TH * (i + 0.5) / 6;
                    arrow(ctx, 8, yy, xSl - 14, yy, col(0.6), 1.3);
                }
                ctx.fillStyle = '#3b5a66';
                ctx.fillRect(xSl - 5, y0, 10, A.y - y0);
                ctx.fillRect(xSl - 5, B.y, 10, y1 - B.y);
                dashed(ctx, xSl, cy, xS, cy, 'rgba(18,49,58,0.4)');
                ctx.fillStyle = '#c9b79a'; ctx.fillRect(xS, y0, 7, TH);

                // 分區色帶
                const zh = aPix / Z;
                for (let z = 0; z < Z; z++) {
                    ctx.fillStyle = zoneCols[Math.floor(z / 2) % 3];
                    ctx.fillRect(xSl - 5, A.y + z * zh, 10, zh);
                    ctx.strokeStyle = 'rgba(18,49,58,0.35)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(xSl - 7, A.y + z * zh); ctx.lineTo(xSl + 7, A.y + z * zh); ctx.stroke();
                    label(ctx, `${z + 1}`, xSl - 12, A.y + z * zh + zh / 2 + 4, C.muted, 10, 'right');
                }
                ctx.beginPath(); ctx.moveTo(xSl - 7, B.y); ctx.lineTo(xSl + 7, B.y); ctx.stroke();

                // 成對抵消：第 2j 區的每一點，與第 2j+1 區對應點的光程差恰為 λ/2
                const pairPhase = (t * 0.6) % 1;
                for (let j = 0; j < Z / 2; j++) {
                    const top = A.y + (2 * j) * zh;
                    const c1 = top + zh * (0.2 + 0.6 * pairPhase);
                    const c2 = c1 + zh;
                    const cc = zoneCols[j % 3].replace('0.20', '0.95');
                    ctx.strokeStyle = cc; ctx.lineWidth = 1.8;
                    ctx.beginPath(); ctx.moveTo(xSl, c1); ctx.lineTo(P.x, P.y); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(xSl, c2); ctx.lineTo(P.x, P.y); ctx.stroke();
                    ctx.fillStyle = cc;
                    ctx.beginPath(); ctx.arc(xSl, c1, 3.4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(xSl, c2, 3.4, 0, Math.PI * 2); ctx.fill();
                    // λ/2 標記
                    const mx = xSl + (P.x - xSl) * 0.30;
                    const my1 = c1 + (P.y - c1) * 0.30, my2 = c2 + (P.y - c2) * 0.30;
                    ctx.strokeStyle = C.rose; ctx.lineWidth = 1.2;
                    ctx.beginPath(); ctx.moveTo(mx, my1); ctx.lineTo(mx, my2); ctx.stroke();
                    if (j === 0) label(ctx, '光程差 λ/2 ⇒ 完全抵消', mx + 6, (my1 + my2) / 2 + 4, C.rose, 11);
                }

                [[A, 'A'], [B, 'B']].forEach(([s, nm]) => {
                    ctx.fillStyle = C.orange;
                    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
                    label(ctx, nm, s.x - 16, s.y + 4, C.orange, 12, 'right');
                });
                drawScreen();
                ctx.fillStyle = '#3a3a3a';
                ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, Math.PI * 2); ctx.fill();
                label(ctx, 'P（暗）', P.x + 10, P.y - 6, C.rose, 12);

                const bw = Math.min(400, w - 16);
                ctx.fillStyle = 'rgba(255,255,255,0.93)';
                ctx.strokeStyle = 'rgba(18,49,58,0.16)'; ctx.lineWidth = 1;

                const endAt = (uu) => {
                    const cc = cStart + uu * (cEnd - cStart);
                    return tCoef * shape(bx - cc);            // (1+r)·A·shape → 以 A 為單位
                };
                ctx.strokeStyle = C.orange; ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i <= gw; i++) {
                    const Y = gMid - endAt(i / gw) * (gh * 0.42);
                    i === 0 ? ctx.moveTo(gx, Y) : ctx.lineTo(gx + i, Y);
                }
                ctx.stroke();
                ctx.fillStyle = C.rose;
                ctx.beginPath(); ctx.arc(gx + u01 * gw, gMid - endAt(u01) * (gh * 0.42), 3.6, 0, Math.PI * 2); ctx.fill();
                label(ctx, twoRope ? '交界位移隨時間' : '端點位移隨時間', gx, gy + 8, C.muted, 10);
                label(ctx, `最大 ${tCoef.toFixed(2)}A`, gx + gw, gy + gh + 16, tCoef === 0 ? C.rose : C.orange, 10, 'right');
                if (p.mode === 'fixed') label(ctx, '恆為零', gx, gy + gh + 16, C.rose, 10);
            }
        };











        /* =====================================================================
         * 互動實驗室的兩個檢視
         * ===================================================================*/
        function renderLabIndex() {
            const cards = Object.keys(labMeta).map((id) => {
                const nodes = nodesOfLab(id);
                const chips = nodes.map((c) => `<span class="module-node-chip" onclick="event.stopPropagation();navigateTo('node-${c}')">${c} ${nodeMeta[c].title}</span>`).join('');
                return `
                    <div class="card module-card" onclick="navigateTo('lab-${id}')">
                        <span class="module-badge">${LABS[id] ? LABS[id].tag : ''}</span>
                        <h3>${labMeta[id].name}</h3>
                        <p>${labMeta[id].desc}</p>
                        <div class="module-nodes">${chips}</div>
                    </div>`;
            }).join('');

            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <span class="view-eyebrow">複習工具箱</span>
                    <h2>互動物理實驗室</h2>
                    <p>共 ${Object.keys(labMeta).length} 個可調參數的模擬。每個實驗都以獨立網址開啟，方便直接分享或從節點頁跳轉。動畫使用固定步長時鐘，因此在不同更新率的螢幕上速度一致；系統若設定為減少動態效果，載入時會自動暫停。</p>
                </div>
                <div class="card-grid">${cards}</div>`;
        }

        function renderSingleLabView(rawId) {
            const parts = String(rawId).split(':');
            const id = parts[0];
            const initialMode = parts[1] || null;
            if (!LABS[id]) { renderLabIndex(); return; }
            const nodes = nodesOfLab(id);
            const chips = nodes.map((c) => `<button class="node-route-btn" onclick="navigateTo('node-${c}')"><b>${c}　${nodeMeta[c].title}</b><span>回到節點頁看公式與題型</span></button>`).join('');

            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <span class="view-eyebrow">互動實驗　${LABS[id].tag}</span>
                    <h2>${labMeta[id].name}</h2>
                    <p>${labMeta[id].desc}</p>
                </div>
                ${labShellHtml(id)}
                <div class="section-title">對應的知識節點</div>
                <div class="node-route-actions">
                    ${chips}
                    <button class="node-route-btn" onclick="navigateTo('tool-lab')"><b>← 回到實驗室總覽</b><span>瀏覽其他 ${Object.keys(labMeta).length - 1} 個實驗</span></button>
                </div>`;
            mountLab(id, initialMode);
        }

        /* =====================================================================
         * 啟動
         * ===================================================================*/
        window.addEventListener('popstate', () => { renderRoute(routeFromLocation()); });

        document.addEventListener('DOMContentLoaded', () => {
            buildNodeSidebar();
            const initial = routeFromLocation();
            history.replaceState({ waveRoute: initial }, '', `#${encodeURIComponent(initial)}`);
            renderRoute(initial);
        });
    </script>
</body>
</html>
