<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波動與光學 SUPER 複習系統</title>
    <meta name="description" content="波動、聲波、幾何光學、物理光學四章的知識節點複習、互動實驗與分級題庫。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="assets/js/wave-runtime.js"></script>
    <link rel="stylesheet" href="assets/css/interaction-runtime.css">

    <script src="data/modulesData.js"></script>
    <script src="data/questionBank.js"></script>
    <style>
        :root {
            --bg-body: hsl(200, 30%, 98%);
            --bg-sidebar: #14313a;
            --bg-card: rgba(255, 255, 255, 0.72);

            --text-main: hsl(200, 26%, 14%);
            --text-muted: hsl(200, 12%, 43%);
            --border-color: rgba(10, 45, 55, 0.08);

            --primary-blue: hsl(196, 88%, 32%);
            --primary-blue-light: rgba(8, 118, 156, 0.07);
            --accent-cyan: hsl(184, 78%, 31%);
            --accent-green: hsl(150, 65%, 30%);
            --accent-green-light: rgba(16, 145, 105, 0.07);
            --accent-orange: hsl(32, 88%, 42%);
            --accent-orange-light: rgba(220, 130, 20, 0.08);
            --accent-rose: hsl(348, 72%, 45%);
            --accent-rose-light: rgba(200, 40, 70, 0.07);
            --accent-violet: hsl(264, 52%, 46%);
            --accent-violet-light: rgba(120, 70, 200, 0.07);

            --transition: all 0.24s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-neon: 0 4px 20px rgba(10, 45, 55, 0.04);
            --shadow-neon-hover: 0 10px 30px rgba(10, 45, 55, 0.09);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at 50% 0%, hsl(200, 34%, 99%) 0%, hsl(200, 22%, 95%) 100%) no-repeat fixed;
            color: var(--text-main);
            font-family: 'Outfit', 'Noto Sans TC', system-ui, sans-serif;
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        /* ---------- 側欄 ---------- */
        #sidebar {
            width: 296px;
            padding: 1.7rem 1.1rem 2rem;
            background: var(--bg-sidebar);
            box-shadow: 10px 0 30px rgba(16, 38, 51, 0.09);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #35525d transparent;
        }

        .sidebar-brand {
            margin: 0 0 1.6rem;
            padding: 0.3rem 0.7rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-brand::before {
            content: '';
            display: block;
            width: 34px; height: 3px;
            margin-bottom: 0.8rem;
            border-radius: 99px;
            background: #58c9c6;
            box-shadow: 12px 0 0 rgba(88, 201, 198, 0.35);
        }
        .sidebar-brand h1 { color: #f4fbfc; font-size: 1.16rem; font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; }
        .sidebar-brand p { font-size: 0.74rem; font-weight: 500; margin-top: 0.4rem; color: #9db0b8; line-height: 1.55; }

        .nav-section-title {
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.12em; color: #6fd0ce; margin: 1.45rem 0.7rem 0.6rem;
        }
        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 0.16rem; }
        .nav-item {
            display: flex; align-items: center; min-height: 40px;
            padding: 0.58rem 0.7rem; border: 1px solid transparent; border-radius: 8px;
            cursor: pointer; color: #b6c5cb; font-size: 0.85rem; font-weight: 500;
            transition: var(--transition); text-decoration: none; gap: 0.7rem; line-height: 1.5;
        }
        .nav-item:hover { color: #f4fbfc; background: rgba(255, 255, 255, 0.055); }
        .nav-item.active {
            color: #fff; background: rgba(76, 179, 184, 0.16);
            border-color: rgba(112, 210, 208, 0.22); border-left: 3px solid #58c5c4; font-weight: 700;
        }
        .nav-item-node { padding-left: 1.5rem; }
        .nav-module-label {
            font-size: 0.71rem; font-weight: 800; color: #8fb6bd;
            margin: 0.85rem 0.7rem 0.35rem; letter-spacing: 0.04em;
        }
        .node-code-badge {
            font-size: 0.67rem; font-weight: 800; min-width: 34px; padding: 0.12rem 0.36rem;
            color: #8edbd9; background: rgba(85, 195, 195, 0.1);
            border: 1px solid rgba(85, 195, 195, 0.15); border-radius: 4px;
            font-family: 'Outfit', sans-serif; text-align: center;
        }
        .nav-item.active .node-code-badge { color: #fff; background: rgba(88, 197, 196, 0.32); }
        .nav-icon { width: 18px; text-align: center; font-size: 0.95rem; }
        .nav-badge {
            margin-left: auto; font-size: 0.66rem; font-weight: 800; padding: 0.05rem 0.36rem;
            border-radius: 99px; background: var(--accent-rose); color: #fff;
        }
        .mobile-nav-toggle { display: none; }

        /* ---------- 版面 ---------- */
        .app-workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        .view-toolbar {
            position: sticky; top: 0; z-index: 30;
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.6rem clamp(1rem, 3vw, 2.5rem);
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(10px) saturate(140%);
            border-bottom: 1px solid var(--border-color);
        }
        .view-toolbar button {
            font: inherit; font-size: 0.8rem; font-weight: 600;
            padding: 0.32rem 0.7rem; border-radius: 7px;
            border: 1px solid var(--border-color); background: #fff;
            color: var(--text-main); cursor: pointer; transition: var(--transition);
        }
        .view-toolbar button:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .view-breadcrumb { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-left: 0.4rem; }

        #main-content { padding: 2.2rem clamp(1.1rem, 4vw, 3rem) 5rem; max-width: 1180px; width: 100%; }

        /* ---------- 通用元件 ---------- */
        .view-header { margin-bottom: 1.8rem; }
        .view-eyebrow {
            display: inline-flex; align-items: center; gap: 0.4rem;
            font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--accent-cyan); background: rgba(6, 148, 162, 0.08);
            border: 1px solid rgba(6, 148, 162, 0.16);
            padding: 0.2rem 0.6rem; border-radius: 99px; margin-bottom: 0.7rem;
        }
        .view-header h2 { font-size: clamp(1.45rem, 3.2vw, 2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; }
        .view-header p { margin-top: 0.6rem; color: var(--text-muted); font-size: 0.94rem; line-height: 1.8; max-width: 62ch; }

        .section-title {
            display: flex; align-items: center; gap: 0.6rem;
            font-size: 1.08rem; font-weight: 800; margin: 2.3rem 0 1rem;
            padding-bottom: 0.5rem; border-bottom: 2px solid var(--border-color);
        }
        .section-title::before {
            content: ''; width: 4px; height: 18px; border-radius: 99px; background: var(--accent-cyan);
        }
        .section-title .title-hint { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); margin-left: auto; }

        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 1.1rem 1.2rem; box-shadow: var(--shadow-neon);
            transition: var(--transition);
        }
        .card + .card { margin-top: 0.95rem; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0.95rem; }
        .card-grid .card + .card { margin-top: 0; }

        /* 公式卡 */
        .formula-card { border-left: 4px solid var(--primary-blue); }
        .formula-card h4 {
            font-size: 1rem; font-weight: 800; display: flex; align-items: center;
            gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.6rem;
        }
        .formula-node-tag {
            font-size: 0.66rem; font-weight: 800; padding: 0.1rem 0.4rem; border-radius: 4px;
            color: var(--primary-blue); background: var(--primary-blue-light);
            border: 1px solid rgba(8, 118, 156, 0.18); cursor: pointer;
        }
        .formula-box {
            margin: 0.55rem 0 0.75rem; padding: 0.75rem 0.9rem; overflow-x: auto;
            background: rgba(8, 118, 156, 0.045); border: 1px solid rgba(8, 118, 156, 0.12);
            border-radius: 10px; text-align: center; font-size: 1.02rem;
        }
        .formula-anchor {
            font-size: 0.85rem; font-weight: 700; color: var(--accent-cyan);
            padding-left: 0.7rem; border-left: 3px solid var(--accent-cyan); margin-bottom: 0.7rem; line-height: 1.7;
        }
        .formula-desc { font-size: 0.88rem; line-height: 1.9; color: var(--text-main); }
        .formula-desc b { color: var(--primary-blue); }

        /* 即時檢核 probe */
        .probe { margin-top: 0.85rem; padding: 0.75rem 0.85rem; border-radius: 10px; background: var(--accent-violet-light); border: 1px solid rgba(120, 70, 200, 0.15); }
        .probe-q { font-size: 0.84rem; font-weight: 700; margin-bottom: 0.5rem; }
        .probe-opts { display: flex; flex-direction: column; gap: 0.35rem; }
        .probe-opt {
            text-align: left; font: inherit; font-size: 0.82rem; padding: 0.38rem 0.6rem;
            border-radius: 7px; border: 1px solid rgba(120, 70, 200, 0.18);
            background: rgba(255, 255, 255, 0.85); cursor: pointer; transition: var(--transition);
        }
        .probe-opt:hover { border-color: var(--accent-violet); }
        .probe-opt.right { background: var(--accent-green-light); border-color: var(--accent-green); color: var(--accent-green); font-weight: 700; }
        .probe-opt.wrong { background: var(--accent-rose-light); border-color: var(--accent-rose); color: var(--accent-rose); }

        /* 解題特徵卡 */
        .feature-card { border-left: 4px solid var(--accent-orange); }
        .feature-line { font-size: 0.88rem; line-height: 1.85; }
        .feature-line + .feature-line { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed var(--border-color); }
        .feature-label {
            display: inline-block; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.05em;
            padding: 0.08rem 0.4rem; border-radius: 4px; margin-right: 0.45rem; vertical-align: 1px;
        }
        .label-feature { color: var(--primary-blue); background: var(--primary-blue-light); }
        .label-bridge { color: var(--accent-green); background: var(--accent-green-light); }
        .label-trap { color: var(--accent-rose); background: var(--accent-rose-light); }

        /* 概念圖 */
        .concept-map-container { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
        .map-node {
            width: 100%; max-width: 680px; padding: 0.8rem 1rem; border-radius: 12px;
            background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-neon);
        }
        .map-node-title { font-size: 0.92rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 0.25rem; }
        .map-node-desc { font-size: 0.83rem; line-height: 1.8; color: var(--text-muted); }
        .map-connector { font-size: 0.76rem; font-weight: 700; color: var(--accent-cyan); padding: 0.35rem 0; }

        /* 表格 */
        .edu-table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-color); }
        .edu-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: rgba(255,255,255,0.72); min-width: 520px; }
        .edu-table th {
            background: rgba(8, 118, 156, 0.07); font-weight: 800; text-align: left;
            padding: 0.65rem 0.8rem; border-bottom: 2px solid rgba(8, 118, 156, 0.14); color: var(--primary-blue);
        }
        .edu-table td { padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--border-color); line-height: 1.75; vertical-align: top; }
        .edu-table tr:last-child td { border-bottom: 0; }
        .formula-desc .edu-table { min-width: 380px; margin-top: 0.5rem; }

        /* 大考題型卡 */
        .exam-card { border-left: 4px solid var(--accent-violet); }
        .exam-card h4 { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.3rem; }
        .exam-year {
            display: inline-block; font-size: 0.7rem; font-weight: 800; padding: 0.1rem 0.45rem;
            border-radius: 4px; color: var(--accent-violet); background: var(--accent-violet-light);
            border: 1px solid rgba(120, 70, 200, 0.18); margin-bottom: 0.45rem;
        }
        .exam-card p { font-size: 0.86rem; line-height: 1.85; color: var(--text-main); }

        /* 首頁 */
        .home-hero {
            display: grid; grid-template-columns: 1.35fr 1fr; gap: 1.6rem; align-items: start;
            padding: 1.6rem 1.5rem; border-radius: 18px; margin-bottom: 2rem;
            background: linear-gradient(135deg, rgba(8,118,156,0.07), rgba(120,70,200,0.05));
            border: 1px solid var(--border-color);
        }
        .home-hero h2 { font-size: clamp(1.5rem, 3.4vw, 2.1rem); font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; }
        .home-hero p { margin-top: 0.7rem; font-size: 0.92rem; line-height: 1.85; color: var(--text-muted); }
        .home-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
        .home-stat {
            padding: 0.7rem 0.85rem; border-radius: 12px; background: rgba(255,255,255,0.8);
            border: 1px solid var(--border-color);
        }
        .home-stat span { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); }
        .home-stat strong { display: block; font-size: 1.35rem; font-weight: 800; color: var(--primary-blue); font-family: 'Outfit', sans-serif; }

        .module-card { cursor: pointer; border-left: 4px solid var(--accent-cyan); }
        .module-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-neon-hover); border-color: var(--accent-cyan); }
        .module-card h3 { font-size: 1.02rem; font-weight: 800; margin-bottom: 0.3rem; }
        .module-card p { font-size: 0.84rem; color: var(--text-muted); line-height: 1.75; }
        .module-badge {
            display: inline-block; font-size: 0.68rem; font-weight: 800; padding: 0.1rem 0.45rem;
            border-radius: 4px; color: var(--accent-cyan); background: rgba(6,148,162,0.08);
            border: 1px solid rgba(6,148,162,0.16); margin-bottom: 0.4rem;
        }
        .module-nodes { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.7rem; }
        .module-node-chip {
            font-size: 0.7rem; font-weight: 700; padding: 0.16rem 0.45rem; border-radius: 5px;
            background: var(--primary-blue-light); color: var(--primary-blue);
            border: 1px solid rgba(8,118,156,0.14); cursor: pointer; transition: var(--transition);
        }
        .module-node-chip:hover { background: var(--primary-blue); color: #fff; }

        /* 節點頁動作列 */
        .node-route-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0.6rem; margin-bottom: 1.6rem; }
        .node-route-btn {
            font: inherit; text-align: left; padding: 0.7rem 0.85rem; border-radius: 12px; cursor: pointer;
            background: rgba(255,255,255,0.82); border: 1px solid var(--border-color); transition: var(--transition);
        }
        .node-route-btn:hover { border-color: var(--accent-cyan); transform: translateY(-1px); box-shadow: var(--shadow-neon-hover); }
        .node-route-btn b { display: block; font-size: 0.88rem; font-weight: 800; }
        .node-route-btn span { display: block; font-size: 0.76rem; color: var(--text-muted); margin-top: 0.15rem; }

        /* 題庫 */
        .quiz-toolbar { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.1rem; align-items: center; }
        .chip-btn {
            font: inherit; font-size: 0.79rem; font-weight: 700; padding: 0.34rem 0.75rem;
            border-radius: 99px; border: 1px solid var(--border-color); background: #fff;
            color: var(--text-muted); cursor: pointer; transition: var(--transition);
        }
        .chip-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .chip-btn.is-active { background: var(--accent-cyan); border-color: var(--accent-cyan); color: #fff; }
        .quiz-card { border-left: 4px solid var(--accent-green); }
        .quiz-meta { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem; }
        .quiz-tag { font-size: 0.68rem; font-weight: 800; padding: 0.1rem 0.42rem; border-radius: 4px; border: 1px solid var(--border-color); color: var(--text-muted); background: rgba(255,255,255,0.7); }
        .quiz-tag.level-記憶 { color: var(--primary-blue); background: var(--primary-blue-light); border-color: rgba(8,118,156,0.18); }
        .quiz-tag.level-理解 { color: var(--accent-cyan); background: rgba(6,148,162,0.08); border-color: rgba(6,148,162,0.18); }
        .quiz-tag.level-應用 { color: var(--accent-orange); background: var(--accent-orange-light); border-color: rgba(220,130,20,0.2); }
        .quiz-tag.level-分析 { color: var(--accent-violet); background: var(--accent-violet-light); border-color: rgba(120,70,200,0.2); }
        .quiz-q { font-size: 0.92rem; font-weight: 700; line-height: 1.8; margin-bottom: 0.7rem; }
        .quiz-opts { display: flex; flex-direction: column; gap: 0.4rem; }
        .quiz-opt {
            text-align: left; font: inherit; font-size: 0.86rem; line-height: 1.7;
            padding: 0.5rem 0.7rem; border-radius: 9px; border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.85); cursor: pointer; transition: var(--transition);
        }
        .quiz-opt:hover { border-color: var(--accent-cyan); }
        .quiz-opt.picked { border-color: var(--primary-blue); background: var(--primary-blue-light); }
        .quiz-opt.right { border-color: var(--accent-green); background: var(--accent-green-light); }
        .quiz-opt.wrong { border-color: var(--accent-rose); background: var(--accent-rose-light); }
        .quiz-why { display: block; margin-top: 0.3rem; font-size: 0.79rem; color: var(--text-muted); line-height: 1.7; }
        .quiz-actions { display: flex; gap: 0.45rem; margin-top: 0.7rem; flex-wrap: wrap; }
        .quiz-exp {
            margin-top: 0.7rem; padding: 0.6rem 0.8rem; border-radius: 0 9px 9px 0;
            border-left: 3px solid var(--accent-green); background: var(--accent-green-light);
            font-size: 0.83rem; line-height: 1.8;
        }
        .quiz-empty { padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

        /* 提示條 */
        .callout {
            padding: 0.75rem 0.95rem; border-radius: 0 10px 10px 0; font-size: 0.85rem; line-height: 1.85;
            border-left: 3px solid var(--accent-orange); background: var(--accent-orange-light); margin: 1rem 0;
        }
        .callout.info { border-left-color: var(--primary-blue); background: var(--primary-blue-light); }

        .print-hide { }
        @media print { .view-toolbar, #sidebar { display: none !important; } #main-content { padding: 0; } }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            #sidebar {
                width: 100%; height: auto; position: static; padding: 0.9rem 1rem;
                flex-direction: column;
            }
            .mobile-nav-toggle {
                display: block; position: absolute; top: 0.9rem; right: 1rem;
                font-size: 1.3rem; background: none; border: 0; color: #cfe4e6; cursor: pointer;
            }
            #sidebar > .nav-section-title,
            #sidebar > .nav-list,
            #sidebar > #node-nav-container { display: none; }
            #sidebar.mobile-open > .nav-list { display: flex; }
            #sidebar.mobile-open > .nav-section-title,
            #sidebar.mobile-open > #node-nav-container { display: block; }
            #sidebar.mobile-open { padding-bottom: 1.1rem; }
            .sidebar-brand { border-bottom: 0; padding-bottom: 0; margin-bottom: 0; }
            .home-hero { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            #main-content { padding: 1.4rem 0.9rem 4rem; }
            .card-grid { grid-template-columns: 1fr; }
            .node-route-actions { grid-template-columns: 1fr; }
            .lab-readout { grid-template-columns: 1fr 1fr; }
            .home-stats { grid-template-columns: 1fr 1fr; }
            .view-toolbar .toolbar-long { display: none; }
            .formula-box { font-size: 0.92rem; padding: 0.6rem 0.5rem; }
            .quiz-toolbar { gap: 0.35rem; }
            .chip-btn { font-size: 0.74rem; padding: 0.28rem 0.6rem; }
        }
    </style>
</head>
<body>
    <nav id="sidebar">
        <div class="sidebar-brand">
            <h1>波動與光學 SUPER 複習系統</h1>
            <p>選修物理 Ch1–Ch4 • 20 個知識節點導航</p>
        </div>
        <button class="mobile-nav-toggle" type="button" aria-label="開啟導覽選單" aria-expanded="false" onclick="toggleMobileNav(this)"><span aria-hidden="true">☰</span></button>

        <div class="nav-section-title">開始</div>
        <ul class="nav-list">
            <li><a class="nav-item" data-route="home" onclick="switchMainView(this, 'home')"><span class="nav-icon">⌂</span> 學習首頁</a></li>
        </ul>

        <div class="nav-section-title">四章 20 個知識節點</div>
        <div id="node-nav-container"></div>

        <div class="nav-section-title">複習工具箱</div>
        <ul class="nav-list">
            <li><a class="nav-item" data-route="tool-formula" onclick="switchMainView(this, 'tool-formula')"><span class="nav-icon">📐</span> 公式速查表</a></li>
            <li><a class="nav-item" data-route="tool-lab" onclick="switchMainView(this, 'tool-lab')"><span class="nav-icon">🔬</span> 互動實驗室</a></li>
            <li><a class="nav-item" data-route="tool-quiz" onclick="switchMainView(this, 'tool-quiz')"><span class="nav-icon">✏️</span> 分級題庫（80 題）</a></li>
            <li><a class="nav-item" data-route="tool-compare" onclick="switchMainView(this, 'tool-compare')"><span class="nav-icon">⚖️</span> 易混淆對照表</a></li>
            <li><a class="nav-item" data-route="tool-exam" onclick="switchMainView(this, 'tool-exam')"><span class="nav-icon">📚</span> 大考題型索引</a></li>
            <li><a class="nav-item" data-route="tool-wrong" onclick="switchMainView(this, 'tool-wrong')"><span class="nav-icon">📕</span> 錯題本<span class="nav-badge" id="wrong-nav-badge" style="display:none;"></span></a></li>
        </ul>
    </nav>

    <div class="app-workspace">
        <div class="view-toolbar print-hide" id="view-toolbar" aria-label="頁面導覽">
            <button type="button" onclick="goBackInApp()" aria-label="回到上一頁">← <span class="toolbar-long">上一頁</span></button>
            <button type="button" onclick="navigateTo('home')" aria-label="回到學習首頁">⌂ <span class="toolbar-long">首頁</span></button>
            <div class="view-breadcrumb" id="view-breadcrumb">學習首頁</div>
        </div>
        <main id="main-content"></main>
    </div>

    <script>
        /* =====================================================================
         * 核心：檢視生命週期、路由與側欄
         * ===================================================================*/
        let activeDisposers = WaveRuntime.createDisposerRegistry('initial');
        let lastRenderedRoute = null;
        let mathJaxTimer = null;

        function cleanupCurrentView() {
            activeDisposers.dispose();
            activeDisposers = WaveRuntime.createDisposerRegistry('view');
        }

        function scheduleMathJax(target) {
            if (mathJaxTimer) clearTimeout(mathJaxTimer);
            mathJaxTimer = setTimeout(() => {
                mathJaxTimer = null;
                const el = target || document.getElementById('main-content');
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([el]).catch((err) => console.warn('MathJax', err));
                }
            }, 40);
        }

        const ALL_NODES = Object.keys(nodeMeta).sort();

        function nodesOfModule(moduleNum) {
            return ALL_NODES.filter((code) => nodeMeta[code].module === Number(moduleNum));
        }

        function itemsForNode(list, code) {
            return list.filter((item) => [].concat(item.node).includes(code));
        }

        /* 一個節點可以對應一個或多個互動實驗 */
        function labsOfNode(code) {
            const meta = nodeMeta[code];
            if (!meta || !meta.lab) return [];
            return [].concat(meta.lab);
        }
        function nodesOfLab(labId) {
            return ALL_NODES.filter((c) => labsOfNode(c).includes(labId));
        }

        function buildNodeSidebar() {
            const host = document.getElementById('node-nav-container');
            let html = '';
            Object.keys(modulesData).map(Number).sort((a, b) => a - b).forEach((m) => {
                html += `<div class="nav-module-label">${modulesData[m].title.replace('模組', '')}</div><ul class="nav-list">`;
                html += `<li><a class="nav-item nav-item-node" data-route="module-${m}" onclick="switchMainView(this, 'module-${m}')"><span class="node-code-badge">總覽</span> 模組導讀</a></li>`;
                nodesOfModule(m).forEach((code) => {
                    html += `<li><a class="nav-item nav-item-node" data-route="node-${code}" onclick="switchMainView(this, 'node-${code}')"><span class="node-code-badge">${code}</span> ${nodeMeta[code].title}</a></li>`;
                });
                html += '</ul>';
            });
            host.innerHTML = html;
        }

        function routeFromLocation() {
            const raw = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
            return raw || 'home';
        }

        function routeLabel(route) {
            if (route === 'home') return '學習首頁';
            if (route.startsWith('module-')) return modulesData[route.slice(7)] ? modulesData[route.slice(7)].title : '模組導讀';
            if (route.startsWith('node-')) {
                const code = route.slice(5);
                return nodeMeta[code] ? `${code}　${nodeMeta[code].title}` : '知識節點';
            }
            if (route.startsWith('lab-')) {
                const id = route.slice(4).split(':')[0];
                return labMeta[id] ? `互動實驗：${labMeta[id].name}` : '互動實驗';
            }
            const toolNames = {
                'tool-formula': '公式速查表',
                'tool-lab': '互動實驗室',
                'tool-quiz': '知識節點分級題庫',
                'tool-compare': '易混淆對照表',
                'tool-exam': '大考題型索引',
                'tool-wrong': '錯題本'
            };
            return toolNames[route] || '學習首頁';
        }

        function activateNavForRoute(route) {
            document.querySelectorAll('#sidebar .nav-item').forEach((el) => el.classList.remove('active'));
            const target = document.querySelector(`#sidebar .nav-item[data-route="${route}"]`);
            if (target) target.classList.add('active');
        }

        function renderRoute(route) {
            cleanupCurrentView();
            const main = document.getElementById('main-content');
            main.scrollTop = 0;
            window.scrollTo({ top: 0, behavior: 'auto' });

            if (route === 'home') renderHomeView();
            else if (route.startsWith('module-')) renderModuleView(route.slice(7));
            else if (route.startsWith('node-')) renderNodeView(route.slice(5));
            else if (route.startsWith('lab-')) renderSingleLabView(route.slice(4));
            else if (route === 'tool-formula') renderFormulaSheet();
            else if (route === 'tool-lab') renderLabIndex();
            else if (route === 'tool-quiz') renderQuizView();
            else if (route === 'tool-compare') renderCompareView();
            else if (route === 'tool-exam') renderExamIndexView();
            else if (route === 'tool-wrong') renderWrongBookView();
            else renderHomeView();

            activateNavForRoute(route);
            document.getElementById('view-breadcrumb').textContent = routeLabel(route);
            lastRenderedRoute = route;
            updateWrongBadge();
            scheduleMathJax();
        }

        function navigateTo(route) {
            if (route === lastRenderedRoute) return;
            history.pushState({ waveRoute: route }, '', `#${encodeURIComponent(route)}`);
            renderRoute(route);
        }

        function switchMainView(navEl, route) {
            document.getElementById('sidebar').classList.remove('mobile-open');
            navigateTo(route);
        }

        function goBackInApp() {
            if (history.length > 1) history.back();
            else navigateTo('home');
        }

        function toggleMobileNav(button) {
            const bar = document.getElementById('sidebar');
            const open = bar.classList.toggle('mobile-open');
            button.setAttribute('aria-expanded', String(open));
        }

        /* =====================================================================
         * 首頁
         * ===================================================================*/
        function renderHomeView() {
            const totalFormulas = Object.values(modulesData).reduce((s, m) => s + m.formulas.length, 0);
            const totalExams = Object.values(modulesData).reduce((s, m) => s + m.examQuestions.length, 0);

            let cards = '';
            Object.keys(modulesData).map(Number).sort((a, b) => a - b).forEach((m) => {
                const mod = modulesData[m];
                const chips = nodesOfModule(m).map((code) =>
                    `<span class="module-node-chip" onclick="event.stopPropagation();navigateTo('node-${code}')">${code} ${nodeMeta[code].title}</span>`
                ).join('');
                cards += `
                    <div class="card module-card" onclick="navigateTo('module-${m}')">
                        <span class="module-badge">${mod.badge}</span>
                        <h3>${mod.title}</h3>
                        <p>${mod.subtitle}</p>
                        <div class="module-nodes">${chips}</div>
                    </div>`;
            });

            document.getElementById('main-content').innerHTML = `
                <div class="home-hero">
                    <div>
                        <span class="view-eyebrow">選修物理　波動・聲波・光學</span>
                        <h2>把四章拆成 20 個知識節點，<br>每個節點都能看、能算、能練。</h2>
                        <p>本站以「波速由介質決定、頻率由波源決定」為主軸，把繩波、駐波、聲波樂器、折射全反射、透鏡成像與干涉繞射串成一條完整的推理鏈。每個節點提供核心公式、解題特徵引導、常見陷阱、跨章連結與大考題型解析，並搭配可調參數的互動實驗。</p>
                    </div>
                    <div class="home-stats">
                        <div class="home-stat"><span>知識節點</span><strong>${ALL_NODES.length}</strong></div>
                        <div class="home-stat"><span>核心公式卡</span><strong>${totalFormulas}</strong></div>
                        <div class="home-stat"><span>分級題庫</span><strong>${questionBank.length}</strong></div>
                        <div class="home-stat"><span>互動實驗</span><strong>${Object.keys(labMeta).length}</strong></div>
                    </div>
                </div>

                <div class="section-title">四大模組<span class="title-hint">點選卡片進入模組導讀，或直接點節點標籤</span></div>
                <div class="card-grid">${cards}</div>

                <div class="section-title">建議的複習路徑</div>
                <div class="card-grid">
                    <div class="card">
                        <h4 style="font-size:0.98rem;font-weight:800;margin-bottom:0.4rem;">第一次建立架構</h4>
                        <p style="font-size:0.85rem;line-height:1.85;color:var(--text-muted);">先讀「公式速查表」掌握四章全部公式的位置，再依序看四個模組導讀的概念圖，最後才進入個別節點細讀。</p>
                    </div>
                    <div class="card">
                        <h4 style="font-size:0.98rem;font-weight:800;margin-bottom:0.4rem;">觀念卡關時</h4>
                        <p style="font-size:0.85rem;line-height:1.85;color:var(--text-muted);">到「互動實驗室」把參數拉一拉：駐波、折射、透鏡成像與干涉條紋，用眼睛看過一次比背十遍有效。</p>
                    </div>
                    <div class="card">
                        <h4 style="font-size:0.98rem;font-weight:800;margin-bottom:0.4rem;">段考前衝刺</h4>
                        <p style="font-size:0.85rem;line-height:1.85;color:var(--text-muted);">用「分級題庫」依節點與層級篩選，先做記憶與理解確認定義，再攻應用與分析；答錯的題目會自動進入錯題本。</p>
                    </div>
                    <div class="card">
                        <h4 style="font-size:0.98rem;font-weight:800;margin-bottom:0.4rem;">最容易混淆的地方</h4>
                        <p style="font-size:0.85rem;line-height:1.85;color:var(--text-muted);">開管與閉管、雙狹縫與單狹縫、聲波與光波進入密介質的快慢——「易混淆對照表」把這些成對的概念放在同一頁。</p>
                    </div>
                </div>

                <div class="callout info">
                    共 ${totalExams} 則大考與段考題型解析散布在各節點頁，也可從側欄的「大考題型索引」一次瀏覽。
                </div>`;
        }

        /* =====================================================================
         * 模組導讀
         * ===================================================================*/
        function renderModuleView(moduleNum) {
            const mod = modulesData[moduleNum];
            if (!mod) { renderHomeView(); return; }

            const nodeCards = nodesOfModule(moduleNum).map((code) => {
                const meta = nodeMeta[code];
                const fCount = itemsForNode(mod.formulas, code).length;
                const qCount = questionBank.filter((q) => q.node === code).length;
                const labs = labsOfNode(code).filter((l) => labMeta[l]);
                return `
                    <div class="card module-card" onclick="navigateTo('node-${code}')">
                        <span class="module-badge">${code}　${meta.section}</span>
                        <h3>${meta.title}</h3>
                        <p>核心公式卡 ${fCount} 張・分級題庫 ${qCount} 題${labs.length ? `・互動實驗「${labs.map((l) => labMeta[l].name).join('」「')}」` : ''}</p>
                    </div>`;
            }).join('');

            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <span class="view-eyebrow">${mod.badge}</span>
                    <h2>${mod.title}</h2>
                    <p>${mod.subtitle}</p>
                </div>

                <div class="section-title">這一章的推理鏈</div>
                ${mod.conceptMap}

                <div class="section-title">本模組的知識節點</div>
                <div class="card-grid">${nodeCards}</div>

                <div class="section-title">跨章與跨科延伸</div>
                ${mod.extensions}`;
        }

        /* =====================================================================
         * 節點頁
         * ===================================================================*/
        function renderNodeView(code) {
            const meta = nodeMeta[code];
            if (!meta) { renderHomeView(); return; }
            const mod = modulesData[meta.module];

            const formulas = itemsForNode(mod.formulas, code);
            const features = itemsForNode(mod.keyFeatures, code);
            const exams = itemsForNode(mod.examQuestions, code);
            const quizCount = questionBank.filter((q) => q.node === code).length;

            let probeUid = 0;
            const formulaHtml = formulas.map((f) => {
                let probeHtml = '';
                if (f.probe) {
                    const uid = `${code}-p${probeUid++}`;
                    probeHtml = `
                        <div class="probe" id="probe-${uid}">
                            <div class="probe-q">🧪 即時檢核：${f.probe.q}</div>
                            <div class="probe-opts">
                                ${f.probe.opts.map((o, i) => `<button type="button" class="probe-opt" onclick="probePick('${uid}', ${i}, ${o.c ? 1 : 0})">${o.t}</button>`).join('')}
                            </div>
                        </div>`;
                }
                return `
                    <div class="card formula-card">
                        <h4><span class="formula-node-tag">${code}</span>${f.name}</h4>
                        <div class="formula-box">$$${f.formula}$$</div>
                        <div class="formula-anchor">${f.anchor}</div>
                        <div class="formula-desc">${f.desc}</div>
                        ${probeHtml}
                    </div>`;
            }).join('');

            const featureHtml = features.length ? features.map((k) => `
                <div class="card feature-card">
                    <div class="feature-line"><span class="feature-label label-feature">題目特徵</span>${k.feature}</div>
                    <div class="feature-line"><span class="feature-label label-bridge">解題橋樑</span>${k.bridge}</div>
                    <div class="feature-line"><span class="feature-label label-trap">常見陷阱</span>${k.trap}</div>
                </div>`).join('') : '<div class="card"><p style="font-size:0.86rem;color:var(--text-muted);">本節點的解題特徵整理在同模組的其他節點頁，可由左側切換。</p></div>';

            const examHtml = exams.length ? exams.map((e) => `
                <div class="card exam-card">
                    <span class="exam-year">${e.year}</span>
                    <h4>${e.title}</h4>
                    <p>${e.desc}</p>
                </div>`).join('') : '<div class="card"><p style="font-size:0.86rem;color:var(--text-muted);">本節點目前沒有獨立的大考題型解析，建議搭配同模組其他節點一起複習。</p></div>';

            const siblings = nodesOfModule(meta.module);
            const idx = siblings.indexOf(code);
            const prev = idx > 0 ? siblings[idx - 1] : null;
            const next = idx < siblings.length - 1 ? siblings[idx + 1] : null;

            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <span class="view-eyebrow">${mod.badge}　${meta.section}　${code}</span>
                    <h2>${meta.title}</h2>
                    <p>${mod.title.replace(/^模組[一二三四]：/, '')}｜核心公式卡 ${formulas.length} 張・解題特徵 ${features.length} 組・大考題型 ${exams.length} 則・題庫 ${quizCount} 題</p>
                </div>

                <div class="node-route-actions">
                    ${labsOfNode(code).filter((l) => labMeta[l]).map((l) => `<button class="node-route-btn" onclick="navigateTo('lab-${l}')"><b>🔬 開啟互動實驗</b><span>${labMeta[l].name}</span></button>`).join('')}
                    <button class="node-route-btn" onclick="openBankForNode('${code}')"><b>✏️ 練這個節點的題目</b><span>${quizCount} 題，含記憶到分析四個層級</span></button>
                    <button class="node-route-btn" onclick="navigateTo('module-${meta.module}')"><b>🧭 回到模組導讀</b><span>${mod.title}</span></button>
                </div>

                <div class="section-title">核心公式與觀念</div>
                ${formulaHtml}

                <div class="section-title">解題特徵引導</div>
                ${featureHtml}

                <div class="section-title">大考與段考題型</div>
                ${examHtml}

                <div class="node-route-actions" style="margin-top:2rem;">
                    ${prev ? `<button class="node-route-btn" onclick="navigateTo('node-${prev}')"><b>← 上一個節點</b><span>${prev}　${nodeMeta[prev].title}</span></button>` : ''}
                    ${next ? `<button class="node-route-btn" onclick="navigateTo('node-${next}')"><b>下一個節點 →</b><span>${next}　${nodeMeta[next].title}</span></button>` : ''}
                </div>`;
        }

        function probePick(uid, idx, isRight) {
            const host = document.getElementById(`probe-${uid}`);
            if (!host) return;
            const opts = host.querySelectorAll('.probe-opt');
            opts[idx].classList.add(isRight ? 'right' : 'wrong');
            if (!isRight) {
                opts.forEach((el, i) => { if (el.getAttribute('onclick').includes(', 1)')) opts[i].classList.add('right'); });
            }
            opts.forEach((el) => { el.disabled = true; });
        }

        function openBankForNode(code) {
            quizFilter.node = code;
            quizFilter.level = 'all';
            navigateTo('tool-quiz');
        }

        /* =====================================================================
         * 工具：公式速查表
         * ===================================================================*/
        function renderFormulaSheet() {
            let html = '';
            Object.keys(modulesData).map(Number).sort((a, b) => a - b).forEach((m) => {
                const mod = modulesData[m];
                const rows = mod.formulas.map((f) => {
                    const codes = [].concat(f.node);
                    const chips = codes.map((c) => `<span class="module-node-chip" onclick="navigateTo('node-${c}')">${c}</span>`).join(' ');
                    return `<tr>
                        <td style="white-space:nowrap;">${chips}<br><span style="font-size:0.72rem;color:var(--text-muted);">${nodeMeta[codes[0]].section}</span></td>
                        <td><b>${f.name}</b><div style="margin-top:0.3rem;">$${f.formula}$</div></td>
                        <td style="color:var(--text-muted);">${f.anchor}</td>
                    </tr>`;
                }).join('');
                html += `
                    <div class="section-title">${mod.title}<span class="title-hint">${mod.badge}</span></div>
                    <div class="edu-table-container">
                        <table class="edu-table">
                            <thead><tr><th style="width:14%">節點</th><th style="width:44%">公式</th><th>一句話重點</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            });

            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <span class="view-eyebrow">複習工具箱</span>
                    <h2>公式速查表</h2>
                    <p>四章全部核心公式集中在同一頁，附上「一句話重點」與所屬節點。段考前先掃一遍這頁，確認每一條式子都知道它在什麼情境下用。</p>
                </div>
                <div class="callout">列印這一頁時側欄與工具列會自動隱藏，可直接當成單張公式卡使用。</div>
                ${html}`;
        }

        /* =====================================================================
         * 工具：大考題型索引
         * ===================================================================*/
        function renderExamIndexView() {
            let html = '';
            Object.keys(modulesData).map(Number).sort((a, b) => a - b).forEach((m) => {
                const mod = modulesData[m];
                const cards = mod.examQuestions.map((e) => {
                    const chips = [].concat(e.node).map((c) => `<span class="module-node-chip" onclick="navigateTo('node-${c}')">${c} ${nodeMeta[c].title}</span>`).join(' ');
                    return `<div class="card exam-card">
                        <span class="exam-year">${e.year}</span>
                        <h4>${e.title}</h4>
                        <p>${e.desc}</p>
                        <div class="module-nodes">${chips}</div>
                    </div>`;
                }).join('');
                html += `<div class="section-title">${mod.title}<span class="title-hint">${mod.examQuestions.length} 則</span></div>${cards}`;
            });

            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <span class="view-eyebrow">複習工具箱</span>
                    <h2>大考題型索引</h2>
                    <p>把散在各節點頁的大考與段考題型解析集中排列。每一則都標註了對應的知識節點，看完解析可直接點節點標籤回去補觀念。標有答對率的題目來自歷屆學測與指考，數字愈低代表該處的誘答設計愈成功。</p>
                </div>
                ${html}`;
        }

        /* =====================================================================
         * 工具：易混淆對照表
         * ===================================================================*/
        function renderCompareView() {
            const tables = [
                {
                    title: '駐波系統：三種端點條件',
                    hint: '弦樂器、開管、閉管其實只有兩張圖',
                    head: ['系統', '端點條件', '駐波條件', '頻率公式', '可存在的諧音'],
                    rows: [

            const q = findQuestion(qid);

            if (!q || !host || host.dataset.done === '1') return;
            const btns = host.querySelectorAll('.quiz-opt');
            if (q.type === 'multi') btns[idx].classList.toggle('picked');
            else { btns.forEach((b) => b.classList.remove('picked')); btns[idx].classList.add('picked'); }

        function gradeQuiz(qid, forceReveal) {
            const q = findQuestion(qid);
            const host = document.getElementById(`quiz-${qid}`);
            if (!q || !host) return;
            const btns = host.querySelectorAll('.quiz-opt');
            const picked = [];
            btns.forEach((b, i) => { if (b.classList.contains('picked')) picked.push(i); });
            if (!forceReveal && picked.length === 0) return;

            let allRight = true;
            btns.forEach((b, i) => {
                const correct = Boolean(q.opts[i].c);
                b.classList.remove('picked');
                if (correct) b.classList.add('right');
                else if (picked.includes(i)) { b.classList.add('wrong'); allRight = false; }
                if (correct && !picked.includes(i)) allRight = false;
                b.querySelector('.quiz-why').style.display = 'block';
            });
            host.querySelector('.quiz-exp').style.display = 'block';
            host.dataset.done = '1';
            if (!forceReveal) { if (allRight) unmarkWrong(qid); else markWrong(qid); }
            scheduleMathJax(host);
        }

        /* =====================================================================
         * 互動實驗：共用框架
         * ---------------------------------------------------------------------
         * 每個實驗宣告 controls（滑桿）、modes（切換鈕）、draw（繪圖）與
         * readouts（即時讀數）。框架負責建立 DOM、綁定事件、跑固定步長時鐘，
         * 並在離開檢視時由 activeDisposers 一次清除。
         * ===================================================================*/
        const C = {
            ink: '#12313a', muted: '#7d949c', grid: 'rgba(18,49,58,0.10)',
            blue: '#0b6f92', cyan: '#0e8b93', rose: '#c2264a',
            violet: '#6b46c1', orange: '#c9750f', green: '#12805c',
            soft: 'rgba(11,111,146,0.12)'
        };

        function axis(ctx, x0, y0, x1, y1) {
            ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        }
        function label(ctx, text, x, y, color, size, align) {
            ctx.fillStyle = color || C.muted;
            ctx.font = `${size || 11}px Outfit, "Noto Sans TC", sans-serif`;
            ctx.textAlign = align || 'left';
            ctx.fillText(text, x, y);
            ctx.textAlign = 'left';
        }
        function arrow(ctx, x1, y1, x2, y2, color, width) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width || 1.6;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            const a = Math.atan2(y2 - y1, x2 - x1); const s = 6;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - s * Math.cos(a - 0.4), y2 - s * Math.sin(a - 0.4));
            ctx.lineTo(x2 - s * Math.cos(a + 0.4), y2 - s * Math.sin(a + 0.4));
            ctx.closePath(); ctx.fill();
        }
        function dashed(ctx, x1, y1, x2, y2, color) {
            ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = color || C.muted; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
        }
        const deg = (r) => r * 180 / Math.PI;
        const rad = (d) => d * Math.PI / 180;

        function labShellHtml(id) {
            const lab = LABS[id];
            const controls = (lab.controls || []).map((c) => `
                <div class="lab-control" id="${id}-${c.key}-wrap">
                    <label for="${id}-${c.key}">${c.label}<b id="${id}-${c.key}-out"></b></label>
                    <input type="range" id="${id}-${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}">
                </div>`).join('');
            const modes = (lab.modes || []).map((m, i) =>
                `<button type="button" class="lab-btn ${i === 0 ? 'is-active' : ''}" data-mode="${m.key}">${m.label}</button>`
            ).join('');
            const scrub = lab.cycle ? `
                    <div class="lab-scrub">
                        <span class="scrub-label">⏱ 時間軸</span>
                        <button type="button" class="scrub-btn" data-role="step-back" aria-label="退一格">⏴</button>
                        <input type="range" id="${id}-scrub" min="0" max="1000" step="1" value="0" aria-label="拖曳以慢慢看過程">
                        <button type="button" class="scrub-btn" data-role="step-fwd" aria-label="進一格">⏵</button>
                        <b id="${id}-scrub-out">0.00 s</b>
                    </div>` : '';
            return `
                <div class="lab-shell" id="lab-${id}">
                    <div class="lab-title"><h4>${lab.name}</h4><span class="lab-tag">${lab.tag}</span></div>
                    <div class="lab-hint">${lab.hint}</div>
                    ${modes ? `<div class="lab-buttons" data-role="modes">${modes}</div>` : ''}
                    <div class="lab-stage"><canvas id="${id}-canvas"></canvas></div>
                    ${scrub}
                    <div class="lab-controls">${controls}</div>
                    <div class="lab-buttons">
                        <button type="button" class="lab-btn" data-role="toggle">⏸ 暫停</button>
                        <button type="button" class="lab-btn" data-role="reset">↺ 回到預設值</button>
                    </div>
                    <div class="lab-readout" id="${id}-readout"></div>
                    ${lab.note ? `<div class="lab-note">${lab.note}</div>` : ''}
                </div>`;
        }

        function mountLab(id, initialMode) {
            const lab = LABS[id];
            const host = document.getElementById(`lab-${id}`);
            const canvas = document.getElementById(`${id}-canvas`);
            if (!lab || !host || !canvas) return;

            const params = {};
            (lab.controls || []).forEach((c) => { params[c.key] = Number(c.value); });
            const modeKeys = lab.modes ? lab.modes.map((m) => m.key) : [];
            params.mode = lab.modes
                ? (modeKeys.includes(initialMode) ? initialMode : lab.modes[0].key)
                : null;
            if (lab.modes) {
                host.querySelectorAll('[data-mode]').forEach((b) => {
                    b.classList.toggle('is-active', b.dataset.mode === params.mode);
                });
            }

            let running = !WaveRuntime.prefersReducedMotion();
            let simTime = 0;
            let geom = WaveRuntime.fitCanvas(canvas, lab.height || 320);

            const syncOutputs = () => {
                (lab.controls || []).forEach((c) => {
                    const out = document.getElementById(`${id}-${c.key}-out`);
                    if (out) out.textContent = c.fmt ? c.fmt(params[c.key], params) : params[c.key];
                    const wrap = document.getElementById(`${id}-${c.key}-wrap`);
                    if (wrap && c.only) wrap.style.display = c.only.includes(params.mode) ? '' : 'none';
                });
                const ro = document.getElementById(`${id}-readout`);
                if (ro && lab.readouts) {
                    ro.innerHTML = lab.readouts(params).map((r) => `<div><span>${r.label}</span><strong>${r.value}</strong></div>`).join('');
                }
            };

            const paint = () => {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, geom.width, geom.height);
                lab.draw(ctx, geom.width, geom.height, params, simTime);
            };

            (lab.controls || []).forEach((c) => {
                const input = document.getElementById(`${id}-${c.key}`);
                activeDisposers.addEventListener(input, 'input', () => {
                    params[c.key] = Number(input.value);
                    syncOutputs(); paint();
                });
            });

            host.querySelectorAll('[data-mode]').forEach((btn) => {
                activeDisposers.addEventListener(btn, 'click', () => {
                    host.querySelectorAll('[data-mode]').forEach((b) => b.classList.remove('is-active'));
                    btn.classList.add('is-active');
                    params.mode = btn.dataset.mode;
                    if (lab.onMode) lab.onMode(params);
                    syncOutputs(); paint();
                });
            });

            const toggleBtn = host.querySelector('[data-role="toggle"]');
            activeDisposers.addEventListener(toggleBtn, 'click', () => {
                running = !running;
                toggleBtn.textContent = running ? '⏸ 暫停' : '▶ 播放';
            });
            if (!running) toggleBtn.textContent = '▶ 播放';

            /* 時間軸：拖曳或逐格前後時自動暫停，讓學生慢慢看疊加、反射的過程 */
            const scrubInput = lab.cycle ? document.getElementById(`${id}-scrub`) : null;
            const scrubOut = lab.cycle ? document.getElementById(`${id}-scrub-out`) : null;
            // cycle 可以是數字，也可以是依參數計算的函式（例如週期 T = 1/f）
            const cycleOf = () => {
                const c = (typeof lab.cycle === 'function') ? lab.cycle(params) : lab.cycle;
                return (Number.isFinite(c) && c > 0.02) ? c : 2;
            };
            const showScrub = () => {
                if (!scrubInput) return;
                const cyc = cycleOf();
                const phase = ((simTime % cyc) + cyc) % cyc;
                scrubInput.value = String(Math.round(phase / cyc * 1000));
                if (scrubOut) scrubOut.textContent = `${phase.toFixed(2)} s`;
            };
            const pausePlayback = () => {
                if (!running) return;
                running = false;
                toggleBtn.textContent = '▶ 播放';
            };
            if (scrubInput) {
                activeDisposers.addEventListener(scrubInput, 'input', () => {
                    pausePlayback();
                    simTime = Number(scrubInput.value) / 1000 * cycleOf();
                    if (scrubOut) scrubOut.textContent = `${simTime.toFixed(2)} s`;
                    syncOutputs(); paint();
                });
                const stepBy = (frac) => {
                    pausePlayback();
                    const cyc = cycleOf();
                    simTime = (((simTime + frac * cyc) % cyc) + cyc) % cyc;
                    showScrub(); paint();
                };
                activeDisposers.addEventListener(host.querySelector('[data-role="step-back"]'), 'click', () => stepBy(-1 / 48));
                activeDisposers.addEventListener(host.querySelector('[data-role="step-fwd"]'), 'click', () => stepBy(1 / 48));
                showScrub();
            }

            activeDisposers.addEventListener(host.querySelector('[data-role="reset"]'), 'click', () => {
                (lab.controls || []).forEach((c) => {
                    params[c.key] = Number(c.value);
                    const input = document.getElementById(`${id}-${c.key}`);
                    if (input) input.value = c.value;
                });
                simTime = 0;
                showScrub();
                syncOutputs(); paint();
            });

            activeDisposers.addEventListener(window, 'resize', () => {
                geom = WaveRuntime.fitCanvas(canvas, lab.height || 320);
                paint();
            });

            let scrubTick = 0;
            activeDisposers.runLoop((dt) => {
                if (running) {
                    simTime += dt;
                    if (scrubInput && (scrubTick = (scrubTick + 1) % 6) === 0) showScrub();
                }
                paint();
            });

            syncOutputs();
            paint();
        }

        /* =====================================================================
         * 互動實驗：各實驗定義
         * ===================================================================*/
        const LABS = {};

        /* 4. 波前與惠更斯原理 ---------------------------------------------- */
        LABS.huygens = {
            name: '波前與惠更斯原理',
            cycle: 2.6,                                     // 子波長大一個 λ 的時間
            tag: 'N05',
            hint: '前兩個模式重現講義圖 (a)(b)：條狀波源產生直線波前、點狀波源產生圓形波前，實線是波峰波前、虛線是波谷波前，綠色箭頭是傳播方向。後兩個模式重現圖 (c)(d)：把舊波前上的每一點當成新的點波源，子波的包絡線就是新的波前。',
            note: '兩個必記結論：① 波前是「振動情形相同」的點所連成的線，不一定要是波峰或波谷。② 波的傳播方向恆與波前垂直（夾角 90°）——這是之後所有折射、繞射作圖的起點。',
            height: 360,
            modes: [
                { key: 'lineFront', label: '直線波的波前' },
                { key: 'circleFront', label: '圓形波的波前' },
                { key: 'lineHuygens', label: '惠更斯建構：直線波' },
                { key: 'circleHuygens', label: '惠更斯建構：圓形波' }
            ],
            controls: [
                { key: 'lam', label: '波長 λ (px)', min: 30, max: 80, step: 2, value: 46, fmt: (v) => `${v}` },
                { key: 'nsrc', label: '子波源數目', min: 4, max: 16, step: 1, value: 9, only: ['lineHuygens', 'circleHuygens'], fmt: (v) => `${v} 個` }
            ],
            readouts: (p) => {
                const isHuy = p.mode === 'lineHuygens' || p.mode === 'circleHuygens';
                return [
                    { label: '波前與傳播方向', value: '恆垂直（90°）' },
                    { label: '相鄰兩波峰波前', value: `相距一個波長 λ = ${p.lam} px` },
                    { label: isHuy ? '子波半徑' : '波前形狀', value: isHuy ? '每過一個週期長 λ' : (p.mode === 'circleFront' ? '同心圓' : '平行直線') },
                    { label: isHuy ? '新波前' : '波源', value: isHuy ? '所有子波的包絡線' : (p.mode === 'circleFront' ? '點狀波源' : '條狀波源') }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const lam = Math.max(p.lam, 10);
                const cyc = 2.6;                                  // 一個週期的秒數
                const phase = ((t / cyc) % 1) * lam;              // 波前在一個週期內前進的距離
                const isCircle = (p.mode === 'circleFront' || p.mode === 'circleHuygens');
                const isHuy = (p.mode === 'lineHuygens' || p.mode === 'circleHuygens');

                /* ---------- 模式一、二：純粹畫波前 ---------- */
                if (!isHuy) {
                    if (!isCircle) {
                        const x0 = 46;
                        const barY0 = h * 0.16, barY1 = h * 0.84;
                        // 條狀波源（上下振動）
                        const wob = Math.sin(2 * Math.PI * t / cyc) * 5;
                        ctx.strokeStyle = '#2b5f74'; ctx.lineWidth = 6;
                        ctx.beginPath(); ctx.moveTo(x0 - 14, barY0 + wob); ctx.lineTo(x0 - 14, barY1 + wob); ctx.stroke();
                        arrow(ctx, x0 - 30, h / 2 - 8, x0 - 30, h / 2 - 30, C.ink, 1.4);
                        arrow(ctx, x0 - 30, h / 2 + 8, x0 - 30, h / 2 + 30, C.ink, 1.4);
                        label(ctx, '條狀波源', 8, barY0 - 10, C.ink, 11);
                        label(ctx, '上下振動', 8, barY0 + 6, C.muted, 10);

                        // 波峰波前（實線＋淡藍色隆起帶）與波谷波前（虛線）
                        for (let k = 0; k < 14; k++) {
                            const X = x0 + phase + k * lam / 2;
                            if (X > w - 12) break;
                            const crest = (k % 2 === 0);
                            if (crest) {
                                const bw = lam * 0.22;
                                const g = ctx.createLinearGradient(X - bw, 0, X + bw, 0);
                                g.addColorStop(0, 'rgba(11,111,146,0)');
                                g.addColorStop(0.5, 'rgba(11,111,146,0.20)');
                                g.addColorStop(1, 'rgba(11,111,146,0)');
                                ctx.fillStyle = g;
                                ctx.fillRect(X - bw, barY0, bw * 2, barY1 - barY0);
                                ctx.strokeStyle = 'rgba(11,111,146,0.9)'; ctx.lineWidth = 2.6;
                                ctx.beginPath(); ctx.moveTo(X, barY0); ctx.lineTo(X, barY1); ctx.stroke();
                            } else {
                                dashed(ctx, X, barY0, X, barY1, 'rgba(107,70,193,0.55)');
                            }
                        }
                        // 傳播方向（與波前垂直）
                        [0.28, 0.5, 0.72].forEach((f) => {
                            arrow(ctx, x0 + 10, h * f, Math.min(w - 18, x0 + 10 + Math.max(150, (w - x0) * 0.55)), h * f, C.green, 1.8);
                        });
                        // 波長標示
                        const xa = x0 + phase, xb = xa + lam;
                        if (xb < w - 20) {
                            ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.2;
                            const yy = barY1 + 20;
                            ctx.beginPath();
                            ctx.moveTo(xa, yy); ctx.lineTo(xb, yy);
                            ctx.moveTo(xa, yy - 5); ctx.lineTo(xa, yy + 5);
                            ctx.moveTo(xb, yy - 5); ctx.lineTo(xb, yy + 5);
                            ctx.stroke();
                            label(ctx, `λ`, (xa + xb) / 2, yy - 8, C.cyan, 12, 'center');
                        }
                        ctx.fillStyle = 'rgba(255,255,255,0.88)';
                        ctx.fillRect(w - 232, 6, 226, 54);
                        label(ctx, '—— 波峰波前', w - 14, 22, '#0b6f92', 11, 'right');
                        label(ctx, '- - - 波谷波前', w - 14, 38, '#6b46c1', 11, 'right');
                        label(ctx, '→ 波傳遞的方向（與波前垂直）', w - 14, 54, C.green, 10, 'right');
                        return;
                    }

                    // 圓形波
                    const sx = Math.min(90, w * 0.16), sy = h / 2;
                    const wob = Math.sin(2 * Math.PI * t / cyc) * 4;
                    ctx.fillStyle = '#2b5f74';
                    ctx.beginPath(); ctx.arc(sx, sy + wob, 6, 0, Math.PI * 2); ctx.fill();
                    arrow(ctx, sx - 22, sy - 8, sx - 22, sy - 28, C.ink, 1.4);
                    arrow(ctx, sx - 22, sy + 8, sx - 22, sy + 28, C.ink, 1.4);
                    label(ctx, '點狀波源', 8, sy - 44, C.ink, 11);
                    label(ctx, '上下振動', 8, sy - 28, C.muted, 10);

                    const rMax = Math.hypot(w - sx, h / 2) + lam;
                    for (let k = 0; k < 30; k++) {
                        const R = phase + k * lam / 2;
                        if (R > rMax) break;
                        if (R < 6) continue;
                        const crest = (k % 2 === 0);
                        ctx.save();
                        ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                        if (crest) {
                            ctx.strokeStyle = 'rgba(11,111,146,0.14)'; ctx.lineWidth = Math.max(4, lam * 0.42);
                            ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.05, Math.PI / 2.05); ctx.stroke();
                            ctx.strokeStyle = 'rgba(11,111,146,0.85)'; ctx.lineWidth = 2.6;
                            ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.05, Math.PI / 2.05); ctx.stroke();
                        } else {
                            ctx.save(); ctx.setLineDash([5, 5]);
                            ctx.strokeStyle = 'rgba(107,70,193,0.6)'; ctx.lineWidth = 1.6;
                            ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.05, Math.PI / 2.05); ctx.stroke();
                            ctx.restore();
                        }
                        ctx.restore();
                    }
                    [-0.7, -0.35, 0, 0.35, 0.7].forEach((a) => {
                        const r0 = 16, r1 = Math.min(w - sx - 16, 150);
                        arrow(ctx, sx + Math.cos(a) * r0, sy + Math.sin(a) * r0,
                            sx + Math.cos(a) * r1, sy + Math.sin(a) * r1, C.green, 1.7);
                    });
                    const ra = phase + 4 * lam / 2, rb = ra + lam;
                    if (sx + rb < w - 16) {
                        ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.2;
                        const yy = sy + h * 0.36;
                        ctx.beginPath();
                        ctx.moveTo(sx + ra, yy); ctx.lineTo(sx + rb, yy);
                        ctx.moveTo(sx + ra, yy - 5); ctx.lineTo(sx + ra, yy + 5);
                        ctx.moveTo(sx + rb, yy - 5); ctx.lineTo(sx + rb, yy + 5);
                        ctx.stroke();
                        label(ctx, 'λ', sx + ra + lam / 2, yy - 8, C.cyan, 12, 'center');
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.88)';
                    ctx.fillRect(w - 232, 6, 226, 54);
                    label(ctx, '—— 波峰波前', w - 14, 22, '#0b6f92', 11, 'right');
                    label(ctx, '- - - 波谷波前', w - 14, 38, '#6b46c1', 11, 'right');
                    label(ctx, '→ 波傳遞的方向（沿半徑，與波前垂直）', w - 14, 54, C.green, 10, 'right');
                    return;
                }

                /* ---------- 模式三、四：惠更斯建構 ---------- */
                const grow = phase;                              // 子波目前的半徑（0 → λ）
                const nsrc = Math.max(3, Math.round(p.nsrc));
                const done = grow > lam * 0.97;

                if (p.mode === 'lineHuygens') {
                    const y0 = h * 0.16, y1 = h * 0.82;
                    const xOld = Math.max(70, w * 0.24);
                    // 更早的波前（淡）
                    for (let k = 1; k <= 2; k++) {
                        const X = xOld - k * lam;
                        if (X > 12) dashed(ctx, X, y0, X, y1, 'rgba(11,111,146,0.22)');
                    }
                    // 舊波前
                    ctx.strokeStyle = 'rgba(11,111,146,0.9)'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(xOld, y0); ctx.lineTo(xOld, y1); ctx.stroke();
                    label(ctx, '舊波前（此刻的波前）', xOld - 6, y0 - 10, C.blue, 12, 'right');

                    // 子波
                    ctx.strokeStyle = 'rgba(201,117,15,0.75)'; ctx.lineWidth = 1.5;
                    for (let i = 0; i < nsrc; i++) {
                        const yy = y0 + (y1 - y0) * i / (nsrc - 1);
                        ctx.fillStyle = C.orange;
                        ctx.beginPath(); ctx.arc(xOld, yy, 3.6, 0, Math.PI * 2); ctx.fill();
                        if (grow > 1.5) {
                            ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                            ctx.beginPath(); ctx.arc(xOld, yy, grow, -Math.PI / 2, Math.PI / 2); ctx.stroke();
                            ctx.restore();
                        }
                    }
                    // 新波前＝包絡線
                    const xNew = xOld + grow;
                    if (xNew < w - 10) {
                        if (done) {
                            ctx.strokeStyle = C.green; ctx.lineWidth = 3.4;
                            ctx.beginPath(); ctx.moveTo(xNew, y0); ctx.lineTo(xNew, y1); ctx.stroke();
                        } else {
                            dashed(ctx, xNew, y0, xNew, y1, 'rgba(18,128,92,0.65)');
                        }
                        label(ctx, done ? '新波前（包絡線）' : '包絡線形成中…', Math.min(xNew + 8, w - 12), y0 - 10, C.green, 12);
                    }
                    label(ctx, '① 舊波前上的每一點 → 新的點波源', 14, h - 40, C.ink, 11);
                    label(ctx, '② 各自發出半徑相同的圓形子波（一個週期長一個 λ）', 14, h - 24, C.orange, 11);
                    label(ctx, '③ 與所有子波相切的線＝包絡線＝新的波前', 14, h - 8, C.green, 11);
                    return;
                }

                // 圓形波的惠更斯建構
                const sx = Math.min(96, w * 0.17), sy = h / 2;
                const Rold = Math.min(w * 0.30, h * 0.34);
                ctx.fillStyle = '#2b5f74';
                ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2); ctx.fill();
                label(ctx, '點波源', sx - 8, sy - 14, C.ink, 11, 'right');
                for (let k = 1; k <= 2; k++) {
                    const R = Rold - k * lam;
                    if (R > 10) {
                        ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(11,111,146,0.22)'; ctx.lineWidth = 1.4;
                        ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke(); ctx.restore();
                    }
                }
                ctx.strokeStyle = 'rgba(11,111,146,0.9)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(sx, sy, Rold, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke();
                label(ctx, '舊波前', sx + Rold * 0.72, sy - Rold * 0.80, C.blue, 12);

                ctx.strokeStyle = 'rgba(201,117,15,0.75)'; ctx.lineWidth = 1.5;
                for (let i = 0; i < nsrc; i++) {
                    const a = -Math.PI / 2.2 + (Math.PI / 1.1) * i / (nsrc - 1);
                    const px = sx + Math.cos(a) * Rold, py = sy + Math.sin(a) * Rold;
                    ctx.fillStyle = C.orange;
                    ctx.beginPath(); ctx.arc(px, py, 3.6, 0, Math.PI * 2); ctx.fill();
                    if (grow > 1.5) {
                        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                        ctx.beginPath(); ctx.arc(px, py, grow, a - Math.PI / 2, a + Math.PI / 2); ctx.stroke();
                        ctx.restore();
                    }
                }
                const Rnew = Rold + grow;
                ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                if (done) {
                    ctx.strokeStyle = C.green; ctx.lineWidth = 3.4;
                    ctx.beginPath(); ctx.arc(sx, sy, Rnew, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke();
                } else {
                    ctx.save(); ctx.setLineDash([6, 5]);
                    ctx.strokeStyle = 'rgba(18,128,92,0.65)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(sx, sy, Rnew, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke();
                    ctx.restore();
                }
                ctx.restore();
                label(ctx, done ? '新波前（包絡線）仍是圓形' : '包絡線形成中…', 14, 22, C.green, 12);
                label(ctx, '① 舊波前上的每一點 → 新的點波源', 14, h - 40, C.ink, 11);
                label(ctx, '② 各自發出半徑相同的圓形子波', 14, h - 24, C.orange, 11);
                label(ctx, '③ 包絡線＝新的波前（圓形波仍為圓形）', 14, h - 8, C.green, 11);
            }
        };

        /* 8. 諧音疊加與音色 ------------------------------------------------- */
        LABS.timbre = {
            name: '諧音疊加與音色',
            cycle: 2.62,
            tag: 'N11',
            hint: '三條細線分別是基音、第二諧音與第三諧音，粗線是它們疊加後的波形。改變振幅比，波形會完全改變，但合成波的週期始終等於基音的週期。',
            note: '這就是「音調由基音決定、音色由波形決定」的數學根據：所有諧音都是基頻的整數倍，最小共同週期就是基音的週期。',
            height: 300,
            controls: [
                { key: 'a1', label: '基音振幅', min: 0, max: 10, step: 1, value: 6, fmt: (v) => `${v}` },
                { key: 'a2', label: '第二諧音振幅', min: 0, max: 10, step: 1, value: 3, fmt: (v) => `${v}` },
                { key: 'a3', label: '第三諧音振幅', min: 0, max: 10, step: 1, value: 2, fmt: (v) => `${v}` }
            ],
            readouts: (p) => [
                { label: '振幅比', value: `${p.a1} : ${p.a2} : ${p.a3}` },
                { label: '合成波頻率', value: '= 基音頻率 f₁' },
                { label: '音調', value: '不隨振幅比改變' },
                { label: '音色', value: '隨波形改變' }
            ],
            draw: (ctx, w, h, p, t) => {
                const x0 = 20, x1 = w - 20, span = x1 - x0;
                const top = h * 0.28, mid = h * 0.72;
                const period = span / 2;             // 畫面顯示兩個基音週期
                const k1 = 2 * Math.PI / period;
                const shift = (t * 60) % period;

                axis(ctx, x0, top, x1, top);
                const harm = [[p.a1, 1, C.blue], [p.a2, 2, C.violet], [p.a3, 3, C.orange]];
                harm.forEach(([a, n, color]) => {
                    if (a === 0) return;
                    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.75;
                    ctx.beginPath();
                    for (let i = 0; i <= span; i += 2) ctx.lineTo(x0 + i, top - a * 4 * Math.sin(n * k1 * (i + shift)));
                    ctx.stroke(); ctx.globalAlpha = 1;
                });
                label(ctx, '各諧音（藍：基音　紫：第二諧音　橘：第三諧音）', x0, top - 52, C.muted, 11);

                axis(ctx, x0, mid, x1, mid);
                ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.8; ctx.beginPath();
                for (let i = 0; i <= span; i += 2) {
                    const s = p.a1 * Math.sin(k1 * (i + shift)) + p.a2 * Math.sin(2 * k1 * (i + shift)) + p.a3 * Math.sin(3 * k1 * (i + shift));
                    ctx.lineTo(x0 + i, mid - s * 4);
                }
                ctx.stroke();
                label(ctx, '疊加後的波形（決定音色）', x0, mid - 62, C.cyan, 12);

                // 標出一個基音週期
                ctx.strokeStyle = C.rose; ctx.lineWidth = 1.2;
                const px0 = x0 + 10;
                ctx.beginPath();
                ctx.moveTo(px0, mid + 62); ctx.lineTo(px0 + period, mid + 62);
                ctx.moveTo(px0, mid + 57); ctx.lineTo(px0, mid + 67);
                ctx.moveTo(px0 + period, mid + 57); ctx.lineTo(px0 + period, mid + 67);
                ctx.stroke();
                label(ctx, '合成波的週期 = 基音週期 T₁', px0 + period / 2, mid + 56, C.rose, 11, 'center');
            }
        };

        /* 9. 司乃耳定律與全反射 -------------------------------------------- */
        LABS.snell = {
            name: '司乃耳定律與全反射',
            tag: 'N13 / N15',
            hint: '調整入射角與兩側介質的折射率。當光由光密進入光疏且入射角達到臨界角時，折射線會消失、只剩下反射線——那就是全反射。',
            note: '全反射的兩個條件缺一不可：必須是 n₁ > n₂（光密 → 光疏），且入射角 ≥ 臨界角 θ_c（sinθ_c = n₂/n₁）。',
            height: 340,
            controls: [
                { key: 'th1', label: '入射角 θ₁', min: 0, max: 89, step: 1, value: 40, fmt: (v) => `${v}°` },
                { key: 'n1', label: '入射側折射率 n₁', min: 1, max: 2.5, step: 0.05, value: 1.5, fmt: (v) => v.toFixed(2) },
                { key: 'n2', label: '出射側折射率 n₂', min: 1, max: 2.5, step: 0.05, value: 1.0, fmt: (v) => v.toFixed(2) }
            ],
            readouts: (p) => {
                const s2 = p.n1 * Math.sin(rad(p.th1)) / p.n2;
                const tir = s2 > 1;
                const canTir = p.n1 > p.n2;
                return [
                    { label: '折射角 θ₂', value: tir ? '不存在（全反射）' : `${deg(Math.asin(s2)).toFixed(1)}°` },
                    { label: '臨界角 θ_c', value: canTir ? `${deg(Math.asin(p.n2 / p.n1)).toFixed(1)}°` : '不存在（疏→密）' },
                    { label: '光速比 v₁ : v₂', value: `${(1 / p.n1).toFixed(2)} : ${(1 / p.n2).toFixed(2)}` },
                    { label: '目前狀態', value: tir ? '全反射' : (p.n1 > p.n2 ? '偏離法線' : (p.n1 < p.n2 ? '偏向法線' : '不偏折')) }
                ];
            },
            draw: (ctx, w, h, p) => {
                const iy = h * 0.5, cx = w * 0.5;
                ctx.fillStyle = `rgba(11,111,146,${0.04 + (p.n1 - 1) * 0.05})`; ctx.fillRect(0, 0, w, iy);
                ctx.fillStyle = `rgba(201,117,15,${0.04 + (p.n2 - 1) * 0.05})`; ctx.fillRect(0, iy, w, h - iy);
                ctx.strokeStyle = 'rgba(18,49,58,0.4)'; ctx.lineWidth = 1.6;
                ctx.beginPath(); ctx.moveTo(0, iy); ctx.lineTo(w, iy); ctx.stroke();
                label(ctx, `介質 1：n₁ = ${p.n1.toFixed(2)}${p.n1 > p.n2 ? '（光密）' : p.n1 < p.n2 ? '（光疏）' : ''}`, 12, 20, C.blue, 12);
                label(ctx, `介質 2：n₂ = ${p.n2.toFixed(2)}${p.n2 > p.n1 ? '（光密）' : p.n2 < p.n1 ? '（光疏）' : ''}`, 12, h - 12, C.orange, 12);

                dashed(ctx, cx, 10, cx, h - 10, 'rgba(18,49,58,0.35)');
                label(ctx, '法線', cx + 6, 34, C.muted, 10);

                const th1 = rad(p.th1);
                const s2 = p.n1 * Math.sin(th1) / p.n2;
                const tir = s2 > 1;
                const R = Math.min(w, h) * 0.42;

                // 入射線
                arrow(ctx, cx - Math.sin(th1) * R, iy - Math.cos(th1) * R, cx, iy, C.blue, 2.4);
                label(ctx, '入射線', cx - Math.sin(th1) * R - 6, iy - Math.cos(th1) * R - 6, C.blue, 11);

                // 反射線
                ctx.globalAlpha = tir ? 1 : 0.55;
                arrow(ctx, cx, iy, cx + Math.sin(th1) * R, iy - Math.cos(th1) * R, C.rose, tir ? 2.6 : 1.8);
                ctx.globalAlpha = 1;
                label(ctx, tir ? '全反射（光全部回到介質 1）' : '反射線', cx + Math.sin(th1) * R * 0.55, iy - Math.cos(th1) * R * 0.55 - 8, C.rose, 11);

                if (!tir) {
                    const th2 = Math.asin(s2);
                    arrow(ctx, cx, iy, cx + Math.sin(th2) * R, iy + Math.cos(th2) * R, C.orange, 2.4);
                    label(ctx, '折射線', cx + Math.sin(th2) * R * 0.7 + 6, iy + Math.cos(th2) * R * 0.7, C.orange, 11);
                    ctx.strokeStyle = 'rgba(18,49,58,0.45)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(cx, iy, 46, Math.PI / 2 - th2, Math.PI / 2); ctx.stroke();
                    label(ctx, `θ₂ = ${deg(th2).toFixed(0)}°`, cx + 52, iy + 46, C.orange, 11);
                }

                ctx.strokeStyle = 'rgba(18,49,58,0.45)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(cx, iy, 46, -Math.PI / 2 - th1, -Math.PI / 2); ctx.stroke();
                label(ctx, `θ₁ = ${p.th1}°`, cx - 96, iy - 38, C.blue, 11);

                // 臨界角參考線
                if (p.n1 > p.n2) {
                    const thc = Math.asin(p.n2 / p.n1);
                    dashed(ctx, cx, iy, cx - Math.sin(thc) * R, iy - Math.cos(thc) * R, 'rgba(107,70,193,0.7)');
                    label(ctx, `臨界角 ${deg(thc).toFixed(1)}°`, cx - Math.sin(thc) * R - 4, iy - Math.cos(thc) * R + 16, C.violet, 11, 'right');
                }
            }
        };

        /* 10. 薄透鏡成像作圖 ----------------------------------------------- */
        LABS.lens = {
            name: '薄透鏡成像作圖',
            tag: 'N16 / N17',
            hint: '三條主要光線同時作圖：平行主軸的光線、通過焦點的光線、通過鏡心的光線。拖動物距與焦距，觀察像距、放大率與成像性質如何隨之改變。',
            note: '符號法則：凸透鏡 f 取正、凹透鏡 f 取負；q > 0 為鏡後實像、q < 0 為鏡前虛像；m = −q/p，m > 0 正立、m < 0 倒立。',
            height: 340,
            modes: [
                { key: 'convex', label: '凸透鏡（f > 0）' },
                { key: 'concave', label: '凹透鏡（f < 0）' }
            ],
            controls: [
                { key: 'p', label: '物距 p (cm)', min: 5, max: 90, step: 1, value: 30, fmt: (v) => `${v} cm` },
                { key: 'f', label: '焦距 |f| (cm)', min: 8, max: 45, step: 1, value: 20, fmt: (v) => `${v} cm` },
                { key: 'ho', label: '物高 (cm)', min: 2, max: 14, step: 1, value: 8, fmt: (v) => `${v} cm` }
            ],
            readouts: (p) => {
                const f = p.mode === 'concave' ? -p.f : p.f;
                if (Math.abs(p.p - f) < 1e-6) return [
                    { label: '像距 q', value: '無窮遠' }, { label: '放大率 m', value: '—' },
