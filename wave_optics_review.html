            /* 斯涅爾窗與水下光扇模式：讀數下方附真實影片與照片對照 */
            setup: (ctx) => bindRealMedia(ctx, 'snell', {
                window: {
                    title: '真實影像對照：斯涅爾窗與水面全反射',
                    desc: '按「套用到模擬」，把太陽仰角、水面波動與深度調成接近畫面的情況，再和上方的仰望影像比較。',
                    items: [
                        withApply(REAL_MEDIA.poolVideo, { scene: 'pool', eyeD: 1.0, ripple: 0.15, sun: 60, objX: 3.2 }),
                        withApply(REAL_MEDIA.poolPhoto, { scene: 'pool', eyeD: 0.8, ripple: 0.25, sun: 70 }),
                        ...SNELL_PHOTOS
                    ]
                },
                fan: {
                    title: '真實影像對照：水槽中的光扇',
                    desc: '影片中光源的位置與傾角會改變；按「套用到模擬」把模擬設成水中光源，再拖動深度比較。',
                    items: [withApply(REAL_MEDIA.fanVideo, { nw: '1.33', depth: 8 })]
                }
            }),
            /* ---------- 單一光線 ---------- */
            drawRay: (ctx, w, h, p) => {
                const iy = h * 0.5, cx = w * 0.5;
                ctx.fillStyle = `rgba(11,111,146,${0.04 + (p.n1 - 1) * 0.05})`; ctx.fillRect(0, 0, w, iy);
                ctx.fillStyle = `rgba(201,117,15,${0.04 + (p.n2 - 1) * 0.05})`; ctx.fillRect(0, iy, w, h - iy);
                ctx.strokeStyle = 'rgba(18,49,58,0.4)'; ctx.lineWidth = 1.6;
                ctx.beginPath(); ctx.moveTo(0, iy); ctx.lineTo(w, iy); ctx.stroke();
                label(ctx, `介質 1：n₁ = ${p.n1.toFixed(2)}${p.n1 > p.n2 ? '（光密）' : p.n1 < p.n2 ? '（光疏）' : ''}`, 12, 20, C.blue, 12);
                label(ctx, `介質 2：n₂ = ${p.n2.toFixed(2)}${p.n2 > p.n1 ? '（光密）' : p.n2 < p.n1 ? '（光疏）' : ''}`, 12, h - 12, C.orange, 12);

                dashed(ctx, cx, 10, cx, h - 10, 'rgba(18,49,58,0.35)');
                label(ctx, '法線', cx + 6, 34, C.muted, 10);

                const th1 = rad(p.th1);
                const s2 = p.n1 * Math.sin(th1) / p.n2;
                const tir = s2 > 1;
                const R = Math.min(w * 0.42, h * 0.42);
                const Rf = fresnelR(p.n1, p.n2, Math.cos(th1));

                // 入射線
                arrow(ctx, cx - Math.sin(th1) * R, iy - Math.cos(th1) * R, cx, iy, C.blue, 2.6);
                label(ctx, '入射線', cx - Math.sin(th1) * R - 6, iy - Math.cos(th1) * R - 6, C.blue, 11);

                // 反射線：粗細與透明度隨反射率 R
                ctx.globalAlpha = 0.25 + 0.75 * Rf;
                arrow(ctx, cx, iy, cx + Math.sin(th1) * R, iy - Math.cos(th1) * R, C.rose, 0.8 + 2.4 * Rf);
                ctx.globalAlpha = 1;
                labelFit(ctx, tir ? '全反射（R = 100%）' : `反射線 R = ${Math.round(Rf * 100)}%`,
                    cx + Math.sin(th1) * R * 0.55 + 4, iy - Math.cos(th1) * R * 0.55 - 8, C.rose, 11, 'left', { clampW: w });

                if (!tir) {
                    const th2 = Math.asin(Math.min(1, s2));
                    ctx.globalAlpha = 0.3 + 0.7 * (1 - Rf);
                    arrow(ctx, cx, iy, cx + Math.sin(th2) * R, iy + Math.cos(th2) * R, C.orange, 0.8 + 2.4 * (1 - Rf));
                    ctx.globalAlpha = 1;
                    labelFit(ctx, `折射線 T = ${Math.round((1 - Rf) * 100)}%`, cx + Math.sin(th2) * R * 0.7 + 6, iy + Math.cos(th2) * R * 0.7 + 18,
                        C.orange, 11, 'left', { clampW: w, plate: 1 });
                    ctx.strokeStyle = 'rgba(18,49,58,0.45)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(cx, iy, 46, Math.PI / 2 - th2, Math.PI / 2); ctx.stroke();
                    label(ctx, `θ₂ = ${deg(th2).toFixed(1)}°`, cx + 10, iy + 62, C.orange, 11);
                }

                ctx.strokeStyle = 'rgba(18,49,58,0.45)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(cx, iy, 46, -Math.PI / 2 - th1, -Math.PI / 2); ctx.stroke();
                labelFit(ctx, `θ₁ = ${p.th1}°`, cx - 54, iy - 30, C.blue, 11, 'right', { clampW: w });

                // 臨界角參考線
                if (p.n1 > p.n2) {
                    const thc = Math.asin(p.n2 / p.n1);
                    dashed(ctx, cx, iy, cx - Math.sin(thc) * R, iy - Math.cos(thc) * R, 'rgba(107,70,193,0.7)');
                    // 與「入射線」標籤的外框相交時往下錯開，避免兩個標籤疊在一起
                    ctx.font = '11px Outfit, "Noto Sans TC", sans-serif';
                    const ctext = `臨界角 ${deg(thc).toFixed(1)}°`;
                    const ix = cx - Math.sin(th1) * R - 6, iyL = iy - Math.cos(th1) * R - 6;
                    const iw = ctx.measureText('入射線').width, cw = ctx.measureText(ctext).width;
                    const cxr = cx - Math.sin(thc) * R - 4;
                    let cyL = iy - Math.cos(thc) * R + 16;
                    const hits = (y) => cxr > ix - 4 && cxr - cw < ix + iw + 4 && y > iyL - 14 && y - 14 < iyL;
                    for (let k = 0; k < 6 && hits(cyL); k++) cyL += 16;
                    labelFit(ctx, ctext, cxr, cyL, C.violet, 11, 'right', { clampW: w, plate: 1 });
                }

                // 左下角：反射率 R 對入射角的曲線
                const gw = Math.min(190, Math.max(120, cx - 70)), gx0 = 34;
                const gTop = iy + 34, gBot = h - 40, gh = gBot - gTop;
                if (gh > 50) {
                    ctx.fillStyle = 'rgba(255,255,255,0.78)';
                    ctx.fillRect(gx0 - 26, gTop - 22, gw + 34, gh + 40);
                    labelFit(ctx, '反射率 R 與入射角', gx0 - 20, gTop - 8, C.ink, 11, 'left', { maxW: gw + 24 });
                    ctx.strokeStyle = 'rgba(18,49,58,0.35)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(gx0, gTop); ctx.lineTo(gx0, gBot); ctx.lineTo(gx0 + gw, gBot); ctx.stroke();
                    label(ctx, '100%', gx0 - 3, gTop + 4, C.muted, 9, 'right');
                    label(ctx, '0', gx0 - 3, gBot + 3, C.muted, 9, 'right');
                    label(ctx, '90°', gx0 + gw, gBot + 12, C.muted, 9, 'right');
                    ctx.strokeStyle = C.rose; ctx.lineWidth = 1.8; ctx.beginPath();
                    for (let i = 0; i <= 120; i++) {
                        const a = i / 120 * 90;
                        const y = gBot - fresnelR(p.n1, p.n2, Math.cos(rad(a))) * gh;
                        const x = gx0 + a / 90 * gw;
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    if (p.n1 > p.n2) {
                        const xc = gx0 + deg(Math.asin(p.n2 / p.n1)) / 90 * gw;
                        dashed(ctx, xc, gTop, xc, gBot, 'rgba(107,70,193,0.7)');
                        labelFit(ctx, 'θc', xc, gBot + 12, C.violet, 9, 'center', { clampW: w });
                    }
                    const xp = gx0 + p.th1 / 90 * gw, yp = gBot - Rf * gh;
                    ctx.fillStyle = C.blue; ctx.beginPath(); ctx.arc(xp, yp, 3.6, 0, Math.PI * 2); ctx.fill();
                }
            },

            /* ---------- 水下光扇 ---------- */
            drawFan: (ctx, w, h, p, t) => {
                const n = Number(p.nw), thc = Math.asin(1 / n);
                const ys = Math.round(h * 0.40);
                const wallL = 14, wallR = w - 14, yb = h - 40;
                const s = (yb - ys - 16) / 32;                 // px / cm
                const sxp = w / 2, syp = ys + p.depth * s;
                // 暗室背景與水槽
                ctx.fillStyle = '#0b161c'; ctx.fillRect(0, 0, w, h);
                const wg = ctx.createLinearGradient(0, ys, 0, yb);
                wg.addColorStop(0, '#173a46'); wg.addColorStop(1, '#0f2a33');
                ctx.fillStyle = wg; ctx.fillRect(wallL, ys, wallR - wallL, yb - ys);
                ctx.strokeStyle = 'rgba(190,225,235,0.45)'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(wallL, ys - 30); ctx.lineTo(wallL, yb); ctx.lineTo(wallR, yb); ctx.lineTo(wallR, ys - 30); ctx.stroke();
                ctx.strokeStyle = 'rgba(160,220,240,0.8)'; ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.moveTo(wallL, ys); ctx.lineTo(wallR, ys); ctx.stroke();

                // 一條光線的路徑：水中段（含全反射後）與空氣段
                const trace = (phi) => {
                    const pts = [[sxp, syp]];
                    const dx = Math.sin(phi), dy = -Math.cos(phi);
                    let tw = (syp - ys) / -dy;
                    let hx = sxp + dx * tw;
                    if (hx < wallL || hx > wallR) {
                        const tl = ((dx < 0 ? wallL : wallR) - sxp) / dx;
                        pts.push([sxp + dx * tl, syp + dy * tl]);
                        return { water: pts, air: null, refl: null, tir: Math.abs(phi) > thc, hit: false };
                    }
                    pts.push([hx, ys]);
                    const R = fresnelR(n, 1, Math.cos(phi));
                    // 反射後向下，打到槽壁或槽底為止
                    const rdx = dx, rdy = -dy;
                    const tB = (yb - ys) / rdy, tS = ((rdx < 0 ? wallL : wallR) - hx) / (rdx || 1e-9);
                    const tr = Math.min(tB, tS > 0 ? tS : Infinity);
                    const refl = [[hx, ys], [hx + rdx * tr, ys + rdy * tr]];
                    if (R >= 1) return { water: pts, air: null, refl, R, tir: true, hit: true };
                    const b = Math.asin(n * Math.sin(phi));
                    const adx = Math.sin(b), ady = -Math.cos(b);
                    const tT = ys / -ady, tA = ((adx < 0 ? 0 : w) - hx) / (adx || 1e-9);
                    const ta = Math.min(tT, tA > 0 ? tA : Infinity);
                    return { water: pts, air: [[hx, ys], [hx + adx * ta, ys + ady * ta]], refl, R, tir: false, hit: true };
                };
                const beam = (a, b, color, alpha) => {
                    ctx.strokeStyle = color;
                    ctx.globalAlpha = alpha * 0.28; ctx.lineWidth = 5;
                    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
                    ctx.globalAlpha = alpha; ctx.lineWidth = 1.6;
                    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
                    ctx.globalAlpha = 1;
                };
                // 光脈衝：水中速度 c/n，空氣中速度 c（點的間距反映光速差）
                const pulses = (segs, color, alpha) => {
                    const V = 130, period = 1.1;
                    let tau0 = 0;
                    ctx.fillStyle = color; ctx.globalAlpha = alpha;
                    for (const sg of segs) {
                        const [a, b, nn] = sg;
                        const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
                        const dur = len * nn / V;
                        const first = Math.ceil((tau0 - t) / period);
                        for (let m = first; ; m++) {
                            const tau = t + m * period - tau0;
                            if (tau > dur) break;
                            if (tau < 0) continue;
                            const f = tau / dur;
                            ctx.beginPath(); ctx.arc(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, 2.2, 0, Math.PI * 2); ctx.fill();
                        }
                        tau0 += dur;
                    }
                    ctx.globalAlpha = 1;
                };

                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                let idx = 0;
                for (let a = -SNELL_FAN_MAX; a <= SNELL_FAN_MAX; a += SNELL_FAN_STEP, idx++) {
                    const phi = rad(a);
                    const col = SNELL_FAN_COLORS[idx % SNELL_FAN_COLORS.length];
                    const tr = trace(phi);
                    beam(tr.water[0], tr.water[1], col, 0.95);
                    const segs = [[tr.water[0], tr.water[1], n]];
                    if (tr.hit) {
                        const R = tr.R;
                        if (tr.air) {
                            beam(tr.air[0], tr.air[1], col, Math.max(0.12, 1 - R));
                            if (R > 0.02) beam(tr.refl[0], tr.refl[1], col, Math.min(1, R * 1.4));
                            segs.push([tr.air[0], tr.air[1], 1]);
                        } else {
                            beam(tr.refl[0], tr.refl[1], col, 0.95);
                            segs.push([tr.refl[0], tr.refl[1], n]);
                        }
                    }
                    pulses(segs, '#ffffff', 0.8);
                }
                ctx.restore();

                // 光源（燈與燈罩）
                ctx.fillStyle = '#05090b';
                ctx.beginPath(); ctx.arc(sxp, syp + 3, 13, 0, Math.PI); ctx.fill();
                const lg = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, 10);
                lg.addColorStop(0, '#fffbe6'); lg.addColorStop(1, 'rgba(255,240,180,0)');
                ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(sxp, syp, 10, 0, Math.PI * 2); ctx.fill();

                // 臨界角圓錐與出光範圍
                const r = p.depth * Math.tan(thc) * s;
                ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(sxp - r, ys); ctx.lineTo(sxp, syp); ctx.lineTo(sxp + r, ys); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(sxp, syp); ctx.lineTo(sxp, ys); ctx.stroke();
                ctx.restore();
                const xl = Math.max(wallL, sxp - r), xr = Math.min(wallR, sxp + r);
                ctx.strokeStyle = '#fff6b0'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(xl, ys); ctx.lineTo(xr, ys); ctx.stroke();
                ctx.strokeStyle = 'rgba(255,90,110,0.85)';
                if (xl > wallL) { ctx.beginPath(); ctx.moveTo(wallL, ys); ctx.lineTo(xl, ys); ctx.stroke(); }
                if (xr < wallR) { ctx.beginPath(); ctx.moveTo(xr, ys); ctx.lineTo(wallR, ys); ctx.stroke(); }

                const plate = 'rgba(8,18,24,0.82)';
                labelFit(ctx, `空氣 n = 1.00`, wallL + 6, 18, '#cfe9f2', 11, 'left', { clampW: w, plate });
                labelFit(ctx, `${snellMediumName(n)} n = ${n.toFixed(2)}`, wallL + 6, yb - 8, '#cfe9f2', 11, 'left', { clampW: w, plate });
                labelFit(ctx, `出光範圍 2r（θ < θc）`, sxp, ys - 8, '#fff6b0', 11, 'center', { clampW: w, plate });
                if (xr < wallR - 60) labelFit(ctx, '全反射', (xr + wallR) / 2, ys - 8, '#ff9aa8', 11, 'center', { clampW: w, plate });
                labelFit(ctx, `h = ${p.depth} cm`, sxp - 20, syp + 4, '#ffffff', 10, 'right', { clampW: w, plate });
                labelFit(ctx, `θc = ${deg(thc).toFixed(1)}°`, sxp + 20, syp + 4, '#ffffff', 10, 'left', { clampW: w, plate });
                labelWrap(ctx, '顏色只用來分辨方向　白點是光脈衝：水中較密、空氣中較疏（光速 c/n）',
                    wallL, h - 22, 'rgba(207,233,242,0.85)', 10, 13, w - 2 * wallL);
            },

            /* ---------- 斯涅爾窗 ---------- */
            drawWindow: (ctx, w, h, p, t) => {
                const n = Number(p.nw), thc = Math.asin(1 / n);
                const L = snellWindowLayout(w, h);
                const sec = L.sec, V = L.view;
                const d = p.eyeD, r = d * Math.tan(thc);
                const ocean = p.scene === 'ocean';
                const bx = p.objX, bz = SNELL_BALL.z, br = SNELL_BALL.r;

                /* 側視圖 —— 等比例尺：水平 x（m）、垂直深度 z（m） */
                const xmin = -Math.max(r * 1.18 + 0.3, 1.7), xmax = Math.max(r * 1.18 + 0.3, bx + br + 0.4);
                const skyH = Math.round(sec.h * 0.30);
                const s = Math.min(sec.w / (xmax - xmin), (sec.h - skyH - 10) / SNELL_POOL_H);
                const X = (x) => sec.x + (x - xmin) * s + (sec.w - (xmax - xmin) * s) / 2;
                const ys = sec.y + skyH;
                const Z = (z) => ys - z * s;                     // z 向上為正，水面 z = 0
                const yFloor = Z(-SNELL_POOL_H);
                ctx.save();
                ctx.beginPath(); ctx.rect(sec.x, sec.y, sec.w, sec.h); ctx.clip();
                const skyG = ctx.createLinearGradient(0, sec.y, 0, ys);
                skyG.addColorStop(0, '#d7ecf7'); skyG.addColorStop(1, '#f4fafc');
                ctx.fillStyle = skyG; ctx.fillRect(sec.x, sec.y, sec.w, skyH);
                const wG = ctx.createLinearGradient(0, ys, 0, sec.y + sec.h);
                wG.addColorStop(0, ocean ? '#2b6e8f' : '#7cc9d4'); wG.addColorStop(1, ocean ? '#071d2e' : '#4fa9b8');
                ctx.fillStyle = wG; ctx.fillRect(sec.x, ys, sec.w, sec.h - skyH);
                if (!ocean) {
                    ctx.fillStyle = '#e9f6f6'; ctx.fillRect(sec.x, yFloor, sec.w, sec.y + sec.h - yFloor);
                    ctx.strokeStyle = 'rgba(18,49,58,0.35)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(sec.x, yFloor); ctx.lineTo(sec.x + sec.w, yFloor); ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(18,49,58,0.55)'; ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.moveTo(sec.x, ys); ctx.lineTo(sec.x + sec.w, ys); ctx.stroke();

                const ex = X(0), ey = Z(-d);
                // 看得到天空的圓錐（斯涅爾窗）
                ctx.fillStyle = 'rgba(255,236,150,0.32)';
                ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(X(-r), ys); ctx.lineTo(X(r), ys); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = 'rgba(107,70,193,0.85)'; ctx.lineWidth = 1.3;
                // 窗緣的極限光路：空氣側沿水面（與法線成 90°），水中與法線成 θc。
                [[sec.x, X(-r)], [sec.x + sec.w, X(r)]].forEach(([edgeX, hx]) => {
                    ctx.beginPath();
                    ctx.moveTo(edgeX, ys);
                    ctx.lineTo(hx, ys); ctx.lineTo(ex, ey); ctx.stroke();
                });
                dashed(ctx, ex, ey, ex, ys, 'rgba(18,49,58,0.5)');
                // 窗的寬度標尺
                ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(X(-r), ys); ctx.lineTo(X(r), ys); ctx.stroke();

                // 陽光：從 −x 方向的天空照下，在水面折射後進入眼睛
                const e = rad(p.sun);
                const aSun = Math.asin(Math.cos(e) / n);
                const hxSun = X(-d * Math.tan(aSun));
                const dirx = Math.cos(e), diry = Math.sin(e);   // 光前進方向（向右下）
                let tBack = (ys - sec.y) / diry;
                if (dirx > 1e-6) tBack = Math.min(tBack, (hxSun - sec.x) / dirx);
                const sunX0 = hxSun - dirx * tBack, sunY0 = ys - diry * tBack;
                ctx.strokeStyle = '#e0a400'; ctx.lineWidth = 2.4;
                ctx.beginPath(); ctx.moveTo(sunX0, sunY0); ctx.lineTo(hxSun, ys); ctx.stroke();
                arrow(ctx, hxSun, ys, ex + (hxSun - ex) * 0.25, ey + (ys - ey) * 0.25, '#e0a400', 2.4);
                ctx.fillStyle = '#ffc928';
                ctx.beginPath(); ctx.arc(sunX0 + dirx * 8, sunY0 + diry * 8, 6, 0, Math.PI * 2); ctx.fill();

                // 浮球與它在水面的倒影（虛像位於水面上方對稱處）
                const bX = X(bx), bY = Z(-bz), bR = br * s;
                const xm = bx * d / (d + bz);                 // 反射點
                const aImg = Math.atan(bx / (d + bz));
                const tir = aImg > thc;
                const Rimg = fresnelR(n, 1, Math.cos(aImg));
                ctx.save();
                if (!tir) ctx.setLineDash([4, 4]);
                ctx.strokeStyle = C.rose; ctx.globalAlpha = 0.35 + 0.65 * Rimg; ctx.lineWidth = 1.8;
                ctx.beginPath(); ctx.moveTo(bX, bY); ctx.lineTo(X(xm), ys); ctx.lineTo(ex, ey); ctx.stroke();
                ctx.restore();
                arrow(ctx, X(xm) + (ex - X(xm)) * 0.55, ys + (ey - ys) * 0.55, X(xm) + (ex - X(xm)) * 0.62, ys + (ey - ys) * 0.62, C.rose, 1.8);
                dashed(ctx, X(xm), ys, bX, Z(bz), 'rgba(194,38,74,0.45)');
                ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(194,38,74,0.6)'; ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.arc(bX, Z(bz), bR, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
                ctx.fillStyle = '#e8463a'; ctx.beginPath(); ctx.arc(bX, bY, bR, 0, Math.PI * 2); ctx.fill();

                // 眼睛
                ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.ellipse(ex, ey, 9, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(ex, ey - 1.5, 3, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                // 側視圖文字
                const lp = 'rgba(255,255,255,0.84)';
                labelFit(ctx, `${snellMediumName(n)} n=${n.toFixed(2)}（上方空氣）`, sec.x + 6, Math.min(yFloor, sec.y + sec.h) - 7, C.blue, 11, 'left', { clampW: w, plate: lp, maxW: sec.w * 0.55 });
                labelFit(ctx, '陽光', sunX0 + dirx * 8 + 9, Math.max(sec.y + 13, sunY0 + diry * 8 - 4), '#9a6c00', 11, 'left', { clampW: w, plate: lp });
                labelFit(ctx, `2r`, ex, ys - 7, '#8a6400', 11, 'center', { clampW: w, plate: lp });
                labelFit(ctx, 'd', ex + 5, (ys + ey) / 2 + 4, C.ink, 11, 'left', { clampW: w });
                labelFit(ctx, `θc`, ex - 6, ey - 16, C.violet, 11, 'right', { clampW: w });
                const imgRight = bX + bR + 36 < sec.x + sec.w;
                labelFit(ctx, '倒影', imgRight ? bX + bR + 4 : bX - bR - 4, Z(bz) + 4, C.rose, 11, imgRight ? 'left' : 'right', { clampW: w, plate: lp });

                /* 仰望影像 */
                const N = Math.max(120, Math.min(300, Math.round(V.s * Math.min(2, window.devicePixelRatio || 1) * 0.8)));

                const off = getOffscreen(N, N);

                const aS = deg(Math.asin(Math.cos(rad(p.sun)) / n));
                const sx0 = vcx - aS / SNELL_FOV * vR, bloomR = V.s * (0.07 + 0.05 * Math.max(0, (20 - p.sun) / 20));
                const warmB = Math.max(0, Math.min(1, (16 - p.sun) / 12));
                const bg = ctx.createRadialGradient(sx0, vcy, 0, sx0, vcy, bloomR);
                bg.addColorStop(0, `rgba(255,${Math.round(250 - 60 * warmB)},${Math.round(225 - 130 * warmB)},0.95)`);
                bg.addColorStop(0.35, `rgba(255,${Math.round(230 - 70 * warmB)},${Math.round(170 - 100 * warmB)},0.45)`);

                ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(sx0, vcy, bloomR, 0, Math.PI * 2); ctx.fill();
                const rW = deg(thc) / SNELL_FOV * vR;
                ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.arc(vcx, vcy, rW, 0, Math.PI * 2); ctx.stroke();
                ctx.restore();
                const vp = 'rgba(6,14,20,0.72)';
                labelFit(ctx, `仰望影像（魚眼 ${2 * SNELL_FOV}°）`, V.x + 4, V.y + 14, '#e9f5f8', 10, 'left', { clampW: w, plate: vp, maxW: V.s * 0.6 });
                labelFit(ctx, `窗緣＝地平線（${deg(thc).toFixed(1)}°）`, vcx, vcy - rW - 6, '#ffffff', 10, 'center', { clampW: w, plate: vp, maxW: V.s - 20 });
                labelFit(ctx, ocean ? '窗外：全反射映出幽暗深水' : '窗外：全反射映出池底與浮球',
                    vcx, Math.min(V.y + V.s - 8, vcy + (rW + vR) / 2 + 4), '#ffffff', 10, 'center', { clampW: w, plate: vp, maxW: V.s - 20 });
            }
        };

        /* 9b. 視深：岸上看水中、斜看、水中看岸上、多層介質 ------------------- */
        /* 所有像點都由「真實折射光線的反向延長線交點」求得，不是直接代公式畫上去：
         *   兩條從物體出發、進入眼睛的相鄰光線，各自依司乃耳定律折射，
         *   在觀察者所在介質中反向延長，交點就是眼睛看到的像。
         * 近乎正上方時交點與 h' = h·n'/n 一致；斜看時交點才會偏離公式。 */
        const DEPTH_MEDIA = { '1.33': '水', '1.5': '玻璃', '2.42': '鑽石' };
        const depthMedium = (n) => DEPTH_MEDIA[String(n)] || '介質';
        const depthWindow = (p) => p.tank === 'home' ? '玻璃' : p.tank === 'custom' ? (p.ng >= 1.505 ? '玻璃' : '壓克力') : '壓克力';
        function depthFish(ctx, x, y, size, dir, ghost) {
            ctx.save();
            ctx.translate(x, y); ctx.scale(dir, 1);
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size * 0.48, 0, 0, Math.PI * 2);
            ctx.moveTo(-size * 0.85, 0);
            ctx.lineTo(-size * 1.55, -size * 0.5); ctx.lineTo(-size * 1.55, size * 0.5); ctx.closePath();
            if (ghost) {
                ctx.setLineDash([4, 3]); ctx.strokeStyle = 'rgba(194,38,74,0.85)'; ctx.lineWidth = 1.5;
                ctx.fillStyle = 'rgba(194,38,74,0.10)'; ctx.fill(); ctx.stroke();
            } else {
                ctx.fillStyle = '#f08a24'; ctx.fill();
                ctx.strokeStyle = '#a4540a'; ctx.lineWidth = 1.2; ctx.stroke();
                ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(size * 0.55, -size * 0.1, size * 0.12, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

            if (ghost) ctx.setLineDash([4, 3]);

            ctx.moveTo(x - size, y - size * 0.45);
            ctx.quadraticCurveTo(x - size * 0.45, y - size * 0.6, x, y);

        function depthEye(ctx, x, y, look) {

            const dx = look === 'right' ? 2.5 : 0, dy = look === 'down' ? 1.8 : look === 'up' ? -1.8 : 0;
            ctx.save();
            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.ellipse(x, y, 11, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(x + dx, y + dy, 3.4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
        /* 在單調函數上二分求根（f(lo) 與 f(hi) 異號） */
        function depthSolve(f, lo, hi) {
            let flo = f(lo);
            for (let i = 0; i < 60; i++) {
                const mid = (lo + hi) / 2, fm = f(mid);
                if ((fm > 0) === (flo > 0)) { lo = mid; flo = fm; } else hi = mid;
            }
            return (lo + hi) / 2;
        }
        /* 兩條直線 P1 + t·d1 與 P2 + u·d2 的交點 */
        function depthIntersect(p1, d1, p2, d2) {
            const den = d1[0] * d2[1] - d1[1] * d2[0];
            if (Math.abs(den) < 1e-12) return null;
            const t = ((p2[0] - p1[0]) * d2[1] - (p2[1] - p1[1]) * d2[0]) / den;
            return [p1[0] + d1[0] * t, p1[1] + d1[1] * t];
        }
        /* 垂直尺寸線：左右各一條短橫線，中間文字放在 labelX */
        function depthBracket(ctx, x, y1, y2, color, dash) {
            ctx.save();
            if (dash) ctx.setLineDash([4, 3]);
            ctx.strokeStyle = color; ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(x, y1); ctx.lineTo(x, y2);
            ctx.moveTo(x - 5, y1); ctx.lineTo(x + 5, y1);
            ctx.moveTo(x - 5, y2); ctx.lineTo(x + 5, y2);
            ctx.stroke();
            ctx.restore();
        }

        /* ---- 光束（兩條光線）求解：座標以公尺計，y 向上為正，水面為 y = 0 ----
         * 物點 O 發出的光進入眼睛 E 的瞳孔上、下兩緣 P±（垂直於視線、相距 2a）。
         * 每條光線都是真實光路；把眼睛端的那一段反向延長，兩線交點就是看到的像。 */
        function depthCross(O, nO, P, nP) {
            // O、P 在水面兩側：求折射點 S=(xs,0)，滿足 nO·sinθO = nP·sinθP
            if (Math.abs(O[0] - P[0]) < 1e-9) return O[0];
            const f = (xs) => nO * (xs - O[0]) / Math.hypot(xs - O[0], O[1]) - nP * (P[0] - xs) / Math.hypot(P[0] - xs, P[1]);
            let lo = Math.min(O[0], P[0]), hi = Math.max(O[0], P[0]);
            for (let i = 0; i < 64; i++) {
                const mid = (lo + hi) / 2;
                if (f(mid) > 0) hi = mid; else lo = mid;
            }
            return (lo + hi) / 2;
        }
        const depthNorm = (v) => { const L = Math.hypot(v[0], v[1]) || 1; return [v[0] / L, v[1] / L]; };
        function depthPencil(O, E, nWater, a, kind) {
            // kind: 'auto'（直接或折射）或 'mirror'（水面反射）
            const nOf = (pt) => (pt[1] < 0 ? nWater : 1);
            const nO = nOf(O), nE = nOf(E);
            const edges = (dir) => {
                const u = [-dir[1], dir[0]];
                return [[E[0] + u[0] * a, E[1] + u[1] * a], [E[0] - u[0] * a, E[1] - u[1] * a]];
            };
            if (kind === 'mirror') {
                const Om = [O[0], -O[1]];                     // 平面鏡的虛像
                const hit = (P) => { const k = Om[1] / (Om[1] - P[1]); return [Om[0] + (P[0] - Om[0]) * k, 0]; };
                const S0 = hit(E);
                const rays = edges(depthNorm([E[0] - S0[0], E[1] - S0[1]])).map((P) => ({ pts: [O, hit(P), P], S: hit(P), P }));
                const cosi = Math.abs(E[1]) / Math.hypot(E[0] - S0[0], E[1]);
                return { type: 'mirror', rays, img: Om, S0, cosi, R: fresnelR(nE, nE === 1 ? nWater : 1, cosi) };
            }
            if ((O[1] < 0) === (E[1] < 0)) {
                const rays = edges(depthNorm([E[0] - O[0], E[1] - O[1]])).map((P) => ({ pts: [O, P], P }));
                return { type: 'direct', rays, img: O };
            }
            const S0 = [depthCross(O, nO, E, nE), 0];
            const rays = edges(depthNorm([E[0] - S0[0], E[1] - S0[1]])).map((P) => {
                const S = [depthCross(O, nO, P, nE), 0];
                return { pts: [O, S, P], S, P };
            });
            const d1 = depthNorm([rays[0].S[0] - rays[0].P[0], rays[0].S[1] - rays[0].P[1]]);
            const d2 = depthNorm([rays[1].S[0] - rays[1].P[0], rays[1].S[1] - rays[1].P[1]]);
            const img = depthIntersect(rays[0].S, d1, rays[1].S, d2) || O;
            return { type: 'refract', rays, img, S0 };
        }
        /* 畫布標籤避讓：已放的標籤外框記在 placed，重疊就往下挪 */
        function depthLabel(ctx, placed, text, x, y, color, w, align) {
            ctx.font = '11px Outfit, "Noto Sans TC", sans-serif';
            const tw = ctx.measureText(text).width;
            let left = align === 'right' ? x - tw : align === 'center' ? x - tw / 2 : x;
            left = Math.max(2, Math.min(left, w - tw - 2));
            const hMax = placed.hMax || Infinity;
            const hits = (yv) => placed.some((b) => left < b.x + b.w + 3 && left + tw + 3 > b.x && yv - 12 < b.y + 3 && yv + 3 > b.y - 12);
            // 依序嘗試 y、y+15、y−15、y+30…，並保持在畫布內
            let yy = Math.max(14, Math.min(y, hMax - 4));
            for (let k = 1; k <= 48 && hits(yy); k++) {
                const cand = y + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 14;
                if (cand >= 14 && cand <= hMax - 4) yy = cand;
            }
            placed.push({ x: left, y: yy, w: tw });
            labelFit(ctx, text, left, yy, color, 11, 'left', { clampW: w, plate: 'rgba(255,255,255,0.88)' });
        }

        /* ---- 視深評估練習：湖邊玩水 ----
         * 身體部位高度採常用人體比例（以身高 H 為 1）：膝 0.285、胯 0.47、肚臍 0.60、胸 0.72、肩 0.82、下巴 0.87、口鼻約 0.90。
         * 分區以這些位置為界；出題時避開分界 ±0.02，避免答案模稜兩可。 */
        const BODY_MARKS = [
            { key: 'knee', label: '膝', f: 0.285 }, { key: 'crotch', label: '胯', f: 0.47 }, { key: 'waist', label: '肚臍', f: 0.60 },
            { key: 'chest', label: '胸', f: 0.72 }, { key: 'shoulder', label: '肩', f: 0.82 }, { key: 'mouth', label: '口鼻', f: 0.90 }
        ];
        const BODY_ZONES = [
            { key: 'z0', label: '小腿（膝蓋以下）', max: 0.285 },
            { key: 'z1', label: '大腿（膝蓋到胯下）', max: 0.47 },
            { key: 'z2', label: '腰腹（胯下以上、胸口以下）', max: 0.66 },
            { key: 'z3', label: '胸口（肩膀以下）', max: 0.80 },
            { key: 'z4', label: '肩頸（肩膀到下巴）', max: 0.88 },
            { key: 'z5', label: '淹過口鼻（有溺水危險）', max: Infinity }
        ];
        const bodyZone = (r) => BODY_ZONES.find((z) => r < z.max);
        const LAKE_N = 4 / 3;
        function lakeQuestion() {
            const heights = [150, 160, 170, 180];
            // 先平均挑一個身體分區，再找符合的身高與視深，讓各種情況出現的機會相近
            const target = BODY_ZONES[Math.floor(Math.random() * BODY_ZONES.length)];
            for (let tries = 0; tries < 2000; tries++) {
                const H = heights[Math.floor(Math.random() * heights.length)];
                const hp = 3 * (10 + Math.floor(Math.random() * 41));          // 看起來的深度：30–150 cm，3 的倍數
                const real = hp * LAKE_N;
                const r = real / H, rp = hp / H;
                if (r > 1.15) continue;
                const near = BODY_ZONES.slice(0, -1).some((z) => Math.abs(r - z.max) < 0.02);
                if (near || (tries < 1500 && bodyZone(r) !== target)) continue;
                // 多數題目刻意讓「以為的位置」與「實際位置」落在不同區，凸顯錯覺
                if (target.key !== 'z0' && bodyZone(r) === bodyZone(rp) && Math.random() < 0.75) continue;
                return numQ({ H, hp, real, r, rp });
            }
            return numQ({ H: 160, hp: 90, real: 120, r: 0.75, rp: 0.5625 });
        }
        function numQ(q) {
            const zone = bodyZone(q.r), illusion = bodyZone(q.rp);
            return Object.assign(q, { kind: 'num', zone, illusion, answerKey: zone.key, choices: BODY_ZONES,
                realLabel: zone.label, appLabel: illusion.label });
        }
        /* 用生活物品估：一般人是拿熟悉的東西比高度，例如「湖水看起來大概有一張課桌那麼深」。
         * 物品高度為常見的大約值；實際水位依身高而不同，出題時避開身體分區交界 ±0.02。 */
        const LAKE_OBJECTS = [
            { key: 'shoe', label: '一隻運動鞋', cm: 12 },
            { key: 'bottle', label: '一瓶 1.5 公升寶特瓶', cm: 30 },
            { key: 'stool', label: '椅子的座面', cm: 45 },
            { key: 'desk', label: '一張課桌', cm: 75 },
            { key: 'counter', label: '廚房流理台', cm: 85 },
            { key: 'washer', label: '一台直立式洗衣機', cm: 100 },
            { key: 'fridge', label: '一台雙門冰箱', cm: 150 }
        ];
        const lakeObjectWidth = (key, hpx) => ({ shoe: Math.max(18, hpx * 2.4), bottle: hpx * 0.3, stool: hpx * 0.9, desk: hpx * 1.0,
            counter: hpx * 0.9, washer: hpx * 0.68, fridge: hpx * 0.48 })[key] || hpx * 0.5;
        function objQuestion() {
            const heights = [150, 160, 170, 180];
            for (let tries = 0; tries < 500; tries++) {
                const obj = LAKE_OBJECTS[Math.floor(Math.random() * LAKE_OBJECTS.length)];
                const H = heights[Math.floor(Math.random() * heights.length)];
                const hp = obj.cm, real = hp * LAKE_N, r = real / H, rp = hp / H;
                if (BODY_ZONES.slice(0, -1).some((z) => Math.abs(r - z.max) < 0.02)) continue;
                const zone = bodyZone(r), illusion = bodyZone(rp);
                return { kind: 'obj', obj, H, hp, real, r, rp, zone, illusion, answerKey: zone.key, choices: BODY_ZONES,
                    realLabel: zone.label, appLabel: obj.label };
            }
            const obj = LAKE_OBJECTS[3];
            return { kind: 'obj', obj, H: 160, hp: 75, real: 100, r: 0.625, rp: 75 / 160, zone: bodyZone(0.625), illusion: bodyZone(75 / 160),
                answerKey: bodyZone(0.625).key, choices: BODY_ZONES, realLabel: bodyZone(0.625).label, appLabel: obj.label };
        }
        /* 生活物品的簡圖：底部中心在 (x, yB)，高度 hpx */
        function drawLakeObject(ctx, key, x, yB, hpx, style) {
            const st = style || {};
            ctx.save();
            ctx.strokeStyle = st.color || '#5a4632'; ctx.fillStyle = st.fill || 'rgba(160,120,80,0.35)'; ctx.lineWidth = 1.6;
            if (st.dash) ctx.setLineDash([4, 3]);
            const yT = yB - hpx;
            if (key === 'shoe') {
                const w = Math.max(18, hpx * 2.4);
                ctx.beginPath(); ctx.moveTo(x - w / 2, yB); ctx.lineTo(x + w / 2, yB); ctx.lineTo(x + w / 2, yB - hpx * 0.45);
                ctx.quadraticCurveTo(x + w * 0.2, yB - hpx * 0.5, x, yT); ctx.lineTo(x - w / 2, yT); ctx.closePath(); ctx.fill(); ctx.stroke();

                const w = hpx * 0.3;
                ctx.beginPath(); ctx.moveTo(x - w / 2, yB); ctx.lineTo(x - w / 2, yB - hpx * 0.72); ctx.lineTo(x - w * 0.18, yB - hpx * 0.9);
                ctx.lineTo(x - w * 0.18, yT); ctx.lineTo(x + w * 0.18, yT); ctx.lineTo(x + w * 0.18, yB - hpx * 0.9); ctx.lineTo(x + w / 2, yB - hpx * 0.72);
                ctx.lineTo(x + w / 2, yB); ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (key === 'stool' || key === 'desk') {
                const w = lakeObjectWidth(key, hpx), t = Math.max(3, hpx * 0.07);
                ctx.fillRect(x - w / 2, yT, w, t); ctx.strokeRect(x - w / 2, yT, w, t);
                ctx.beginPath(); ctx.moveTo(x - w / 2 + 4, yT + t); ctx.lineTo(x - w / 2 + 4, yB); ctx.moveTo(x + w / 2 - 4, yT + t); ctx.lineTo(x + w / 2 - 4, yB); ctx.stroke();
            } else if (key === 'counter') {
                const w = hpx * 0.9;
                ctx.fillRect(x - w / 2, yT, w, hpx); ctx.strokeRect(x - w / 2, yT, w, hpx);
                ctx.beginPath(); ctx.moveTo(x, yT + hpx * 0.08); ctx.lineTo(x, yB); ctx.moveTo(x - w / 2, yT + hpx * 0.08); ctx.lineTo(x + w / 2, yT + hpx * 0.08); ctx.stroke();
            } else if (key === 'fridge') {
                const w = lakeObjectWidth(key, hpx);
                ctx.fillRect(x - w / 2, yT, w, hpx); ctx.strokeRect(x - w / 2, yT, w, hpx);
                ctx.beginPath(); ctx.moveTo(x - w / 2, yT + hpx * 0.32); ctx.lineTo(x + w / 2, yT + hpx * 0.32);
                ctx.moveTo(x + w / 2 - 6, yT + hpx * 0.12); ctx.lineTo(x + w / 2 - 6, yT + hpx * 0.24);

                ctx.beginPath(); ctx.arc(x, yT + hpx * 0.55, w * 0.3, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - w / 2, yT + hpx * 0.18); ctx.lineTo(x + w / 2, yT + hpx * 0.18); ctx.stroke();
            } else {
                ctx.restore(); drawPerson(ctx, x, yB, hpx, { color: st.color || '#5a4632', fill: st.fill, dash: st.dash }); return;
            }
            ctx.restore();
        }
        /* 「水到胸口」／「淹過口鼻」：後者本身已有動詞，不再加「水到」 */

            ctx.moveTo(x + sw, y(0.82)); ctx.lineTo(x + sw * 1.1, y(0.47));

            /* 動畫：① 光脈衝沿真實光路從物體走到眼睛；② 再由眼睛沿進入方向直線反推到像。
             * fwd / back 是折線陣列（每條為 [[x,y],...]），cap 為說明文字的位置。 */
            animate: (ctx, w, t, fwd, back, cap) => {
                const T = 3.2, u = (((t % T) + T) % T) / T;
                const len = (pts) => { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; };
                const trace = (pts, f, color, glow) => {
                    const total = len(pts); let left = total * Math.max(0, Math.min(1, f));
                    ctx.save(); ctx.lineCap = 'round';
                    ctx.strokeStyle = glow; ctx.lineWidth = 6; ctx.globalAlpha = 0.55;
                    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
                    let tip = pts[0];
                    for (let i = 1; i < pts.length && left > 0; i++) {
                        const a = pts[i - 1], b = pts[i], sl = Math.hypot(b[0] - a[0], b[1] - a[1]);
                        const k = Math.min(1, left / (sl || 1));
                        tip = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
                        ctx.lineTo(tip[0], tip[1]); left -= sl;
                    }
                    ctx.stroke(); ctx.restore();
                    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = color; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(tip[0], tip[1], 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                };
                const plate = 'rgba(255,255,255,0.9)';
                if (u < 0.6) {
                    fwd.forEach((pts) => trace(pts, u / 0.6, '#d48a00', 'rgba(255,214,90,0.9)'));
                    labelFit(ctx, cap[3] || '① 光從物體出發，折射後進入眼睛', cap[0], cap[1], '#8a5a00', 11, cap[2], { clampW: w, plate });
                } else {
                    back.forEach((pts) => trace(pts, (u - 0.6) / 0.4, C.rose, 'rgba(194,38,74,0.35)'));
                    labelFit(ctx, cap[4] || '② 眼睛沿進入的方向直線反推 → 看到像', cap[0], cap[1], C.rose, 11, cap[2], { clampW: w, plate });
                }
            },

            /* ---- 物理：每個模式回傳畫圖與讀數共用的幾何量 ---- */
            above: (p, eyeHalfCm, eyeUpCm) => {
                const n = Number(p.nw), h = p.h;
                // 兩條邊緣光線的水中角 α：恰好打到眼睛（寬 2·eyeHalf）的左右緣
                const reach = (a) => h * Math.tan(a) + eyeUpCm * Math.tan(Math.asin(n * Math.sin(a))) - eyeHalfCm;
                const a = depthSolve(reach, 0, Math.asin(1 / n) - 1e-4);
                const th = Math.asin(n * Math.sin(a));
                const xs = h * Math.tan(a);
                const hImg = xs / Math.tan(th);            // 反向延長線與鉛直線的交點深度
                return { n, h, a, th, xs, hImg, hFormula: h / n };
            },
            below: (p, eyeHalfCm, eyeDownCm) => {
                const n = Number(p.nw), H = p.hb;
                const reach = (th) => H * Math.tan(th) + eyeDownCm * Math.tan(Math.asin(Math.sin(th) / n)) - eyeHalfCm;
                const th = depthSolve(reach, 0, Math.PI / 2 - 1e-3);
                const a = Math.asin(Math.sin(th) / n);
                const xs = H * Math.tan(th);
                const HImg = xs / Math.tan(a);
                return { n, H, th, a, xs, HImg, HFormula: n * H };
            },
            /* 斜看：池邊眼睛在 (0, eyeH)，池底物體在 (X, −D)；回傳真實光路與像點 */
            obliqueTrace: (X, D, eyeH, n) => {
                if (X < 1e-3) return { xs: 0, a: 0, th: 0, img: [0, -D / n] };
                const f = (xs) => n * (X - xs) / Math.hypot(X - xs, D) - xs / Math.hypot(xs, eyeH);
                const xs = depthSolve(f, 0, X);
                const a = Math.atan((X - xs) / D), th = Math.asin(Math.min(1, n * Math.sin(a)));
                // 相鄰光線：水中角 a + δ，從同一個物點出發
                const ray = (aa) => {
                    const x0 = X - D * Math.tan(aa), tt = Math.asin(Math.min(0.999999, n * Math.sin(aa)));
                    return { p: [x0, 0], d: [Math.sin(tt), -Math.cos(tt)] };   // 反向延長（往水下）
                };
                const da = 1e-4, r1 = ray(a), r2 = ray(a + da);
                const img = depthIntersect(r1.p, r1.d, r2.p, r2.d) || [xs, -D / n];
                return { xs, a, th, img };
            },
            obliqueN: 1.33,
            /* 水族箱：水中角 a 的光線依序經 水 → 窗 → 空氣；n_w·sin a ≥ 1 時在外壁全反射 */
            layers: (p, a) => {
                const nw = 1.33, ng = p.ng, t = p.t, d = p.d;
                const b = Math.asin(nw * Math.sin(a) / ng);
                const sAir = nw * Math.sin(a);
                const tir = sAir >= 1;
                const g = tir ? null : Math.asin(sAir);
                const y1 = d * Math.tan(a), y0 = y1 + t * Math.tan(b);
                return { nw, ng, t, d, a, b, g, y1, y0, tir,
                    imgGlass: y1 / Math.tan(b),                   // 第一面成像：距內壁（在窗材中看）
                    imgAir: tir ? null : y0 / Math.tan(g),        // 最終像：距外壁
                    fGlass: d * ng / nw, fAir: t / ng + d / nw };
            },

                        { label: '水面在身高的', value: shown ? `${Math.round(q.r * 100)}%：${toWhere(q.realLabel)}` : '作答後揭曉' }
                    ];
                    return [
                        { label: '身高', value: `${q.H} cm` },
                        { label: '看起來的深度 h′', value: `${q.hp} cm` },
                        { label: '實際深度 h', value: shown ? `${q.real.toFixed(0)} cm` : '作答後揭曉' },
                        { label: '水面在身高的', value: shown ? `${Math.round(q.r * 100)}%：${toWhere(q.zone.label)}` : '作答後揭曉' }
                    ];
                }
                if (p.mode === 'stack' && p.stackDir !== 'depth') {
                    const ns = L.stackNs(p), ts = L.stackTs(p), info = L.stackTirInfo(ns);
                    const tr = L.stackTirTrace(ns, ts, rad(p.th1s));
                    const poss = info.map((it, j) => it.possible ? '(' + 'ABCDE'[j] + ')' : null).filter(Boolean);
                    return [
                        { label: '守恆量 n₁·sinθ₁', value: tr.k.toFixed(3) },
                        { label: '這條光線', value: tr.tirAt === null ? '穿過所有界面，從最下層射出' : `在 (${'ABCDE'[tr.tirAt]}) 全反射，回到最上層` },
                        { label: '可能全反射的界面', value: p.tirHints === true ? (poss.length ? poss.join('、') : '沒有') : '勾選「顯示各界面判斷」後顯示' },
                        { label: '判斷法', value: p.tirHints === true ? '下方的 n 小於上方「每一層」的 n' : '先調 θ₁ 自己找找看' }
                    ];

                    const ns = L.stackNs(p), ts = L.stackTs(p);
                    const total = ts.reduce((a, v) => a + v, 0), app = ns.reduce((a, n, i) => a + ts[i] / n, 0);
