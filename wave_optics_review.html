            readouts: (p) => [
                { label: '波速 v = fλ', value: `${(p.f * p.lam).toFixed(2)} cm/s` },
                { label: '週期 T = 1/f', value: `${(1 / p.f).toFixed(2)} s` },
                { label: '質點最大速率', value: `${(2 * Math.PI * p.f * p.A).toFixed(2)} cm/s` },
                { label: '波形前進方向', value: '+x（向右）' }
            ],
            draw: (ctx, w, h, p, t) => {
                const mid = h * 0.52;
                const scaleX = (w - 22) / 32;     // 32 cm 對應畫布可用寬度
                const scaleY = 26;                // 1 cm 對應 26 px
                axis(ctx, 10, mid, w - 10, mid);
                for (let x = 0; x <= 32; x += 4) {
                    dashed(ctx, 10 + x * scaleX, mid - 70, 10 + x * scaleX, mid + 70, 'rgba(18,49,58,0.06)');
                    label(ctx, `${x}`, 10 + x * scaleX, h - 8, C.muted, 10, 'center');
                }

                const k = 2 * Math.PI / p.lam;
                const omega = 2 * Math.PI * p.f;
                const yAt = (xcm) => p.A * Math.sin(k * xcm - omega * t);

                ctx.strokeStyle = C.blue; ctx.lineWidth = 2.4; ctx.beginPath();
                for (let i = 0; i <= 320; i++) {
                    const xcm = i / 10;
                    const X = 10 + xcm * scaleX;
                    const Y = mid - yAt(xcm) * scaleY;
                    i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
                }
                ctx.stroke();

                // 觀察質點
                const X = 10 + p.px * scaleX;
                const Y = mid - yAt(p.px) * scaleY;
                dashed(ctx, X, mid - 75, X, mid + 75, 'rgba(201,117,15,0.4)');
                ctx.fillStyle = C.orange;
                ctx.beginPath(); ctx.arc(X, Y, 6, 0, Math.PI * 2); ctx.fill();

                // 質點速度方向（對時間微分）
                const vy = -p.A * omega * Math.cos(k * p.px - omega * t);
                if (Math.abs(vy) > 0.05) {
                    arrow(ctx, X, Y, X, Y - Math.sign(vy) * 26, C.orange, 2);
                }
                label(ctx, '質點只上下振動', X + 10, Y - 12, C.orange, 11);

                // 波形移動方向
                arrow(ctx, w - 120, mid - 88, w - 40, mid - 88, C.blue, 2);
                label(ctx, '波形前進', w - 118, mid - 96, C.blue, 11);
                label(ctx, 'x (cm)', w - 40, h - 8, C.muted, 10);

                // 標示波長
                const x0 = 10 + 2 * scaleX;
                ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(x0, mid + 88); ctx.lineTo(x0 + p.lam * scaleX, mid + 88);
                ctx.moveTo(x0, mid + 83); ctx.lineTo(x0, mid + 93);
                ctx.moveTo(x0 + p.lam * scaleX, mid + 83); ctx.lineTo(x0 + p.lam * scaleX, mid + 93);
                ctx.stroke();
                label(ctx, `λ = ${p.lam.toFixed(1)} cm`, x0 + p.lam * scaleX / 2, mid + 80, C.cyan, 11, 'center');
            }
        };

        /* 2. 繩波的反射與透射 --------------------------------------------- */
        LABS.reflection = {
            name: '繩波的反射與透射',
            tag: 'N03',
            hint: '一個脈衝波向右前進。切換端點條件，觀察反射波是否上下顛倒；切到兩段繩時，還會同時產生反射波與透射波。',
            note: '判斷口訣：對面接「重繩」等效於固定端（反射波上下顛倒），接「輕繩」等效於自由端（不顛倒）。透射波永遠不顛倒。',
            height: 260,
            modes: [
                { key: 'fixed', label: '固定端（牆）' },
                { key: 'free', label: '自由端（小環）' },
                { key: 'l2h', label: '輕繩 → 重繩' },
                { key: 'h2l', label: '重繩 → 輕繩' }
            ],
            controls: [
                { key: 'ratio', label: '兩段繩的線密度比 μ₂/μ₁', min: 2, max: 9, step: 1, value: 4, only: ['l2h', 'h2l'], fmt: (v) => `${v} : 1` }
            ],
            readouts: (p) => {
                const heavyRight = p.mode === 'l2h';
                if (p.mode === 'fixed') return [
                    { label: '反射波上下', value: '顛倒' }, { label: '反射波左右', value: '相反' },
                    { label: '振幅', value: '不變' }, { label: '波速', value: '不變' }];
                if (p.mode === 'free') return [
                    { label: '反射波上下', value: '不顛倒' }, { label: '反射波左右', value: '相反' },
                    { label: '端點最大高度', value: '約 2A' }, { label: '波速', value: '不變' }];
                const r = Math.sqrt(p.ratio);
                return [
                    { label: '反射波上下', value: heavyRight ? '顛倒' : '不顛倒' },
                    { label: '透射波波速', value: heavyRight ? `變慢（÷${r.toFixed(2)}）` : `變快（×${r.toFixed(2)}）` },
                    { label: '透射波波長', value: heavyRight ? '變短' : '變長' },
                    { label: '透射波頻率', value: '不變' }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const mid = h * 0.5;
                const cycle = 6;
                const tau = (t % cycle) / cycle;      // 0 → 1
                const bx = w * 0.62;                  // 界面位置
                const pulse = (x, center, width, amp) => amp * Math.exp(-Math.pow((x - center) / width, 2));
                const twoRope = (p.mode === 'l2h' || p.mode === 'h2l');
                const speedRatio = p.mode === 'l2h' ? 1 / Math.sqrt(p.ratio) : Math.sqrt(p.ratio);

                // 繩子底線與界面
                ctx.strokeStyle = 'rgba(18,49,58,0.15)'; ctx.lineWidth = twoRope ? 1 : 1;
                if (twoRope) {
                    ctx.lineWidth = p.mode === 'l2h' ? 1.2 : 3.2;
                    ctx.beginPath(); ctx.moveTo(10, mid + 62); ctx.lineTo(bx, mid + 62); ctx.stroke();
                    ctx.lineWidth = p.mode === 'l2h' ? 3.2 : 1.2;
                    ctx.beginPath(); ctx.moveTo(bx, mid + 62); ctx.lineTo(w - 10, mid + 62); ctx.stroke();
                    label(ctx, p.mode === 'l2h' ? '輕繩（μ 小、v 快）' : '重繩（μ 大、v 慢）', 14, mid + 78, C.muted, 11);
                    label(ctx, p.mode === 'l2h' ? '重繩（μ 大、v 慢）' : '輕繩（μ 小、v 快）', bx + 8, mid + 78, C.muted, 11);
                    dashed(ctx, bx, mid - 70, bx, mid + 66, C.rose);
                }
                axis(ctx, 10, mid, w - 10, mid);

                const A = 26;
                const width = 26;
                let center = 20 + tau * 2 * (bx - 30);
                let refCenter = null, transCenter = null;
                let refAmp = 0, transAmp = 0;

                if (center > bx - 10) {
                    const over = center - (bx - 10);
                    center = null;
                    if (twoRope) {
                        const rr = (Math.sqrt(p.ratio) - 1) / (Math.sqrt(p.ratio) + 1);
                        refCenter = bx - 10 - over;
                        refAmp = (p.mode === 'l2h' ? -1 : 1) * A * Math.abs(rr);
                        transCenter = bx - 10 + over * speedRatio;
                        transAmp = A * (1 - Math.abs(rr)) * (p.mode === 'h2l' ? 1.35 : 0.8);
                    } else {
                        refCenter = bx - 10 - over;
                        refAmp = (p.mode === 'fixed' ? -A : A);
                    }
                }

                ctx.strokeStyle = C.blue; ctx.lineWidth = 2.6; ctx.beginPath();
                const ropeEnd = twoRope ? (w - 10) : bx;
                for (let X = 10; X <= ropeEnd; X += 2) {
                    let y = 0;
                    if (center !== null && X <= bx) y += pulse(X, center, width, A);
                    if (refCenter !== null && X <= bx) y += pulse(X, refCenter, width, refAmp);
                    if (transCenter !== null && X >= bx) y += pulse(X, transCenter, width * speedRatio, transAmp);
                    const Y = mid - y;
                    X === 10 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
                }
                ctx.stroke();

                if (!twoRope) {
                    if (p.mode === 'fixed') {
                        ctx.fillStyle = 'rgba(18,49,58,0.18)';
                        ctx.fillRect(bx, mid - 62, 12, 124);
                        label(ctx, '固定端（牆）', bx + 16, mid - 50, C.rose, 11);
                    } else {
                        let ringY = mid;
                        if (center !== null) ringY = mid - pulse(bx, center, width, A);
                        if (refCenter !== null) ringY = mid - pulse(bx, refCenter, width, refAmp) - (center !== null ? 0 : 0);
                        ctx.strokeStyle = 'rgba(18,49,58,0.35)'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.moveTo(bx, mid - 62); ctx.lineTo(bx, mid + 62); ctx.stroke();
                        ctx.strokeStyle = C.rose; ctx.lineWidth = 2.4;
                        ctx.beginPath(); ctx.arc(bx, ringY, 7, 0, Math.PI * 2); ctx.stroke();
                        label(ctx, '自由端（可上下滑動的小環）', bx + 14, mid - 50, C.rose, 11);
                    }
                }

                if (center !== null) { arrow(ctx, center + 14, mid - 46, center + 44, mid - 46, C.blue, 1.8); }
                if (refCenter !== null) { arrow(ctx, refCenter + 14, mid - 46, refCenter - 16, mid - 46, C.violet, 1.8); label(ctx, '反射波', refCenter - 18, mid - 54, C.violet, 11); }
                if (transCenter !== null) { arrow(ctx, transCenter + 4, mid - 46, transCenter + 34, mid - 46, C.green, 1.8); label(ctx, '透射波', transCenter + 6, mid - 54, C.green, 11); }
            }
        };

        /* 3. 駐波的形成 ---------------------------------------------------- */
        LABS.standing = {
            name: '駐波的形成',
            tag: 'N04 / N10 / N12',
            hint: '上方兩條細線是行進方向相反的兩列波，下方粗線是它們的疊加結果。紅點為波節（永遠不動）、綠點為波腹（振幅兩倍）。',
            note: '兩端固定 ⇒ 兩端都是波節，$L = n\\lambda/2$；一端自由 ⇒ 該端是波腹，$L = m\\lambda/4$ 且 $m$ 只能是奇數。',
            height: 330,
            modes: [
                { key: 'both', label: '兩端固定（弦／開管）' },
                { key: 'one', label: '一端自由（閉管）' }
            ],
            controls: [
                { key: 'n', label: '諧音序號', min: 1, max: 6, step: 1, value: 3, fmt: (v, p) => (p.mode === 'one' ? `m = ${2 * v - 1}` : `n = ${v}`) },
                { key: 'L', label: '弦長／管長 L (m)', min: 0.5, max: 3, step: 0.1, value: 1.5, fmt: (v) => `${v.toFixed(1)} m` },
                { key: 'v', label: '波速 v (m/s)', min: 60, max: 400, step: 10, value: 340, fmt: (v) => `${v} m/s` }
            ],
            readouts: (p) => {
                const one = p.mode === 'one';
                const m = one ? 2 * p.n - 1 : p.n;
                const lam = one ? 4 * p.L / m : 2 * p.L / m;
                const f = p.v / lam;
                return [
                    { label: '波長 λ', value: `${lam.toFixed(3)} m` },
                    { label: '頻率 f', value: `${f.toFixed(1)} Hz` },
                    { label: '波節數', value: one ? `${(m + 1) / 2}` : `${m + 1}` },
                    { label: '波腹數', value: one ? `${(m + 1) / 2}` : `${m}` }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const one = p.mode === 'one';
                const m = one ? 2 * p.n - 1 : p.n;
                const x0 = 34, x1 = w - 34, span = x1 - x0;
                const topA = h * 0.20, topB = h * 0.36, main = h * 0.72;
                const A = 16, Amain = 30;
                // 波數：兩端固定 k = m*pi/L；一端自由 k = m*pi/(2L)
                const kUnit = one ? (m * Math.PI / 2) : (m * Math.PI);
                const omega = 2.2;

                label(ctx, '向右行進的波', x0, topA - 24, C.blue, 11);
                label(ctx, '向左行進的波（反射波）', x0, topB - 20, C.violet, 11);
                label(ctx, '疊加結果：駐波', x0, main - 62, C.cyan, 12);

                const drawWave = (yc, amp, dir, color, lw) => {
                    ctx.strokeStyle = color; ctx.lineWidth = lw;
                    ctx.beginPath();
                    for (let i = 0; i <= span; i += 2) {
                        const u = i / span;
                        const y = amp * Math.sin(kUnit * u - dir * omega * t);
                        i === 0 ? ctx.moveTo(x0 + i, yc - y) : ctx.lineTo(x0 + i, yc - y);
                    }
                    ctx.stroke();
                };
                axis(ctx, x0, topA, x1, topA); axis(ctx, x0, topB, x1, topB);
                drawWave(topA, A, 1, C.blue, 1.6);
                drawWave(topB, A, -1, C.violet, 1.6);

                // 駐波：2A sin(kx) cos(wt)
                axis(ctx, x0, main, x1, main);
                ctx.strokeStyle = 'rgba(14,139,147,0.22)'; ctx.lineWidth = 1.2;
                [1, -1].forEach((s) => {
                    ctx.beginPath();
                    for (let i = 0; i <= span; i += 2) {
                        const u = i / span;
                        const y = s * Amain * Math.sin(kUnit * u);
                        i === 0 ? ctx.moveTo(x0 + i, main - y) : ctx.lineTo(x0 + i, main - y);
                    }
                    ctx.stroke();
                });
                ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.8; ctx.beginPath();
                for (let i = 0; i <= span; i += 2) {
                    const u = i / span;
                    const y = Amain * Math.sin(kUnit * u) * Math.cos(omega * t);
                    i === 0 ? ctx.moveTo(x0 + i, main - y) : ctx.lineTo(x0 + i, main - y);
                }
                ctx.stroke();

                // 波節與波腹
                for (let j = 0; j * Math.PI <= kUnit + 1e-6; j++) {
                    const u = j * Math.PI / kUnit;
                    if (u > 1.0001) break;
                    ctx.fillStyle = C.rose;
                    ctx.beginPath(); ctx.arc(x0 + u * span, main, 4.5, 0, Math.PI * 2); ctx.fill();
                }
                for (let j = 0; (j + 0.5) * Math.PI <= kUnit + 1e-6; j++) {
                    const u = (j + 0.5) * Math.PI / kUnit;
                    if (u > 1.0001) break;
                    ctx.fillStyle = C.green;
                    ctx.beginPath(); ctx.arc(x0 + u * span, main, 4.5, 0, Math.PI * 2); ctx.fill();
                }

                // 端點標示
                ctx.fillStyle = 'rgba(18,49,58,0.2)';
                ctx.fillRect(x0 - 10, main - 46, 8, 92);
                if (one) {
                    ctx.strokeStyle = 'rgba(18,49,58,0.35)'; ctx.lineWidth = 2.4;
                    ctx.beginPath(); ctx.moveTo(x1 + 6, main - 46); ctx.lineTo(x1 + 6, main + 46); ctx.stroke();
                    label(ctx, '自由端（腹點）', x1 - 4, main + 62, C.green, 11, 'right');
                } else {
                    ctx.fillRect(x1 + 2, main - 46, 8, 92);
                    label(ctx, '固定端（節點）', x1 - 4, main + 62, C.rose, 11, 'right');
                }
                label(ctx, '固定端（節點）', x0 - 6, main + 62, C.rose, 11);
                label(ctx, `● 波節　● 波腹`, x0, h - 8, C.muted, 11);
            }
        };

        /* 4. 惠更斯原理與折射 ---------------------------------------------- */
        LABS.huygens = {
            name: '惠更斯原理與水波折射',
            tag: 'N05 / N06',
            hint: '上半部是深水區（波速快、波長長），下半部是淺水區（波速慢、波長短）。灰色小圓是波前上各點發出的子波，它們的包絡線就是新的波前。',
            note: '折射的唯一原因是波速改變。波速變慢 ⇒ 波長變短 ⇒ 折射線偏向法線；頻率則兩區完全相同。',
            height: 340,
            controls: [
                { key: 'th1', label: '入射角 θ₁', min: 5, max: 80, step: 1, value: 45, fmt: (v) => `${v}°` },
                { key: 'vr', label: '波速比 v₂/v₁', min: 0.3, max: 1.6, step: 0.05, value: 0.65, fmt: (v) => v.toFixed(2) },
                { key: 'lam', label: '深水區波長 λ₁ (px)', min: 20, max: 60, step: 2, value: 36, fmt: (v) => `${v}` }
            ],
            readouts: (p) => {
                const s2 = Math.sin(rad(p.th1)) * p.vr;
                const total = Math.abs(s2) > 1;
                return [
                    { label: '折射角 θ₂', value: total ? '全反射（無折射）' : `${deg(Math.asin(s2)).toFixed(1)}°` },
                    { label: 'λ₂ / λ₁ = v₂ / v₁', value: p.vr.toFixed(2) },
                    { label: 'sinθ₁ / sinθ₂', value: total ? '—' : (Math.sin(rad(p.th1)) / s2).toFixed(3) },
                    { label: '頻率', value: '兩區相同' }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const iy = h * 0.5;
                ctx.fillStyle = 'rgba(11,111,146,0.05)'; ctx.fillRect(0, 0, w, iy);
                ctx.fillStyle = 'rgba(201,117,15,0.06)'; ctx.fillRect(0, iy, w, h - iy);
                ctx.strokeStyle = C.rose; ctx.lineWidth = 1.6;
                ctx.beginPath(); ctx.moveTo(0, iy); ctx.lineTo(w, iy); ctx.stroke();
                label(ctx, `深水區　v₁（波長 ${p.lam} px）`, 12, 18, C.blue, 11);
                label(ctx, `淺水區　v₂ = ${p.vr.toFixed(2)} v₁`, 12, h - 12, C.orange, 11);

                const th1 = rad(p.th1);
                const s2 = Math.sin(th1) * p.vr;
                const total = Math.abs(s2) > 1;
                const th2 = total ? null : Math.asin(s2);
                const cx = w * 0.5;

                // 法線
                dashed(ctx, cx, 12, cx, h - 12, 'rgba(18,49,58,0.35)');
                label(ctx, '法線', cx + 6, 26, C.muted, 10);

                // 入射與折射波前（垂直於射線）
                const lam1 = p.lam, lam2 = p.lam * p.vr;
                const drawFronts = (angle, lam, region, color, phase) => {
                    // 射線方向單位向量
                    const dx = Math.sin(angle), dy = Math.cos(angle);
                    ctx.strokeStyle = color; ctx.lineWidth = 1.8;
                    for (let n = -8; n <= 8; n++) {
                        const s = n * lam + (phase % lam);
                        // 波前是通過點 (cx + dx*s, iy + dy*s*region) 且垂直於射線的直線
                        const px0 = cx + dx * s * (region > 0 ? 1 : -1) * (region > 0 ? 1 : 1);
                        const py0 = iy + dy * s * (region > 0 ? 1 : -1);
                        const ex = -dy, ey = dx;
                        const L = 420;
                        let ax = px0 - ex * L, ay = py0 - ey * L;
                        let bx2 = px0 + ex * L, by = py0 + ey * L;
                        ctx.save();
                        ctx.beginPath();
                        if (region > 0) ctx.rect(0, iy, w, h - iy); else ctx.rect(0, 0, w, iy);
                        ctx.clip();
                        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx2, by); ctx.stroke();
                        ctx.restore();
                    }
                };
                const phase = (t * 30) % 1000;
                drawFronts(th1, lam1, -1, 'rgba(11,111,146,0.75)', phase);
                if (!total) drawFronts(th2, lam2, 1, 'rgba(201,117,15,0.8)', phase * p.vr);

                // 惠更斯子波：界面上相隔 λ₁/sinθ₁ 的各點依序被波前掃過，
                // 早 n 個週期被掃過的點，其子波半徑為 n·λ₂ ⇒ 這些圓的公切線就是折射波前。
                if (!total) {
                    const faceStep = lam1 / Math.max(Math.sin(th1), 0.12);
                    ctx.strokeStyle = 'rgba(18,49,58,0.34)'; ctx.lineWidth = 1;
                    for (let n = 0; n <= 5; n++) {
                        const fx = cx - n * faceStep;
                        if (fx < 8) break;
                        ctx.save();
                        ctx.beginPath(); ctx.rect(0, iy, w, h - iy); ctx.clip();
                        ctx.beginPath(); ctx.arc(fx, iy, n * lam2, 0, Math.PI * 2); ctx.stroke();
                        ctx.restore();
                        ctx.fillStyle = 'rgba(18,49,58,0.5)';
                        ctx.beginPath(); ctx.arc(fx, iy, 2.4, 0, Math.PI * 2); ctx.fill();
                    }
                    label(ctx, '子波半徑 = n·λ₂，公切線即新波前', 12, iy + 34, C.muted, 10);
                }

                // 射線
                const inLen = 150;
                arrow(ctx, cx - Math.sin(th1) * inLen, iy - Math.cos(th1) * inLen, cx, iy, C.blue, 2.2);
                if (total) {
                    arrow(ctx, cx, iy, cx + Math.sin(th1) * 130, iy - Math.cos(th1) * 130, C.rose, 2.2);
                    label(ctx, '全反射', cx + Math.sin(th1) * 132, iy - Math.cos(th1) * 132, C.rose, 12);
                } else {
                    arrow(ctx, cx, iy, cx + Math.sin(th2) * 150, iy + Math.cos(th2) * 150, C.orange, 2.2);
                }

                // 角度弧
                ctx.strokeStyle = 'rgba(18,49,58,0.5)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(cx, iy, 44, -Math.PI / 2 - th1, -Math.PI / 2); ctx.stroke();
                label(ctx, `θ₁=${p.th1}°`, cx - 30 - Math.sin(th1) * 30, iy - 46, C.blue, 11, 'center');
                if (!total) {
                    ctx.beginPath(); ctx.arc(cx, iy, 44, Math.PI / 2 - th2, Math.PI / 2); ctx.stroke();
                    label(ctx, `θ₂=${deg(th2).toFixed(0)}°`, cx + 34 + Math.sin(th2) * 20, iy + 52, C.orange, 11, 'center');
                }
            }
        };

        /* 5. 水波槽雙點波源干涉 -------------------------------------------- */
        LABS.ripple = {
            name: '水波槽雙點波源干涉',
            tag: 'N07 / N19',
            hint: '兩個同相點波源產生的干涉圖樣。白色代表兩波峰重疊、黑色代表兩波谷重疊；灰色的靜止曲線就是節線。調整波源間距與波長，看腹線與節線的條數如何改變。',
            note: '兩波源連線上滿足駐波條件：相鄰節點間距 λ/2。同相波源的中垂線必為中央腹線，因此腹線總數必為奇數、節線總數必為偶數。',
            height: 340,
            controls: [
                { key: 'd', label: '波源間距 d (cm)', min: 2, max: 16, step: 0.5, value: 8, fmt: (v) => `${v.toFixed(1)} cm` },
                { key: 'lam', label: '波長 λ (cm)', min: 1, max: 6, step: 0.25, value: 2.5, fmt: (v) => `${v.toFixed(2)} cm` }
            ],
            readouts: (p) => {
                const nMax = Math.floor(p.d / p.lam);
                const mMax = Math.floor(p.d / p.lam + 0.5);
                return [
                    { label: 'd / λ', value: (p.d / p.lam).toFixed(2) },
                    { label: '腹線總數', value: `${2 * nMax + 1} 條` },
                    { label: '節線總數', value: `${2 * mMax} 條` },
                    { label: '連線上相鄰節點間距', value: `${(p.lam / 2).toFixed(2)} cm` }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const scale = w / 24;                 // 24 cm 對應畫布寬
                const cx = w / 2, cy = h / 2;
                const s1 = { x: cx - p.d * scale / 2, y: cy };
                const s2 = { x: cx + p.d * scale / 2, y: cy };
                const k = 2 * Math.PI / (p.lam * scale);
                const omega = 3.2;
                const step = 4;
                const img = ctx.createImageData(Math.ceil(w / step) * step, Math.ceil(h / step) * step);

                for (let y = 0; y < h; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const r1 = Math.hypot(x - s1.x, y - s1.y);
                        const r2 = Math.hypot(x - s2.x, y - s2.y);
                        const a1 = Math.cos(k * r1 - omega * t) / Math.sqrt(Math.max(r1, 18));
                        const a2 = Math.cos(k * r2 - omega * t) / Math.sqrt(Math.max(r2, 18));
                        const v = (a1 + a2) * 9;
                        const g = Math.max(0, Math.min(255, Math.round(146 + v * 120)));
                        for (let dy = 0; dy < step; dy++) {
                            for (let dx = 0; dx < step; dx++) {
                                const idx = (((y + dy) * img.width) + (x + dx)) * 4;
                                img.data[idx] = g * 0.86; img.data[idx + 1] = g * 0.95; img.data[idx + 2] = g;
                                img.data[idx + 3] = 255;
                            }
                        }
                    }
                }
                ctx.putImageData(img, 0, 0);

                // 節線（波程差 = 半波長奇數倍）以曲線疊畫
                const mMax = Math.floor(p.d / p.lam + 0.5);
                ctx.strokeStyle = 'rgba(194,38,74,0.55)'; ctx.lineWidth = 1.4;
                for (let m = 1; m <= mMax; m++) {
                    [-1, 1].forEach((sgn) => {
                        const c = p.d * scale / 2;
                        const a = sgn * (m - 0.5) * p.lam * scale / 2;
                        if (Math.abs(a) >= c) return;
                        const b2 = c * c - a * a;
                        ctx.beginPath();
                        let started = false;
                        for (let y = -h; y <= h; y += 3) {
                            const x = a * Math.sqrt(1 + (y * y) / b2);
                            const X = cx + x, Y = cy + y;
                            if (X < 0 || X > w) { started = false; continue; }
                            started ? ctx.lineTo(X, Y) : (ctx.moveTo(X, Y), started = true);
                        }
                        ctx.stroke();
                    });
                }
                // 中央腹線
                dashed(ctx, cx, 0, cx, h, 'rgba(18,128,92,0.8)');

                [s1, s2].forEach((s, i) => {
                    ctx.fillStyle = C.rose;
                    ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, Math.PI * 2); ctx.fill();
                    label(ctx, `S${i + 1}`, s.x - 6, s.y - 10, '#fff', 12);
                });
                ctx.fillStyle = 'rgba(255,255,255,0.82)';
                ctx.fillRect(6, 6, 250, 36);
                label(ctx, '－－ 中央腹線（中垂線）', 12, 20, '#0d6b4f', 11);
                label(ctx, '—— 節線（波程差為半波長的奇數倍）', 12, 36, '#a81a42', 11);
            }
        };

        /* 6. 縱波的疏密與波形 ---------------------------------------------- */
        LABS.longitudinal = {
            name: '縱波的疏密與波形',
            tag: 'N08 / N09',
            hint: '最上排是空氣分子的實際位置（縱向振動形成疏密）；中間是分子位移對位置的圖；最下是壓力變化圖。三張圖對照著看，就能理解位移與壓力為何差 λ/4。',
            note: '密部中央：位移 0、壓力最大、振動速率最大；疏部中央：位移 0、壓力最小；疏密之間：位移最大、壓力變化為 0、振動速率為 0。',
            height: 360,
            controls: [
                { key: 'lam', label: '波長 λ (px)', min: 60, max: 200, step: 5, value: 120, fmt: (v) => `${v}` },
                { key: 'A', label: '位移振幅 (px)', min: 4, max: 22, step: 1, value: 13, fmt: (v) => `${v}` }
            ],
            readouts: () => [
                { label: '密部中央', value: '位移 0、壓力最大' },
                { label: '疏部中央', value: '位移 0、壓力最小' },
                { label: '疏密之間', value: '位移最大、ΔP = 0' },
                { label: '位移圖與壓力圖', value: '相差 λ/4' }
            ],
            draw: (ctx, w, h, p, t) => {
                const rowMol = h * 0.16, rowDisp = h * 0.52, rowP = h * 0.86;
                const k = 2 * Math.PI / p.lam;
                const omega = 2.0;
                const disp = (x) => p.A * Math.sin(k * x - omega * t);

                // 分子
                for (let x = 6; x < w - 6; x += 9) {
                    for (let r = -1; r <= 1; r++) {
                        const X = x + disp(x);
                        ctx.fillStyle = 'rgba(18,49,58,0.55)';
                        ctx.beginPath(); ctx.arc(X, rowMol + r * 13, 2.1, 0, Math.PI * 2); ctx.fill();
                    }
                }
                label(ctx, '空氣分子的實際位置（縱波）', 10, rowMol - 26, C.ink, 12);

                // 位移圖
                axis(ctx, 10, rowDisp, w - 10, rowDisp);
                ctx.strokeStyle = C.blue; ctx.lineWidth = 2.2; ctx.beginPath();
                for (let X = 10; X <= w - 10; X += 2) {
                    const Y = rowDisp - disp(X);
                    X === 10 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
                }
                ctx.stroke();
                label(ctx, '位移 y – 位置 x（y > 0 代表分子向右）', 10, rowDisp - 34, C.blue, 12);

                // 壓力圖：ΔP ∝ -dy/dx，相位落後 λ/4
                axis(ctx, 10, rowP, w - 10, rowP);
                ctx.strokeStyle = C.rose; ctx.lineWidth = 2.2; ctx.beginPath();
                for (let X = 10; X <= w - 10; X += 2) {
                    const Y = rowP + p.A * Math.cos(k * X - omega * t);
                    X === 10 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
                }
                ctx.stroke();
                label(ctx, '壓力變化 ΔP – 位置 x', 10, rowP - 30, C.rose, 12);

                // 標出密部與疏部中央（ΔP 極值處）
                for (let n = -2; n < 12; n++) {
                    const X = ((omega * t / k) + (n * p.lam / 2)) % (w + p.lam);
                    if (X < 20 || X > w - 20) continue;
                    const isDense = Math.cos(k * X - omega * t) < -0.9;
                    const isRare = Math.cos(k * X - omega * t) > 0.9;
                    if (!isDense && !isRare) continue;
                    dashed(ctx, X, rowMol + 20, X, rowP + 26, isDense ? 'rgba(194,38,74,0.35)' : 'rgba(11,111,146,0.3)');
                    label(ctx, isDense ? '密部中央' : '疏部中央', X, rowMol + 34, isDense ? C.rose : C.blue, 10, 'center');
                }
            }
        };

        /* 7. 弦、開管與閉管的諧音 ------------------------------------------ */
        LABS.pipes = {
            name: '弦、開管與閉管的諧音',
            tag: 'N10 / N12',
            hint: '同一個長度 L、同一個波速 v，三種樂器能產生的諧音完全不同。切換樂器種類並調整諧音序號，比較駐波圖形、波長與頻率。',
            note: '閉管只有奇數諧音，且同長度時基頻只有開管的一半——這就是閉管聽起來低八度的原因。',
            height: 320,
            modes: [
                { key: 'string', label: '兩端固定的弦' },
                { key: 'open', label: '開管樂器' },
                { key: 'closed', label: '閉管樂器' }
            ],
            controls: [
                { key: 'idx', label: '第幾個可存在的諧音', min: 1, max: 5, step: 1, value: 2, fmt: (v, p) => (p.mode === 'closed' ? `m = ${2 * v - 1}` : `n = ${v}`) },
                { key: 'L', label: '長度 L (m)', min: 0.2, max: 2, step: 0.05, value: 0.6, fmt: (v) => `${v.toFixed(2)} m` },
                { key: 'v', label: '波速 v (m/s)', min: 100, max: 400, step: 10, value: 340, fmt: (v) => `${v} m/s` }
            ],
            readouts: (p) => {
                const closed = p.mode === 'closed';
                const m = closed ? 2 * p.idx - 1 : p.idx;
                const lam = closed ? 4 * p.L / m : 2 * p.L / m;
                const f = p.v / lam;
                const f1 = p.v / (closed ? 4 * p.L : 2 * p.L);
                return [
                    { label: '諧音名稱', value: `第 ${m} 諧音${p.idx === 1 ? '（基音）' : `（第 ${p.idx - 1} 泛音）`}` },
                    { label: '波長 λ', value: `${lam.toFixed(3)} m` },
                    { label: '頻率 f', value: `${f.toFixed(1)} Hz` },
                    { label: '基頻 f₁', value: `${f1.toFixed(1)} Hz` }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const closed = p.mode === 'closed';
                const isString = p.mode === 'string';
                const m = closed ? 2 * p.idx - 1 : p.idx;
                const x0 = 44, x1 = w - 44, span = x1 - x0;
                const mid = h * 0.5;
                const A = 44;
                const kUnit = closed ? (m * Math.PI / 2) : (m * Math.PI);
                const omega = 2.4;

                // 管壁 / 弦的端點
                if (isString) {
                    ctx.fillStyle = 'rgba(18,49,58,0.2)';
                    ctx.fillRect(x0 - 10, mid - 60, 8, 120);
                    ctx.fillRect(x1 + 2, mid - 60, 8, 120);
                } else {
                    ctx.strokeStyle = 'rgba(18,49,58,0.28)'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(x0, mid - 58); ctx.lineTo(x1, mid - 58);
                    ctx.moveTo(x0, mid + 58); ctx.lineTo(x1, mid + 58); ctx.stroke();
                    if (closed) { ctx.beginPath(); ctx.moveTo(x1, mid - 58); ctx.lineTo(x1, mid + 58); ctx.stroke(); }
                }

                // 駐波（位移振幅包絡）
                const phase = Math.cos(omega * t);
                ctx.strokeStyle = 'rgba(14,139,147,0.2)'; ctx.lineWidth = 1.2;
                [1, -1].forEach((s) => {
                    ctx.beginPath();
                    for (let i = 0; i <= span; i += 2) {
                        const u = i / span;
                        const shape = closed ? Math.sin(kUnit * u) : Math.sin(kUnit * u);
                        ctx.lineTo(x0 + i, mid - s * A * shape);
                    }
                    ctx.stroke();
                });
                ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.8; ctx.beginPath();
                for (let i = 0; i <= span; i += 2) {
                    const u = i / span;
                    ctx.lineTo(x0 + i, mid - A * Math.sin(kUnit * u) * phase);
                }
                ctx.stroke();

                // 節點與腹點
                for (let j = 0; j * Math.PI <= kUnit + 1e-6; j++) {
                    const u = j * Math.PI / kUnit;
                    if (u > 1.0001) break;
                    ctx.fillStyle = C.rose;
                    ctx.beginPath(); ctx.arc(x0 + u * span, mid, 4.5, 0, Math.PI * 2); ctx.fill();
                }
                for (let j = 0; (j + 0.5) * Math.PI <= kUnit + 1e-6; j++) {
                    const u = (j + 0.5) * Math.PI / kUnit;
                    if (u > 1.0001) break;
                    ctx.fillStyle = C.green;
                    ctx.beginPath(); ctx.arc(x0 + u * span, mid, 4.5, 0, Math.PI * 2); ctx.fill();
                }

                const leftTag = isString ? '固定端（位移節點）' : '開口（位移腹點）';
                const rightTag = isString ? '固定端（位移節點）' : (closed ? '閉口端（位移節點）' : '開口（位移腹點）');
                label(ctx, leftTag, x0 - 8, mid + 84, isString ? C.rose : C.green, 11);
                label(ctx, rightTag, x1 + 6, mid + 84, (isString || closed) ? C.rose : C.green, 11, 'right');
                label(ctx, closed ? 'L = m λ/4，m = 1, 3, 5, …' : 'L = n λ/2，n = 1, 2, 3, …', x0, 24, C.ink, 12);
                label(ctx, closed ? `f = m v / 4L` : `f = n v / 2L`, x0, 42, C.blue, 12);

                // 長度標示
                ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x0, h - 26); ctx.lineTo(x1, h - 26);
                ctx.moveTo(x0, h - 31); ctx.lineTo(x0, h - 21);
                ctx.moveTo(x1, h - 31); ctx.lineTo(x1, h - 21);
                ctx.stroke();
                label(ctx, `L = ${p.L.toFixed(2)} m`, (x0 + x1) / 2, h - 32, C.muted, 11, 'center');
            }
        };

        /* 8. 諧音疊加與音色 ------------------------------------------------- */
        LABS.timbre = {
            name: '諧音疊加與音色',
            tag: 'N11',
            hint: '三條細線分別是基音、第二諧音與第三諧音，粗線是它們疊加後的波形。改變振幅比，波形會完全改變，但合成波的週期始終等於基音的週期。',
            note: '這就是「音調由基音決定、音色由波形決定」的數學根據：所有諧音都是基頻的整數倍，最小共同週期就是基音的週期。',
            height: 300,
            controls: [
                { key: 'a1', label: '基音振幅', min: 0, max: 10, step: 1, value: 6, fmt: (v) => `${v}` },
                { key: 'a2', label: '第二諧音振幅', min: 0, max: 10, step: 1, value: 3, fmt: (v) => `${v}` },
                { key: 'a3', label: '第三諧音振幅', min: 0, max: 10, step: 1, value: 2, fmt: (v) => `${v}` }
            ],
            readouts: (p) => [
                { label: '振幅比', value: `${p.a1} : ${p.a2} : ${p.a3}` },
                { label: '合成波頻率', value: '= 基音頻率 f₁' },
                { label: '音調', value: '不隨振幅比改變' },
                { label: '音色', value: '隨波形改變' }
            ],
            draw: (ctx, w, h, p, t) => {
                const x0 = 20, x1 = w - 20, span = x1 - x0;
                const top = h * 0.28, mid = h * 0.72;
                const period = span / 2;             // 畫面顯示兩個基音週期
                const k1 = 2 * Math.PI / period;
                const shift = (t * 60) % period;

                axis(ctx, x0, top, x1, top);
                const harm = [[p.a1, 1, C.blue], [p.a2, 2, C.violet], [p.a3, 3, C.orange]];
                harm.forEach(([a, n, color]) => {
                    if (a === 0) return;
                    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.75;
                    ctx.beginPath();
                    for (let i = 0; i <= span; i += 2) ctx.lineTo(x0 + i, top - a * 4 * Math.sin(n * k1 * (i + shift)));
                    ctx.stroke(); ctx.globalAlpha = 1;
                });
                label(ctx, '各諧音（藍：基音　紫：第二諧音　橘：第三諧音）', x0, top - 52, C.muted, 11);

                axis(ctx, x0, mid, x1, mid);
                ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.8; ctx.beginPath();
                for (let i = 0; i <= span; i += 2) {
                    const s = p.a1 * Math.sin(k1 * (i + shift)) + p.a2 * Math.sin(2 * k1 * (i + shift)) + p.a3 * Math.sin(3 * k1 * (i + shift));
                    ctx.lineTo(x0 + i, mid - s * 4);
                }
                ctx.stroke();
                label(ctx, '疊加後的波形（決定音色）', x0, mid - 62, C.cyan, 12);

                // 標出一個基音週期
                ctx.strokeStyle = C.rose; ctx.lineWidth = 1.2;
                const px0 = x0 + 10;
                ctx.beginPath();
                ctx.moveTo(px0, mid + 62); ctx.lineTo(px0 + period, mid + 62);
                ctx.moveTo(px0, mid + 57); ctx.lineTo(px0, mid + 67);
                ctx.moveTo(px0 + period, mid + 57); ctx.lineTo(px0 + period, mid + 67);
                ctx.stroke();
                label(ctx, '合成波的週期 = 基音週期 T₁', px0 + period / 2, mid + 56, C.rose, 11, 'center');
            }
        };

        /* 9. 司乃耳定律與全反射 -------------------------------------------- */
        LABS.snell = {
            name: '司乃耳定律與全反射',
            tag: 'N13 / N15',
            hint: '調整入射角與兩側介質的折射率。當光由光密進入光疏且入射角達到臨界角時，折射線會消失、只剩下反射線——那就是全反射。',
            note: '全反射的兩個條件缺一不可：必須是 n₁ > n₂（光密 → 光疏），且入射角 ≥ 臨界角 θ_c（sinθ_c = n₂/n₁）。',
            height: 340,
            controls: [
                { key: 'th1', label: '入射角 θ₁', min: 0, max: 89, step: 1, value: 40, fmt: (v) => `${v}°` },
                { key: 'n1', label: '入射側折射率 n₁', min: 1, max: 2.5, step: 0.05, value: 1.5, fmt: (v) => v.toFixed(2) },
                { key: 'n2', label: '出射側折射率 n₂', min: 1, max: 2.5, step: 0.05, value: 1.0, fmt: (v) => v.toFixed(2) }
            ],
            readouts: (p) => {
                const s2 = p.n1 * Math.sin(rad(p.th1)) / p.n2;

                    { label: '折射角 θ₂', value: tir ? '不存在（全反射）' : `${deg(Math.asin(s2)).toFixed(1)}°` },
                    { label: '臨界角 θ_c', value: canTir ? `${deg(Math.asin(p.n2 / p.n1)).toFixed(1)}°` : '不存在（疏→密）' },
                    { label: '光速比 v₁ : v₂', value: `${(1 / p.n1).toFixed(2)} : ${(1 / p.n2).toFixed(2)}` },
                    { label: '目前狀態', value: tir ? '全反射' : (p.n1 > p.n2 ? '偏離法線' : (p.n1 < p.n2 ? '偏向法線' : '不偏折')) }
                ];
            },
            draw: (ctx, w, h, p) => {
                const iy = h * 0.5, cx = w * 0.5;
                ctx.fillStyle = `rgba(11,111,146,${0.04 + (p.n1 - 1) * 0.05})`; ctx.fillRect(0, 0, w, iy);
                ctx.fillStyle = `rgba(201,117,15,${0.04 + (p.n2 - 1) * 0.05})`; ctx.fillRect(0, iy, w, h - iy);
                ctx.strokeStyle = 'rgba(18,49,58,0.4)'; ctx.lineWidth = 1.6;
                ctx.beginPath(); ctx.moveTo(0, iy); ctx.lineTo(w, iy); ctx.stroke();
                label(ctx, `介質 1：n₁ = ${p.n1.toFixed(2)}${p.n1 > p.n2 ? '（光密）' : p.n1 < p.n2 ? '（光疏）' : ''}`, 12, 20, C.blue, 12);
                label(ctx, `介質 2：n₂ = ${p.n2.toFixed(2)}${p.n2 > p.n1 ? '（光密）' : p.n2 < p.n1 ? '（光疏）' : ''}`, 12, h - 12, C.orange, 12);

                dashed(ctx, cx, 10, cx, h - 10, 'rgba(18,49,58,0.35)');
                label(ctx, '法線', cx + 6, 34, C.muted, 10);

                const th1 = rad(p.th1);
                const s2 = p.n1 * Math.sin(th1) / p.n2;
                const tir = s2 > 1;
                const R = Math.min(w, h) * 0.42;

                // 入射線
                arrow(ctx, cx - Math.sin(th1) * R, iy - Math.cos(th1) * R, cx, iy, C.blue, 2.4);
                label(ctx, '入射線', cx - Math.sin(th1) * R - 6, iy - Math.cos(th1) * R - 6, C.blue, 11);

                // 反射線
                ctx.globalAlpha = tir ? 1 : 0.55;
                arrow(ctx, cx, iy, cx + Math.sin(th1) * R, iy - Math.cos(th1) * R, C.rose, tir ? 2.6 : 1.8);
                ctx.globalAlpha = 1;
                label(ctx, tir ? '全反射（光全部回到介質 1）' : '反射線', cx + Math.sin(th1) * R * 0.55, iy - Math.cos(th1) * R * 0.55 - 8, C.rose, 11);

                if (!tir) {
                    const th2 = Math.asin(s2);
                    arrow(ctx, cx, iy, cx + Math.sin(th2) * R, iy + Math.cos(th2) * R, C.orange, 2.4);
                    label(ctx, '折射線', cx + Math.sin(th2) * R * 0.7 + 6, iy + Math.cos(th2) * R * 0.7, C.orange, 11);
                    ctx.strokeStyle = 'rgba(18,49,58,0.45)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(cx, iy, 46, Math.PI / 2 - th2, Math.PI / 2); ctx.stroke();
                    label(ctx, `θ₂ = ${deg(th2).toFixed(0)}°`, cx + 52, iy + 46, C.orange, 11);
                }

                ctx.strokeStyle = 'rgba(18,49,58,0.45)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(cx, iy, 46, -Math.PI / 2 - th1, -Math.PI / 2); ctx.stroke();
                label(ctx, `θ₁ = ${p.th1}°`, cx - 96, iy - 38, C.blue, 11);

                // 臨界角參考線
                if (p.n1 > p.n2) {
                    const thc = Math.asin(p.n2 / p.n1);
                    dashed(ctx, cx, iy, cx - Math.sin(thc) * R, iy - Math.cos(thc) * R, 'rgba(107,70,193,0.7)');
                    label(ctx, `臨界角 ${deg(thc).toFixed(1)}°`, cx - Math.sin(thc) * R - 4, iy - Math.cos(thc) * R + 16, C.violet, 11, 'right');
                }
            }
        };

        /* 10. 薄透鏡成像作圖 ----------------------------------------------- */
        LABS.lens = {
            name: '薄透鏡成像作圖',
            tag: 'N16 / N17',
            hint: '三條主要光線同時作圖：平行主軸的光線、通過焦點的光線、通過鏡心的光線。拖動物距與焦距，觀察像距、放大率與成像性質如何隨之改變。',
            note: '符號法則：凸透鏡 f 取正、凹透鏡 f 取負；q > 0 為鏡後實像、q < 0 為鏡前虛像；m = −q/p，m > 0 正立、m < 0 倒立。',
            height: 340,
            modes: [
                { key: 'convex', label: '凸透鏡（f > 0）' },
                { key: 'concave', label: '凹透鏡（f < 0）' }
            ],
            controls: [
                { key: 'p', label: '物距 p (cm)', min: 5, max: 90, step: 1, value: 30, fmt: (v) => `${v} cm` },
                { key: 'f', label: '焦距 |f| (cm)', min: 8, max: 45, step: 1, value: 20, fmt: (v) => `${v} cm` },
                { key: 'ho', label: '物高 (cm)', min: 2, max: 14, step: 1, value: 8, fmt: (v) => `${v} cm` }
            ],
            readouts: (p) => {
                const f = p.mode === 'concave' ? -p.f : p.f;
                if (Math.abs(p.p - f) < 1e-6) return [
                    { label: '像距 q', value: '無窮遠' }, { label: '放大率 m', value: '—' },
                    { label: '成像性質', value: '折射光平行，無法成像' }, { label: '焦距 f', value: `${f} cm` }];
                const q = 1 / (1 / f - 1 / p.p);
                const m = -q / p.p;
                const kind = `${m > 0 ? '正立' : '倒立'}${Math.abs(m) > 1 ? '放大' : (Math.abs(m) < 1 ? '縮小' : '等大')}${q > 0 ? '實像' : '虛像'}`;
                return [
                    { label: '像距 q', value: `${q.toFixed(1)} cm（${q > 0 ? '鏡後' : '鏡前'}）` },
                    { label: '放大率 m', value: m.toFixed(2) },
                    { label: '像高', value: `${(m * p.ho).toFixed(1)} cm` },
                    { label: '成像性質', value: kind }
                ];
            },
            draw: (ctx, w, h, p) => {
                const concave = p.mode === 'concave';
                const f = concave ? -p.f : p.f;
                const axisY = h * 0.56;
                const noImage = Math.abs(p.p - f) < 1e-6;
                const q = noImage ? null : 1 / (1 / f - 1 / p.p);
                const m = noImage ? null : -q / p.p;

                // 依「需要顯示的最大距離」自動縮放，讓物、像與焦點都留在畫面內
                const needCm = Math.max(p.p, Math.abs(q === null ? 0 : q), 2 * p.f) * 1.18 + 6;
                const cx = w * 0.5;
                const scale = (w * 0.5 - 14) / needCm;
                const hoMax = Math.max(p.ho, Math.abs(m === null ? 0 : m * p.ho));
                const vScale = Math.min(7, (h * 0.36) / Math.max(hoMax, 1));
                const sx = (cm) => cx + cm * scale;
                const sy = (cm) => axisY - cm * vScale;

                axis(ctx, 12, axisY, w - 12, axisY);
                label(ctx, '主軸', w - 40, axisY + 16, C.muted, 10);

                // 透鏡本體
                ctx.strokeStyle = C.blue; ctx.lineWidth = 2.4;
                ctx.beginPath();
                if (!concave) {
                    ctx.moveTo(cx, axisY - 68); ctx.quadraticCurveTo(cx + 14, axisY, cx, axisY + 68);
                    ctx.moveTo(cx, axisY - 68); ctx.quadraticCurveTo(cx - 14, axisY, cx, axisY + 68);
                } else {
                    ctx.moveTo(cx - 9, axisY - 68); ctx.quadraticCurveTo(cx + 5, axisY, cx - 9, axisY + 68);
                    ctx.moveTo(cx + 9, axisY - 68); ctx.quadraticCurveTo(cx - 5, axisY, cx + 9, axisY + 68);
                    ctx.moveTo(cx - 9, axisY - 68); ctx.lineTo(cx + 9, axisY - 68);
                    ctx.moveTo(cx - 9, axisY + 68); ctx.lineTo(cx + 9, axisY + 68);
                }
                ctx.stroke();

                // 焦點與兩倍焦距
                [[-p.f, 'F'], [p.f, 'F'], [-2 * p.f, '2F'], [2 * p.f, '2F']].forEach(([d, name]) => {
                    const X = sx(d);
                    if (X < 8 || X > w - 8) return;
                    ctx.fillStyle = C.violet;
                    ctx.beginPath(); ctx.arc(X, axisY, 3.4, 0, Math.PI * 2); ctx.fill();
                    label(ctx, name, X, axisY + 18, C.violet, 10, 'center');
                });

                const Ox = sx(-p.p), Oy = sy(p.ho);
                const ray = (x1, y1, x2, y2, color, dash) => {
                    ctx.save();
                    if (dash) ctx.setLineDash([5, 4]);
                    ctx.strokeStyle = color; ctx.lineWidth = 1.6;
                    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                    ctx.restore();
                };
                // 由起點沿方向延伸到畫布右緣（或左緣）
                const extend = (x0, y0, dx, dy, color, dash) => {
                    const limit = dx >= 0 ? (w - 6 - x0) : (6 - x0);
                    const k = Math.abs(dx) < 1e-9 ? 0 : limit / dx;
                    ray(x0, y0, x0 + dx * k, y0 + dy * k, color, dash);
                };

                // ── 光線 1：平行主軸入射
                ray(Ox, Oy, cx, Oy, C.orange);
                if (!concave) {
                    const Fx = sx(p.f);
                    extend(cx, Oy, Fx - cx, axisY - Oy, C.orange);
                } else {
                    const Fx = sx(-p.f);                     // 虛焦點在鏡前
                    extend(cx, Oy, cx - Fx, Oy - axisY, C.orange);
                    ray(cx, Oy, Fx, axisY, C.orange, true);  // 反向延長線通過虛焦點
                }

                // ── 光線 2：通過鏡心，方向不變
                extend(Ox, Oy, cx - Ox, axisY - Oy, C.rose);
                if (q !== null && q < 0) extend(cx, axisY, Ox - cx, Oy - axisY, C.rose, true);

                // ── 光線 3：（凸透鏡）通過鏡前焦點 → 折射後平行主軸
                if (!concave && p.p > p.f + 0.5) {
                    const Fpre = sx(-p.f);
                    const t3 = (cx - Ox) / (Fpre - Ox);
                    const yAtLens = Oy + (axisY - Oy) * t3;
                    ray(Ox, Oy, cx, yAtLens, C.cyan);
                    extend(cx, yAtLens, 1, 0, C.cyan);
                    if (q !== null && q < 0) extend(cx, yAtLens, -1, 0, C.cyan, true);
                }

                // 物與像
                arrow(ctx, Ox, axisY, Ox, Oy, C.green, 2.8);
                label(ctx, '物', Ox - 16, Oy + 4, C.green, 12);

                if (noImage) {
                    label(ctx, 'p = f：折射光互相平行，無法成像', 14, 22, C.rose, 12);
                } else {
                    const Ix = sx(q), Iy = sy(m * p.ho);
                    arrow(ctx, Ix, axisY, Ix, Iy, q > 0 ? C.blue : C.violet, 2.8);
                    label(ctx, q > 0 ? '實像' : '虛像', Ix + 8, Iy + (Iy < axisY ? -6 : 15), q > 0 ? C.blue : C.violet, 12);
                    label(ctx, `p = ${p.p} cm　f = ${f} cm　q = ${q.toFixed(1)} cm　m = ${m.toFixed(2)}`, 14, 22, C.ink, 12);
                }
                label(ctx, concave ? '凹透鏡：不論物體在哪裡，永遠成正立縮小虛像' : '凸透鏡：物在焦點外成倒立實像、焦點內成正立放大虛像', 14, h - 12, C.muted, 11);
                label(ctx, '橘：平行主軸入射　粉：通過鏡心　青：通過鏡前焦點', 14, h - 28, C.muted, 10);
            }
        };

        /* 11. 雙狹縫干涉與單狹縫繞射 ---------------------------------------- */
        LABS.fringe = {
            name: '雙狹縫干涉與單狹縫繞射',
            tag: 'N19 / N20',
            hint: '上方是屏幕上實際看到的條紋，下方是對應的光強度曲線。切換兩種裝置，注意單狹縫的中央亮紋寬度是其他亮紋的兩倍，而且亮度向兩側迅速遞減。',
            note: '兩條公式外型相似但意義相反：雙狹縫 yₙ = nLλ/d 是「亮紋」；單狹縫 yₘ = mLλ/a 是「暗紋」。',
            height: 330,
            modes: [
                { key: 'double', label: '雙狹縫干涉' },
                { key: 'single', label: '單狹縫繞射' }
            ],
            controls: [
                { key: 'lam', label: '波長 λ (nm)', min: 400, max: 700, step: 5, value: 550, fmt: (v) => `${v} nm` },
                { key: 'w', label: '縫距 d／縫寬 a (μm)', min: 1, max: 12, step: 0.2, value: 2.2, fmt: (v) => `${v.toFixed(1)} μm` },
                { key: 'L', label: '屏幕距離 L (m)', min: 0.3, max: 2.5, step: 0.1, value: 1.0, fmt: (v) => `${v.toFixed(1)} m` }
            ],
            readouts: (p) => {
                const lam = p.lam * 1e-9, ww = p.w * 1e-6;
                const dy = p.L * lam / ww;
                const single = p.mode === 'single';
                return [
                    { label: single ? '暗紋間距 Lλ/a' : '條紋間距 Lλ/d', value: `${(dy * 100).toFixed(2)} cm` },
                    { label: '中央亮紋寬度', value: `${((single ? 2 : 1) * dy * 100).toFixed(2)} cm` },
                    { label: single ? '第一暗紋位置' : '第一亮紋位置', value: `${(dy * 100).toFixed(2)} cm` },
                    { label: '浸入水中（n = 1.33）', value: `間距 ${(dy * 100 / 1.33).toFixed(2)} cm` }
                ];
            },
            draw: (ctx, w, h, p) => {
                const single = p.mode === 'single';
                const lam = p.lam * 1e-9, ww = p.w * 1e-6;
                const dy = p.L * lam / ww;           // 公尺
                const halfSpan = Math.max(dy * (single ? 3.2 : 3.6), 1e-4);   // 依條紋間距自動縮放顯示範圍
                const pxPerM = (w - 40) / (2 * halfSpan);
                const cx = w / 2;
                const stripTop = 26, stripH = 78;
                const curveBase = h - 34, curveH = 120;

                // 顏色近似（依波長）
                const wl = p.lam;
                let rgb;
                if (wl < 440) rgb = [130, 0, 200];
                else if (wl < 490) rgb = [0, 90, 235];
                else if (wl < 510) rgb = [0, 180, 190];
                else if (wl < 580) rgb = [70, 200, 60];
                else if (wl < 645) rgb = [235, 160, 0];
                else rgb = [225, 40, 40];

                const intensity = (y) => {
                    // y 以公尺為單位（屏幕上與中央線的距離）
                    const beta = Math.PI * ww * y / (lam * p.L);
                    if (single) {
                        if (Math.abs(beta) < 1e-9) return 1;
                        const s = Math.sin(beta) / beta;
                        return s * s;
                    }
                    return Math.pow(Math.cos(beta), 2);
                };

                // 條紋帶
                for (let X = 20; X <= w - 20; X++) {
                    const y = (X - cx) / pxPerM;
                    const I = intensity(y);
                    ctx.fillStyle = `rgb(${Math.round(rgb[0] * I + 12 * (1 - I))},${Math.round(rgb[1] * I + 20 * (1 - I))},${Math.round(rgb[2] * I + 26 * (1 - I))})`;
                    ctx.fillRect(X, stripTop, 1, stripH);
                }
                ctx.strokeStyle = 'rgba(18,49,58,0.2)'; ctx.lineWidth = 1;
                ctx.strokeRect(20, stripTop, w - 40, stripH);
                label(ctx, single ? '單狹縫繞射：屏幕上的條紋' : '雙狹縫干涉：屏幕上的條紋', 20, stripTop - 8, C.ink, 12);

                // 強度曲線
                axis(ctx, 20, curveBase, w - 20, curveBase);
                ctx.strokeStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; ctx.lineWidth = 2.2;
                ctx.beginPath();
                for (let X = 20; X <= w - 20; X++) {
                    const y = (X - cx) / pxPerM;
                    ctx.lineTo(X, curveBase - intensity(y) * curveH);
                }
                ctx.stroke();
                label(ctx, '相對光強度', 20, curveBase - curveH - 6, C.muted, 11);

                // 標尺與條紋位置
                dashed(ctx, cx, stripTop, cx, curveBase, 'rgba(255,255,255,0.5)');
                for (let n = 1; n <= 6; n++) {
                    const yy = n * dy;
                    const X = cx + yy * pxPerM;
                    if (X > w - 24) break;
                    [cx - yy * pxPerM, X].forEach((XX) => {
                        dashed(ctx, XX, curveBase - curveH - 4, XX, curveBase, 'rgba(18,49,58,0.18)');
                        label(ctx, single ? `暗${n}` : `亮${n}`, XX, curveBase + 16, C.muted, 10, 'center');
                    });
                }
                label(ctx, `中央`, cx, curveBase + 16, C.rose, 10, 'center');
                label(ctx, `Δy = Lλ/${single ? 'a' : 'd'} = ${(dy * 100).toFixed(2)} cm`, w - 22, stripTop - 8, C.ink, 12, 'right');
            }
        };

        /* =====================================================================
         * 互動實驗室的兩個檢視
         * ===================================================================*/
        function renderLabIndex() {
            const cards = Object.keys(labMeta).map((id) => {
                const nodes = ALL_NODES.filter((c) => nodeMeta[c].lab === id);
                const chips = nodes.map((c) => `<span class="module-node-chip" onclick="event.stopPropagation();navigateTo('node-${c}')">${c} ${nodeMeta[c].title}</span>`).join('');
                return `
                    <div class="card module-card" onclick="navigateTo('lab-${id}')">
                        <span class="module-badge">${LABS[id] ? LABS[id].tag : ''}</span>
                        <h3>${labMeta[id].name}</h3>
                        <p>${labMeta[id].desc}</p>
                        <div class="module-nodes">${chips}</div>
                    </div>`;
            }).join('');

            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <span class="view-eyebrow">複習工具箱</span>
                    <h2>互動物理實驗室</h2>
                    <p>共 ${Object.keys(labMeta).length} 個可調參數的模擬。每個實驗都以獨立網址開啟，方便直接分享或從節點頁跳轉。動畫使用固定步長時鐘，因此在不同更新率的螢幕上速度一致；系統若設定為減少動態效果，載入時會自動暫停。</p>
                </div>
                <div class="card-grid">${cards}</div>`;
        }

        function renderSingleLabView(id) {
            if (!LABS[id]) { renderLabIndex(); return; }
            const nodes = ALL_NODES.filter((c) => nodeMeta[c].lab === id);
            const chips = nodes.map((c) => `<button class="node-route-btn" onclick="navigateTo('node-${c}')"><b>${c}　${nodeMeta[c].title}</b><span>回到節點頁看公式與題型</span></button>`).join('');

            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <span class="view-eyebrow">互動實驗　${LABS[id].tag}</span>
                    <h2>${labMeta[id].name}</h2>
                    <p>${labMeta[id].desc}</p>
                </div>
                ${labShellHtml(id)}
                <div class="section-title">對應的知識節點</div>
                <div class="node-route-actions">
                    ${chips}
                    <button class="node-route-btn" onclick="navigateTo('tool-lab')"><b>← 回到實驗室總覽</b><span>瀏覽其他 ${Object.keys(labMeta).length - 1} 個實驗</span></button>
                </div>`;
            mountLab(id);
        }

        /* =====================================================================
         * 啟動
         * ===================================================================*/
        window.addEventListener('popstate', () => { renderRoute(routeFromLocation()); });

        document.addEventListener('DOMContentLoaded', () => {
            buildNodeSidebar();
            const initial = routeFromLocation();
            history.replaceState({ waveRoute: initial }, '', `#${encodeURIComponent(initial)}`);
            renderRoute(initial);
        });
    </script>
</body>
</html>
