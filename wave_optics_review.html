    <script>
        /* 獨立於應用程式：必要腳本失敗時仍提供可見的復原入口。 */
        window.WavePageStatus = (() => {
            let ready = false;
            let failed = false;
            function showFailure() {
                failed = true;
                ready = false;
                const main = document.getElementById('main-content');
                if (!main) return;
                main.classList.remove('lab-wide');
                main.innerHTML = `<section class="page-status" role="alert">
                    <h2>學習內容未能載入</h2>
                    <p>請重新載入這一頁，再繼續閱讀或操作實驗。</p>
                    <button type="button" onclick="location.reload()">重新載入</button>
                    <a href="water_interference.html">開啟獨立水波模擬器</a>
                </section>`;
            }
            window.addEventListener('error', (event) => {
                if (event.target instanceof HTMLScriptElement && event.target.hasAttribute('data-page-required')) {
                    console.error('必要頁面腳本載入失敗', event.target.src);
                    showFailure();
                }
            }, true);
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => { if (!ready) showFailure(); }, 0);
            });
            return {
                fail: showFailure,
                get failed() { return failed; },
                ready() { ready = true; }
            };
        })();
    </script>

        .quiz-fig-img {

            background: rgba(255,255,255,0.85); cursor: pointer; transition: var(--transition);
        }
        .quiz-opt:hover { border-color: var(--accent-cyan); }
        .quiz-opt.picked { border-color: var(--primary-blue); background: var(--primary-blue-light); }
        .quiz-opt.right { border-color: var(--accent-green); background: var(--accent-green-light); }
        .quiz-opt.wrong { border-color: var(--accent-rose); background: var(--accent-rose-light); }
        .quiz-why { display: block; margin-top: 0.3rem; font-size: 0.79rem; color: var(--text-muted); line-height: 1.7; }
        .quiz-actions { display: flex; gap: 0.45rem; margin-top: 0.7rem; flex-wrap: wrap; }
        .quiz-exp {
            margin-top: 0.7rem; padding: 0.6rem 0.8rem; border-radius: 0 9px 9px 0;

        .quiz-empty { padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
        .quiz-lab-btn {

        }
        .quiz-lab-btn:hover {
            background: #0b6f92 !important;
            color: #ffffff !important;

        .quiz-lab-btn.is-open {
            background: #0b6f92 !important;

        }
        .quiz-lab-box {
            margin-top: 1rem;
            border: 1.5px solid rgba(11, 111, 146, 0.25);

            animation: fadeInLab 0.24s ease-out;
        }

            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 0.85rem;
            margin-bottom: 0.75rem;
            background: rgba(14, 139, 147, 0.1);

            font-size: 0.84rem;
            color: #12313a;
            line-height: 1.6;
        }
        @keyframes fadeInLab {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }


        /* 提示條 */
        .callout {
            padding: 0.75rem 0.95rem; border-radius: 0 10px 10px 0; font-size: 0.85rem; line-height: 1.85;
            border-left: 3px solid var(--accent-orange); background: var(--accent-orange-light); margin: 1rem 0;
        }
        .callout.info { border-left-color: var(--primary-blue); background: var(--primary-blue-light); }

        .print-hide { }

        /* ---------- 動畫講解 ---------- */
        .anim-block { border-left: 4px solid var(--accent-violet); }
        /* 這支動畫在打哪個迷思——放在最前面，讀者一眼知道要不要看 */
        .anim-myth {
            font-size: 0.84rem; line-height: 1.8; color: var(--text-main);
            background: var(--accent-rose-light);
            border-left: 3px solid var(--accent-rose);
            border-radius: 0 8px 8px 0;
            padding: 0.55rem 0.75rem; margin-bottom: 0.7rem; max-width: 68ch;
        }
        .anim-myth b {
            display: inline-block; margin-right: 0.5rem;
            font-size: 0.74rem; font-weight: 800; letter-spacing: 0.04em;
            color: var(--accent-rose);
        }

        .anim-lead {
            font-size: 0.88rem; line-height: 1.85; color: var(--text-muted);
            margin-bottom: 0.85rem; max-width: 66ch;
        }
        .anim-stage {
            position: relative; border-radius: 12px; overflow: hidden;
            background: #0d1b24; border: 1px solid rgba(10, 45, 55, 0.16);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }
        /* 明確宣告 16:9。preload 尚未取得 metadata 前，瀏覽器會用預設的
         * 300×150（2:1）當內建比例，版面會先歪一下再跳回來。 */
        .anim-stage video {
            display: block; width: 100%; height: auto;
            aspect-ratio: 16 / 9; background: #0d1b24;
        }
        .anim-stage-vertical {
            max-width: 360px; margin: 0 auto;
            aspect-ratio: 9 / 16; height: auto; position: relative;
        }
        .anim-stage-vertical iframe {
            display: block; width: 100%; height: 100%;
            border: 0; background: #000;
        }
        .anim-meta {
            display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem;
            margin: 0.7rem 0 0.2rem; font-size: 0.76rem; color: var(--text-muted);
        }
        .anim-dur {
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 0.72rem;
            color: var(--accent-violet); background: rgba(107, 70, 193, 0.08);
            border: 1px solid rgba(107, 70, 193, 0.18);
            padding: 0.14rem 0.5rem; border-radius: 99px;
        }
        .anim-speed-control {
            display: flex; align-items: center; gap: 0.55rem;
            margin-top: 0.55rem; padding: 0.45rem 0.65rem;
            border-radius: 9px; color: var(--accent-violet);
            background: rgba(107, 70, 193, 0.05);
            border: 1px solid rgba(107, 70, 193, 0.14);
        }
        .anim-speed-control label {
            font-size: 0.76rem; font-weight: 700; white-space: nowrap;
        }
        .anim-speed-control .speed-limit {
            font-size: 0.69rem; font-weight: 700; color: var(--text-muted); white-space: nowrap;
        }
        .anim-speed-control .speed-current {
            font-size: 0.72rem; font-weight: 700; white-space: nowrap;
        }
        .anim-speed-control input[type="range"] {
            flex: 1; min-width: 90px; accent-color: var(--accent-violet); cursor: pointer;
        }
        .anim-speed-control b {
            min-width: 38px; text-align: right;
            font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 800;
        }

        /* 章節時間戳 */
        .anim-chapters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
        .anim-chip {
            font: inherit; font-size: 0.76rem; font-weight: 600; text-align: left;
            display: inline-flex; align-items: baseline; gap: 0.45rem;
            padding: 0.32rem 0.62rem; border-radius: 8px; cursor: pointer;
            border: 1px solid rgba(107, 70, 193, 0.2);
            background: rgba(107, 70, 193, 0.045); color: var(--text-main);
            transition: var(--transition);
        }
        .anim-chip { text-decoration: none; }
        .anim-chip:hover { background: var(--accent-violet); color: #fff; border-color: var(--accent-violet); }
        .anim-chip:hover time { color: rgba(255, 255, 255, 0.75); }
        .anim-chip time {
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 0.72rem;
            color: var(--accent-violet); font-variant-numeric: tabular-nums;
        }
        .anim-chip.playing {
            background: var(--accent-violet); color: #fff; border-color: var(--accent-violet);
        }
        .anim-chip.playing time { color: rgba(255, 255, 255, 0.75); }

        /* 靜態力圖／對照圖 */
        .anim-figs { display: grid; gap: 0.8rem; margin-top: 1rem; }
        .anim-fig { border-radius: 12px; overflow: hidden; border: 1px solid rgba(10, 45, 55, 0.14); }
        .anim-fig img { display: block; width: 100%; height: auto; background: #0d1b24; }
        /* 影片與靜態圖都不要被容器裁切 */
        .anim-stage video, .anim-fig img { object-fit: contain; }
        .anim-fig figcaption {
            font-size: 0.79rem; line-height: 1.75; color: var(--text-muted);
            padding: 0.6rem 0.75rem; background: rgba(10, 45, 55, 0.03);
            border-top: 1px solid rgba(10, 45, 55, 0.08);
        }

        /* 影片重點結論 */
        .anim-points { list-style: none; margin-top: 0.95rem; display: grid; gap: 0.5rem; }
        .anim-points li {
            position: relative; padding-left: 1.5rem;
            font-size: 0.85rem; line-height: 1.8; color: var(--text-main);
        }
        .anim-points li::before {
            content: ''; position: absolute; left: 0.35rem; top: 0.72em;
            width: 6px; height: 6px; border-radius: 99px; background: var(--accent-violet);
        }
        .anim-extra { display: grid; gap: 0.8rem; margin-top: 0.9rem; }
        .anim-extra-title { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.4rem; }

        /* 首頁／空狀態的通用小字 */
        .muted-note { font-size: 0.85rem; line-height: 1.8; color: var(--text-muted); }
        .tip-card h4 { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.35rem; }

        @media print { .view-toolbar, #sidebar { display: none !important; } #main-content { padding: 0; } }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            #sidebar {
                width: 100%; height: auto; position: static; padding: 0.9rem 1rem;
                flex-direction: column;
            }
            .mobile-nav-toggle {
                display: block; position: absolute; top: 0.9rem; right: 1rem;
                font-size: 1.3rem; background: none; border: 0; color: #cfe4e6; cursor: pointer;
            }
            #sidebar > .nav-section-title,
            #sidebar > .nav-list,
            #sidebar > #node-nav-container { display: none; }
            #sidebar.mobile-open > .nav-list { display: flex; }
            #sidebar.mobile-open > .nav-section-title,
            #sidebar.mobile-open > #node-nav-container { display: block; }
            #sidebar.mobile-open { padding-bottom: 1.1rem; }
            .sidebar-brand { border-bottom: 0; padding-bottom: 0; margin-bottom: 0; }
        }
        @media (max-width: 640px) {
            #main-content { padding: 1.4rem 0.9rem 4rem; }
            .card-grid { grid-template-columns: 1fr; }
            .node-route-actions { grid-template-columns: 1fr; }

            .quiz-toolbar { gap: 0.35rem; }

            .anim-chapters { display: grid; grid-template-columns: 1fr; gap: 0.3rem; }
            .anim-chip { width: 100%; }
            .anim-fig figcaption { font-size: 0.76rem; }
        }

    <script>
        /* =====================================================================
         * 核心：檢視生命週期、路由與側欄
         * ===================================================================*/
        let activeDisposers = WaveRuntime.createDisposerRegistry('initial');
        let lastRenderedRoute = null;
        let mathJaxTimer = null;

        const activeQuizLabDisposers = new Map();

        function cleanupCurrentView() {
            /* 上一個檢視若是寬版實驗，離開時要把正文欄寬還原 */
            const mc = document.getElementById('main-content');
            if (mc) mc.classList.remove('lab-wide');
            activeQuizLabDisposers.forEach((d) => { try { d.dispose(); } catch (e) {} });
            activeQuizLabDisposers.clear();
            activeDisposers.dispose();
            activeDisposers = WaveRuntime.createDisposerRegistry('view');
        }

        function scheduleMathJax(target) {
            if (mathJaxTimer) clearTimeout(mathJaxTimer);
            mathJaxTimer = setTimeout(() => {
                mathJaxTimer = null;
                const el = target || document.getElementById('main-content');
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([el]).catch((err) => console.warn('MathJax', err));
                }
            }, 40);
        }

        const ALL_NODES = Object.keys(nodeMeta).sort();

        function nodesOfModule(moduleNum) {
            return ALL_NODES.filter((code) => nodeMeta[code].module === Number(moduleNum));
        }

        function itemsForNode(list, code) {
            return list.filter((item) => [].concat(item.node).includes(code));
        }

        /* 一個節點可以對應一個或多個互動實驗 */
        function labsOfNode(code) {
            const meta = nodeMeta[code];
            if (!meta || !meta.lab) return [];
            return [].concat(meta.lab);
        }
        function nodesOfLab(labId) {
            return ALL_NODES.filter((c) => labsOfNode(c).includes(labId));
        }

        /* buildNodeSidebar is in assets/js/learner-ui.js. */

        function routeFromLocation() {
            try {
                const raw = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
                if (!raw || raw === 'home') return 'home';
                if (/^module-[1-4]$/.test(raw)) return raw;
                if (raw.startsWith('node-') && Object.hasOwn(nodeMeta,raw.slice(5))) return raw;
                if (raw.startsWith('lab-') && Object.hasOwn(LABS,raw.slice(4).split(':')[0])) return raw;
                if (['tool-formula','tool-lab','tool-anim','tool-quiz','tool-compare','tool-exam','tool-wrong'].includes(raw)) return raw;
            } catch (_) { /* 損壞的分享連結仍回到可使用的首頁。 */ }
            return 'home';
        }

        function routeLabel(route) {
            if (route === 'home') return '學習首頁';
            if (route.startsWith('module-')) return modulesData[route.slice(7)] ? modulesData[route.slice(7)].title : '模組導讀';
            if (route.startsWith('node-')) {
                const code = route.slice(5);
                return nodeMeta[code] ? `${code}　${nodeMeta[code].title}` : '知識節點';
            }
            if (route.startsWith('lab-')) {
                const id = route.slice(4).split(':')[0];
                return labMeta[id] ? `互動實驗：${labMeta[id].name}` : '互動實驗';
            }
            const toolNames = {
                'tool-formula': '公式速查表',
                'tool-lab': '互動實驗室',
                'tool-anim': '動畫講解',
                'tool-quiz': '知識節點分級題庫',
                'tool-compare': '易混淆對照表',
                'tool-exam': '大考題型索引',
                'tool-wrong': '錯題本'
            };
            return toolNames[route] || '學習首頁';
        }

        /* activateNavForRoute is in assets/js/learner-ui.js. */

        function renderRoute(route) {
            try {
                cleanupCurrentView();
                const main = document.getElementById('main-content');
                if (main) main.scrollTop = 0;
                window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;

                if (route === 'home') renderHomeView();
                else if (route.startsWith('module-')) renderModuleView(route.slice(7));
                else if (route.startsWith('node-')) renderNodeView(route.slice(5));
                else if (route.startsWith('lab-')) renderSingleLabView(route.slice(4));
                else if (route === 'tool-formula') renderFormulaSheet();
                else if (route === 'tool-lab') renderLabIndex();
                else if (route === 'tool-anim') renderAnimIndex();
                else if (route === 'tool-quiz') renderQuizView();
                else if (route === 'tool-compare') renderCompareView();
                else if (route === 'tool-exam') renderExamIndexView();
                else if (route === 'tool-wrong') renderWrongBookView();
                else renderHomeView();

                activateNavForRoute(route);
                document.getElementById('view-breadcrumb').textContent = routeLabel(route);
                lastRenderedRoute = route;
                updateWrongBadge();
                scheduleMathJax();
                window.WavePageStatus.ready();
            } catch (error) {
                lastRenderedRoute = null;
                console.error('學習頁面顯示失敗', route, error);
                try { cleanupCurrentView(); }
                catch (cleanupError) { console.warn('頁面資源清理失敗', cleanupError); }
                window.WavePageStatus.fail();
                window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            }
        }

        function navigateTo(route) {
            if (route === lastRenderedRoute) return;
            history.pushState({ waveRoute: route }, '', `#${encodeURIComponent(route)}`);
            renderRoute(route);
        }

        function switchMainView(navEl, route) {
            document.getElementById('sidebar').classList.remove('mobile-open');
            const toggle = document.querySelector('.mobile-nav-toggle');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', '開啟導覽選單');
            navigateTo(route);
        }

        function goBackInApp() {
            if (history.length > 1) history.back();
            else navigateTo('home');
        }

        function toggleMobileNav(button) {
            const bar = document.getElementById('sidebar');

            button.setAttribute('aria-expanded', String(open));

        const mmss = (sec) => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, '0')}`;

        /* 章節時間戳：跳到指定秒數並開始播放 */
        function seekAnim(vid, sec) {
            const v = document.getElementById(vid);
            if (!v) return;
            /* readyState < HAVE_METADATA 時 currentTime 是設不進去的（duration 仍為 NaN），
             * 必須等 loadedmetadata 之後再跳，否則第一次點時間戳會沒有反應。 */
            const go = () => {
                v.currentTime = sec;
                v.play().catch(() => {});
            };
            if (v.readyState >= 1) go();
            else {
                v.addEventListener('loadedmetadata', go, { once: true });
                v.load();
            }
            const box = document.getElementById(`${vid}-chapters`);
            if (box) {
                box.querySelectorAll('.anim-chip').forEach((el) => {
                    el.classList.toggle('playing', Number(el.dataset.t) === sec);
                });
            }
        }

        /* 播放中自動高亮目前所在的章節 */
        function bindAnimChapters(vid, chapters) {
            const v = document.getElementById(vid);
            const box = document.getElementById(`${vid}-chapters`);
            if (!v || !box || !chapters.length) return;
            let lastIdx = -1;
            activeDisposers.addEventListener(v, 'timeupdate', () => {
                let idx = 0;
                for (let i = 0; i < chapters.length; i++) {
                    if (v.currentTime >= chapters[i].t - 0.25) idx = i;
                }
                if (idx === lastIdx) return;
                lastIdx = idx;
                box.querySelectorAll('.anim-chip').forEach((el, i) => el.classList.toggle('playing', i === idx));
            });
        }

        function animSpeedControlHtml(vid) {
            return `
                <div class="anim-speed-control">
                    <label for="${vid}-speed">播放速度</label>
                    <span class="speed-limit">0.1×</span>
                    <input type="range" id="${vid}-speed" min="0.1" max="1.5" step="0.1" value="1" data-video-speed="${vid}" aria-label="播放速度，0.1 倍到 1.5 倍">
                    <span class="speed-limit">1.5×</span>
                    <span class="speed-current">目前 <b id="${vid}-speed-out">1.0×</b></span>
                </div>`;
        }

        function bindAnimSpeed(vid) {
            const video = document.getElementById(vid);
            const input = document.querySelector(`[data-video-speed="${vid}"]`);
            const out = document.getElementById(`${vid}-speed-out`);
            if (!video || !input) return;
            activeDisposers.addEventListener(input, 'input', () => {
                const rate = Math.max(0.1, Math.min(1.5, Number(input.value) || 1));
                video.playbackRate = rate;
                if (out) out.textContent = `${rate.toFixed(1)}×`;
            });
        }

            `;

            return `

        function pickQuizOption(qid, idx) {
            const q = findQuestion(qid);
            const host = document.getElementById(`quiz-${qid}`);
            if (!q || !host || host.dataset.done === '1') return;
            const btns = host.querySelectorAll('.quiz-opt');
            if (q.type === 'multi') btns[idx].classList.toggle('picked');
            else { btns.forEach((b) => b.classList.remove('picked')); btns[idx].classList.add('picked'); }
            btns.forEach(b => b.setAttribute('aria-pressed', String(b.classList.contains('picked'))));
        }

        function gradeQuiz(qid, forceReveal) {
            const q = findQuestion(qid);
            const host = document.getElementById(`quiz-${qid}`);
            if (!q || !host || host.dataset.done === '1') return;
            const btns = host.querySelectorAll('.quiz-opt');
            const picked = [];
            btns.forEach((b, i) => { if (b.classList.contains('picked')) picked.push(i); });
            if (!forceReveal && picked.length === 0) { host.querySelector('.quiz-result').textContent = '先選擇一個答案，再送出。'; return; }

            let allRight = true;
            btns.forEach((b, i) => {
                const correct = Boolean(q.opts[i].c);
                b.classList.remove('picked');
                if (correct) b.classList.add('right');
                else if (picked.includes(i)) { b.classList.add('wrong'); allRight = false; }
                if (correct && !picked.includes(i)) allRight = false;
                b.querySelector('.quiz-why').style.display = 'block';
            });
            const saved = forceReveal ? true : allRight ? unmarkWrong(qid) : markWrong(qid);
            host.querySelector('.quiz-result').textContent = forceReveal ? '答案已展開，這次不計入錯題紀錄。' : allRight ? '答對了。看看解析，確認你的理由。' : saved ? '再看一次解析；這題已收進錯題本，可按「重做」再試。' : '再看一次解析，可按「重做」再試。目前瀏覽器無法儲存錯題。';
            host.querySelector('.quiz-exp').style.display = 'block';
            host.dataset.done = '1';
            scheduleMathJax(host);
        }

        function submitQuiz(qid) { gradeQuiz(qid, false); }
        function revealQuiz(qid) { gradeQuiz(qid, true); }

        /* =====================================================================
         * 離屏畫布快取（確保 High-DPI / Retina / 縮放螢幕下像素對齊不跑版）
         * ===================================================================*/
        let _offCanvas = null, _offCtx = null;
        function getOffscreen(w, h) {
            if (!_offCanvas) {
                _offCanvas = document.createElement('canvas');
                _offCtx = _offCanvas.getContext('2d');
            }
            if (_offCanvas.width !== w || _offCanvas.height !== h) {
                _offCanvas.width = w;
                _offCanvas.height = h;
            }
            return { canvas: _offCanvas, ctx: _offCtx };
        }

        /* =====================================================================
         * 互動實驗：共用框架
         * ---------------------------------------------------------------------
         * 每個實驗宣告 controls（滑桿）、modes（切換鈕）、draw（繪圖）與
         * readouts（即時讀數）。框架負責建立 DOM、綁定事件、跑固定步長時鐘，
         * 並在離開檢視時由 activeDisposers 一次清除。
         * ===================================================================*/
        const C = {
            ink: '#12313a', muted: '#7d949c', grid: 'rgba(18,49,58,0.10)',
            blue: '#0b6f92', cyan: '#0e8b93', rose: '#c2264a',
            violet: '#6b46c1', orange: '#c9750f', green: '#12805c',
            soft: 'rgba(11,111,146,0.12)'
        };

        function axis(ctx, x0, y0, x1, y1) {
            ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        }
        function label(ctx, text, x, y, color, size, align) {
            ctx.fillStyle = color || C.muted;
            ctx.font = `${size || 11}px Outfit, "Noto Sans TC", sans-serif`;
            ctx.textAlign = align || 'left';
            ctx.fillText(text, x, y);
            ctx.textAlign = 'left';
        }
        function arrow(ctx, x1, y1, x2, y2, color, width) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width || 1.6;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            const a = Math.atan2(y2 - y1, x2 - x1); const s = 6;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - s * Math.cos(a - 0.4), y2 - s * Math.sin(a - 0.4));
            ctx.lineTo(x2 - s * Math.cos(a + 0.4), y2 - s * Math.sin(a + 0.4));
            ctx.closePath(); ctx.fill();
        }
        /* 畫布文字排版：把「這行放不放得下」交給程式算，而不是為每個標籤各猜一個常數（守則 §3）。
         *   maxW   可用寬度，超過就逐級縮字，縮到 min 仍放不下則截斷加省略號
         *   clampW 畫布寬度，給定時會把文字方塊夾在 [2, clampW-2] 之內，避免跑出畫面
         *   plate  在文字底下鋪一層半透明白底，讓壓在波場或圖樣上的文字仍讀得到
         * 回傳實際佔用的寬度與字級，呼叫端可據此排下一個元素。 */
        function labelFit(ctx, text, x, y, color, size, align, opts) {
            const o = opts || {};
            const maxW = o.maxW || Infinity;
            const minSize = o.min || 8;
            const setF = (px) => { ctx.font = `${px}px Outfit, "Noto Sans TC", sans-serif`; };
            let sz = size || 11;
            let txt = String(text);
            setF(sz);
            while (ctx.measureText(txt).width > maxW && sz > minSize) { sz -= 0.5; setF(sz); }
            if (ctx.measureText(txt).width > maxW) {
                while (txt.length > 1 && ctx.measureText(txt + '…').width > maxW) txt = txt.slice(0, -1);
                txt += '…';
            }
            const tw = ctx.measureText(txt).width;
            let lx = x;
            if (align === 'center') lx = x - tw / 2;
            else if (align === 'right') lx = x - tw;
            if (o.clampW) lx = Math.max(2, Math.min(lx, o.clampW - tw - 2));
            if (o.plate) {
                ctx.fillStyle = typeof o.plate === 'string' ? o.plate : 'rgba(255,255,255,0.86)';
                ctx.fillRect(lx - 3, y - sz - 1, tw + 6, sz + 5);
            }
            ctx.fillStyle = color || C.muted;
            ctx.textAlign = 'left';
            ctx.fillText(txt, lx, y);
            return { w: tw, size: sz, x: lx };
        }

        /* 一段長說明：優先在指定的分隔符（預設全形空白）斷句換行，斷不開才逐字換行。
         * 回傳實際畫了幾行，呼叫端據此推進 y。比直接截斷好，因為不會掉字。 */
        function labelWrap(ctx, text, x, y, color, size, lineH, maxW, sep) {
            const setF = () => { ctx.font = `${size}px Outfit, "Noto Sans TC", sans-serif`; };
            setF();
            if (ctx.measureText(text).width <= maxW) {
                label(ctx, text, x, y, color, size);
                return 1;
            }
            const chunks = String(text).split(sep || '　').filter(Boolean);
            const lines = [];
            let cur = '';
            const push = () => { if (cur) { lines.push(cur); cur = ''; } };
            chunks.forEach((ch) => {
                const trial = cur ? cur + (sep || '　') + ch : ch;
                if (ctx.measureText(trial).width <= maxW) { cur = trial; return; }
                push();
                if (ctx.measureText(ch).width <= maxW) { cur = ch; return; }
                /* 單一段落本身就超寬 → 逐「詞」斷。
                 * 中日韓字元可以單獨換行，但英數、小數點與運算子必須整組保留，
                 * 否則 "0.680 m" 會被切成 "0.6" 和 "80 m" 這種假數字。 */
                const tokens = ch.match(/[0-9A-Za-z.,:=+\-/×·°%]+|\s+|[^]/g) || [ch];
                let buf = '';
                tokens.forEach((tk) => {
                    if (!buf) { buf = tk; return; }
                    if (ctx.measureText(buf + tk).width > maxW) { lines.push(buf); buf = tk.trim() ? tk : ''; }
                    else buf += tk;
                });
                cur = buf;
            });
            push();
            lines.forEach((ln, i) => label(ctx, ln, x, y + i * lineH, color, size));
            return lines.length;
        }

        /* 一列上放左右兩段文字：同一行放得下就左右對齊，放不下就自動拆成上下兩行。
         * 回傳實際用掉的行數，呼叫端據此決定下一列的 y。 */
        function labelRow(ctx, xL, xR, y, lineH, left, right) {
            const measure = (o) => {
                ctx.font = `${o.size || 11}px Outfit, "Noto Sans TC", sans-serif`;
                return ctx.measureText(o.text).width;
            };
            const wL = measure(left), wR = measure(right);
            if (wL + wR + 16 <= xR - xL) {
                label(ctx, left.text, xL, y, left.color, left.size || 11);
                label(ctx, right.text, xR, y, right.color, right.size || 11, 'right');
                return 1;
            }
            labelFit(ctx, left.text, xL, y, left.color, left.size || 11, 'left', { maxW: xR - xL });
            labelFit(ctx, right.text, xL, y + lineH, right.color, right.size || 11, 'left', { maxW: xR - xL });
            return 2;
        }

        function dashed(ctx, x1, y1, x2, y2, color) {
            ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = color || C.muted; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
        }
        const deg = (r) => r * 180 / Math.PI;
        const rad = (d) => d * Math.PI / 180;

        function labShellHtml(id, prefix = '') {
            const lab = LABS[id];
            if (!lab) return '';
            const controlHtml = (c) => {
                if (c.type === 'checkbox') {
                    return `
                        <div class="lab-control lab-check" id="${prefix}${id}-${c.key}-wrap">
                            <label for="${prefix}${id}-${c.key}"><input type="checkbox" id="${prefix}${id}-${c.key}" ${c.value ? 'checked' : ''}><span>${c.label}</span></label>
                        </div>`;
                }
                if (c.options) {
                    const opts = c.options.map((o) => `<option value="${o.value}" ${String(o.value) === String(c.value) ? 'selected' : ''}>${o.label}</option>`).join('');
                    return `
                        <div class="lab-control" id="${prefix}${id}-${c.key}-wrap">
                            <label for="${prefix}${id}-${c.key}">${c.label}<b id="${prefix}${id}-${c.key}-out"></b></label>
                            <select id="${prefix}${id}-${c.key}" class="lab-select">${opts}</select>
                        </div>`;
                }
                return `
                    <div class="lab-control" id="${prefix}${id}-${c.key}-wrap">
                        <label for="${prefix}${id}-${c.key}">${c.label}<b id="${prefix}${id}-${c.key}-out"></b></label>
                        <input type="range" id="${prefix}${id}-${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}">
                    </div>`;
            };
            const controls = (lab.controls || []).map(controlHtml).join('');
            const modes = (lab.modes || []).map((m, i) =>
                `<button type="button" class="lab-btn ${i === 0 ? 'is-active' : ''}" data-mode="${m.key}">${m.label}</button>`
            ).join('');
            const scrub = lab.cycle ? `
                    <div class="lab-scrub">
                        <span class="scrub-label">⏱ 時間軸</span>
                        <button type="button" class="scrub-btn" data-role="step-back" aria-label="退一格">⏴</button>
                        <input type="range" id="${prefix}${id}-scrub" min="0" max="1000" step="1" value="0" aria-label="拖曳以慢慢看過程">
                        <button type="button" class="scrub-btn" data-role="step-fwd" aria-label="進一格">⏵</button>
                        <b id="${prefix}${id}-scrub-out">0.00 s</b>
                        <div class="lab-speed">
                            <label for="${prefix}${id}-speed">播放速度</label>
                            <span class="speed-limit">0.1×</span>
                            <input type="range" id="${prefix}${id}-speed" min="0.1" max="1.5" step="0.1" value="1" aria-label="播放速度，0.1 倍到 1.5 倍">
                            <span class="speed-limit">1.5×</span>
                            <span class="speed-current">目前 <b id="${prefix}${id}-speed-out">1.0×</b></span>
                        </div>
                    </div>` : '';
            const extraBtns = (lab.extraButtons || []).map((b) =>
                `<button type="button" class="lab-btn ${b.className || ''}" data-action="${b.action}">${b.label}</button>`
            ).join('');
            if (id === 'water_interference') {
                const waterControls = keys => keys.map(key => controlHtml(lab.controls.find(c => c.key === key))).join('');
                const waterButtons = actions => (lab.extraButtons || []).filter(b => actions.includes(b.action)).map(b =>
                    `<button type="button" class="lab-btn ${b.className || ''}" data-action="${b.action}">${b.label}</button>`
                ).join('');
                const presetActions = [1,1.5,2,2.5,3,3.5,4].map(mult => `snap_${String(mult).replace('.','_')}_lambda`);
                return `
                    <div class="lab-shell lab-water" id="${prefix}lab-${id}">
                        <div class="water-stage-toolbar">
                            <div class="lab-buttons" data-role="modes">${modes}</div>
                            <div class="lab-buttons water-playback">
                                <button type="button" class="lab-btn" data-role="toggle">⏸ 暫停</button>
                                <button type="button" class="lab-btn" data-role="reset">↺ 回到預設值</button>
                            </div>
                        </div>
                        <div class="lab-stage"><canvas id="${prefix}${id}-canvas"></canvas></div>
                        <p class="water-stage-caption">點水面放置或拖曳測量點 P；三維模式可拖曳畫面旋轉視角。</p>
                        ${scrub}
                        <div class="water-control-cards">
                            <section class="water-control-card" aria-labelledby="${prefix}${id}-distance-title">
                                <h5 id="${prefix}${id}-distance-title">波源間距與長度顯示</h5>
                                ${waterControls(['d'])}
                                <p class="water-control-hint">λ 是一個波長。改變間距，觀察腹線與節線如何改變。</p>
                                ${waterControls(['dlabel'])}
                                <div class="lab-buttons water-presets" aria-label="精確設定波源間距">${waterButtons(presetActions)}</div>
                                <div class="lab-buttons">${waterButtons(['snap_degen_int','snap_degen_half'])}</div>
                            </section>
                            <section class="water-control-card" aria-labelledby="${prefix}${id}-display-title">
                                <h5 id="${prefix}${id}-display-title">水波與圖示</h5>
                                ${waterControls(['freq','phase','decay','shade','lines','yaw'])}
                                <div class="lab-buttons">${waterButtons(['random_quiz'])}</div>
                            </section>
                        </div>
                        <div class="water-measure-toolbar"><h5>測量與判讀</h5><div class="lab-buttons">${waterButtons(['clear_p'])}</div></div>
                        <div class="lab-readout" id="${prefix}${id}-readout"></div>
                        <p class="water-credit">原始探究設計：成德高中 陳家騏老師。</p>
                        <details class="water-guide"><summary>第一次操作：凍結、測量、核對</summary><div class="lab-hint">${lab.hint}</div></details>
                        ${lab.note ? `<div class="lab-note"><details><summary>觀察後的補充說明</summary>${lab.note}</details></div>` : ''}
                    </div>`;
            }
            return `
                <div class="lab-shell" id="${prefix}lab-${id}">
                    <div class="lab-title"><h4>${lab.name}</h4><span class="lab-tag">${lab.tag}</span></div>
                    <div class="lab-hint">${lab.hint}</div>
                    ${modes ? `<div class="lab-buttons" data-role="modes">${modes}</div>` : ''}
                    <div class="lab-stage"><canvas id="${prefix}${id}-canvas"></canvas></div>
                    ${scrub}
                    <div class="lab-controls">${controls}</div>
                    <div class="lab-buttons">
                        <button type="button" class="lab-btn" data-role="toggle">⏸ 暫停</button>
                        <button type="button" class="lab-btn" data-role="reset">↺ 回到預設值</button>
                        ${extraBtns}
                    </div>
                    <div class="lab-readout" id="${prefix}${id}-readout"></div>
                    ${lab.note ? `<div class="lab-note"><details><summary>觀察後的補充說明</summary>${lab.note}</details></div>` : ''}
                </div>`;
        }

        function mountLab(id, initialMode, prefix = '', customDisposers = null, initialParams = null) {
            const lab = LABS[id];
            const host = document.getElementById(prefix ? `${prefix}lab-${id}` : `lab-${id}`);
            const canvas = document.getElementById(prefix ? `${prefix}${id}-canvas` : `${id}-canvas`);
            if (!lab || !host || !canvas) return;

            const disposers = customDisposers || activeDisposers;

            if (lab.wide) document.getElementById('main-content').classList.add('lab-wide');

            const params = {};
            const initialValue = c => initialParams && Object.hasOwn(initialParams,c.key) ? initialParams[c.key] : c.value;
            /* 勾選框的值是布林；其餘控制項（滑桿、選單）可轉成數字就轉成數字 */
            const parseValue = (c, v) => c.type === 'checkbox' ? !!v : (isNaN(Number(v)) ? v : Number(v));
            const writeInput = (input, c, v) => { if (c.type === 'checkbox') input.checked = !!v; else input.value = v; };
            (lab.controls || []).forEach((c) => {
                const value = initialValue(c);
                params[c.key] = parseValue(c, value);
                const input = document.getElementById(`${prefix}${id}-${c.key}`);
                if (input) writeInput(input, c, value);
            });
            const modeKeys = lab.modes ? lab.modes.map((m) => m.key) : [];
            params.mode = lab.modes
                ? (modeKeys.includes(initialMode) ? initialMode : lab.modes[0].key)
                : null;
            if (lab.modes) {
                host.querySelectorAll('[data-mode]').forEach((b) => {
                    b.classList.toggle('is-active', b.dataset.mode === params.mode);
                });
            }

            let running = !WaveRuntime.prefersReducedMotion();
            let simTime = 0;
            let playbackRate = 1;
            /* lab.height 可為數字，或依模式與畫布寬度決定的函式 (params, cssWidth) => px */
            const labHeight = () => {
                if (typeof lab.height !== 'function') return lab.height || 320;
                const cw = canvas.clientWidth || canvas.parentElement?.clientWidth || 640;
                return lab.height(params, cw);
            };
            /* lab.hintFor / lab.noteFor：同一實驗的不同模式各自給提示與補充說明 */
            const syncModeText = () => {
                if (typeof lab.hintFor === 'function') {
                    const el = host.querySelector('.lab-hint');
                    if (el) el.innerHTML = lab.hintFor(params);
                }
                if (typeof lab.noteFor === 'function') {
                    const el = host.querySelector('.lab-note details');
                    if (el) el.innerHTML = `<summary>觀察後的補充說明</summary>${lab.noteFor(params)}`;
                }
            };
            syncModeText();
            let geom = WaveRuntime.fitCanvas(canvas, labHeight());

            const syncOutputs = () => {
                (lab.controls || []).forEach((c) => {
                    const out = document.getElementById(prefix ? `${prefix}${id}-${c.key}-out` : `${id}-${c.key}-out`);
                    if (out) out.textContent = c.fmt ? c.fmt(params[c.key], params) : params[c.key];
                    const wrap = document.getElementById(prefix ? `${prefix}${id}-${c.key}-wrap` : `${id}-${c.key}-wrap`);
                    if (wrap && (c.only || c.showIf)) {
                        const vis = (!c.only || c.only.includes(params.mode)) && (!c.showIf || c.showIf(params));
                        wrap.style.display = vis ? '' : 'none';
                    }
                });
                const ro = document.getElementById(prefix ? `${prefix}${id}-readout` : `${id}-readout`);
                if (ro && lab.readouts) {
                    ro.innerHTML = lab.readouts(params).map((r) => `<div><span>${r.label}</span><strong>${r.value}</strong></div>`).join('');
                }
            };

            const paint = () => {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, geom.width, geom.height);
                lab.draw(ctx, geom.width, geom.height, params, simTime);
            };

            (lab.controls || []).forEach((c) => {
                const input = document.getElementById(prefix ? `${prefix}${id}-${c.key}` : `${id}-${c.key}`);
                if (input) {
                    const evt = (input.tagName === 'SELECT' || c.type === 'checkbox') ? 'change' : 'input';
                    disposers.addEventListener(input, evt, () => {
                        params[c.key] = c.type === 'checkbox' ? input.checked : parseValue(c, input.value);
                        if (c.onChange) c.onChange(params[c.key], params);
                        syncOutputs(); paint();
                    });
                }
            });

            (lab.extraButtons || []).forEach((b) => {
                const btn = host.querySelector(`[data-action="${b.action}"]`);
                if (btn && b.onClick) {
                    disposers.addEventListener(btn, 'click', () => {
                        b.onClick(params, { syncOutputs, paint, host });
                    });
                }
            });

            host.querySelectorAll('[data-mode]').forEach((btn) => {
                disposers.addEventListener(btn, 'click', () => {
                    host.querySelectorAll('[data-mode]').forEach((b) => b.classList.remove('is-active'));
                    btn.classList.add('is-active');
                    params.mode = btn.dataset.mode;
                    if (lab.onMode) lab.onMode(params);
                    syncModeText();
                    if (typeof lab.height === 'function') geom = WaveRuntime.fitCanvas(canvas, labHeight());
                    syncOutputs(); paint();
                });
            });

            const toggleBtn = host.querySelector('[data-role="toggle"]');
            if (toggleBtn) {
                disposers.addEventListener(toggleBtn, 'click', () => {
                    running = !running;
                    toggleBtn.textContent = running ? '⏸ 暫停' : '▶ 播放';
                });
                if (!running) toggleBtn.textContent = '▶ 播放';
            }

            /* 時間軸：拖曳或逐格前後時自動暫停，讓學生慢慢看疊加、反射的過程 */
            const scrubInput = lab.cycle ? document.getElementById(prefix ? `${prefix}${id}-scrub` : `${id}-scrub`) : null;
            const scrubOut = lab.cycle ? document.getElementById(prefix ? `${prefix}${id}-scrub-out` : `${id}-scrub-out`) : null;
            const speedInput = lab.cycle ? document.getElementById(prefix ? `${prefix}${id}-speed` : `${id}-speed`) : null;
            const speedOut = lab.cycle ? document.getElementById(prefix ? `${prefix}${id}-speed-out` : `${id}-speed-out`) : null;
            const cycleOf = () => {
                const c = (typeof lab.cycle === 'function') ? lab.cycle(params) : lab.cycle;
                return (Number.isFinite(c) && c > 0.02) ? c : 2;
            };
            const showScrub = () => {
                if (!scrubInput) return;
                const cyc = cycleOf();
                const phase = ((simTime % cyc) + cyc) % cyc;
                scrubInput.value = String(Math.round(phase / cyc * 1000));
                if (scrubOut) scrubOut.textContent = `${phase.toFixed(2)} s`;
            };
            const pausePlayback = () => {
                if (!running) return;
                running = false;
                if (toggleBtn) toggleBtn.textContent = '▶ 播放';
            };
            if (scrubInput) {
                disposers.addEventListener(scrubInput, 'input', () => {
                    pausePlayback();
                    simTime = Number(scrubInput.value) / 1000 * cycleOf();
                    if (scrubOut) scrubOut.textContent = `${simTime.toFixed(2)} s`;
                    syncOutputs(); paint();
                });
                const stepBy = (frac) => {
                    pausePlayback();
                    const cyc = cycleOf();
                    simTime = (((simTime + frac * cyc) % cyc) + cyc) % cyc;
                    showScrub(); paint();
                };
                const backBtn = host.querySelector('[data-role="step-back"]');
                const fwdBtn = host.querySelector('[data-role="step-fwd"]');
                if (backBtn) disposers.addEventListener(backBtn, 'click', () => stepBy(-1 / 48));
                if (fwdBtn) disposers.addEventListener(fwdBtn, 'click', () => stepBy(1 / 48));
                showScrub();
            }
            if (speedInput) {
                disposers.addEventListener(speedInput, 'input', () => {
                    playbackRate = Math.max(0.1, Math.min(1.5, Number(speedInput.value) || 1));
                    if (speedOut) speedOut.textContent = `${playbackRate.toFixed(1)}×`;
                });
            }

            const resetBtn = host.querySelector('[data-role="reset"]');
            if (resetBtn) {
                disposers.addEventListener(resetBtn, 'click', () => {
                    (lab.controls || []).forEach((c) => {
                        const value = initialValue(c);
                        params[c.key] = parseValue(c, value);
                        const input = document.getElementById(prefix ? `${prefix}${id}-${c.key}` : `${id}-${c.key}`);
                        if (input) writeInput(input, c, value);
                    });
                    if (lab.onReset) lab.onReset(params);
                    simTime = 0;
                    playbackRate = 1;
                    if (speedInput) speedInput.value = '1';
                    if (speedOut) speedOut.textContent = '1.0×';
                    showScrub();
                    syncOutputs(); paint();
                });
            }

            disposers.addEventListener(window, 'resize', () => {
                geom = WaveRuntime.fitCanvas(canvas, labHeight());
                paint();
            });

            let scrubTick = 0;
            disposers.runLoop((dt) => {
                if (running) {
                    simTime += dt * playbackRate;
                    if (scrubInput && (scrubTick = (scrubTick + 1) % 6) === 0) showScrub();
                }
                paint();
            });

            if (typeof lab.setup === 'function') {
                lab.setup({
                    host,
                    canvas,
                    params,
                    disposers,
                    syncOutputs,
                    paint,
                    getGeom: () => geom,
                    isPaused: () => !running,
                    pause: pausePlayback
                });
            }

            syncOutputs();
            paint();
        }

        /* =====================================================================
         * 互動實驗：各實驗定義
         * ===================================================================*/
        const LABS = {};

        /* 4. 波前與惠更斯原理 ---------------------------------------------- */
        LABS.huygens = {
            name: '波前與惠更斯原理',
            cycle: 2.6,                                     // 子波長大一個 λ 的時間
            tag: 'N05',
            hint: '前兩個模式：條狀波源產生直線波前、點狀波源產生圓形波前，實線是波峰波前、虛線是波谷波前，綠色箭頭是傳播方向。後兩個模式：把舊波前上的每一點當成新的點波源，子波的包絡線就是新的波前。',
            note: '兩個必記結論：① 波前是「振動情形相同」的點所連成的線，不一定要是波峰或波谷。② 波的傳播方向恆與波前垂直（夾角 90°）——這是之後所有折射、繞射作圖的起點。',
            height: 360,
            modes: [
                { key: 'lineFront', label: '直線波的波前' },
                { key: 'circleFront', label: '圓形波的波前' },
                { key: 'lineHuygens', label: '惠更斯建構：直線波' },
                { key: 'circleHuygens', label: '惠更斯建構：圓形波' }
            ],
            controls: [
                { key: 'lam', label: '波長 λ (px)', min: 30, max: 80, step: 2, value: 46, fmt: (v) => `${v}` },
                { key: 'nsrc', label: '子波源數目', min: 4, max: 16, step: 1, value: 9, only: ['lineHuygens', 'circleHuygens'], fmt: (v) => `${v} 個` }
            ],
            readouts: (p) => {
                const isHuy = p.mode === 'lineHuygens' || p.mode === 'circleHuygens';
                return [
                    { label: '波前與傳播方向', value: '恆垂直（90°）' },
                    { label: '相鄰兩波峰波前', value: `相距一個波長 λ = ${p.lam} px` },
                    { label: isHuy ? '子波半徑' : '波前形狀', value: isHuy ? '每過一個週期長 λ' : (p.mode === 'circleFront' ? '同心圓' : '平行直線') },
                    { label: isHuy ? '新波前' : '波源', value: isHuy ? '所有子波的包絡線' : (p.mode === 'circleFront' ? '點狀波源' : '條狀波源') }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const lam = Math.max(p.lam, 10);
                const cyc = 2.6;                                  // 一個週期的秒數
                const phase = ((t / cyc) % 1) * lam;              // 波前在一個週期內前進的距離
                const isCircle = (p.mode === 'circleFront' || p.mode === 'circleHuygens');
                const isHuy = (p.mode === 'lineHuygens' || p.mode === 'circleHuygens');

                /* ---------- 模式一、二：純粹畫波前 ---------- */
                if (!isHuy) {
                    if (!isCircle) {
                        const x0 = 46;
                        const barY0 = h * 0.16, barY1 = h * 0.84;
                        // 條狀波源（上下振動）
                        const wob = Math.sin(2 * Math.PI * t / cyc) * 5;
                        ctx.strokeStyle = '#2b5f74'; ctx.lineWidth = 6;
                        ctx.beginPath(); ctx.moveTo(x0 - 14, barY0 + wob); ctx.lineTo(x0 - 14, barY1 + wob); ctx.stroke();
                        arrow(ctx, x0 - 30, h / 2 - 8, x0 - 30, h / 2 - 30, C.ink, 1.4);
                        arrow(ctx, x0 - 30, h / 2 + 8, x0 - 30, h / 2 + 30, C.ink, 1.4);
                        label(ctx, '條狀波源', 8, barY0 - 10, C.ink, 11);
                        label(ctx, '上下振動', 8, barY0 + 6, C.muted, 10);

                        // 波峰波前（實線＋淡藍色隆起帶）與波谷波前（虛線）
                        for (let k = 0; k < 14; k++) {
                            const X = x0 + phase + k * lam / 2;
                            if (X > w - 12) break;
                            const crest = (k % 2 === 0);
                            if (crest) {
                                const bw = lam * 0.22;
                                const g = ctx.createLinearGradient(X - bw, 0, X + bw, 0);
                                g.addColorStop(0, 'rgba(11,111,146,0)');
                                g.addColorStop(0.5, 'rgba(11,111,146,0.20)');
                                g.addColorStop(1, 'rgba(11,111,146,0)');
                                ctx.fillStyle = g;
                                ctx.fillRect(X - bw, barY0, bw * 2, barY1 - barY0);
                                ctx.strokeStyle = 'rgba(11,111,146,0.9)'; ctx.lineWidth = 2.6;
                                ctx.beginPath(); ctx.moveTo(X, barY0); ctx.lineTo(X, barY1); ctx.stroke();
                            } else {
                                dashed(ctx, X, barY0, X, barY1, 'rgba(107,70,193,0.55)');
                            }
                        }
                        // 傳播方向（與波前垂直）
                        [0.28, 0.5, 0.72].forEach((f) => {
                            arrow(ctx, x0 + 10, h * f, Math.min(w - 18, x0 + 10 + Math.max(150, (w - x0) * 0.55)), h * f, C.green, 1.8);
                        });
                        // 波長標示
                        const xa = x0 + phase, xb = xa + lam;
                        if (xb < w - 20) {
                            ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.2;
                            const yy = barY1 + 20;
                            ctx.beginPath();
                            ctx.moveTo(xa, yy); ctx.lineTo(xb, yy);
                            ctx.moveTo(xa, yy - 5); ctx.lineTo(xa, yy + 5);
                            ctx.moveTo(xb, yy - 5); ctx.lineTo(xb, yy + 5);
                            ctx.stroke();
                            label(ctx, `λ`, (xa + xb) / 2, yy - 8, C.cyan, 12, 'center');
                        }
                        ctx.fillStyle = 'rgba(255,255,255,0.88)';
                        ctx.fillRect(w - 232, 6, 226, 54);
                        label(ctx, '—— 波峰波前', w - 14, 22, '#0b6f92', 11, 'right');
                        label(ctx, '- - - 波谷波前', w - 14, 38, '#6b46c1', 11, 'right');
                        label(ctx, '→ 波傳遞的方向（與波前垂直）', w - 14, 54, C.green, 10, 'right');
                        return;
                    }

                    // 圓形波
                    const sx = Math.min(90, w * 0.16), sy = h / 2;
                    const wob = Math.sin(2 * Math.PI * t / cyc) * 4;
                    ctx.fillStyle = '#2b5f74';
                    ctx.beginPath(); ctx.arc(sx, sy + wob, 6, 0, Math.PI * 2); ctx.fill();
                    arrow(ctx, sx - 22, sy - 8, sx - 22, sy - 28, C.ink, 1.4);
                    arrow(ctx, sx - 22, sy + 8, sx - 22, sy + 28, C.ink, 1.4);
                    label(ctx, '點狀波源', 8, sy - 44, C.ink, 11);
                    label(ctx, '上下振動', 8, sy - 28, C.muted, 10);

                    const rMax = Math.hypot(w - sx, h / 2) + lam;
                    for (let k = 0; k < 30; k++) {
                        const R = phase + k * lam / 2;
                        if (R > rMax) break;
                        if (R < 6) continue;
                        const crest = (k % 2 === 0);
                        ctx.save();
                        ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                        if (crest) {
                            ctx.strokeStyle = 'rgba(11,111,146,0.14)'; ctx.lineWidth = Math.max(4, lam * 0.42);
                            ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.05, Math.PI / 2.05); ctx.stroke();
                            ctx.strokeStyle = 'rgba(11,111,146,0.85)'; ctx.lineWidth = 2.6;
                            ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.05, Math.PI / 2.05); ctx.stroke();
                        } else {
                            ctx.save(); ctx.setLineDash([5, 5]);
                            ctx.strokeStyle = 'rgba(107,70,193,0.6)'; ctx.lineWidth = 1.6;
                            ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.05, Math.PI / 2.05); ctx.stroke();
                            ctx.restore();
                        }
                        ctx.restore();
                    }
                    [-0.7, -0.35, 0, 0.35, 0.7].forEach((a) => {
                        const r0 = 16, r1 = Math.min(w - sx - 16, 150);
                        arrow(ctx, sx + Math.cos(a) * r0, sy + Math.sin(a) * r0,
                            sx + Math.cos(a) * r1, sy + Math.sin(a) * r1, C.green, 1.7);
                    });
                    const ra = phase + 4 * lam / 2, rb = ra + lam;
                    if (sx + rb < w - 16) {
                        ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.2;
                        const yy = sy + h * 0.36;
                        ctx.beginPath();
                        ctx.moveTo(sx + ra, yy); ctx.lineTo(sx + rb, yy);
                        ctx.moveTo(sx + ra, yy - 5); ctx.lineTo(sx + ra, yy + 5);
                        ctx.moveTo(sx + rb, yy - 5); ctx.lineTo(sx + rb, yy + 5);
                        ctx.stroke();
                        label(ctx, 'λ', sx + ra + lam / 2, yy - 8, C.cyan, 12, 'center');
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.88)';
                    ctx.fillRect(w - 232, 6, 226, 54);
                    label(ctx, '—— 波峰波前', w - 14, 22, '#0b6f92', 11, 'right');
                    label(ctx, '- - - 波谷波前', w - 14, 38, '#6b46c1', 11, 'right');
                    label(ctx, '→ 波傳遞的方向（沿半徑，與波前垂直）', w - 14, 54, C.green, 10, 'right');
                    return;
                }

                /* ---------- 模式三、四：惠更斯建構 ---------- */
                const grow = phase;                              // 子波目前的半徑（0 → λ）
                const nsrc = Math.max(3, Math.round(p.nsrc));
                const done = grow > lam * 0.97;

                if (p.mode === 'lineHuygens') {
                    const y0 = h * 0.16, y1 = h * 0.82;
                    const xOld = Math.max(70, w * 0.24);
                    // 更早的波前（淡）
                    for (let k = 1; k <= 2; k++) {
                        const X = xOld - k * lam;
                        if (X > 12) dashed(ctx, X, y0, X, y1, 'rgba(11,111,146,0.22)');
                    }
                    // 舊波前
                    ctx.strokeStyle = 'rgba(11,111,146,0.9)'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(xOld, y0); ctx.lineTo(xOld, y1); ctx.stroke();
                    /* 兩個波前標籤固定分成上下兩行：舊波前在上、新波前在下。
                     * 不論畫布多窄都不會互撞，也省掉量測分支（守則 §3）。 */
                    labelFit(ctx, '舊波前（此刻的波前）', xOld - 6, y0 - 28, C.blue, 12, 'right',
                             { clampW: w, maxW: w - 8 });

                    // 子波
                    ctx.strokeStyle = 'rgba(201,117,15,0.75)'; ctx.lineWidth = 1.5;
                    for (let i = 0; i < nsrc; i++) {
                        const yy = y0 + (y1 - y0) * i / (nsrc - 1);
                        ctx.fillStyle = C.orange;
                        ctx.beginPath(); ctx.arc(xOld, yy, 3.6, 0, Math.PI * 2); ctx.fill();
                        if (grow > 1.5) {
                            ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                            ctx.beginPath(); ctx.arc(xOld, yy, grow, -Math.PI / 2, Math.PI / 2); ctx.stroke();
                            ctx.restore();
                        }
                    }
                    // 新波前＝包絡線
                    const xNew = xOld + grow;
                    if (xNew < w - 10) {
                        if (done) {
                            ctx.strokeStyle = C.green; ctx.lineWidth = 3.4;
                            ctx.beginPath(); ctx.moveTo(xNew, y0); ctx.lineTo(xNew, y1); ctx.stroke();
                        } else {
                            dashed(ctx, xNew, y0, xNew, y1, 'rgba(18,128,92,0.65)');
                        }
                        label(ctx, done ? '新波前（包絡線）' : '包絡線形成中…', Math.min(xNew + 8, w - 12), y0 - 10, C.green, 12);
                    }
                    label(ctx, '① 舊波前上的每一點 → 新的點波源', 14, h - 40, C.ink, 11);
                    label(ctx, '② 各自發出半徑相同的圓形子波（一個週期長一個 λ）', 14, h - 24, C.orange, 11);
                    label(ctx, '③ 與所有子波相切的線＝包絡線＝新的波前', 14, h - 8, C.green, 11);
                    return;
                }

                // 圓形波的惠更斯建構
                const sx = Math.min(96, w * 0.17), sy = h / 2;
                const Rold = Math.min(w * 0.30, h * 0.34);
                ctx.fillStyle = '#2b5f74';
                ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2); ctx.fill();
                labelFit(ctx, '點波源', sx - 8, sy - 14, C.ink, 11, 'right', { clampW: w, plate: 1 });
                for (let k = 1; k <= 2; k++) {
                    const R = Rold - k * lam;
                    if (R > 10) {
                        ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(11,111,146,0.22)'; ctx.lineWidth = 1.4;
                        ctx.beginPath(); ctx.arc(sx, sy, R, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke(); ctx.restore();
                    }
                }
                ctx.strokeStyle = 'rgba(11,111,146,0.9)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(sx, sy, Rold, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke();
                label(ctx, '舊波前', sx + Rold * 0.72, sy - Rold * 0.80, C.blue, 12);

                ctx.strokeStyle = 'rgba(201,117,15,0.75)'; ctx.lineWidth = 1.5;
                for (let i = 0; i < nsrc; i++) {
                    const a = -Math.PI / 2.2 + (Math.PI / 1.1) * i / (nsrc - 1);
                    const px = sx + Math.cos(a) * Rold, py = sy + Math.sin(a) * Rold;
                    ctx.fillStyle = C.orange;
                    ctx.beginPath(); ctx.arc(px, py, 3.6, 0, Math.PI * 2); ctx.fill();
                    if (grow > 1.5) {
                        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                        ctx.beginPath(); ctx.arc(px, py, grow, a - Math.PI / 2, a + Math.PI / 2); ctx.stroke();
                        ctx.restore();
                    }
                }
                const Rnew = Rold + grow;
                ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                if (done) {
                    ctx.strokeStyle = C.green; ctx.lineWidth = 3.4;
                    ctx.beginPath(); ctx.arc(sx, sy, Rnew, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke();
                } else {
                    ctx.save(); ctx.setLineDash([6, 5]);
                    ctx.strokeStyle = 'rgba(18,128,92,0.65)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(sx, sy, Rnew, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke();
                    ctx.restore();
                }
                ctx.restore();
                label(ctx, done ? '新波前（包絡線）仍是圓形' : '包絡線形成中…', 14, 22, C.green, 12);
                label(ctx, '① 舊波前上的每一點 → 新的點波源', 14, h - 40, C.ink, 11);
                label(ctx, '② 各自發出半徑相同的圓形子波', 14, h - 24, C.orange, 11);
                label(ctx, '③ 包絡線＝新的波前（圓形波仍為圓形）', 14, h - 8, C.green, 11);
            }
        };

        /* 8. 諧音疊加與音色 ------------------------------------------------- */
        LABS.timbre = {
            name: '諧音疊加與音色',
            cycle: 2.62,
            tag: 'N11',
            hint: '細線是各諧音，粗線是疊加波形。先保留基音、改變泛音振幅，看波形改變而基本週期維持不變；再把基音調成 0，觀察不同組合。',
            note: '基音存在時，合成波的基本週期為 T₁。延伸觀察：只留第二諧音時週期為 T₁/2；只留第三諧音時為 T₁/3。第二、第三諧音同時存在時，最小共同週期仍為 T₁；全部振幅為 0 時沒有振動，也沒有基本頻率。',
            height: 300,
            controls: [
                { key: 'a1', label: '基音振幅', min: 0, max: 10, step: 1, value: 6, fmt: (v) => `${v}` },
                { key: 'a2', label: '第二諧音振幅', min: 0, max: 10, step: 1, value: 3, fmt: (v) => `${v}` },
                { key: 'a3', label: '第三諧音振幅', min: 0, max: 10, step: 1, value: 2, fmt: (v) => `${v}` }
            ],
            fundamentalOrder: (p) => {
                const orders = [1, 2, 3].filter((n) => Number(p[`a${n}`]) > 0);
                const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
                return orders.reduce(gcd, 0);
            },
            readouts: (p) => {
                const order = LABS.timbre.fundamentalOrder(p);
                return [
                    { label: '振幅比', value: `${p.a1} : ${p.a2} : ${p.a3}` },
                    { label: '合成波的基本頻率', value: order ? (order === 1 ? 'f₁' : `${order} f₁`) : '無（沒有振動）' },
                    { label: '合成波的基本週期', value: order ? (order === 1 ? 'T₁' : `T₁ / ${order}`) : '未定義' },
                    { label: '基音成分', value: Number(p.a1) > 0 ? '存在' : '振幅為 0' }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const x0 = 20, x1 = w - 20, span = x1 - x0;
                const top = h * 0.28, mid = h * 0.72;
                const period = span / 2;             // 畫面顯示兩個基音週期
                const k1 = 2 * Math.PI / period;
                const shift = (t * 60) % period;

                axis(ctx, x0, top, x1, top);
                const harm = [[p.a1, 1, C.blue], [p.a2, 2, C.violet], [p.a3, 3, C.orange]];
                harm.forEach(([a, n, color]) => {
                    if (a === 0) return;
                    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.75;
                    ctx.beginPath();
                    for (let i = 0; i <= span; i += 2) ctx.lineTo(x0 + i, top - a * 4 * Math.sin(n * k1 * (i + shift)));
                    ctx.stroke(); ctx.globalAlpha = 1;
                });
                labelFit(ctx, '藍：基音　紫：2f₁　橘：3f₁', x0, top - 52, C.muted, 11, 'left',
                    { maxW: span, clampW: w });

                axis(ctx, x0, mid, x1, mid);
                ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.8; ctx.beginPath();
                for (let i = 0; i <= span; i += 2) {
                    const s = p.a1 * Math.sin(k1 * (i + shift)) + p.a2 * Math.sin(2 * k1 * (i + shift)) + p.a3 * Math.sin(3 * k1 * (i + shift));
                    ctx.lineTo(x0 + i, mid - s * 4);
                }
                ctx.stroke();
                label(ctx, '疊加後的波形（決定音色）', x0, mid - 62, C.cyan, 12);

                // 基本週期由仍存在的諧音決定；零振幅時不標週期。
                const order = LABS.timbre.fundamentalOrder(p);
                const px0 = x0 + 10;
                if (order) {
                    const combinedPeriod = period / order;
                    ctx.strokeStyle = C.rose; ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(px0, mid + 62); ctx.lineTo(px0 + combinedPeriod, mid + 62);
                    ctx.moveTo(px0, mid + 57); ctx.lineTo(px0, mid + 67);
                    ctx.moveTo(px0 + combinedPeriod, mid + 57); ctx.lineTo(px0 + combinedPeriod, mid + 67);
                    ctx.stroke();
                    labelFit(ctx, order === 1 ? '合成基本週期 T₁' : `合成基本週期 T₁/${order}`,
                        px0 + combinedPeriod / 2, mid + 56, C.rose, 11, 'center',
                        { maxW: w - 32, clampW: w });
                } else {
                    labelFit(ctx, '全部振幅為 0：沒有振動，基本週期未定義',
                        w / 2, mid + 56, C.muted, 11, 'center',
                        { maxW: w - 32, clampW: w });
                }
            }
        };

        /* 9. 司乃耳定律與全反射 -------------------------------------------- */
        /* 三種視角對應三種課堂現象：
         *   ray     單一光線：折射角、臨界角，以及反射率 R 隨入射角連續增加到 100%
         *   fan     水下光扇：點光源在水中向上射出一扇光（對應「水槽光扇」實驗影片）
         *   window  斯涅爾窗：潛水者仰望水面（對應水下仰拍照片與泳池水下影片）
         * 物理模型：平面（或小振幅起伏）界面、司乃耳定律、非偏振光的菲涅耳反射率。 */
        function fresnelR(n1, n2, cosi) {
            const c = Math.max(0, Math.min(1, cosi));
            const sint2 = (n1 / n2) * (n1 / n2) * (1 - c * c);
            if (sint2 >= 1) return 1;
            const cost = Math.sqrt(1 - sint2);
            const rs = (n1 * c - n2 * cost) / (n1 * c + n2 * cost);
            const rp = (n1 * cost - n2 * c) / (n1 * cost + n2 * c);
            return (rs * rs + rp * rp) / 2;
        }
        const SNELL_MEDIA = { '1.33': '水', '1.5': '玻璃', '2.42': '鑽石' };
        const snellMediumName = (n) => SNELL_MEDIA[String(n)] || '介質';
        const SNELL_FAN_STEP = 6, SNELL_FAN_MAX = 84;
        const SNELL_FAN_COLORS = ['#ff5a5f', '#ffb347', '#ffe66d', '#7ee081', '#5ec8ff', '#b28dff'];
        const SNELL_POOL_H = 3.5;     // 池深 (m)
        const SNELL_BALL = { z: 0.8, r: 0.32 }; // 浮球中心深度與半徑 (m)
        const SNELL_FOV = 80;         // 魚眼半視角 (°)：影像邊緣離正上方 80°

        /* 斯涅爾窗的側視版面與仰望影像版面：寬螢幕左右並排，窄螢幕上下堆疊 */
        function snellWindowLayout(w, h) {
            if (w >= 640) {
                const V = Math.min(h - 16, Math.floor(w * 0.46));
                return { sec: { x: 8, y: 8, w: w - V - 28, h: h - 16 }, view: { x: w - V - 8, y: Math.round((h - V) / 2), s: V } };
            }
            const V = Math.min(w - 16, 330);
            return { sec: { x: 8, y: 8, w: w - 16, h: 240 }, view: { x: Math.round((w - V) / 2), y: 262, s: V } };
        }

        /* 仰望影像：從眼睛對每個像素方向做光線追蹤。
         * 水面點的法線含小振幅波動；折射到空氣則取天空顏色，入射角超過臨界角或部分反射時
         * 取反射光線打到的池底／浮球；最後依水中路徑長加上水色衰減。 */
        const snellView = { key: '', img: null, N: 0, dirs: null };
        function snellViewImage(N, p, t) {
            const n = Number(p.nw), d = p.eyeD, H = SNELL_POOL_H;
            const ocean = p.scene === 'ocean';
            const amp = p.ripple * 0.10;
            const tq = amp > 0 ? Math.round(t * 30) / 30 : 0;
            const key = [N, n, d, p.sun, p.objX, p.scene, p.ripple, tq].join('|');
            if (snellView.key === key && snellView.img) return snellView.img;
            if (snellView.N !== N || !snellView.dirs) {
                const dirs = new Float32Array(N * N * 4);
                const c = (N - 1) / 2, aMax = rad(SNELL_FOV);
                for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
                    const k = (j * N + i) * 4;
                    const rho = Math.hypot(i - c, j - c) / (N / 2);
                    if (rho > 1) { dirs[k + 3] = -1; continue; }
                    const a = rho * aMax, ph = Math.atan2(-(j - c), i - c);
                    dirs[k] = Math.sin(a) * Math.cos(ph); dirs[k + 1] = Math.sin(a) * Math.sin(ph);
                    dirs[k + 2] = Math.cos(a); dirs[k + 3] = rho;
                }
                snellView.dirs = dirs; snellView.N = N;
                snellView.img = new ImageData(N, N);
            }
            const dirs = snellView.dirs, img = snellView.img, D = img.data;
            const e = rad(p.sun);
            const sx = -Math.cos(e), sz = Math.sin(e);           // 太陽在 −x 方向的天空
            const sunCos = Math.cos(rad(2.2)), glowK = 260;
            const warm = Math.max(0, Math.min(1, (16 - p.sun) / 12));     // 低角度太陽：暮色
            const skyDim = 0.55 + 0.45 * Math.min(1, p.sun / 25);
            const sunRGB = [255, 248 - 70 * warm, 228 - 150 * warm], glowRGB = [255, 236 - 70 * warm, 190 - 110 * warm];
            const bx = p.objX, bz = -SNELL_BALL.z, br = SNELL_BALL.r;
            const water = ocean ? [6, 34, 62] : [38, 150, 168];
            const L = ocean ? 11 : 9;
            const waves = [[2.6, 0.0, 1.1, 1.0], [-1.3, 3.1, 1.6, 0.7], [4.2, -2.4, 2.3, 0.45]];
            const out = [0, 0, 0];

            const hitBall = (ox, oy, oz, vx, vy, vz, tmax) => {
                const lx = ox - bx, ly = oy, lz = oz - bz;
                const b = lx * vx + ly * vy + lz * vz;
                const cc = lx * lx + ly * ly + lz * lz - br * br;
                const disc = b * b - cc;
                if (disc < 0) return -1;
                const s = -b - Math.sqrt(disc);
                return (s > 1e-4 && s < tmax) ? s : -1;
            };
            const ballColor = (px, py, pz) => {
                const nx = (px - bx) / br, ny = py / br, nz = (pz - bz) / br;
                const lam = 0.55 + 0.45 * Math.max(0, nz * 0.9 + nx * 0.3);
                out[0] = 232 * lam; out[1] = 70 * lam; out[2] = 52 * lam;
            };
            /* 水下場景：沿方向 v 從 (ox,oy,oz) 出發（向下或水平） */
            const below = (ox, oy, oz, vx, vy, vz, path0) => {
                const sb = hitBall(ox, oy, oz, vx, vy, vz, 60);
                let path;
                if (sb > 0) { ballColor(ox + vx * sb, oy + vy * sb, oz + vz * sb); path = path0 + sb; }
                else if (ocean || vz > -1e-3) {
                    out[0] = water[0] * 0.35; out[1] = water[1] * 0.35; out[2] = water[2] * 0.45; return;
                } else {
                    const s = (oz + H) / -vz;
                    const fx = ox + vx * s, fy = oy + vy * s;
                    path = path0 + s;
                    const lane = 2.5, lw = 0.13;
                    const mx = ((fx % lane) + lane) % lane;
                    const onLine = (mx < lw || mx > lane - lw) && Math.abs(fy) < 11;
                    const tee = Math.abs(Math.abs(fy) - 11) < lw && (mx < 0.55 || mx > lane - 0.55);
                    const tile = (((Math.floor(fx * 4) + Math.floor(fy * 4)) & 1) ? 0.97 : 1);
                    if (onLine || tee) { out[0] = 28; out[1] = 44; out[2] = 104; }
                    else { out[0] = 214 * tile; out[1] = 240 * tile; out[2] = 240 * tile; }
                }
                const f = Math.exp(-path / L);
                out[0] = water[0] + (out[0] - water[0]) * f;
                out[1] = water[1] + (out[1] - water[1]) * f;
                out[2] = water[2] + (out[2] - water[2]) * f;
            };
            const sky = (vx, vy, vz) => {
                const el = Math.max(0, vz);
                const tz = Math.pow(el, 0.55);
                let r = (200 + (52 - 200) * tz) * skyDim, g = (226 + (128 - 226) * tz) * skyDim, b = (240 + (206 - 240) * tz) * skyDim;
                // 雲：投影到高空水平面，越近地平線越擠
                if (el > 0.06) {
                    const cx = vx / el, cy = vy / el;
                    const cv = Math.sin(cx * 1.3 + 0.4) * Math.sin(cy * 1.1 - 0.7) + 0.55 * Math.sin(cx * 2.7 - cy * 1.9 + 1.2);
                    const a = Math.max(0, Math.min(1, (cv - 0.45) * 2.4)) * Math.min(1, (el - 0.06) * 6) * 0.85;
                    r += (250 - r) * a; g += (250 - g) * a; b += (252 - b) * a;
                }
                // 地平線上的樹林與建築剪影（仰角約 5°–15°）
                const ph = Math.atan2(vy, vx);
                // 泳池：周圍的樹與建築；深海：開闊海面，只剩遠方低矮的島影
                const ridge = ocean
                    ? 0.006 + 0.03 * Math.max(0, Math.sin(ph * 3 + 2.2)) * (0.5 + 0.5 * Math.sin(ph * 11))
                    : 0.09 + 0.16 * (0.5 + 0.5 * Math.sin(ph * 5 + 0.5)) * (0.55 + 0.45 * Math.sin(ph * 13));
                if (el < ridge) { r = 40 * skyDim; g = 70 * skyDim; b = 56 * skyDim; }
                // 太陽
                const cs = vx * sx + vz * sz;
                if (cs > sunCos) { r = sunRGB[0]; g = sunRGB[1]; b = sunRGB[2]; }
                else {
                    const gl = Math.min(1, Math.exp((cs - 1) * glowK) * 0.9 + Math.exp((cs - 1) * (18 - 8 * warm)) * (0.25 + 0.35 * warm));
                    r += (glowRGB[0] - r) * gl; g += (glowRGB[1] - g) * gl; b += (glowRGB[2] - b) * gl;
                }
                out[0] = r; out[1] = g; out[2] = b;
            };

            for (let k = 0, q = 0; q < N * N; q++, k += 4) {
                const rho = dirs[k + 3];
                if (rho < 0) { D[k] = 6; D[k + 1] = 10; D[k + 2] = 14; D[k + 3] = 255; continue; }
                const ux = dirs[k], uy = dirs[k + 1], uz = dirs[k + 2];
                const ts = d / uz;                       // 眼睛到水面的路徑長
                const sDirect = hitBall(0, 0, -d, ux, uy, uz, ts);
                let R, G, B;
                if (sDirect > 0) {
                    ballColor(ux * sDirect, uy * sDirect, -d + uz * sDirect);
                    const f = Math.exp(-sDirect / L);
                    R = water[0] + (out[0] - water[0]) * f; G = water[1] + (out[1] - water[1]) * f; B = water[2] + (out[2] - water[2]) * f;
                } else {
                    const px = ux * ts, py = uy * ts;
                    let gx = 0, gy = 0;
                    if (amp > 0) {
                        for (const [kx, ky, om, a] of waves) {

                            gx += a * kx * cph; gy += a * ky * cph;
                        }
                        gx *= amp / 3; gy *= amp / 3;
                    }
                    const nl = 1 / Math.sqrt(1 + gx * gx + gy * gy);
                    const Nx = -gx * nl, Ny = -gy * nl, Nz = nl;
                    const cosi = Math.max(0, ux * Nx + uy * Ny + uz * Nz);
                    const Rf = fresnelR(n, 1, cosi);
                    // 反射光（向下）
                    const rx = ux - 2 * cosi * Nx, ry = uy - 2 * cosi * Ny, rz = Math.min(-1e-3, uz - 2 * cosi * Nz);
                    below(px, py, 0, rx, ry, rz, ts);
                    R = out[0] * Rf; G = out[1] * Rf; B = out[2] * Rf;
                    if (Rf < 1) {
                        const sint2 = n * n * (1 - cosi * cosi);
                        const cost = Math.sqrt(1 - sint2);
                        const vx = n * ux + (cost - n * cosi) * Nx, vy = n * uy + (cost - n * cosi) * Ny, vz = n * uz + (cost - n * cosi) * Nz;
                        sky(vx, vy, vz);
                        const f = Math.exp(-ts / (L * 2.2)), T = 1 - Rf;

                        G += T * (water[1] + (out[1] - water[1]) * f);
                        B += T * (water[2] + (out[2] - water[2]) * f);
                    }
                }
                const vig = rho > 0.93 ? 1 - (rho - 0.93) * 6 : 1;
                D[k] = R * vig; D[k + 1] = G * vig; D[k + 2] = B * vig; D[k + 3] = 255;
