                ctx.moveTo(xS, yy - 5); ctx.lineTo(xS, yy + 5);
                ctx.stroke();
                label(ctx, `L = ${p.L.toFixed(1)} m`, (xSl + xS) / 2, yy - 7, C.muted, 11, 'center');

                // P 點與 y
                ctx.fillStyle = '#ffb347';
                ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, Math.PI * 2); ctx.fill();
                label(ctx, 'P', P.x + 10, P.y + 4, '#b06a00', 13);
                ctx.strokeStyle = 'rgba(176,106,0,0.8)'; ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(xS + 16, O.y); ctx.lineTo(xS + 16, P.y);
                ctx.moveTo(xS + 11, O.y); ctx.lineTo(xS + 21, O.y);
                ctx.moveTo(xS + 11, P.y); ctx.lineTo(xS + 21, P.y);
                ctx.stroke();
                label(ctx, 'y', xS + 24, (O.y + P.y) / 2 + 4, '#b06a00', 12);

                /* 放大插圖：把 S₁S₂A 這個極小的三角形放大（比照課本圖 b 的作法） */
                const iw2 = Math.min(232, Math.max(150, w * 0.28)), ih2 = 132;
                const ix = Math.min(w - iw2 - 10, xSl + 46);          // 放在左下的空白區，避免蓋住 P 點
                const iy = y1 - ih2 - 6;
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.strokeStyle = 'rgba(107,70,193,0.35)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(ix, iy, iw2, ih2); ctx.fill(); ctx.stroke();
                label(ctx, '🔍 放大：Δℓ = d sinθ', ix + 8, iy + 16, C.violet, 11);
                const thD = rad(30);                                        // 插圖用的誇大角度
                const dI = 62;
                const b1 = { x: ix + 40, y: iy + 40 + dI / 2 };              // 較遠的縫
                const b2 = { x: ix + 40, y: iy + 40 - dI / 2 };              // 較近的縫
                const uu = { x: Math.cos(thD), y: -Math.sin(thD) };
                const pj = (b2.x - b1.x) * uu.x + (b2.y - b1.y) * uu.y;
                const bA = { x: b1.x + uu.x * pj, y: b1.y + uu.y * pj };
                ctx.strokeStyle = C.orange; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
                ctx.strokeStyle = col(0.85); ctx.lineWidth = 1.8;
                ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b1.x + uu.x * 150, b1.y + uu.y * 150); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(b2.x, b2.y); ctx.lineTo(b2.x + uu.x * 150, b2.y + uu.y * 150); ctx.stroke();
                ctx.fillStyle = 'rgba(107,70,193,0.22)';
                ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(bA.x, bA.y); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = C.violet; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(bA.x, bA.y); ctx.stroke();
                dashed(ctx, b2.x, b2.y, bA.x, bA.y, 'rgba(107,70,193,0.85)');
                label(ctx, 'd', b1.x - 8, (b1.y + b2.y) / 2 + 4, C.orange, 11, 'right');
                label(ctx, 'Δℓ', (b1.x + bA.x) / 2 - 4, (b1.y + bA.y) / 2 + 16, C.violet, 12);
                /* 沿射線標「往 P 點」時會落到中央線那條水平線上，
                 * 改成往射線的垂直方向偏移，兩者不會再重疊。 */
                labelFit(ctx, '往 P 點',
                         b2.x + uu.x * 150 - uu.y * 14,
                         b2.y + uu.y * 150 + uu.x * 14 - 6,
                         C.muted, 10, 'left', { clampW: w, plate: 1 });
                ctx.strokeStyle = 'rgba(18,49,58,0.5)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(b1.x, b1.y, 26, -thD, 0); ctx.stroke();
                label(ctx, 'θ', b1.x + 31, b1.y - 6, C.ink, 11);
                dashed(ctx, b1.x, b1.y, b1.x + 60, b1.y, 'rgba(18,49,58,0.3)');

                // 判定面板
                const near = Math.abs(q - Math.round(q));
                const bright = near < 0.03;
                const dark = Math.abs(Math.abs(q % 1) - 0.5) < 0.03;
                const verdict = bright ? `亮紋（完全建設性干涉，n = ${Math.abs(Math.round(q))}）`
                    : (dark ? `暗紋（完全破壞性干涉，m = ${Math.round(Math.abs(q) + 0.5)}）`
                        : '介於亮紋與暗紋之間');
                const vcol = bright ? C.green : (dark ? C.rose : C.muted);
                const bw = Math.min(330, w - 16);
                ctx.fillStyle = 'rgba(255,255,255,0.93)';
                ctx.strokeStyle = 'rgba(18,49,58,0.16)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(8, h - 66, bw, 60); ctx.fill(); ctx.stroke();
                label(ctx, `Δℓ = d sinθ ≈ d·y/L = ${q.toFixed(2)} λ`, 18, h - 48, C.ink, 12);
                label(ctx, `y = ${(q * dy * 100).toFixed(2)} cm　　Δy = Lλ/d = ${(dy * 1000).toFixed(2)} mm`, 18, h - 31, C.muted, 11);
                label(ctx, `⇒ P 點為 ${verdict}`, 18, h - 13, vcol, 12);
                /* 比例聲明放最後一行，與上方結論句錯開，窄畫布時自動縮字 */
                labelFit(ctx, '遠屏、中央附近：L ≫ d，|y| ≪ L 才可小角近似', w - 8, h - 4, C.muted, 10, 'right',
                         { clampW: w, maxW: w - 16 });
            }
        };
        /* 13. 光的繞射實驗（單狹縫） --------------------------------------- */
        LABS.diffraction = {
            name: '光的繞射實驗（單狹縫）',
            cycle: 1.96,
            tag: 'N20',
            hint: '三段推理：① 縫上排滿點光源，子波互相干涉而擴散（惠更斯原理）；② 最大光程差 Δℓ_AB = a sinθ ≈ a·y/L；③ 把縫等分成偶數區，區與區成對抵消 ⇒ 暗紋。第三個模式就是「為什麼 a sinθ = mλ 是暗紋而不是亮紋」的完整論證。',
            note: '先用「惠更斯子波」的無單位 a/λ 比例模型觀察展開趨勢；右側顯示遠場角度分布的示意，第一暗紋滿足 sinθ₁ = λ/a。再切換「最大光程差」或「成對抵消」，輸入實際 λ、a、L 數值。暗紋方向可將狹縫等分成 2m 區，相鄰對應點差 λ/2 而抵消；遠屏、中央附近的小角近似下，暗紋位置 yₘ ≈ mLλ/a，中央亮紋寬度約 2Lλ/a。',
            height: 470,
            modes: [
                { key: 'huygens', label: '惠更斯子波' },
                { key: 'pathdiff', label: '最大光程差' },
                { key: 'cancel', label: '暗紋：成對抵消' }
            ],
            controls: [
                { key: 'lam', label: '波長 λ (nm)', min: 400, max: 700, step: 5, value: 550, fmt: (v) => `${v} nm`, only: ['pathdiff', 'cancel'] },
                { key: 'a', label: '狹縫寬度 a (μm)', min: 10, max: 200, step: 2, value: 60, fmt: (v) => `${v} μm`, only: ['pathdiff', 'cancel'] },
                { key: 'L', label: '屏幕距離 L (m)', min: 0.3, max: 2.5, step: 0.1, value: 1.2, fmt: (v) => `${v.toFixed(1)} m`, only: ['pathdiff', 'cancel'] },
                { key: 'yn', label: 'P 點高度（以 Lλ/a 為單位）', min: 0, max: 320, step: 5, value: 100, fmt: (v) => `${(v / 100).toFixed(2)} Lλ/a`, only: ['pathdiff'] },
                { key: 'zones', label: '把狹縫等分成幾區', min: 2, max: 6, step: 2, value: 2, fmt: (v) => `${v} 區（第 ${v / 2} 暗紋）`, only: ['cancel'] },
                { key: 'aw', label: '縫寬／波長 a/λ（無單位比例）', min: 0.5, max: 8, step: 0.25, value: 2.5, fmt: (v) => `a / λ = ${v.toFixed(2)}`, only: ['huygens'] }
            ],
            readouts: (p) => {
                if (p.mode === 'huygens') {
                    const theta = p.aw >= 1 ? deg(Math.asin(1 / p.aw)) : null;
                    return [
                        { label: '縫寬／波長 a/λ', value: `${p.aw.toFixed(2)}（無單位）` },
                        { label: '第一暗紋角度 |θ₁|', value: theta === null ? '無第一暗紋方向' : `${theta.toFixed(1)}°${p.aw === 1 ? '（側向邊界）' : '（左右各一）'}` },
                        { label: '中央亮區的角度範圍', value: theta === null ? '前方 −90° ～ +90° 內無暗紋' : `−${theta.toFixed(1)}° ～ +${theta.toFixed(1)}°` },
                        { label: '觀察趨勢', value: 'a/λ 越小，展開角越大' }
                    ];
                }
                const lam = p.lam * 1e-9, a = p.a * 1e-6;
                const dy = p.L * lam / a;
                if (p.mode === 'cancel') {
                    const m = Math.round(p.zones / 2);
                    return [
                        { label: '等分區數', value: `${Math.round(p.zones)} 區 ⇒ 兩兩成對抵消` },
                        { label: '最大光程差', value: `Δℓ_AB = ${m}λ` },
                        { label: '結果', value: `第 ${m} 暗紋（y = ${m}·Lλ/a）` },
                        { label: '暗紋位置', value: `y_${m} = ${(m * dy * 1000).toFixed(2)} mm` }];
                }
                if (p.mode === 'pathdiff') {
                    const q = p.yn / 100;
                    const near = Math.abs(q - Math.round(q));
                    const isDark = q >= 0.5 && near < 0.04;
                    return [
                        { label: 'Δℓ_AB / λ', value: q.toFixed(2) },
                        { label: 'P 點高度 y', value: `${(q * dy * 1000).toFixed(2)} mm` },
                        { label: '判定', value: q < 1 ? '中央亮紋範圍內' : (isDark ? `第 ${Math.round(q)} 暗紋` : '亮暗之間（亮度已大幅衰減）') },
                        { label: '暗紋間距 Lλ/a', value: `${(dy * 1000).toFixed(2)} mm` }];
                }
                return [];
            },
            draw: (ctx, w, h, p, t) => {
                const lam = p.lam * 1e-9, aa = p.a * 1e-6;
                const dyR = p.L * lam / aa;
                const wl = p.mode === 'huygens' ? 550 : p.lam;
                let rgb;
                if (wl < 440) rgb = [130, 0, 200];
                else if (wl < 490) rgb = [0, 90, 235];
                else if (wl < 510) rgb = [0, 180, 190];
                else if (wl < 580) rgb = [70, 200, 60];
                else if (wl < 645) rgb = [235, 160, 0];
                else rgb = [225, 40, 40];
                const col = (al) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${al})`;
                const y0 = 8, y1 = h - 74, cy = (y0 + y1) / 2, TH = y1 - y0;
                const xSl = Math.max(60, w * 0.14);
                const xS = Math.max(xSl + 150, w - 148);
                const QMAX = 3.4;                                   // 螢幕上半高＝3.4 個 Lλ/a
                const sinc2 = (q) => {
                    const b = Math.PI * q;
                    if (Math.abs(b) < 1e-7) return 1;
                    const s = Math.sin(b) / b;
                    return s * s;
                };
                const yToQDefault = (py) => (cy - py) / (TH * 0.5) * QMAX;

                /* 螢幕上的條紋帶與強度曲線（三個模式共用；由真實的 sinc² 分布繪製）
                   mapQ 可覆寫「螢幕高度 → Δℓ_AB/λ」的對應，讓條紋與畫面上的繞射場一致。 */
                const drawScreen = (mapQ) => {
                    const yToQ = mapQ || yToQDefault;
                    for (let py = y0; py <= y1; py++) {
                        const I = sinc2(yToQ(py));
                        ctx.fillStyle = `rgb(${Math.round(rgb[0] * I + 12 * (1 - I))},${Math.round(rgb[1] * I + 18 * (1 - I))},${Math.round(rgb[2] * I + 24 * (1 - I))})`;
                        ctx.fillRect(xS, py, 22, 1);
                    }
                    ctx.strokeStyle = 'rgba(18,49,58,0.3)'; ctx.lineWidth = 1;
                    ctx.strokeRect(xS, y0, 22, TH);
                    labelFit(ctx, '屏幕', xS + 11, y0 + 12, '#f4fafb', 10, 'center', { maxW: 22, min: 10, clampW: w });
                    const cw = w - (xS + 30) - 6;
                    if (cw > 30) {
                        ctx.strokeStyle = col(0.95); ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let py = y0; py <= y1; py++) {
                            const X = xS + 30 + sinc2(yToQ(py)) * cw;
                            py === y0 ? ctx.moveTo(X, py) : ctx.lineTo(X, py);
                        }
                        ctx.stroke();
                        // 暗紋位置標記：沿螢幕掃描，找 |q| 通過整數的位置
                        for (let m = 1; m <= 3; m++) {
                            [-1, 1].forEach((sg) => {
                                let py = null;
                                for (let yy = y0 + 1; yy <= y1; yy++) {
                                    const qa = yToQ(yy), qb = yToQ(yy - 1);
                                    if ((qa - sg * m) * (qb - sg * m) <= 0) { py = yy; break; }
                                }
                                if (py === null || py < y0 + 2 || py > y1 - 2) return;
                                dashed(ctx, xS + 24, py, w - 6, py, 'rgba(18,49,58,0.22)');
                                label(ctx, `暗${m}`, w - 8, py - 3, C.muted, 9, 'right');
                            });
                        }
                        label(ctx, '強度', xS + 30, y0 + 12, C.muted, 10);
                    }
                    // 只在圖示實際包含 q = ±1 時標示中央亮紋範圍。
                    let pA = null, pB = null;
                    for (let yy = y0 + 1; yy <= y1; yy++) {
                        if ((yToQ(yy) - 1) * (yToQ(yy - 1) - 1) <= 0) pA = yy;
                        if ((yToQ(yy) + 1) * (yToQ(yy - 1) + 1) <= 0) pB = yy;
                    }
                    if (pA !== null && pB !== null) {
                        ctx.strokeStyle = C.rose; ctx.lineWidth = 1.4;
                        ctx.beginPath();
                        ctx.moveTo(xS - 10, pA); ctx.lineTo(xS - 10, pB);
                        ctx.moveTo(xS - 15, pA); ctx.lineTo(xS - 5, pA);
                        ctx.moveTo(xS - 15, pB); ctx.lineTo(xS - 5, pB);
                        ctx.stroke();
                        label(ctx, p.mode === 'huygens' ? '中央亮紋' : '2Lλ/a', xS - 18, cy + 4, C.rose, 10, 'right');
                    }
                };

                /* ================= 模式一：惠更斯子波 ================= */
                if (p.mode === 'huygens') {
                    const lamPix = 22;
                    const slitPix = Math.max(8, p.aw * lamPix);
                    const k = 2 * Math.PI / lamPix;
                    const om = 3.2;
                    const NS = Math.max(6, Math.min(22, Math.round(slitPix / 6) + 5));
                    const srcs = [];
                    for (let i = 0; i < NS; i++) srcs.push(cy - slitPix / 2 + slitPix * i / (NS - 1));

                    // 縫前的平面波
                    ctx.save(); ctx.beginPath(); ctx.rect(0, y0, xSl, TH); ctx.clip();
                    ctx.strokeStyle = col(0.55); ctx.lineWidth = 2;
                    for (let n = 0; n < 20; n++) {
                        const X = xSl - lamPix + ((t * 30) % lamPix) - n * lamPix;   // 往右走向狹縫
                        if (X < 0) break;
                        ctx.beginPath(); ctx.moveTo(X, y0); ctx.lineTo(X, y1); ctx.stroke();
                    }
                    ctx.restore();

                    // 縫後：子波疊加
                    const step = 5;
                    const fw = xS - xSl, fh = TH;
                    const iw = Math.ceil(fw / step) * step, ih = Math.ceil(fh / step) * step;
                    const img = ctx.createImageData(iw, ih);
                    for (let yy = 0; yy < ih; yy += step) {
                        for (let xx = 0; xx < iw; xx += step) {
                            const gx = xSl + xx, gy = y0 + yy;
                            let sr = 0, si = 0;
                            for (let i = 0; i < NS; i++) {
                                const r = Math.hypot(gx - xSl, gy - srcs[i]);
                                const ph = k * r - om * t;
                                const amp = 1 / Math.sqrt(Math.max(r, 10));
                                sr += Math.cos(ph) * amp; si += Math.sin(ph) * amp;
                            }
                            const v = Math.max(0, Math.min(1, Math.abs(sr) * (6.4 / Math.sqrt(NS))));
                            for (let ddy = 0; ddy < step; ddy++) {
                                const row = (yy + ddy) * iw;
                                for (let ddx = 0; ddx < step; ddx++) {
                                    const idx = (row + xx + ddx) * 4;
                                    img.data[idx] = rgb[0] * v + 10 * (1 - v);
                                    img.data[idx + 1] = rgb[1] * v + 16 * (1 - v);
                                    img.data[idx + 2] = rgb[2] * v + 22 * (1 - v);
                                    img.data[idx + 3] = 255;
                                }
                            }
                        }
                    }
                    const off = getOffscreen(iw, ih);
                    off.ctx.putImageData(img, 0, 0);
                    ctx.drawImage(off.canvas, 0, 0, iw, ih, xSl, y0, fw, fh);

                    // 遮板與縫上的點光源
                    ctx.fillStyle = '#3b5a66';
                    ctx.fillRect(xSl - 5, y0, 10, cy - slitPix / 2 - y0);
                    ctx.fillRect(xSl - 5, cy + slitPix / 2, 10, y1 - (cy + slitPix / 2));
                    ctx.fillStyle = C.orange;
                    for (let i = 0; i < NS; i++) {
                        ctx.beginPath(); ctx.arc(xSl, srcs[i], 2.6, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.strokeStyle = C.orange; ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(xSl - 24, cy - slitPix / 2); ctx.lineTo(xSl - 24, cy + slitPix / 2);
                    ctx.moveTo(xSl - 29, cy - slitPix / 2); ctx.lineTo(xSl - 19, cy - slitPix / 2);
                    ctx.moveTo(xSl - 29, cy + slitPix / 2); ctx.lineTo(xSl - 19, cy + slitPix / 2);
                    ctx.stroke();
                    label(ctx, 'a', xSl - 32, cy + 4, C.orange, 12, 'right');
                    // 依圖示角度畫遠場 sinc² 分布；左側有限子波場用來觀察趨勢。
                    const fwPix = xS - xSl;
                    drawScreen((py) => p.aw * Math.sin(Math.atan2(cy - py, Math.max(fwPix, 1))));
                    ctx.fillStyle = 'rgba(255,255,255,0.88)';
                    const fieldNoteW = Math.min(260, xS - xSl - 16);
                    ctx.fillRect(xSl + 8, y0 + 6, fieldNoteW, 36);
                    labelFit(ctx, '縫上各點發出同相子波', xSl + 14, y0 + 21, '#0a2f3a', 11, 'left', { maxW: fieldNoteW - 12, min: 10, clampW: w });
                    labelFit(ctx, `a/λ = ${p.aw.toFixed(2)}（比例示意）`, xSl + 14, y0 + 36, '#0a2f3a', 11, 'left', { maxW: fieldNoteW - 12, min: 10, clampW: w });
                    labelFit(ctx, 'a/λ 越小，展開角越大；本模式不標實際長度', 8, h - 12, C.ink, 12, 'left', { maxW: w - 16, min: 10, clampW: w });
                    return;
                }

                /* ================= 模式二：最大光程差 ================= */
                if (p.mode === 'pathdiff') {
                    const q = p.yn / 100;
                    const aPix = Math.min(TH * 0.42, 120);
                    const A = { x: xSl, y: cy - aPix / 2 };
                    const B = { x: xSl, y: cy + aPix / 2 };
                    const P = { x: xS, y: Math.max(y0 + 6, Math.min(y1 - 6, cy - (q / QMAX) * (TH * 0.46))) };

                    for (let i = 0; i < 6; i++) {
                        const yy = y0 + TH * (i + 0.5) / 6;
                        arrow(ctx, 8, yy, xSl - 14, yy, col(0.7), 1.4);
                    }
                    ctx.fillStyle = '#3b5a66';
                    ctx.fillRect(xSl - 5, y0, 10, A.y - y0);
                    ctx.fillRect(xSl - 5, B.y, 10, y1 - B.y);
                    dashed(ctx, xSl, cy, xS, cy, 'rgba(18,49,58,0.45)');
                    label(ctx, "O'", xS - 10, cy + 15, C.muted, 11, 'right');
                    label(ctx, '中央線', (xSl + xS) / 2, cy - 6, C.muted, 10, 'center');

                    // 縫上多點到 P 的光線
                    for (let i = 0; i <= 6; i++) {
                        const yy = A.y + (B.y - A.y) * i / 6;
                        ctx.strokeStyle = col(i === 0 || i === 6 ? 0.95 : 0.4);
                        ctx.lineWidth = (i === 0 || i === 6) ? 2 : 1.1;
                        ctx.beginPath(); ctx.moveTo(xSl, yy); ctx.lineTo(P.x, P.y); ctx.stroke();
                    }
                    // 由 A 對 BP 作垂足 C ⇒ BC = Δℓ_AB
                    const ux = P.x - B.x, uy = P.y - B.y;
                    const uLen = Math.max(Math.hypot(ux, uy), 1e-6);
                    const ex = ux / uLen, ey = uy / uLen;
                    const pj = (A.x - B.x) * ex + (A.y - B.y) * ey;
                    const Cc = { x: B.x + ex * pj, y: B.y + ey * pj };
                    ctx.fillStyle = 'rgba(107,70,193,0.22)';
                    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(Cc.x, Cc.y); ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = C.violet; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.lineTo(Cc.x, Cc.y); ctx.stroke();
                    dashed(ctx, A.x, A.y, Cc.x, Cc.y, 'rgba(107,70,193,0.85)');
                    ctx.fillStyle = C.violet;
                    ctx.beginPath(); ctx.arc(Cc.x, Cc.y, 3, 0, Math.PI * 2); ctx.fill();
                    label(ctx, 'C', Cc.x + 7, Cc.y + 14, C.violet, 11);

                    [[A, 'A'], [B, 'B']].forEach(([s, nm]) => {
                        ctx.fillStyle = C.orange;
                        ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
                        label(ctx, nm, s.x - 9, s.y + 4, C.orange, 12, 'right');
                    });
                    ctx.fillStyle = C.muted;
                    ctx.beginPath(); ctx.arc(xSl, cy, 2.6, 0, Math.PI * 2); ctx.fill();
                    label(ctx, 'O', xSl - 9, cy + 16, C.muted, 11, 'right');
                    ctx.strokeStyle = C.orange; ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(xSl - 26, A.y); ctx.lineTo(xSl - 26, B.y);
                    ctx.moveTo(xSl - 31, A.y); ctx.lineTo(xSl - 21, A.y);
                    ctx.moveTo(xSl - 31, B.y); ctx.lineTo(xSl - 21, B.y);
                    ctx.stroke();
                    label(ctx, 'a', xSl - 34, cy + 4, C.orange, 12, 'right');

                    ctx.fillStyle = '#c9b79a'; ctx.fillRect(xS, y0, 7, TH);
                    drawScreen();
                    ctx.fillStyle = '#ffb347';
                    ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, Math.PI * 2); ctx.fill();
                    label(ctx, 'P', P.x + 10, P.y - 6, '#b06a00', 13);

                    ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
                    const yy2 = y1 + 4;
                    ctx.beginPath();
                    ctx.moveTo(xSl, yy2); ctx.lineTo(xS, yy2);
                    ctx.moveTo(xSl, yy2 - 5); ctx.lineTo(xSl, yy2 + 5);
                    ctx.moveTo(xS, yy2 - 5); ctx.lineTo(xS, yy2 + 5);
                    ctx.stroke();
                    label(ctx, `L = ${p.L.toFixed(1)} m`, (xSl + xS) / 2, yy2 - 7, C.muted, 11, 'center');

                    const near = Math.abs(q - Math.round(q));
                    const isDark = q >= 0.5 && near < 0.04;
                    const verdict = q < 1 ? '仍在中央亮紋範圍內' : (isDark ? `第 ${Math.round(q)} 暗紋` : '亮暗之間');
                    const bw = Math.min(340, w - 16);
                    ctx.fillStyle = 'rgba(255,255,255,0.93)';
                    ctx.strokeStyle = 'rgba(18,49,58,0.16)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.rect(8, h - 66, bw, 60); ctx.fill(); ctx.stroke();
                    label(ctx, `最大光程差 Δℓ_AB = BC = a sinθ ≈ a·y/L = ${q.toFixed(2)} λ`, 18, h - 48, C.ink, 12);
                    labelFit(ctx, `y = ${(q * dyR * 1000).toFixed(2)} mm；Lλ/a = ${(dyR * 1000).toFixed(2)} mm`, 18, h - 31, C.muted, 11, 'left', { maxW: w - 36, min: 10, clampW: w });
                    label(ctx, `⇒ P 點：${verdict}`, 18, h - 13, isDark ? C.rose : C.muted, 12);
                    return;
                }

                /* ================= 模式三：暗紋的成對抵消 ================= */
                const Z = Math.max(2, Math.round(p.zones / 2) * 2);        // 偶數區
                const m = Z / 2;                                            // 第 m 暗紋
                const aPix = Math.min(TH * 0.58, 190);
                const A = { x: xSl, y: cy - aPix / 2 };
                const B = { x: xSl, y: cy + aPix / 2 };
                const P = { x: xS, y: Math.max(y0 + 8, cy - (m / QMAX) * (TH * 0.46)) };
                const zoneCols = ['rgba(11,111,146,0.20)', 'rgba(194,38,74,0.20)', 'rgba(18,128,92,0.20)'];

                for (let i = 0; i < 6; i++) {
                    const yy = y0 + TH * (i + 0.5) / 6;
                    arrow(ctx, 8, yy, xSl - 14, yy, col(0.6), 1.3);
                }
                ctx.fillStyle = '#3b5a66';
                ctx.fillRect(xSl - 5, y0, 10, A.y - y0);
                ctx.fillRect(xSl - 5, B.y, 10, y1 - B.y);
                dashed(ctx, xSl, cy, xS, cy, 'rgba(18,49,58,0.4)');
                ctx.fillStyle = '#c9b79a'; ctx.fillRect(xS, y0, 7, TH);

                // 分區色帶
                const zh = aPix / Z;
                for (let z = 0; z < Z; z++) {
                    ctx.fillStyle = zoneCols[Math.floor(z / 2) % 3];
                    ctx.fillRect(xSl - 5, A.y + z * zh, 10, zh);
                    ctx.strokeStyle = 'rgba(18,49,58,0.35)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(xSl - 7, A.y + z * zh); ctx.lineTo(xSl + 7, A.y + z * zh); ctx.stroke();
                    label(ctx, `${z + 1}`, xSl - 12, A.y + z * zh + zh / 2 + 4, C.muted, 10, 'right');
                }
                ctx.beginPath(); ctx.moveTo(xSl - 7, B.y); ctx.lineTo(xSl + 7, B.y); ctx.stroke();

                // 成對抵消：第 2j 區的每一點，與第 2j+1 區對應點的光程差恰為 λ/2
                const pairPhase = (t * 0.6) % 1;
                for (let j = 0; j < Z / 2; j++) {
                    const top = A.y + (2 * j) * zh;
                    const c1 = top + zh * (0.2 + 0.6 * pairPhase);
                    const c2 = c1 + zh;
                    const cc = zoneCols[j % 3].replace('0.20', '0.95');
                    ctx.strokeStyle = cc; ctx.lineWidth = 1.8;
                    ctx.beginPath(); ctx.moveTo(xSl, c1); ctx.lineTo(P.x, P.y); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(xSl, c2); ctx.lineTo(P.x, P.y); ctx.stroke();
                    ctx.fillStyle = cc;
                    ctx.beginPath(); ctx.arc(xSl, c1, 3.4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(xSl, c2, 3.4, 0, Math.PI * 2); ctx.fill();
                    // λ/2 標記
                    const mx = xSl + (P.x - xSl) * 0.30;
                    const my1 = c1 + (P.y - c1) * 0.30, my2 = c2 + (P.y - c2) * 0.30;
                    ctx.strokeStyle = C.rose; ctx.lineWidth = 1.2;
                    ctx.beginPath(); ctx.moveTo(mx, my1); ctx.lineTo(mx, my2); ctx.stroke();
                    if (j === 0) labelFit(ctx, 'Δℓ = λ/2 ⇒ 相消', mx + 6, (my1 + my2) / 2 + 4, C.rose, 11, 'left', { maxW: P.x - mx - 12, min: 10, clampW: w });
                }

                [[A, 'A'], [B, 'B']].forEach(([s, nm]) => {
                    ctx.fillStyle = C.orange;
                    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
                    label(ctx, nm, s.x - 16, s.y + 4, C.orange, 12, 'right');
                });
                drawScreen();
                ctx.fillStyle = '#3a3a3a';
                ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, Math.PI * 2); ctx.fill();
                label(ctx, 'P（暗）', P.x + 10, P.y - 6, C.rose, 12);

                const bw = Math.min(400, w - 16);
                ctx.fillStyle = 'rgba(255,255,255,0.93)';
                ctx.strokeStyle = 'rgba(18,49,58,0.16)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(8, h - 66, bw, 60); ctx.fill(); ctx.stroke();
                labelFit(ctx, `等分 ${Z} 區：相鄰對應點差 λ/2，抵消`, 18, h - 48, C.ink, 12, 'left', { maxW: w - 36, min: 10, clampW: w });
                labelFit(ctx, `最大光程差 a sinθ = ${m}λ`, 18, h - 31, C.violet, 12, 'left', { maxW: w - 36, min: 10, clampW: w });
                labelFit(ctx, `第 ${m} 暗紋：y = ${m}Lλ/a = ${(m * dyR * 1000).toFixed(2)} mm`, 18, h - 13, C.rose, 12, 'left', { maxW: w - 36, min: 10, clampW: w });
            }
        };
        /* 3. 波的疊加原理與獨立性 ------------------------------------------ */
        LABS.superpose = {
            name: '波的疊加原理與獨立性',
            tag: 'N04',
            cycle: 6.0,
            hint: '兩個脈衝相向而行。上方是即時畫面：綠色虛線是 a 波、紫色虛線是 b 波、橘色實線是兩者「位移相加」後的實際繩形。下方把整個過程拆成五格快照，一眼看完「接近 → 開始重疊 → 完全重疊 → 分開 → 各自復原」。用時間軸慢慢拖，可以停在任何一刻比較三條線。',
            note: '綠色虛線是 a 波，紫色虛線是 b 波，橘色實線才是兩者位移相加後的實際繩形。兩個必考重點：① 疊加是帶正負號的「位移相加」（向量和）；一上一下的脈衝重疊時會互相抵消，不會變高。② 波的獨立性：交會之後兩波各自維持原來的波形、振幅與行進方向繼續前進，宛如從未相遇。',
            height: 520,
            modes: [
                { key: 'constructive', label: '建設性干涉（同側）' },
                { key: 'destructive', label: '破壞性干涉（異側）' },
                { key: 'unequal', label: '不等高脈衝（大考題型）' }
            ],
            controls: [
                { key: 'wid', label: '脈衝寬度', min: 0.03, max: 0.10, step: 0.005, value: 0.055, fmt: (v) => `${(v * 100).toFixed(1)}%` },
                { key: 'amp', label: 'a 波振幅 A₁', min: 0.5, max: 1.2, step: 0.05, value: 1.0, fmt: (v) => `${v.toFixed(2)} A` }
            ],
            readouts: (p) => {
                const a1 = p.amp;
                const a2 = p.mode === 'destructive' ? -p.amp : (p.mode === 'unequal' ? p.amp * 0.55 : p.amp);
                const peak = a1 + a2;
                return [
                    { label: 'a 波振幅', value: `${a1.toFixed(2)} A（向上）` },
                    { label: 'b 波振幅', value: `${Math.abs(a2).toFixed(2)} A（${a2 >= 0 ? '向上' : '向下'}）` },
                    { label: '完全重疊時的位移', value: `${peak >= 0 ? '+' : ''}${peak.toFixed(2)} A${Math.abs(peak) < 0.02 ? '（完全抵消）' : ''}` },
                    { label: '交會之後', value: '兩波各自復原（波的獨立性）' }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const CYC = 6.0;
                const u = ((t % CYC) + CYC) % CYC / CYC;                 // 0 → 1
                const a1 = p.amp;
                const a2 = p.mode === 'destructive' ? -p.amp : (p.mode === 'unequal' ? p.amp * 0.55 : p.amp);
                const wid = Math.max(p.wid, 0.02);
                const g = (z) => Math.exp(-z * z);
                // 位置以「畫面比例」表示：a 波由左往右，b 波由右往左
                const xaOf = (uu) => 0.12 + 0.76 * uu;
                const xbOf = (uu) => 0.88 - 0.76 * uu;
                const yA = (xr, uu) => a1 * g((xr - xaOf(uu)) / wid);
                const yB = (xr, uu) => a2 * g((xr - xbOf(uu)) / wid);

                const X0 = 26, X1 = Math.max(X0 + 120, w - 16), SPAN = X1 - X0;
                const px = (xr) => X0 + xr * SPAN;

                /* ---------- 畫一列（成分波虛線 + 合成波實線） ---------- */
                const row = (yc, amp, uu, opts) => {
                    const o = opts || {};
                    axis(ctx, X0, yc, X1, yc);
                    const poly = (fn, color, lw, dash) => {
                        ctx.save();
                        if (dash) ctx.setLineDash([5, 4]);
                        ctx.strokeStyle = color; ctx.lineWidth = lw;
                        ctx.beginPath();
                        for (let i = 0; i <= 260; i++) {
                            const xr = i / 260;
                            const Y = yc - fn(xr) * amp;
                            i === 0 ? ctx.moveTo(px(xr), Y) : ctx.lineTo(px(xr), Y);
                        }
                        ctx.stroke(); ctx.restore();
                    };
                    poly((xr) => yA(xr, uu), 'rgba(18,128,92,0.85)', o.thin ? 1.2 : 1.8, true);
                    poly((xr) => yB(xr, uu), 'rgba(107,70,193,0.85)', o.thin ? 1.2 : 1.8, true);
                    poly((xr) => yA(xr, uu) + yB(xr, uu), '#e08a12', o.thin ? 2.0 : 3.2, false);
                    if (o.arrows) {
                        const ax = px(xaOf(uu)), bx = px(xbOf(uu));
                        arrow(ctx, ax + 10, yc - amp * a1 * 0.55 - 12, ax + 46, yc - amp * a1 * 0.55 - 12, C.green, 1.8);
                        label(ctx, 'a 波', ax + 10, yc - amp * a1 * 0.55 - 18, C.green, 11);
                        arrow(ctx, bx - 10, yc - amp * a2 * 0.55 - 12, bx - 46, yc - amp * a2 * 0.55 - 12, C.violet, 1.8);
                        label(ctx, 'b 波', bx - 10, yc - amp * a2 * 0.55 - 18, C.violet, 11, 'right');
                    }
                };

                /* ---------- 上：即時畫面 ---------- */
                const liveY = h * 0.245;
                const liveAmp = Math.min(46, h * 0.115);
                labelFit(ctx, '虛線：a、b 分波 · 橘實線：位移和', X0, 18, C.ink, 12, 'left', { maxW: SPAN, min: 10, clampW: w });
                row(liveY, liveAmp, u, { arrows: true });

                // 在重疊區標出「相加」的箭頭
                const xm = (xaOf(u) + xbOf(u)) / 2;
                if (Math.abs(xaOf(u) - xbOf(u)) < wid * 3.2) {
                    const X = px(xm);
                    const va = yA(xm, u), vb = yB(xm, u);
                    dashed(ctx, X, liveY - liveAmp * 1.25, X, liveY + liveAmp * 1.25, 'rgba(224,138,18,0.5)');
                    labelFit(ctx, `位移：${va >= 0 ? '+' : ''}${va.toFixed(2)}A ${vb >= 0 ? '+' : '−'} ${Math.abs(vb).toFixed(2)}A = ${(va + vb >= 0 ? '+' : '')}${(va + vb).toFixed(2)}A`,
                        w / 2, 44, '#b06a00', 11, 'center', { maxW: w - 32, min: 10, clampW: w });
                }

                /* ---------- 下：五格快照，看完整過程 ---------- */
                const PH = [0.10, 0.36, 0.50, 0.64, 0.90];
                const CAP = ['① 尚未相遇', '② 開始重疊', '③ 完全重疊', '④ 開始分開', '⑤ 各自復原'];
                const top = h * 0.40, bottom = h - 26;
                const gap = (bottom - top) / PH.length;
                const snapAmp = Math.min(20, gap * 0.30);
                label(ctx, '整個過程（由上而下依時間排列）', X0, top - 10, C.ink, 12);
                PH.forEach((ph, i) => {
                    const yc = top + gap * (i + 0.5);
                    row(yc, snapAmp, ph, { thin: true });
                    label(ctx, CAP[i], X0 - 4, yc - gap * 0.34, C.muted, 10);
                    // 目前時間落在哪一格就highlight
                    if (Math.abs(u - ph) < 0.06) {
                        ctx.strokeStyle = 'rgba(224,138,18,0.55)'; ctx.lineWidth = 1.4;
                        ctx.strokeRect(X0 - 8, yc - gap * 0.42, SPAN + 16, gap * 0.84);
                    }
                });
                /* ③ 那一列的重點說明與左側「③ 完全重疊」共用一行。
                 * 窄畫布放不下時就不畫——畫布下方的重點框已經寫了同一句話，
                 * 硬擠只會疊字。 */
                const midNote = p.mode === 'destructive' ? '③ 一上一下 ⇒ 位移互相抵消，繩子幾乎拉平（不是變高！）'
                    : (p.mode === 'unequal' ? '③ 兩波高度不同 ⇒ 相加後仍有殘餘位移' : '③ 同側相加 ⇒ 位移變大');
                ctx.font = '10px Outfit, "Noto Sans TC", sans-serif';
                const capW = ctx.measureText(CAP[2]).width;
                if (ctx.measureText(midNote).width + capW + 20 <= SPAN) {
                    label(ctx, midNote, X1 - 4, top + gap * 2 + gap * 0.5 - gap * 0.34,
                          p.mode === 'destructive' ? C.rose : C.green, 10, 'right');
                }
                labelFit(ctx, '交會後各波復原：波的獨立性', X0, h - 6, C.muted, 11, 'left', { maxW: SPAN, min: 10, clampW: w });
            }
        };
        /* 2. 繩波的反射與透射 --------------------------------------------- */
        LABS.reflection = {
            name: '繩波的反射與透射',
            tag: 'N03',
            cycle: (p) => p.source === 'periodic' ? 2.4 : 7.0,
            hint: '先選擇<b>單一脈衝</b>或<b>連續週期波</b>。繩子的線寬直接代表線密度：細繩＝線密度小、粗繩＝線密度大。入射波（藍虛線）與反射波（紫虛線）同時存在，實線是兩者「位移相加」後的實際繩形。右上角的小圖是端點（或交界）的位移隨時間變化；用時間軸和慢速播放觀察最清楚。',
            note: '本模型張力固定，線密度較大時波速較慢；畫面粗繩表示線密度較大，細繩表示線密度較小。反射波其實就是「鏡像波」：把入射波以端點為鏡面左右翻轉，固定端再上下顛倒（反射係數 −1）、自由端不顛倒（+1）。週期波穿越兩繩交界時頻率不變，波速較慢的一側波長也較短。',
            height: 340,
            modes: [
                { key: 'fixed', label: '固定端（牆）' },
                { key: 'free', label: '自由端（小環）' },
                { key: 'l2h', label: '輕繩 → 重繩' },
                { key: 'h2l', label: '重繩 → 輕繩' }
            ],
            controls: [
                {
                    key: 'source',
                    label: '波源類型',
                    options: [
                        { value: 'pulse', label: '單一脈衝波' },
                        { value: 'periodic', label: '連續週期波' }
                    ],
                    value: 'pulse',
                    fmt: (v) => v === 'periodic' ? '連續週期波' : '單一脈衝波'
                },
                { key: 'ratio', label: '兩段繩的線密度比 μ₂/μ₁', min: 2, max: 9, step: 1, value: 4, only: ['l2h', 'h2l'], fmt: (v) => `${v} : 1` }
            ],
            readouts: (p) => {
                if (p.mode === 'fixed') return [
                    { label: '反射係數 r', value: '−1（上下顛倒）' },
                    { label: '端點位移', value: '恆為零（入射＋反射剛好抵消）' },
                    { label: '反射波左右', value: '相反（鏡像）' },
                    { label: '等效於', value: '接重繩（μ₂ → ∞）' }];
                if (p.mode === 'free') return [
                    { label: '反射係數 r', value: '＋1（不顛倒）' },
                    { label: '端點最大位移', value: '2A（入射＋反射同號相加）' },
                    { label: '反射波左右', value: '相反（鏡像）' },
                    { label: '等效於', value: '接輕繩（μ₂ → 0）' }];
                const ratio = p.mode === 'l2h' ? p.ratio : 1 / p.ratio;   // μ₂/μ₁
                const r = (1 - Math.sqrt(ratio)) / (1 + Math.sqrt(ratio));
                const speedRatio = Math.sqrt(1 / ratio);
                return [
                    { label: '反射係數 r', value: `${r.toFixed(2)}（${r < 0 ? '上下顛倒' : '不顛倒'}）` },
                    { label: '透射係數 t = 1 + r', value: (1 + r).toFixed(2) },
                    { label: '透射波波速', value: speedRatio < 1 ? `變慢（× ${speedRatio.toFixed(2)}）` : `變快（× ${speedRatio.toFixed(2)}）` },
                    p.source === 'periodic'
                        ? { label: '頻率／波長', value: `f 不變；λ₂ = ${speedRatio.toFixed(2)} λ₁` }
                        : { label: '脈衝空間寬度', value: `變為 ${speedRatio.toFixed(2)} 倍` }
                ];
            },
            draw: (ctx, w, h, p, t) => {
                const isPeriodic = p.source === 'periodic';
                const CYC = isPeriodic ? 2.4 : 7.0;
                const mid = h * (w < 520 ? 0.72 : 0.60);
                const twoRope = (p.mode === 'l2h' || p.mode === 'h2l');
                const bx = Math.max(w * 0.62, 190);              // 端點／交界的位置
                const A = 26;

                /* 不對稱脈衝：前緣（u>0）陡、後緣（u<0）緩，反射後的「左右相反」才看得出來 */
                const FRONT = 13, BACK = 38;
                const shape = (u) => {
                    const sgm = u >= 0 ? FRONT : BACK;
                    const z = u / sgm;
                    return z * z > 20 ? 0 : Math.exp(-z * z);
                };

                /* 反射係數 r 與透射係數 t（張力相同，阻抗 ∝ √μ） */
                const ratio = twoRope ? (p.mode === 'l2h' ? Math.max(p.ratio, 1.01) : 1 / Math.max(p.ratio, 1.01)) : null;
                const rCoef = p.mode === 'fixed' ? -1
                    : p.mode === 'free' ? 1
                        : (1 - Math.sqrt(ratio)) / (1 + Math.sqrt(ratio));
                const tCoef = 1 + rCoef;
                const speed2 = twoRope ? Math.sqrt(1 / ratio) : 1;      // v₂ / v₁

                /* 入射脈衝中心 c 連續前進；反射波用「鏡像波」表示，兩者隨時同時存在 */
                const u01 = (((t % CYC) + CYC) % CYC) / CYC;
                const cStart = 10 - 3.4 * BACK;
                const cEndRefl = 2 * bx - 10 + 3.4 * BACK;
                const cEndTrans = twoRope ? bx + (w + 3.4 * BACK * speed2 - bx) / Math.max(speed2, 0.05) : -Infinity;
                const cEnd = Math.max(cEndRefl, cEndTrans);
                const c = cStart + u01 * (cEnd - cStart);

                /* 週期波使用穩態正弦波。透射側的空間座標除以 v₂/v₁，
                 * 因此頻率不變，而波長會依波速同比例改變。 */
                const LAMBDA = 82;
                const kWave = 2 * Math.PI / LAMBDA;
                const omega = 2 * Math.PI / CYC;
                const harmonic = (coord, time = t) => Math.sin(kWave * coord - omega * time);
                const profile = (coord) => isPeriodic ? harmonic(coord) : shape(coord - c);

                const yInc = (x) => (x <= bx ? A * profile(x) : 0);
                const yRef = (x) => (x <= bx ? rCoef * A * (isPeriodic ? harmonic(2 * bx - x) : shape((2 * bx - x) - c)) : 0);   // 鏡像波
                const yTr = (x) => (twoRope && x >= bx
                    ? tCoef * A * (isPeriodic ? harmonic((x - bx) / Math.max(speed2, 0.05) + bx) : shape((x - bx) / Math.max(speed2, 0.05) + bx - c))
                    : 0);
                const ySum = (x) => (x <= bx ? yInc(x) + yRef(x) : yTr(x));

                /* 繩子：線寬直接代表線密度 */
                const LW_LIGHT = 2.0, LW_HEAVY = 7.0, LW_ONE = 3.0;
                const lwLeft = twoRope ? (p.mode === 'l2h' ? LW_LIGHT : LW_HEAVY) : LW_ONE;
                const lwRight = twoRope ? (p.mode === 'l2h' ? LW_HEAVY : LW_LIGHT) : LW_ONE;

                if (twoRope) {
                    dashed(ctx, bx, mid - 66, bx, mid + 62, C.rose);
                    labelFit(ctx, p.mode === 'l2h' ? '輕繩 μ₁：快' : '重繩 μ₁：慢', 14, mid + 76, C.muted, 11, 'left', { maxW: bx - 22, min: 10, clampW: w });
                    labelFit(ctx, p.mode === 'l2h' ? '重繩 μ₂：慢' : '輕繩 μ₂：快', bx + 10, mid + 76, C.muted, 11, 'left', { maxW: w - bx - 20, min: 10, clampW: w });
                    label(ctx, '交界', bx, mid + 90, C.rose, 10, 'center');
                }
                axis(ctx, 10, mid, twoRope ? w - 10 : bx, mid);

                const curve = (fn, xa, xb, style, lw, dash) => {
                    ctx.save();
                    if (dash) ctx.setLineDash([5, 4]);
                    ctx.strokeStyle = style; ctx.lineWidth = lw; ctx.lineCap = 'round';
                    ctx.beginPath();
                    for (let X = xa; X <= xb; X += 2) {
                        const Y = mid - fn(X);
                        X === xa ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
                    }
                    ctx.stroke(); ctx.restore();
                };
                /* 兩個成分波（隨時顯示）＋ 相加後的實際繩形 */
                curve(yInc, 10, bx, 'rgba(11,111,146,0.55)', 1.7, true);
                curve(yRef, 10, bx, 'rgba(107,70,193,0.6)', 1.7, true);
                curve(ySum, 10, bx, C.blue, lwLeft, false);
                if (twoRope) curve(ySum, bx, w - 10, C.blue, lwRight, false);

                /* 端點裝置 */
                const endY = mid - (yInc(bx) + yRef(bx));
                if (!twoRope) {
                    if (p.mode === 'fixed') {
                        ctx.fillStyle = 'rgba(18,49,58,0.22)';
                        ctx.fillRect(bx, mid - 66, 12, 132);
                        label(ctx, '固定端（牆）', bx + 17, mid + 60, C.rose, 11);
                    } else {
                        ctx.strokeStyle = 'rgba(18,49,58,0.32)'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.moveTo(bx, mid - 66); ctx.lineTo(bx, mid + 66); ctx.stroke();
                        ctx.strokeStyle = C.rose; ctx.lineWidth = 2.4;
                        ctx.beginPath(); ctx.arc(bx, endY, 7, 0, Math.PI * 2); ctx.stroke();
                        label(ctx, '自由端（小環）', bx + 17, mid + 60, C.rose, 11);
                    }
                }

                /* 行進方向箭頭：入射在 c、反射在鏡像位置 2bx−c、透射在 bx+speed2·(c−bx) */
                const cRef = 2 * bx - c;
                const cTr = bx + speed2 * (c - bx);
                if (isPeriodic) {
                    const incX = Math.max(52, bx * 0.34);
                    arrow(ctx, incX, mid - 50, incX + 34, mid - 50, C.blue, 1.8);
                    label(ctx, '入射週期波', incX, mid - 56, C.blue, 11);
                    arrow(ctx, bx - 42, mid + 44, bx - 76, mid + 44, C.violet, 1.8);
                    label(ctx, '反射週期波', bx - 42, mid + 40, C.violet, 11, 'right');
                    if (twoRope) {
                        arrow(ctx, bx + 18, mid - 50, bx + 52, mid - 50, C.green, 1.8);
                        label(ctx, '透射週期波', bx + 18, mid - 56, C.green, 11);
                    }
                } else {
                    if (c > 20 && c < bx - 6) {
                        arrow(ctx, c + 16, mid - 50, c + 48, mid - 50, C.blue, 1.8);
                        label(ctx, '入射波', c + 16, mid - 56, C.blue, 11);
                    }
                    if (cRef > 20 && cRef < bx - 6) {
                        arrow(ctx, cRef - 16, mid + 44, cRef - 48, mid + 44, C.violet, 1.8);
                        label(ctx, '反射波', cRef - 16, mid + 40, C.violet, 11, 'right');
                    }
                    if (twoRope && cTr > bx + 10 && cTr < w - 26) {
                        arrow(ctx, cTr + 8, mid - 50, cTr + 40, mid - 50, C.green, 1.8);
                        label(ctx, '透射波', cTr + 8, mid - 56, C.green, 11);
                    }
                }

                /* 重疊區：在幾個位置畫出「入射位移 → 再加上反射位移」的堆疊刻度，
                   讓「位移相加」不只是文字，而是看得到的線段。 */
                let ovA = null, ovB = null;
                for (let X = 14; X <= bx; X += 2) {
                    if (Math.abs(yInc(X)) > 0.07 * A && Math.abs(yRef(X)) > 0.07 * A) {
                        if (ovA === null) ovA = X;
                        ovB = X;
                    }
                }
                if (ovA !== null && ovB - ovA > 8) {
                    const N = 6;
                    for (let i = 0; i <= N; i++) {
                        const X = ovA + (ovB - ovA) * i / N;
                        const vi = yInc(X), vr = yRef(X);
                        const yI = mid - vi, yS = mid - (vi + vr);
                        if (Math.abs(yS - yI) < 2) continue;
                        ctx.strokeStyle = 'rgba(224,138,18,0.9)'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(X, yI); ctx.lineTo(X, yS); ctx.stroke();
                        ctx.strokeStyle = 'rgba(224,138,18,0.6)'; ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(X - 3.5, yI); ctx.lineTo(X + 3.5, yI);
                        ctx.moveTo(X - 3.5, yS); ctx.lineTo(X + 3.5, yS);
                        ctx.stroke();
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.fillRect(12, mid + 84, 268, 16);
                    label(ctx, '橘色線段＝反射波在該處「加上去」的位移', 14, mid + 96, '#b06a00', 11);
                }

                /* 端點的算式提示 */
                const overlap = isPeriodic ? 1 : Math.min(Math.abs(shape(bx - c)), 1);
                if (overlap > 0.06) {
                    const va = yInc(bx) / A, vb = yRef(bx) / A;
                    dashed(ctx, bx - 2, mid - 82, bx - 2, mid + 66, 'rgba(224,138,18,0.55)');
                    const txt = `端點：${va >= 0 ? '+' : ''}${va.toFixed(2)}A ${vb >= 0 ? '+' : '−'} ${Math.abs(vb).toFixed(2)}A = ${(va + vb >= 0 ? '+' : '')}${(va + vb).toFixed(2)}A`;
                    label(ctx, txt, bx - 8, mid - 74, '#b06a00', 11, 'right');
                }

                /* 左上：入射與反射的形狀對照 */
                const iw = Math.max(78, Math.min(148, (w - 60) * 0.26));
                const ih = 50, gap = 14, ix = 12, iy = 10;
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.strokeStyle = 'rgba(18,49,58,0.14)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(ix - 7, iy - 5, iw * 2 + gap + 18, ih + 24); ctx.fill(); ctx.stroke();
                const mini = (ox, flipX, amp, color, cap) => {
                    const base = iy + ih * 0.52;
                    dashed(ctx, ox, base, ox + iw, base, 'rgba(18,49,58,0.18)');
                    ctx.strokeStyle = color; ctx.lineWidth = 2;
                    ctx.beginPath();
                    for (let k = 0; k <= iw; k += 2) {
                        const uu = (k - iw * 0.5) * (9.0 * FRONT / iw);
                        const sample = isPeriodic
                            ? Math.sin(flipX * (k / iw * 2.8 - 1.4) * Math.PI)
                            : shape(flipX * uu);
                        ctx.lineTo(ox + k, base - sample * amp * (ih * 0.38));
                    }
                    ctx.stroke();
                    labelFit(ctx, cap, ox + iw / 2, iy + ih + 8, color, 10, 'center', { maxW: iw + 4, min: 10, clampW: w });
                };
                mini(ix, 1, 1, C.blue, isPeriodic ? '入射週期波（向右）' : '入射（前緣陡）');
                mini(ix + iw + gap, -1, rCoef, C.violet,
                    isPeriodic
                        ? (rCoef < 0 ? '反射：相位反轉' : '反射：不反轉')
                        : (rCoef < 0 ? '反射：顛倒' : '反射：不顛倒'));

                /* 右上：端點（交界）位移隨時間的變化 */
                const gw = Math.max(96, Math.min(178, w * 0.24)), gh = 52;
                const gx = w - gw - 14, gy = w < 520 ? 94 : 12;
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.strokeStyle = 'rgba(18,49,58,0.14)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(gx - 6, gy - 5, gw + 12, gh + 26); ctx.fill(); ctx.stroke();
                const gMid = gy + gh * 0.62;
                axis(ctx, gx, gMid, gx + gw, gMid);
                const endAt = (uu) => {
                    if (isPeriodic) return tCoef * harmonic(bx, uu * CYC);
                    const cc = cStart + uu * (cEnd - cStart);
                    return tCoef * shape(bx - cc);            // (1+r)·A·shape → 以 A 為單位
                };
                ctx.strokeStyle = C.orange; ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i <= gw; i++) {
                    const Y = gMid - endAt(i / gw) * (gh * 0.42);
                    i === 0 ? ctx.moveTo(gx, Y) : ctx.lineTo(gx + i, Y);
                }
                ctx.stroke();
                ctx.fillStyle = C.rose;
                ctx.beginPath(); ctx.arc(gx + u01 * gw, gMid - endAt(u01) * (gh * 0.42), 3.6, 0, Math.PI * 2); ctx.fill();
                label(ctx, twoRope ? '交界位移隨時間' : '端點位移隨時間', gx, gy + 8, C.muted, 10);
                label(ctx, `最大 ${tCoef.toFixed(2)}A`, gx + gw, gy + gh + 16, tCoef === 0 ? C.rose : C.orange, 10, 'right');
                if (p.mode === 'fixed') label(ctx, '恆為零', gx, gy + gh + 16, C.rose, 10);
            }
        };
