<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fdfdfc; stroke: #d1d5db; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: bold; font-size: 13.5px; fill: #1e293b; }
      .label { font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif; font-size: 13px; fill: #334155; }
      .sublabel { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 11.5px; fill: #475569; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 14px; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      .fringe-bright { fill: #22c55e; }
      .fringe-center { fill: #16a34a; }
      .dim { stroke: #e11d48; stroke-width: 1.2; marker-end: url(#arrow-red); marker-start: url(#arrow-red); }
      .dim-blue { stroke: #0284c7; stroke-width: 1.2; marker-end: url(#arrow-blue); marker-start: url(#arrow-blue); }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="680" height="300" class="bg"/>

  <!-- Left: Fringe Pattern Comparison -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="345" height="260" class="box"/>
    <text x="14" y="24" class="title">(甲) 雙狹縫干涉圖樣 (d = 100 μm)</text>

    <!-- Double Slit Fringe Screen Box -->
    <g transform="translate(20, 34)">
      <rect x="0" y="0" width="300" height="36" fill="#0f172a" rx="4"/>
      <!-- Equal width fringes: spacing 20px on screen -->
      <rect x="140" y="4" width="20" height="28" class="fringe-center"/>
      <rect x="100" y="4" width="20" height="28" class="fringe-bright"/>
      <rect x="180" y="4" width="20" height="28" class="fringe-bright"/>
      <rect x="60" y="4" width="20" height="28" class="fringe-bright"/>
      <rect x="220" y="4" width="20" height="28" class="fringe-bright"/>
      <rect x="20" y="4" width="20" height="28" class="fringe-bright"/>
      <rect x="260" y="4" width="20" height="28" class="fringe-bright"/>

      <!-- Center O to 2nd Dark Fringe marker -->
      <line x1="150" y1="45" x2="210" y2="45" class="dim"/>
      <text x="145" y="60" class="math" fill="#e11d48" font-size="11px">y₂ = 1.5Δy = 1.95 cm</text>
      <text x="235" y="60" class="sublabel">⇒ Δy = 1.30 cm</text>
    </g>

    <!-- Single Slit Fringe Screen Box -->
    <text x="14" y="128" class="title">(乙) 單狹縫繞射圖樣 (縫寬 a)</text>
    <g transform="translate(20, 138)">
      <rect x="0" y="0" width="300" height="42" fill="#0f172a" rx="4"/>
      <!-- Central Maximum (Double width = 100px) -->
      <rect x="100" y="4" width="100" height="34" class="fringe-center"/>
      <text x="128" y="24" font-size="10px" font-weight="bold" fill="#ffffff">中央亮帶</text>

      <!-- Side Maximums (Dimmer, half width) -->
      <rect x="40" y="8" width="40" height="26" class="fringe-bright" opacity="0.65"/>
      <rect x="220" y="8" width="40" height="26" class="fringe-bright" opacity="0.65"/>
      <rect x="5" y="11" width="20" height="20" class="fringe-bright" opacity="0.35"/>
      <rect x="275" y="11" width="20" height="20" class="fringe-bright" opacity="0.35"/>

      <!-- Center O to 2nd Dark Fringe marker -->
      <line x1="150" y1="52" x2="270" y2="52" class="dim-blue"/>
      <text x="145" y="68" class="math" fill="#0284c7" font-size="11px">y₂ = 2(λL/a) = 13.0 cm</text>
      <text x="245" y="68" class="sublabel">⇒ λL/a = 6.50 cm</text>
    </g>

    <text x="35" y="248" class="sublabel" font-weight="bold">中央亮帶總寬度 = 2 × (λL/a) = 13.0 cm</text>
  </g>

  <!-- Right: Calculation Steps -->
  <g transform="translate(385, 20)">
    <rect x="0" y="0" width="270" height="260" class="box"/>
    <text x="14" y="24" class="title">求解單狹縫寬度 a 步驟</text>

    <rect x="15" y="38" width="240" height="208" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="20" y="60" class="label" font-weight="bold">【雙狹縫干涉】</text>
    <text x="20" y="80" class="math">λL / d = 1.95 / 1.5 = 1.30 cm</text>

    <text x="20" y="104" class="label" font-weight="bold">【單狹縫繞射】</text>
    <text x="20" y="124" class="math">λL / a = 13.0 / 2 = 6.50 cm</text>

    <line x1="20" y1="138" x2="230" y2="138" stroke="#cbd5e1"/>
    <text x="20" y="156" class="label" font-weight="bold">【兩式相比求 a】</text>
    <text x="20" y="178" class="math">a / d = 1.30 / 6.50 = 1 / 5</text>
    <text x="20" y="202" class="math" font-weight="bold" fill="#16a34a">a = 100 μm / 5 = 20.0 μm</text>

    <text x="20" y="232" class="label" font-weight="bold" fill="#0284c7">正確答案：(B)(C)(E)</text>
  </g>
</svg>
