<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fdfdfc; stroke: #d1d5db; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: bold; font-size: 13.5px; fill: #1e293b; }
      .label { font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif; font-size: 13px; fill: #334155; }
      .sublabel { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 11.5px; fill: #475569; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 14px; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      .pipe-wall { stroke: #334155; stroke-width: 3; stroke-linecap: round; }
      .pipe-closed { stroke: #334155; stroke-width: 3.5; stroke-linecap: round; }
      .standing-wave1 { fill: none; stroke: #2563eb; stroke-width: 2; }
      .standing-wave2 { fill: none; stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .node-dot { fill: #dc2626; }
      .dim { stroke: #475569; stroke-width: 1.2; marker-end: url(#arrow-slate); marker-start: url(#arrow-slate); }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="680" height="300" class="bg"/>

  <!-- Left: Standing Wave Diagrams in Pipes -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="345" height="260" class="box"/>

    <!-- Pipe 1: Open Pipe (Flute) Length L -->
    <g transform="translate(20, 15)">
      <text x="0" y="15" class="title">(甲) 長笛：兩端開管之基音 (n = 1)</text>

      <!-- Pipe Walls (Open at both ends) -->
      <line x1="20" y1="35" x2="220" y2="35" class="pipe-wall"/>
      <line x1="20" y1="85" x2="220" y2="85" class="pipe-wall"/>

      <!-- Displacement Standing Wave in Open Pipe (Antinode at both ends, node in center) -->
      <path d="M 20 40 Q 120 60, 220 40" class="standing-wave1"/>
      <path d="M 20 80 Q 120 60, 220 80" class="standing-wave2"/>
      <circle cx="120" cy="60" r="3.5" class="node-dot"/>
      <text x="112" y="52" font-size="10px" fill="#dc2626">節點</text>
      <text x="22" y="63" font-size="10px" fill="#2563eb">腹</text>
      <text x="205" y="63" font-size="10px" fill="#2563eb">腹</text>

      <!-- Length L -->
      <line x1="20" y1="95" x2="220" y2="95" class="dim"/>
      <text x="110" y="110" class="math" fill="#0284c7">L = (1/2)λ</text>
      <text x="230" y="65" class="math" font-weight="bold" fill="#0284c7">f₁ = v / (2L)</text>
    </g>

    <!-- Pipe 2: Closed Pipe (Clarinet) Length L' -->
    <g transform="translate(20, 135)">
      <text x="0" y="15" class="title">(乙) 單簧管：一開一閉管之第一泛音 (m = 3)</text>

      <!-- Pipe Walls (Closed at left end x=20) -->
      <line x1="20" y1="35" x2="310" y2="35" class="pipe-wall"/>
      <line x1="20" y1="85" x2="310" y2="85" class="pipe-wall"/>
      <line x1="20" y1="33" x2="20" y2="87" class="pipe-closed"/>
      <text x="2" y="64" font-size="10px" font-weight="bold" fill="#334155">閉</text>

      <!-- Displacement Standing Wave (Node at closed end, 3 quarters) -->
      <path d="M 20 60 Q 68 38, 116 60 T 212 60 Q 261 40, 310 40" class="standing-wave1"/>
      <path d="M 20 60 Q 68 82, 116 60 T 212 60 Q 261 80, 310 80" class="standing-wave2"/>
      <circle cx="20" cy="60" r="3.5" class="node-dot"/>
      <circle cx="116" cy="60" r="3.5" class="node-dot"/>
      <circle cx="212" cy="60" r="3.5" class="node-dot"/>
      <text x="295" y="63" font-size="10px" fill="#2563eb">腹</text>

      <!-- Length L' -->
      <line x1="20" y1="95" x2="310" y2="95" class="dim"/>
      <text x="145" y="110" class="math" fill="#d97706">L' = (3/4)λ'</text>
      <text x="235" y="22" class="math" font-weight="bold" fill="#d97706">f₃ = 3v / (4L')</text>
    </g>
  </g>

  <!-- Right: Algebraic Solution -->
  <g transform="translate(385, 20)">
    <rect x="0" y="0" width="270" height="260" class="box"/>
    <text x="14" y="24" class="title">管長比例求解步驟</text>

    <rect x="15" y="38" width="240" height="208" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="20" y="60" class="label" font-weight="bold">【題目給定條件】</text>
    <text x="20" y="82" class="math">f(開, 基音) = f(閉, 第一泛音)</text>

    <line x1="20" y1="96" x2="230" y2="96" stroke="#cbd5e1"/>
    <text x="20" y="118" class="label" font-weight="bold">【代入頻率公式】</text>
    <text x="20" y="142" class="math">v / (2L) = 3v / (4L')</text>
    <text x="20" y="168" class="math">1 / (2L) = 3 / (4L')  ⇒  L / L' = 4 / 6</text>

    <text x="20" y="198" class="math" font-weight="bold" fill="#16a34a">L / L' = 2 / 3</text>

    <text x="20" y="232" class="label" font-weight="bold" fill="#0284c7">正確答案：(C) 2/3</text>
  </g>
</svg>
