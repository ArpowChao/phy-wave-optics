<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fdfdfc; stroke: #d1d5db; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: bold; font-size: 13.5px; fill: #1e293b; }
      .label { font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif; font-size: 13px; fill: #334155; }
      .sublabel { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 11.5px; fill: #475569; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 14px; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      .grid-line { stroke: #cbd5e1; stroke-width: 1; }
      .grid-shifted { stroke: #e11d48; stroke-width: 1.8; stroke-dasharray: 4,2; }
      .acrylic-plate { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; fill-opacity: 0.7; }
      .dim { stroke: #475569; stroke-width: 1.2; marker-end: url(#arrow-slate); marker-start: url(#arrow-slate); }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="680" height="300" class="bg"/>

  <!-- Left: Grid Table with Acrylic Slab -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="345" height="260" class="box"/>
    <text x="14" y="24" class="title">【圖 8】垂直正視時方格水平線之視位移</text>

    <!-- Table with Grid Lines -->
    <rect x="25" y="42" width="295" height="200" fill="#ffffff" stroke="#94a3b8"/>
    <!-- Horizontal Grid Lines (Unshifted on table sides) -->
    <line x1="25" y1="80" x2="320" y2="80" class="grid-line"/>
    <line x1="25" y1="120" x2="320" y2="120" class="grid-line"/>
    <line x1="25" y1="160" x2="320" y2="160" class="grid-line"/>
    <line x1="25" y1="200" x2="320" y2="200" class="grid-line"/>

    <!-- Vertical Grid Lines -->
    <line x1="60" y1="42" x2="60" y2="242" class="grid-line"/>
    <line x1="100" y1="42" x2="100" y2="242" class="grid-line"/>
    <line x1="140" y1="42" x2="140" y2="242" class="grid-line"/>
    <line x1="180" y1="42" x2="180" y2="242" class="grid-line"/>
    <line x1="220" y1="42" x2="220" y2="242" class="grid-line"/>
    <line x1="260" y1="42" x2="260" y2="242" class="grid-line"/>

    <!-- Transparent Acrylic Plate (h) -->
    <rect x="70" y="40" width="180" height="70" class="acrylic-plate"/>
    <text x="80" y="65" class="label" font-weight="bold" fill="#0369a1">透明壓克力板 (厚度 h, 折射率 n)</text>

    <!-- Apparent Shifted Lines Seen through Acrylic -->
    <line x1="70" y1="62" x2="250" y2="62" class="grid-shifted"/>
    <line x1="70" y1="95" x2="250" y2="95" class="grid-shifted"/>

    <!-- Displacement Δy Indicator -->
    <line x1="260" y1="80" x2="260" y2="62" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <text x="268" y="74" class="math" fill="#e11d48" font-size="12px">Δy</text>

    <!-- Thickness h Indicator -->
    <line x1="55" y1="40" x2="55" y2="110" class="dim"/>
    <text x="42" y="78" class="math" fill="#0284c7">h</text>
  </g>

  <!-- Right: Derivation & Formula -->
  <g transform="translate(385, 20)">
    <rect x="0" y="0" width="270" height="260" class="box"/>
    <text x="14" y="24" class="title">視位移公式推導與選項分析</text>

    <rect x="15" y="38" width="240" height="208" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="20" y="60" class="label" font-weight="bold">【視深與視位移】</text>
    <text x="20" y="82" class="sublabel">光線在介質中之視厚度：<tspan class="math">h' = h / n</tspan></text>
    <text x="20" y="104" class="label" font-weight="bold">視位移量值 Δy：</text>
    <text x="20" y="126" class="math" font-weight="bold" fill="#0284c7">Δy = h - h' = h(1 - 1/n)</text>

    <line x1="20" y1="140" x2="230" y2="140" stroke="#cbd5e1"/>
    <text x="20" y="160" class="sublabel">• <tspan fill="#16a34a" font-weight="bold">(D) 正確</tspan>：位移量值皆為 h(1 - 1/n)</text>
    <text x="20" y="182" class="sublabel">• <tspan fill="#16a34a" font-weight="bold">(E) 正確</tspan>：測量 Δy/h 即可求出 n</text>
    <text x="20" y="204" class="math" fill="#0369a1" font-size="12px">n = 1 / [1 - (Δy / h)]</text>

    <text x="20" y="232" class="label" font-weight="bold" fill="#0284c7">正確答案：(D)(E)</text>
  </g>
</svg>
