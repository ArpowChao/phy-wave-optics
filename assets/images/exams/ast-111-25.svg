<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fdfdfc; stroke: #d1d5db; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: bold; font-size: 13.5px; fill: #1e293b; }
      .label { font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif; font-size: 13px; fill: #334155; }
      .sublabel { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 11.5px; fill: #475569; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 14px; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      .horn { fill: #f1f5f9; stroke: #334155; stroke-width: 2.2; }
      .wave-front { fill: none; stroke: #0284c7; stroke-width: 1.8; stroke-linecap: round; }
      .dim { stroke: #e11d48; stroke-width: 1.2; marker-end: url(#arrow-red); marker-start: url(#arrow-red); }
      .angle-arc { fill: #fed7aa; stroke: #ea580c; stroke-width: 1.5; fill-opacity: 0.4; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="680" height="300" class="bg"/>

  <!-- Left: Sound Diffraction From Aperture -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="345" height="260" class="box"/>
    <text x="14" y="24" class="title">開口繞射模型 (當波長 λ &gt; 開口寬度 a)</text>

    <!-- Speaker Aperture Plates -->
    <rect x="40" y="35" width="14" height="75" class="horn"/>
    <rect x="40" y="160" width="14" height="75" class="horn"/>

    <!-- Slit Opening a -->
    <line x1="28" y1="110" x2="28" y2="160" class="dim"/>
    <text x="8" y="138" class="math" fill="#e11d48">a = 6 cm</text>

    <!-- Source Mouth -->
    <circle cx="20" cy="135" r="10" fill="#fca5a5" stroke="#dc2626"/>
    <text x="10" y="139" font-size="9px" font-weight="bold" fill="#7f1d1d">波源</text>

    <!-- 180 Degree Fan Semicircle Waves -->
    <path d="M 54 95 A 40 40 0 0 1 54 175" class="wave-front"/>
    <path d="M 54 70 A 65 65 0 0 1 54 200" class="wave-front"/>
    <path d="M 54 45 A 90 90 0 0 1 54 225" class="wave-front"/>
    <path d="M 54 20 A 115 115 0 0 1 54 250" class="wave-front" stroke-dasharray="4,2"/>

    <!-- 180 Degree Angle Sector Arc -->
    <path d="M 54 85 A 50 50 0 0 1 54 185 L 54 135 Z" class="angle-arc"/>
    <text x="110" y="139" class="math" font-weight="bold" fill="#c2410c">張角 = 180°</text>

    <!-- Ray indicators -->
    <line x1="54" y1="135" x2="200" y2="35" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="54" y1="135" x2="200" y2="235" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="54" y1="135" x2="220" y2="135" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4,3"/>

    <text x="130" y="245" class="sublabel" font-weight="bold" fill="#0369a1">等效點波源向半球面擴散</text>
  </g>

  <!-- Right: Calculation & Theory -->
  <g transform="translate(385, 20)">
    <rect x="0" y="0" width="270" height="260" class="box"/>
    <text x="14" y="24" class="title">數值代入與無暗紋判定</text>

    <rect x="15" y="38" width="240" height="208" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="20" y="60" class="label" font-weight="bold">【Step 1：計算聲波波長】</text>
    <text x="20" y="82" class="math">v = 340 m/s ,  f = 3000 Hz</text>
    <text x="20" y="104" class="math" fill="#0284c7">λ = v / f = 340 / 3000 ≈ 11.33 cm</text>

    <line x1="20" y1="116" x2="230" y2="116" stroke="#cbd5e1"/>
    <text x="20" y="136" class="label" font-weight="bold">【Step 2：比值判斷】</text>
    <text x="20" y="158" class="math" fill="#e11d48">λ / a = 11.33 / 6 ≈ 1.89 &gt; 1</text>
    <text x="20" y="180" class="sublabel">因 sinθ = λ/a &gt; 1 無解，前方無暗紋</text>
    <text x="20" y="202" class="sublabel">開口等效為點波源，展開張角達 180°</text>

    <text x="20" y="232" class="label" font-weight="bold" fill="#0284c7">正確答案：(E) 180°</text>
  </g>
</svg>
