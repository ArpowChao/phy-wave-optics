<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fdfdfc; stroke: #d1d5db; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: bold; font-size: 13.5px; fill: #1e293b; }
      .label { font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif; font-size: 13px; fill: #334155; }
      .sublabel { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 11.5px; fill: #475569; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 14px; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      .pipe { fill: #e2e8f0; stroke: #475569; stroke-width: 2.5; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="680" height="300" class="bg"/>

  <!-- Left: Schematic Diagram of Muffler -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="345" height="260" class="box"/>
    <text x="14" y="24" class="title">【圖 3】干涉型消音器兩路徑分流示意圖</text>

    <!-- Inlet Pipe -->
    <rect x="20" y="105" width="60" height="40" class="pipe"/>
    <text x="25" y="130" class="sublabel" font-weight="bold">排氣聲波</text>

    <!-- Split Junction A -->
    <circle cx="80" cy="125" r="4.5" fill="#e11d48"/>
    <text x="72" y="155" class="label" font-weight="bold" fill="#e11d48">甲 (分流點)</text>

    <!-- Straight Path 1 (Blue) -->
    <path d="M 80 125 L 220 125" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="125" y="117" class="label" font-weight="bold" fill="#2563eb">路徑 1 (直線 L₁)</text>

    <!-- Curved Detour Path 2 (Amber) -->
    <path d="M 80 125 C 80 45, 220 45, 220 125" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <text x="115" y="38" class="label" font-weight="bold" fill="#d97706">路徑 2 (彎管 L₂)</text>

    <!-- Merge Junction B -->
    <circle cx="220" cy="125" r="4.5" fill="#16a34a"/>
    <text x="212" y="155" class="label" font-weight="bold" fill="#16a34a">乙 (會合點)</text>

    <!-- Outlet Pipe -->
    <rect x="220" y="105" width="80" height="40" class="pipe"/>
    <text x="235" y="130" class="sublabel" font-weight="bold" fill="#16a34a">聲音相消抵消</text>
    <line x1="260" y1="115" x2="280" y2="135" stroke="#16a34a" stroke-width="2"/>
    <line x1="280" y1="115" x2="260" y2="135" stroke="#16a34a" stroke-width="2"/>

    <!-- Wave Destructive Superposition Diagram -->
    <g transform="translate(30, 185)">
      <text x="0" y="12" class="sublabel" font-weight="bold">乙點波形疊加：</text>
      <!-- Wave 1 -->
      <path d="M 80 8 Q 95 -4, 110 8 T 140 8" fill="none" stroke="#2563eb" stroke-width="1.8"/>
      <text x="148" y="12" font-size="10px" fill="#2563eb">波峰</text>
      <!-- Wave 2 (Inverted) -->
      <path d="M 80 32 Q 95 44, 110 32 T 140 32" fill="none" stroke="#d97706" stroke-width="1.8"/>
      <text x="148" y="36" font-size="10px" fill="#d97706">波谷 (相消)</text>
      <!-- Sum = 0 -->
      <line x1="190" y1="20" x2="250" y2="20" stroke="#16a34a" stroke-width="2.5"/>
      <text x="256" y="24" font-size="10px" font-weight="bold" fill="#16a34a">振幅為 0</text>
    </g>
  </g>

  <!-- Right: Calculation Steps -->
  <g transform="translate(385, 20)">
    <rect x="0" y="0" width="270" height="260" class="box"/>
    <text x="14" y="24" class="title">破壞性干涉條件與計算</text>

    <rect x="15" y="38" width="240" height="208" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="22" y="62" class="label" font-weight="bold">【核心條件】</text>
    <text x="22" y="85" class="math">λ = 1.0 m  (主要噪音波長)</text>
    <text x="22" y="110" class="math" fill="#0284c7">ΔL = (n + 1/2)λ</text>
    <text x="22" y="130" class="sublabel">其中 n = 0, 1, 2... (破壞性干涉)</text>

    <line x1="22" y1="145" x2="230" y2="145" stroke="#cbd5e1"/>
    <text x="22" y="166" class="label" font-weight="bold">【最小路徑差 (n = 0)】</text>
    <text x="22" y="190" class="math" font-weight="bold" fill="#16a34a">ΔL = (1/2)λ = 0.50 m</text>

    <text x="22" y="226" class="label" font-weight="bold" fill="#0284c7">正確答案：(D) 0.50 m</text>
  </g>
</svg>
