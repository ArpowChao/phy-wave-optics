<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fdfdfc; stroke: #d1d5db; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: bold; font-size: 13.5px; fill: #1e293b; }
      .label { font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif; font-size: 13px; fill: #334155; }
      .sublabel { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 11.5px; fill: #475569; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 14px; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      .prism { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; fill-opacity: 0.6; }
      .medium { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; fill-opacity: 0.5; }
      .ray { stroke: #ef4444; stroke-width: 2.2; stroke-linecap: round; }
      .ray-option { stroke-width: 2; stroke-linecap: round; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="680" height="300" class="bg"/>

  <!-- Left: Prism Geometry and Ray Tracing -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="345" height="260" class="box"/>
    <text x="14" y="24" class="title">【圖 4】光線穿越三層平行界面之光程幾何</text>

    <!-- Left Prism 1 (Right Triangle) -->
    <polygon points="40,45 40,225 140,225" class="prism"/>
    <text x="45" y="195" class="sublabel" font-weight="bold" fill="#0369a1">玻璃 (n₁)</text>

    <!-- Middle Gap Medium (Parallelogram) -->
    <polygon points="140,45 180,45 280,225 240,225" class="medium"/>
    <text x="185" y="140" class="sublabel" font-weight="bold" fill="#b45309">介質 (n₂)</text>

    <!-- Right Prism 2 (Right Triangle) -->
    <polygon points="180,45 280,45 280,225" class="prism"/>
    <text x="235" y="75" class="sublabel" font-weight="bold" fill="#0369a1">玻璃 (n₁)</text>

    <!-- Horizontal Incident Ray (Perpendicular to left face) -->
    <line x1="10" y1="135" x2="90" y2="135" class="ray" marker-end="url(#arrow-red)"/>
    <text x="15" y="125" class="sublabel" font-weight="bold" fill="#ef4444">入射光</text>

    <!-- Passing hypotenuse interface into gap -->
    <line x1="90" y1="135" x2="190" y2="135" class="ray"/>

    <!-- Emerging Parallel Rays -->
    <line x1="280" y1="135" x2="335" y2="135" class="ray-option" stroke="#16a34a" marker-end="url(#arrow-red)"/>
    <text x="290" y="128" font-size="10px" font-weight="bold" fill="#16a34a">⑤ (n₂=n₁)</text>

    <line x1="280" y1="115" x2="335" y2="115" class="ray-option" stroke="#2563eb" marker-end="url(#arrow-red)"/>
    <text x="290" y="108" font-size="10px" font-weight="bold" fill="#2563eb">④ (n₂&lt;n₁)</text>

    <line x1="280" y1="155" x2="335" y2="155" class="ray-option" stroke="#d97706" marker-end="url(#arrow-red)"/>
    <text x="290" y="172" font-size="10px" font-weight="bold" fill="#d97706">⑥ (n₂&gt;n₁)</text>

    <text x="15" y="245" class="sublabel">兩斜面平行 ⇒ 入射線與射出線必定互相平行！</text>
  </g>

  <!-- Right: Principles & Deduction -->
  <g transform="translate(385, 20)">
    <rect x="0" y="0" width="270" height="260" class="box"/>
    <text x="14" y="24" class="title">連續折射定律與平行性推導</text>

    <rect x="15" y="38" width="240" height="208" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="20" y="60" class="label" font-weight="bold">【司乃耳定律連立】</text>
    <text x="20" y="82" class="math" fill="#0284c7">n₁ sinθ₁ = n₂ sinθ₂ = n₁ sinθ₃</text>
    <text x="20" y="104" class="sublabel">⇒ 出射角 θ₃ = θ₁ (出射光與入射光平行)</text>

    <line x1="20" y1="116" x2="230" y2="116" stroke="#cbd5e1"/>
    <text x="20" y="136" class="label" font-weight="bold">【三種情形分類】</text>
    <text x="20" y="158" class="sublabel">• n₂ = n₁ ：光不偏折，出射為路徑 ⑤</text>
    <text x="20" y="180" class="sublabel">• n₂ &lt; n₁ ：偏離法線，出射為路徑 ④</text>
    <text x="20" y="202" class="sublabel">• n₂ &gt; n₁ ：偏向法線，出射為路徑 ⑥</text>

    <text x="20" y="232" class="label" font-weight="bold" fill="#0284c7">正確答案：(C) 4, 5, 6</text>
  </g>
</svg>
