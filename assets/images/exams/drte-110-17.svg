<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fdfdfc; stroke: #d1d5db; stroke-width: 1.5; rx: 8px; }
      .title { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: bold; font-size: 13.5px; fill: #1e293b; }
      .label { font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif; font-size: 13px; fill: #334155; }
      .sublabel { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 11.5px; fill: #475569; }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 14px; fill: #0f172a; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      .interface { stroke: #0284c7; stroke-width: 2.5; stroke-linecap: round; }
      .normal { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .wavefront-deep { stroke: #2563eb; stroke-width: 2; }
      .wavefront-shallow { stroke: #0284c7; stroke-width: 2; }
      .ray-deep { stroke: #ef4444; stroke-width: 2.2; stroke-linecap: round; }
      .ray-shallow { stroke: #ef4444; stroke-width: 2.2; stroke-linecap: round; }
      .dim { stroke: #64748b; stroke-width: 1.2; marker-end: url(#arrow-slate); marker-start: url(#arrow-slate); }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="680" height="300" class="bg"/>

  <!-- Left: Water Tank Diagram with ab Interface -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="345" height="260" class="box"/>
    <text x="14" y="24" class="title">【圖 6】水波槽深水區進淺水區折射光路</text>

    <!-- Interface ab (slanted) -->
    <line x1="30" y1="210" x2="310" y2="70" class="interface"/>
    <text x="25" y="228" class="label" font-weight="bold">a</text>
    <text x="312" y="68" class="label" font-weight="bold">b</text>

    <!-- Deep Water Region Label -->
    <text x="40" y="70" class="label" font-weight="bold" fill="#1e3a8a">深水區 (波速快 v₁)</text>
    <text x="40" y="90" class="math" fill="#1e3a8a">λ₁ 較長 ,  θ₁ 較大</text>

    <!-- Shallow Water Region Label -->
    <text x="180" y="210" class="label" font-weight="bold" fill="#0369a1">淺水區 (波速慢 v₂)</text>
    <text x="180" y="230" class="math" fill="#0369a1">λ₂ 較短 ,  θ₂ 較小 (偏向法線)</text>

    <!-- Normal Line -->
    <line x1="120" y1="90" x2="220" y2="190" class="normal"/>
    <text x="215" y="180" class="sublabel">法線</text>

    <!-- Incident Ray in Deep Water -->
    <line x1="60" y1="90" x2="170" y2="140" class="ray-deep" marker-end="url(#arrow-red)"/>
    <text x="95" y="95" class="sublabel" font-weight="bold" fill="#ef4444">入射線</text>

    <!-- Refracted Ray in Shallow Water (Bent towards normal) -->
    <line x1="170" y1="140" x2="250" y2="210" class="ray-shallow" marker-end="url(#arrow-red)"/>
    <text x="225" y="195" class="sublabel" font-weight="bold" fill="#ef4444">折射線</text>

    <!-- Wavefronts in Deep Water (Perpendicular to incident ray) -->
    <line x1="50" y1="130" x2="100" y2="30" class="wavefront-deep"/>
    <line x1="90" y1="150" x2="140" y2="50" class="wavefront-deep"/>
    <line x1="130" y1="170" x2="180" y2="70" class="wavefront-deep"/>

    <!-- Wavefronts in Shallow Water (Closer spacing) -->
    <line x1="165" y1="180" x2="215" y2="120" class="wavefront-shallow"/>
    <line x1="195" y1="205" x2="245" y2="145" class="wavefront-shallow"/>
    <line x1="225" y1="230" x2="275" y2="170" class="wavefront-shallow"/>
  </g>

  <!-- Right: Principles & Multi-Choice Analysis -->
  <g transform="translate(385, 20)">
    <rect x="0" y="0" width="270" height="260" class="box"/>
    <text x="14" y="24" class="title">水波折射定律與選項判定</text>

    <rect x="15" y="38" width="240" height="208" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="20" y="60" class="label" font-weight="bold">【折射關係式】</text>
    <text x="20" y="82" class="math" fill="#0284c7">v₁ / v₂ = λ₁ / λ₂ = sinθ₁ / sinθ₂</text>
    <text x="20" y="104" class="sublabel">波源頻率 f 恆定不變 (f₁ = f₂)</text>

    <line x1="20" y1="116" x2="230" y2="116" stroke="#cbd5e1"/>
    <text x="20" y="136" class="label" font-weight="bold">【深水進淺水判斷】</text>
    <text x="20" y="158" class="sublabel">• <tspan fill="#16a34a" font-weight="bold">波速變慢</tspan>：v淺 &lt; v深</text>
    <text x="20" y="180" class="sublabel">• <tspan fill="#16a34a" font-weight="bold">波長變短</tspan>：λ淺 &lt; λ深</text>
    <text x="20" y="202" class="sublabel">• <tspan fill="#16a34a" font-weight="bold">偏向法線</tspan>：折射角 θ淺 &lt; θ深</text>

    <text x="20" y="232" class="label" font-weight="bold" fill="#0284c7">正確答案：(A)</text>
  </g>
</svg>
